---
# playbooks/08-failover-reinstate.yml - destructive FSFO failover rehearsal.
# Default behavior is readiness validation only. To actually crash the current
# primary VM, let FSFO promote the standby, reinstate the old primary, and switch
# back, pass:
#
#   -e oracle_failover_reinstate_execute=true
#   -e oracle_failover_reinstate_confirm=DESTROY_PRIMARY_AND_REINSTATE

- name: Rehearse Fast-Start Failover and reinstate
  hosts: observer
  become: true
  vars:
    oracle_failover_reinstate_execute: false
    oracle_failover_reinstate_confirm: ""
    oracle_failover_reinstate_confirm_required: DESTROY_PRIMARY_AND_REINSTATE
    oracle_failover_original_primary: "{{ observer_dg_primary_unique_name | default('super') }}"
    oracle_failover_target: "{{ observer_dg_standby_unique_name | default('super_sby') }}"
    oracle_failover_observer_config_dir: "{{ observer_config_dir | default(observer_client_home ~ '/network/admin') }}"
    oracle_failover_target_connect_identifier: "{{ observer_dg_standby_connect_identifier | default('super_sby_dgb') }}"
    oracle_failover_primary_vm: "{{ lab_name | default('ansible-oracle-lab') }}-superdb1"
    oracle_failover_virsh_uri: "{{ lookup('env', 'VIRSH_URI') | default('qemu:///system', true) }}"
    oracle_failover_primary_ssh_host: "{{ hostvars[(groups.primary | first)].ansible_host | default('192.168.87.11') }}"
    oracle_failover_primary_listener: "LISTENER_{{ oracle_failover_original_primary | upper }}"
    oracle_failover_primary_listener_host: "{{ dg_primary.host | default('superdc1.domain.is') }}"
    oracle_failover_grid_home: "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}"
    oracle_failover_lab_host_map_mode: dataguard
    oracle_failover_wait_retries: 60
    oracle_failover_wait_delay: 10
  tasks:
    - name: Validate FSFO readiness before destructive rehearsal
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ observer_client_home }}
        export TNS_ADMIN={{ oracle_failover_observer_config_dir }}
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ observer_dg_connect_identifier }}" <<'DGMGRL'
        SHOW FAST_START FAILOVER;
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        )"
        printf '%s\n' "$output"
        case "$output" in
          *ORA-*|*Error:*) exit 1 ;;
        esac
        printf '%s\n' "$output" | grep -E 'Fast-Start Failover:[[:space:]]+Enabled' >/dev/null || exit 1
        printf '%s\n' "$output" | grep -E 'Protection Mode:[[:space:]]+MaxAvailability' >/dev/null || exit 1
        printf '%s\n' "$output" | grep -E 'Active Target:[[:space:]]+{{ oracle_failover_target }}' >/dev/null || exit 1
        printf '%s\n' "$output" | grep -E '^[[:space:]]*Observer:[[:space:]]+[^()]' >/dev/null || exit 1
        printf '%s\n' "$output" | awk '/Primary database/ {print $1; exit}' | grep -Fx {{ oracle_failover_original_primary | quote }} >/dev/null
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _failover_precheck
      changed_when: false
      no_log: true

    - name: Report readiness-only mode
      ansible.builtin.debug:
        msg: >-
          FSFO readiness validated: Fast-Start Failover is enabled,
          protection mode is MaxAvailability, current primary is
          {{ oracle_failover_original_primary }}, active failover target is
          {{ oracle_failover_target }}, and an observer is present.
          Destructive rehearsal is disabled by default; re-run with
          oracle_failover_reinstate_execute=true and
          oracle_failover_reinstate_confirm={{ oracle_failover_reinstate_confirm_required }}
          to destroy {{ oracle_failover_primary_vm }}, let FSFO promote
          {{ oracle_failover_target }}, reinstate {{ oracle_failover_original_primary }},
          and switch roles back.
      when:
        - not oracle_failover_reinstate_execute | bool

    - name: Validate libvirt primary VM is addressable before destructive rehearsal
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ oracle_failover_virsh_uri }}"
          - dominfo
          - "{{ oracle_failover_primary_vm }}"
      delegate_to: localhost
      become: false
      register: _failover_primary_vm_dominfo
      changed_when: false

    - name: Report libvirt readiness for destructive rehearsal
      ansible.builtin.debug:
        msg: >-
          Libvirt readiness validated: {{ oracle_failover_primary_vm }} is
          addressable through {{ oracle_failover_virsh_uri }} before any
          destructive rehearsal command.

    - name: Fail when destructive rehearsal confirmation is missing
      ansible.builtin.fail:
        msg: >-
          Refusing destructive FSFO rehearsal before destroying
          {{ oracle_failover_primary_vm }}. Set
          oracle_failover_reinstate_confirm={{ oracle_failover_reinstate_confirm_required }}
          to continue.
      when:
        - oracle_failover_reinstate_execute | bool
        - oracle_failover_reinstate_confirm != oracle_failover_reinstate_confirm_required

    - name: Destroy current primary VM to trigger FSFO
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ oracle_failover_virsh_uri }}"
          - destroy
          - "{{ oracle_failover_primary_vm }}"
      delegate_to: localhost
      become: false
      register: _failover_destroy_primary
      changed_when: _failover_destroy_primary.rc == 0
      when: oracle_failover_reinstate_execute | bool

    - name: Wait for FSFO to promote target standby
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ observer_client_home }}
        export TNS_ADMIN={{ oracle_failover_observer_config_dir }}
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ oracle_failover_target_connect_identifier }}" <<'DGMGRL'
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        )"
        printf '%s\n' "$output"
        printf '%s\n' "$output" | awk '/Primary database/ {print $1; exit}' | grep -Fx {{ oracle_failover_target | quote }} >/dev/null
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _failover_promoted
      changed_when: false
      retries: "{{ oracle_failover_wait_retries }}"
      delay: "{{ oracle_failover_wait_delay }}"
      until: _failover_promoted.rc == 0
      when: oracle_failover_reinstate_execute | bool
      no_log: true

    - name: Start old primary VM for broker reinstate
      ansible.builtin.command:
        argv:
          - virsh
          - --connect
          - "{{ oracle_failover_virsh_uri }}"
          - start
          - "{{ oracle_failover_primary_vm }}"
      delegate_to: localhost
      become: false
      register: _failover_start_primary
      changed_when: _failover_start_primary.rc == 0
      failed_when: >-
        _failover_start_primary.rc != 0 and
        'already active' not in (_failover_start_primary.stderr | default('') | lower) and
        'already running' not in (_failover_start_primary.stderr | default('') | lower)
      when: oracle_failover_reinstate_execute | bool

    - name: Wait for old primary VM SSH after restart
      ansible.builtin.wait_for:
        host: "{{ oracle_failover_primary_ssh_host }}"
        port: 22
        delay: 5
        timeout: 900
      delegate_to: localhost
      become: false
      when: oracle_failover_reinstate_execute | bool

    - name: Restore lab host aliases on old primary after VM restart
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE-ORACLE lab guest hosts"
        block: |
          {% for entry in oracle_lab_guest_hosts | default([]) %}
          {% if oracle_failover_lab_host_map_mode in (entry.modes | default([oracle_failover_lab_host_map_mode])) %}
          {{ entry.ip }} {{ entry.names }}
          {% endif %}
          {% endfor %}
        owner: root
        group: root
        mode: "0644"
      delegate_to: "{{ groups.primary | first }}"
      become: true
      when: oracle_failover_reinstate_execute | bool

    - name: Wait for old primary Oracle Restart after VM restart
      ansible.builtin.command:
        argv:
          - "{{ oracle_failover_grid_home }}/bin/crsctl"
          - check
          - has
      delegate_to: "{{ groups.primary | first }}"
      become: true
      register: _failover_old_primary_has
      changed_when: false
      retries: "{{ oracle_failover_wait_retries }}"
      delay: "{{ oracle_failover_wait_delay }}"
      until: _failover_old_primary_has.rc == 0
      when: oracle_failover_reinstate_execute | bool

    - name: Start old primary broker listener after VM restart
      ansible.builtin.command:
        argv:
          - "{{ oracle_failover_grid_home }}/bin/srvctl"
          - start
          - listener
          - -listener
          - "{{ oracle_failover_primary_listener }}"
      delegate_to: "{{ groups.primary | first }}"
      become: true
      register: _failover_start_primary_listener
      changed_when: _failover_start_primary_listener.rc == 0
      failed_when: >-
        _failover_start_primary_listener.rc != 0 and
        'already running' not in (_failover_start_primary_listener.stdout | default('') | lower) and
        'already running' not in (_failover_start_primary_listener.stderr | default('') | lower)
      retries: "{{ oracle_failover_wait_retries }}"
      delay: "{{ oracle_failover_wait_delay }}"
      until: >-
        _failover_start_primary_listener.rc == 0 or
        'already running' in (_failover_start_primary_listener.stdout | default('') | lower) or
        'already running' in (_failover_start_primary_listener.stderr | default('') | lower)
      when: oracle_failover_reinstate_execute | bool

    - name: Wait for old primary broker listener after restart
      ansible.builtin.wait_for:
        host: "{{ oracle_failover_primary_listener_host }}"
        port: 1521
        delay: 2
        timeout: 300
      become: false
      when: oracle_failover_reinstate_execute | bool

    - name: Reconcile old primary through broker reinstate
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ observer_client_home }}
        export TNS_ADMIN={{ oracle_failover_observer_config_dir }}
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ oracle_failover_target_connect_identifier }}" <<'DGMGRL'
        REINSTATE DATABASE '{{ oracle_failover_original_primary }}';
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        )"
        printf '%s\n' "$output"
        printf '%s\n' "$output" | grep -F "Reinstatement of database \"{{ oracle_failover_original_primary }}\" succeeded" >/dev/null || exit 1
        printf '%s\n' "$output" | grep -E '^[[:space:]]*{{ oracle_failover_original_primary }}[[:space:]]+-[[:space:]]+\(\*\)[[:space:]]+Physical standby database' >/dev/null || exit 1
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _failover_reinstate
      changed_when: >-
        'Reinstating database' in (_failover_reinstate.stdout | default('')) or
        'Reinstate' in (_failover_reinstate.stdout | default(''))
      retries: "{{ oracle_failover_wait_retries }}"
      delay: "{{ oracle_failover_wait_delay }}"
      until: _failover_reinstate.rc == 0
      when: oracle_failover_reinstate_execute | bool
      no_log: true

- name: Restore original Data Guard primary after FSFO rehearsal
  hosts: observer
  become: true
  vars:
    oracle_failover_original_primary: "{{ observer_dg_primary_unique_name | default('super') }}"
    oracle_failover_observer_config_dir: "{{ observer_config_dir | default(observer_client_home ~ '/network/admin') }}"
    oracle_failover_target_connect_identifier: "{{ observer_dg_standby_connect_identifier | default('super_sby_dgb') }}"
    oracle_failover_wait_retries: 60
    oracle_failover_wait_delay: 10
  tasks:
    - name: Wait for reinstated primary to become valid FSFO target
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ observer_client_home }}
        export TNS_ADMIN={{ oracle_failover_observer_config_dir }}
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ oracle_failover_target_connect_identifier }}" <<'DGMGRL'
        SHOW FAST_START FAILOVER;
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        )"
        printf '%s\n' "$output"
        printf '%s\n' "$output" | grep -E '^[[:space:]]*{{ oracle_failover_original_primary }}[[:space:]]+valid' >/dev/null || exit 1
        printf '%s\n' "$output" | grep -F 'ORA-16817' >/dev/null && exit 1
        printf '%s\n' "$output" | grep -F 'SUCCESS' >/dev/null || exit 1
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _failover_reinstated_target_ready
      changed_when: false
      retries: "{{ oracle_failover_wait_retries }}"
      delay: "{{ oracle_failover_wait_delay }}"
      until: _failover_reinstated_target_ready.rc == 0
      no_log: true
      when: oracle_failover_reinstate_execute | default(false) | bool

    - name: Switch back to original primary after reinstate through broker
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ observer_client_home }}
        export TNS_ADMIN={{ oracle_failover_observer_config_dir }}
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ oracle_failover_target_connect_identifier }}" <<'DGMGRL'
        SWITCHOVER TO '{{ oracle_failover_original_primary }}';
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        )"
        printf '%s\n' "$output"
        printf '%s\n' "$output" | awk '/Primary database/ {print $1; exit}' | grep -Fx {{ oracle_failover_original_primary | quote }} >/dev/null
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _failover_switchback
      changed_when: >-
        'Performing switchover' in (_failover_switchback.stdout | default('')) or
        'Switchover succeeded' in (_failover_switchback.stdout | default(''))
      retries: "{{ oracle_failover_wait_retries | default(60) }}"
      delay: "{{ oracle_failover_wait_delay | default(10) }}"
      until: _failover_switchback.rc == 0
      no_log: true
      when: oracle_failover_reinstate_execute | default(false) | bool

- name: Validate Data Guard roles after FSFO rehearsal
  hosts: observer
  become: true
  vars:
    oracle_failover_observer_config_dir: "{{ observer_config_dir | default(observer_client_home ~ '/network/admin') }}"
    oracle_failover_target_connect_identifier: "{{ observer_dg_standby_connect_identifier | default('super_sby_dgb') }}"
  tasks:
    - name: Validate original primary restored and standby read-only with apply
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ observer_client_home }}
        export TNS_ADMIN={{ oracle_failover_observer_config_dir }}
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ observer_dg_connect_identifier }}" <<'DGMGRL'
        SHOW CONFIGURATION;
        SHOW FAST_START FAILOVER;
        EXIT;
        DGMGRL
        )"
        printf '%s\n' "$output"
        printf '%s\n' "$output" | grep -qE 'Error:[[:space:]]*ORA-01017|logon denied' && exit 1
        printf '%s\n' "$output" | awk '/Primary database/ {print $1; exit}' | grep -Fx {{ observer_dg_primary_unique_name | default('super') | quote }} >/dev/null || exit 1
        printf '%s\n' "$output" | grep -E 'Protection Mode:[[:space:]]+MaxAvailability' >/dev/null || exit 1
        printf '%s\n' "$output" | grep -E 'Fast-Start Failover:[[:space:]]+Enabled' >/dev/null || exit 1
        printf '%s\n' "$output" | grep -F 'SUCCESS' >/dev/null || exit 1
        standby="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ oracle_failover_target_connect_identifier }} as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
        )"
        printf '%s\n' "$standby"
        printf '%s\n' "$standby" | grep -qF 'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY' || exit 1
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _failover_final_validate
      changed_when: false
      failed_when: >-
        _failover_final_validate.rc != 0 or
        'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_failover_final_validate.stdout | default(''))
      retries: "{{ oracle_failover_wait_retries | default(60) }}"
      delay: "{{ oracle_failover_wait_delay | default(10) }}"
      until: >-
        _failover_final_validate.rc == 0 and
        'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY' in (_failover_final_validate.stdout | default(''))
      no_log: true
