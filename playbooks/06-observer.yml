---
# playbooks/06-observer.yml — FSFO observer on the third node.
# Installs the observer-side Oracle Client and validates DGMGRL connectivity.
# FSFO enable/start remains gated behind oracle_observer_enabled.

- name: Configure FSFO observer client
  hosts: observer
  become: true
  vars:
    oracle_observer_install_client: true
  roles:
    - role: oracle_observer
