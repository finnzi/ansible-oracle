---
# playbooks/06-observer.yml — FSFO observer on the third node.
# Installs the observer-side Oracle Client, enables FSFO, and starts the
# foreground systemd observer when oracle_observer_enabled=true.

- name: Configure FSFO observer client
  hosts: observer
  become: true
  vars:
    oracle_observer_install_client: true
  roles:
    - role: oracle_observer
