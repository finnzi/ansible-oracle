---
# playbooks/01-install-grid.yml — install Oracle Restart (Grid standalone).
# The role is opt-in because Grid install is slow and media-dependent. Set
# oracle_gi_install_enabled=true to install Oracle Restart into the current GI
# home; when disabled, the role reports the existing Restart state.

- name: Install Oracle Grid Infrastructure (Restart)
  hosts: oracle_db_hosts
  become: true
  roles:
    - role: oracle_gi_install
