---
# playbooks/05-dataguard.yml — Data Guard broker config + switchover.
# Primary and standby auxiliary preparation run by default. Full standby
# duplicate and broker configuration now run in the lab; manual switchover is
# opt-in via oracle_dataguard_run_switchover.

- name: Configure Data Guard
  hosts: oracle_db_hosts
  become: true
  roles:
    - role: oracle_network
      vars:
        oracle_network_dataguard_enabled: true
        oracle_lab_host_map_mode: dataguard
    - role: oracle_dataguard
      vars:
        oracle_dataguard_prepare_primary: true
        oracle_dataguard_prepare_standby: true
        oracle_dataguard_duplicate_standby: true
        oracle_dataguard_configure_broker: true
