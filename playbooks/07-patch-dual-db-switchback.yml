---
# playbooks/07-patch-dual-db-switchback.yml - reversible standalone dual-home
# rehearsal. Default behavior resolves inventory plus safe Restart discovery
# without switching. To actually install the target home, switch Restart to it,
# validate, and switch back, pass:
#
#   -e oracle_patch_dual_home_switchback_execute=true
#   -e oracle_patch_dual_home_switchback_confirm=SWITCH_DUAL_HOME_AND_BACK
#
# Restart-discovered, non-inventory DBs also require explicit names:
#
#   -e '{"oracle_patch_dual_home_switchback_discovered_restart_names":["super"],
#        "oracle_patch_dual_home_switchback_listener_names":{"super":"LISTENER_SUPER"},
#        "oracle_patch_dual_home_switchback_sid_names":{"super":"super"}}'
#
# Data Guard dual-home switching belongs to playbooks/07-patch-standbyfirst.yml.

- name: Rehearse standalone DB dual-home switch and switchback
  hosts: oracle_db_hosts
  become: true
  gather_facts: false
  vars:
    oracle_patch_dual_home_switchback_execute: false
    oracle_patch_dual_home_switchback_confirm: ""
    oracle_patch_dual_home_switchback_confirm_required: SWITCH_DUAL_HOME_AND_BACK
    oracle_patch_dual_home_switchback_target_suffix: db_home2
    oracle_patch_dual_home_switchback_target_path: ""
    oracle_patch_dual_home_switchback_discover_restart: false
    oracle_patch_dual_home_switchback_discovered_restart_names: []
    oracle_patch_dual_home_switchback_listener_names: {}
    oracle_patch_dual_home_switchback_sid_names: {}
    oracle_patch_dual_home_switchback_discovered_listener_prefix: LISTENER_
    oracle_patch_dual_home_switchback_install_discovered_targets: true
    oracle_patch_dual_home_switchback_restart_discovery_fixture: []
  tasks:
    - name: Resolve inventory DB home paths for switchback target
      ansible.builtin.set_fact:
        _dual_switchback_inventory_home_paths: >-
          {%- set out = [] -%}
          {%- set instances = (oracle_instances | default([])) | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), false) -%}
          {%- for inst in instances -%}
            {%- for home in inst.db_homes | default([]) -%}
              {%- set _ = out.append(inst.oracle_base ~ '/' ~ home.suffix) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: Resolve inventory dual-home switchback targets
      ansible.builtin.set_fact:
        _dual_switchback_inventory_targets: >-
          {%- set out = [] -%}
          {%- set instances = (oracle_instances | default([])) | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), false) -%}
          {%- for inst in instances -%}
            {%- set restart_name = inst.db_unique_name | default(inst.name) -%}
            {%- set sid_name = (
              oracle_patch_dual_home_switchback_sid_names[restart_name]
              if restart_name in oracle_patch_dual_home_switchback_sid_names
              else oracle_patch_dual_home_switchback_sid_names[inst.name]
                if inst.name in oracle_patch_dual_home_switchback_sid_names
                else inst.name
            ) -%}
            {%- set listener_name = (
              oracle_patch_dual_home_switchback_listener_names[restart_name]
              if restart_name in oracle_patch_dual_home_switchback_listener_names
              else oracle_patch_dual_home_switchback_listener_names[inst.name]
                if inst.name in oracle_patch_dual_home_switchback_listener_names
                else oracle_patch_dual_home_switchback_discovered_listener_prefix ~ (inst.name | upper)
            ) -%}
            {%- set current_home = (inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0]) -%}
            {%- set target_home = (inst.db_homes | selectattr('suffix', 'equalto', oracle_patch_dual_home_switchback_target_suffix) | list | first) | default({}) -%}
            {%- set target_suffix = (
              oracle_patch_dual_home_switchback_target_path.rsplit('/', 1)[1]
              if oracle_patch_dual_home_switchback_target_path | length > 0
              else target_home.suffix | default('')
            ) -%}
            {%- set target_home_path = (
              oracle_patch_dual_home_switchback_target_path
              if oracle_patch_dual_home_switchback_target_path | length > 0
              else inst.oracle_base ~ '/' ~ target_suffix
            ) -%}
            {%- set _ = out.append({
              'name': inst.name,
              'restart_db_name': restart_name,
              'sid_name': sid_name,
              'listener_name': listener_name,
              'dataguard': inst.dataguard | default(false) | bool,
              'oracle_base': inst.oracle_base,
              'original_suffix': current_home.suffix,
              'original_home_path': inst.oracle_base ~ '/' ~ current_home.suffix,
              'target_suffix': target_suffix,
              'target_home_path': target_home_path,
              'source': 'inventory'
            }) -%}
          {%- endfor -%}
          {{ out }}

    - name: Read Restart database names for switchback discovery
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" config database 2>/dev/null || true
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_restart_database_names
      changed_when: false
      failed_when: false
      when: >-
        (
          oracle_patch_dual_home_switchback_discover_restart | bool or
          oracle_patch_dual_home_switchback_discovered_restart_names | length > 0
        ) and
        oracle_patch_dual_home_switchback_restart_discovery_fixture | length == 0

    - name: Read Restart database homes for switchback discovery
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" config database -db {{ item | quote }} 2>/dev/null |
          awk -F': ' '$1 == "Oracle home" {print $2}'
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_restart_database_homes
      changed_when: false
      failed_when: false
      loop: "{{ _dual_switchback_restart_database_names.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when: >-
        (
          oracle_patch_dual_home_switchback_discover_restart | bool or
          oracle_patch_dual_home_switchback_discovered_restart_names | length > 0
        ) and
        oracle_patch_dual_home_switchback_restart_discovery_fixture | length == 0

    - name: Resolve fixture Restart database homes for switchback discovery
      ansible.builtin.set_fact:
        _dual_switchback_restart_database_homes:
          results: >-
            {%- set out = [] -%}
            {%- for item in oracle_patch_dual_home_switchback_restart_discovery_fixture | default([]) -%}
              {%- set restart_name = item.restart_db_name | default(item.name) -%}
              {%- set home_path = item.home_path | default(item.original_home_path | default('')) -%}
              {%- if restart_name | length > 0 and home_path | length > 0 -%}
                {%- set _ = out.append({
                  'item': restart_name,
                  'stdout': home_path,
                  'stdout_lines': [home_path],
                  'dataguard': item.dataguard | default(false) | bool,
                  'rc': 0
                }) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ out }}
      when: oracle_patch_dual_home_switchback_restart_discovery_fixture | length > 0

    - name: Resolve Restart-discovered switchback targets
      ansible.builtin.set_fact:
        _dual_switchback_restart_targets: >-
          {%- set out = [] -%}
          {%- for result in _dual_switchback_restart_database_homes.results | default([]) -%}
            {%- set current_home = result.stdout | default('') | trim -%}
            {%- set include_discovered = (
              oracle_patch_dual_home_switchback_discovered_restart_names | length == 0
              or result.item in oracle_patch_dual_home_switchback_discovered_restart_names
            ) -%}
            {%- if include_discovered and result.rc == 0 and current_home | length > 0 -%}
              {%- set oracle_base = current_home.rsplit('/', 1)[0] -%}
              {%- set original_suffix = current_home.rsplit('/', 1)[1] -%}
              {%- set listener_name = (
                oracle_patch_dual_home_switchback_listener_names[result.item]
                if result.item in oracle_patch_dual_home_switchback_listener_names
                else oracle_patch_dual_home_switchback_discovered_listener_prefix ~ (result.item | upper)
              ) -%}
              {%- set sid_name = (
                oracle_patch_dual_home_switchback_sid_names[result.item]
                if result.item in oracle_patch_dual_home_switchback_sid_names
                else result.item
              ) -%}
              {%- set target_suffix = (
                oracle_patch_dual_home_switchback_target_path.rsplit('/', 1)[1]
                if oracle_patch_dual_home_switchback_target_path | length > 0
                else oracle_patch_dual_home_switchback_target_suffix
              ) -%}
              {%- set target_home_path = (
                oracle_patch_dual_home_switchback_target_path
                if oracle_patch_dual_home_switchback_target_path | length > 0
                else oracle_base ~ '/' ~ target_suffix
              ) -%}
              {%- set _ = out.append({
                'name': result.item,
                'restart_db_name': result.item,
                'sid_name': sid_name,
                'listener_name': listener_name,
                'dataguard': result.dataguard | default(false) | bool,
                'oracle_base': oracle_base,
                'original_suffix': original_suffix,
                'original_home_path': current_home,
                'target_suffix': target_suffix,
                'target_home_path': target_home_path,
                'source': 'restart'
              }) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Merge inventory and Restart-discovered switchback targets
      ansible.builtin.set_fact:
        _dual_switchback_targets: >-
          {%- set out = [] -%}
          {%- set seen = [] -%}
          {%- for target in (_dual_switchback_inventory_targets | default([])) + (_dual_switchback_restart_targets | default([])) -%}
            {%- if target.restart_db_name not in seen -%}
              {%- set _ = seen.append(target.restart_db_name) -%}
              {%- set _ = out.append(target) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Resolve standalone switchback execution targets
      ansible.builtin.set_fact:
        _dual_switchback_standalone_targets: >-
          {{
            _dual_switchback_targets
            | rejectattr('dataguard', 'equalto', true)
            | list
          }}

    - name: Resolve Restart-discovered target homes for installation
      ansible.builtin.set_fact:
        _dual_switchback_restart_install_instances: >-
          {%- set out = [] -%}
          {%- for target in _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list -%}
            {%- set _ = out.append({
              'name': target.sid_name,
              'oracle_base': target.target_home_path.rsplit('/', 1)[0],
              'db_homes': [
                {
                  'suffix': target.target_suffix,
                  'current': false
                }
              ]
            }) -%}
          {%- endfor -%}
          {{ out }}

    - name: Report Restart-discovered install plan
      ansible.builtin.debug:
        msg: >-
          Restart-discovered target-home install plan (readiness only;
          destructive execution re-validates standalone state before install):
          {{ _dual_switchback_restart_install_instances | default([]) }}
      when:
        - not oracle_patch_dual_home_switchback_execute | bool
        - oracle_patch_dual_home_switchback_install_discovered_targets | bool
        - _dual_switchback_restart_install_instances | default([]) | length > 0
        - _dual_switchback_targets | selectattr('source', 'equalto', 'restart') | selectattr('dataguard', 'equalto', true) | list | length == 0
        - >-
          oracle_patch_dual_home_switchback_discovered_restart_names | length > 0 or
          oracle_patch_dual_home_switchback_restart_discovery_fixture | length > 0

    - name: Report readiness-only mode
      ansible.builtin.debug:
        msg: >-
          Dual-home switchback readiness resolved for {{
            _dual_switchback_targets
            | rejectattr('dataguard', 'equalto', true)
            | list
            | length
          }} standalone DB candidate(s) and {{
            _dual_switchback_targets
            | selectattr('dataguard', 'equalto', true)
            | list
            | length
          }} Data Guard target(s). Destructive switchback execution is disabled
          by default; re-run with oracle_patch_dual_home_switchback_execute=true
          and oracle_patch_dual_home_switchback_confirm={{
          oracle_patch_dual_home_switchback_confirm_required }} to switch
          standalone candidates to {{
            oracle_patch_dual_home_switchback_target_path
            if oracle_patch_dual_home_switchback_target_path | length > 0
            else oracle_patch_dual_home_switchback_target_suffix
          }} and back. Data Guard targets must use
          playbooks/07-patch-standbyfirst.yml.
      when: not oracle_patch_dual_home_switchback_execute | bool

    - name: Fail when destructive switchback confirmation is missing
      ansible.builtin.fail:
        msg: >-
          Refusing dual-home switchback rehearsal. Set
          oracle_patch_dual_home_switchback_confirm={{
          oracle_patch_dual_home_switchback_confirm_required }}.
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - oracle_patch_dual_home_switchback_confirm != oracle_patch_dual_home_switchback_confirm_required

    - name: Fail when fixture Restart discovery is used for execution
      ansible.builtin.fail:
        msg: >-
          oracle_patch_dual_home_switchback_restart_discovery_fixture is
          readiness/test-only. Destructive switchback execution must discover
          Restart state with srvctl on the target host.
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - oracle_patch_dual_home_switchback_restart_discovery_fixture | length > 0

    - name: Fail when no DB instances are available for switchback
      ansible.builtin.fail:
        msg: No DB instances were resolved for dual-home switchback rehearsal.
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | length == 0

    - name: Fail when Restart-discovered switchback targets are not explicitly named
      ansible.builtin.fail:
        msg: >-
          Restart-discovered DBs are visible for readiness reporting, but
          destructive switchback execution for brownfield-only databases
          requires oracle_patch_dual_home_switchback_discovered_restart_names.
          This playbook cannot infer whether an unmodeled Restart database is
          part of Data Guard; model Data Guard databases in oracle_instances so
          standby-first orchestration can handle them, or explicitly name only
          discovered standalone databases.
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - oracle_patch_dual_home_switchback_discovered_restart_names | length == 0
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list | length > 0

    - name: Fail when requested Restart-discovered switchback targets are missing
      ansible.builtin.fail:
        msg: >-
          The requested Restart-discovered DB name(s) were not found on this
          host: {{
            oracle_patch_dual_home_switchback_discovered_restart_names
            | difference(
              _dual_switchback_targets
              | selectattr('source', 'equalto', 'restart')
              | rejectattr('dataguard', 'equalto', true)
              | map(attribute='restart_db_name')
              | list
            )
            | join(',')
          }}.
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - oracle_patch_dual_home_switchback_discovered_restart_names | length > 0
        - >-
          oracle_patch_dual_home_switchback_discovered_restart_names
          | difference(
            _dual_switchback_targets
            | selectattr('source', 'equalto', 'restart')
            | rejectattr('dataguard', 'equalto', true)
            | map(attribute='restart_db_name')
            | list
          )
          | length > 0

    - name: Fail when Restart-discovered listener names are not explicitly mapped
      ansible.builtin.fail:
        msg: >-
          Restart-discovered DB {{ item.restart_db_name }} needs an explicit
          listener resource name before destructive switchback execution. Set
          oracle_patch_dual_home_switchback_listener_names with an entry for
          {{ item.restart_db_name }}.
      loop: "{{ _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list }}"
      loop_control:
        label: "{{ item.restart_db_name }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - item.restart_db_name not in oracle_patch_dual_home_switchback_listener_names

    - name: Fail when Restart-discovered SID names are not explicitly mapped
      ansible.builtin.fail:
        msg: >-
          Restart-discovered DB {{ item.restart_db_name }} needs an explicit
          local ORACLE_SID before destructive switchback execution. Set
          oracle_patch_dual_home_switchback_sid_names with an entry for
          {{ item.restart_db_name }}.
      loop: "{{ _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list }}"
      loop_control:
        label: "{{ item.restart_db_name }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - item.restart_db_name not in oracle_patch_dual_home_switchback_sid_names

    - name: Fail when target suffix is not declared on every DB instance
      ansible.builtin.fail:
        msg: >-
          oracle_patch_dual_home_switchback_target_suffix={{
          oracle_patch_dual_home_switchback_target_suffix }} must be declared
          in every oracle_instances[*].db_homes entry when
          oracle_patch_dual_home_switchback_target_path is not set.
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - oracle_patch_dual_home_switchback_target_path | length == 0
        - _dual_switchback_standalone_targets | selectattr('target_suffix', 'equalto', '') | list | length > 0

    - name: Check existing brownfield switchback target path
      ansible.builtin.stat:
        path: "{{ oracle_patch_dual_home_switchback_target_path }}"
      register: _dual_switchback_target_path_stat
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - oracle_patch_dual_home_switchback_target_path | length > 0
        - oracle_patch_dual_home_switchback_target_path not in _dual_switchback_inventory_home_paths

    - name: Fail when explicit switchback target path is neither inventory-declared nor existing
      ansible.builtin.fail:
        msg: >-
          oracle_patch_dual_home_switchback_target_path={{
          oracle_patch_dual_home_switchback_target_path }} is not declared in
          oracle_instances[*].db_homes and does not exist on this host. Declare
          it in inventory for automatic installation, or pre-create the
          brownfield target home.
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - oracle_patch_dual_home_switchback_target_path | length > 0
        - oracle_patch_dual_home_switchback_target_path not in _dual_switchback_inventory_home_paths
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'inventory') | list | length > 0
        - not (_dual_switchback_target_path_stat.stat.exists | default(false))

    - name: Check existing Restart-discovered switchback target paths
      ansible.builtin.stat:
        path: "{{ item.target_home_path }}"
      register: _dual_switchback_restart_target_path_stats
      loop: "{{ _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list }}"
      loop_control:
        label: "{{ item.restart_db_name }} -> {{ item.target_home_path }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list | length > 0

    - name: Fail when Restart-discovered switchback target path does not exist
      ansible.builtin.fail:
        msg: >-
          Restart-discovered DB {{ item.item.restart_db_name }} target home
          {{ item.item.target_home_path }} does not exist. The switchback
          rehearsal can install inventory-backed homes, but brownfield
          Restart-discovered targets must already be installed or be modeled in
          oracle_instances.
      loop: "{{ _dual_switchback_restart_target_path_stats.results | default([]) }}"
      loop_control:
        label: "{{ item.item.restart_db_name }} -> {{ item.item.target_home_path }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - not item.stat.exists | default(false)
        - not oracle_patch_dual_home_switchback_install_discovered_targets | bool

    - name: Read actual Restart homes before dual-home switchback
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" config database -db {{ item.restart_db_name | quote }} |
          awk -F': ' '$1 == "Oracle home" {print $2}'
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_restart_homes_before
      changed_when: false
      failed_when: >-
        _dual_switchback_restart_homes_before.rc != 0 or
        (_dual_switchback_restart_homes_before.stdout | trim | length) == 0
      loop: "{{ _dual_switchback_standalone_targets }}"
      loop_control:
        label: "{{ item.restart_db_name }}"
      when: oracle_patch_dual_home_switchback_execute | bool

    - name: Record actual original Restart homes for switchback
      ansible.builtin.set_fact:
        _dual_switchback_standalone_targets: >-
          {%- set out = [] -%}
          {%- for result in _dual_switchback_restart_homes_before.results | default([]) -%}
            {%- set _ = out.append(result.item | combine({'actual_original_home_path': result.stdout | trim})) -%}
          {%- endfor -%}
          {{ out }}
      when: oracle_patch_dual_home_switchback_execute | bool

    - name: Read Restart-discovered database role before standalone switch
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ (item.actual_original_home_path | default(item.original_home_path)) | quote }}
        export ORACLE_SID={{ item.sid_name | quote }}
        "$ORACLE_HOME/bin/sqlplus" -L -S / as sysdba <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF ECHO OFF TRIMSPOOL ON
        SELECT d.database_role || '|' || d.protection_mode || '|' ||
               (SELECT COUNT(*)
                FROM v$archive_dest ad
                WHERE ad.target = 'STANDBY'
                  AND ad.destination IS NOT NULL) || '|' ||
               (SELECT COUNT(*)
                FROM v$dataguard_config dgc
                WHERE dgc.db_unique_name != d.db_unique_name)
        FROM v$database d;
        EXIT;
        SQL
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_discovered_database_roles
      changed_when: false
      failed_when: >-
        _dual_switchback_discovered_database_roles.rc != 0 or
        'ORA-' in (_dual_switchback_discovered_database_roles.stdout | default('')) or
        'SP2-' in (_dual_switchback_discovered_database_roles.stdout | default('')) or
        (_dual_switchback_discovered_database_roles.stdout | trim | length) == 0
      loop: "{{ _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list }}"
      loop_control:
        label: "{{ item.restart_db_name }}:{{ item.sid_name }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list | length > 0

    - name: Fail when Restart-discovered database is not standalone primary
      ansible.builtin.fail:
        msg: >-
          Restart-discovered DB {{ item.item.restart_db_name }} reports
          {{ item.stdout_lines | map('trim') | reject('equalto', '') | list | last }}.
          This switchback rehearsal is standalone-only. Model Data Guard
          databases in oracle_instances and use playbooks/07-patch-standbyfirst.yml.
      loop: "{{ _dual_switchback_discovered_database_roles.results | default([]) }}"
      loop_control:
        label: "{{ item.item.restart_db_name }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - >-
          (item.stdout_lines | map('trim') | reject('equalto', '') | list | last)
          != 'PRIMARY|MAXIMUM PERFORMANCE|0|0'

    - name: Resolve Restart-discovered target homes for patching
      ansible.builtin.set_fact:
        _dual_switchback_restart_patch_targets: >-
          {%- set out = [] -%}
          {%- for target in _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list -%}
            {%- set _ = out.append({
              'name': target.sid_name,
              'restart_db_name': target.restart_db_name,
              'oracle_base': target.target_home_path.rsplit('/', 1)[0],
              'home_suffix': target.target_suffix,
              'home_path': target.target_home_path
            }) -%}
          {%- endfor -%}
          {{ out }}
      when: oracle_patch_dual_home_switchback_execute | bool

    - name: Gather facts required for target-home installation
      ansible.builtin.setup:
        gather_subset:
          - min
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - >-
          _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'inventory') | list | length > 0 or
          (
            oracle_patch_dual_home_switchback_install_discovered_targets | bool and
            _dual_switchback_restart_install_instances | default([]) | length > 0
          )

    - name: Install dual-home switchback target
      ansible.builtin.include_role:
        name: oracle_db_install
      vars:
        oracle_db_install_home_selection: selected
        oracle_db_install_home_suffixes: >-
          {{
            [oracle_patch_dual_home_switchback_target_suffix]
            if oracle_patch_dual_home_switchback_target_path | length == 0
            else []
          }}
        oracle_db_install_home_paths: >-
          {{
            [oracle_patch_dual_home_switchback_target_path]
            if oracle_patch_dual_home_switchback_target_path | length > 0
            else []
          }}
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'inventory') | list | length > 0

    - name: Install Restart-discovered dual-home target homes
      ansible.builtin.include_role:
        name: oracle_db_install
      vars:
        oracle_db_install_instances: "{{ _dual_switchback_restart_install_instances | default([]) }}"
        oracle_db_install_home_selection: selected
        oracle_db_install_home_suffixes: >-
          {{
            [oracle_patch_dual_home_switchback_target_suffix]
            if oracle_patch_dual_home_switchback_target_path | length == 0
            else []
          }}
        oracle_db_install_home_paths: >-
          {{
            [oracle_patch_dual_home_switchback_target_path]
            if oracle_patch_dual_home_switchback_target_path | length > 0
            else []
          }}
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - oracle_patch_dual_home_switchback_install_discovered_targets | bool
        - _dual_switchback_restart_install_instances | default([]) | length > 0

    - name: Switch Restart to dual-home target
      ansible.builtin.include_role:
        name: oracle_patch
      vars:
        oracle_patch_target: db
        oracle_patch_mode: oop_dual
        oracle_patch_apply_enabled: true
        oracle_patch_dual_home_suffix: >-
          {{
            oracle_patch_dual_home_switchback_target_suffix
            if oracle_patch_dual_home_switchback_target_path | length == 0
            else ''
          }}
        oracle_patch_dual_home_path: "{{ oracle_patch_dual_home_switchback_target_path }}"
        oracle_patch_discover_oratab: false
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'inventory') | list | length > 0

    - name: Patch Restart-discovered dual-home target homes
      ansible.builtin.include_role:
        name: oracle_patch
      vars:
        oracle_instances: []
        oracle_patch_target: db
        oracle_patch_mode: inplace
        oracle_patch_apply_enabled: true
        oracle_patch_run_datapatch: false
        oracle_patch_discover_oratab: false
        oracle_patch_extra_homes: "{{ _dual_switchback_restart_patch_targets | default([]) }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_restart_patch_targets | default([]) | length > 0

    - name: Stop Restart-discovered DBs before dual-home target switch
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" stop database -db {{ item.restart_db_name | quote }} -stopoption IMMEDIATE
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_stop_discovered_target
      changed_when: _dual_switchback_stop_discovered_target.rc == 0
      failed_when: >-
        _dual_switchback_stop_discovered_target.rc != 0 and
        'PRCD-1120' not in (_dual_switchback_stop_discovered_target.stdout | default('')) and
        'PRCR-1005' not in (_dual_switchback_stop_discovered_target.stdout | default('')) and
        'not running' not in (_dual_switchback_stop_discovered_target.stdout | default('') | lower)
      loop: "{{ _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list }}"
      loop_control:
        label: "{{ item.restart_db_name }} -> {{ item.target_home_path }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list | length > 0

    - name: Switch Restart-discovered database to dual-home target
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" modify database \
          -db {{ item.restart_db_name | quote }} \
          -oraclehome {{ item.target_home_path | quote }}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_modify_discovered_target_db
      changed_when: _dual_switchback_modify_discovered_target_db.rc == 0
      failed_when: _dual_switchback_modify_discovered_target_db.rc != 0
      loop: "{{ _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list }}"
      loop_control:
        label: "{{ item.restart_db_name }} -> {{ item.target_home_path }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list | length > 0

    - name: Switch Restart-discovered listener to dual-home target
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" modify listener \
          -listener {{ item.listener_name | quote }} \
          -oraclehome {{ item.target_home_path | quote }}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_modify_discovered_target_listener
      changed_when: _dual_switchback_modify_discovered_target_listener.rc == 0
      failed_when: _dual_switchback_modify_discovered_target_listener.rc != 0
      loop: "{{ _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list }}"
      loop_control:
        label: "{{ item.listener_name }} -> {{ item.target_home_path }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list | length > 0

    - name: Start Restart-discovered DBs after dual-home target switch
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" start database -db {{ item.restart_db_name | quote }}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_start_discovered_target
      changed_when: _dual_switchback_start_discovered_target.rc == 0
      failed_when: >-
        _dual_switchback_start_discovered_target.rc != 0 and
        'already running' not in (_dual_switchback_start_discovered_target.stdout | default('') | lower) and
        'PRCR-1079' not in (_dual_switchback_start_discovered_target.stdout | default(''))
      loop: "{{ _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list }}"
      loop_control:
        label: "{{ item.restart_db_name }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list | length > 0

    - name: Run datapatch for Restart-discovered switched DBs
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ item.target_home_path | quote }}
        export ORACLE_SID={{ item.sid_name | quote }}
        {{ item.target_home_path }}/OPatch/datapatch -verbose
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_discovered_datapatch
      changed_when: _dual_switchback_discovered_datapatch.rc == 0
      failed_when: >-
        _dual_switchback_discovered_datapatch.rc != 0 or
        (
          'Patch installation complete' not in (_dual_switchback_discovered_datapatch.stdout | default('')) and
          'SQL Patching tool complete' not in (_dual_switchback_discovered_datapatch.stdout | default(''))
        )
      loop: "{{ _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list }}"
      loop_control:
        label: "{{ item.restart_db_name }}:{{ item.target_suffix }}"
      when:
        - oracle_patch_dual_home_switchback_execute | bool
        - _dual_switchback_standalone_targets | selectattr('source', 'equalto', 'restart') | list | length > 0

    - name: Validate Restart uses dual-home target
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" config database -db {{ item.restart_db_name | quote }} |
          awk -F': ' '$1 == "Oracle home" {print $2}'
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_target_home
      changed_when: false
      failed_when: >-
        _dual_switchback_target_home.rc != 0 or
        (_dual_switchback_target_home.stdout | trim) != item.target_home_path
      loop: "{{ _dual_switchback_standalone_targets }}"
      loop_control:
        label: "{{ item.restart_db_name }} -> {{ item.target_home_path }}"
      when: oracle_patch_dual_home_switchback_execute | bool

    - name: Stop DBs before dual-home switchback
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" stop database -db {{ item.restart_db_name | quote }} -stopoption IMMEDIATE
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_stop_original
      changed_when: _dual_switchback_stop_original.rc == 0
      failed_when: >-
        _dual_switchback_stop_original.rc != 0 and
        'PRCD-1120' not in (_dual_switchback_stop_original.stdout | default('')) and
        'PRCR-1005' not in (_dual_switchback_stop_original.stdout | default('')) and
        'not running' not in (_dual_switchback_stop_original.stdout | default('') | lower)
      loop: "{{ _dual_switchback_standalone_targets }}"
      loop_control:
        label: "{{ item.restart_db_name }} -> {{ item.actual_original_home_path | default(item.original_home_path) }}"
      when: oracle_patch_dual_home_switchback_execute | bool

    - name: Switch Restart database back to actual original home
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" modify database \
          -db {{ item.restart_db_name | quote }} \
          -oraclehome {{ (item.actual_original_home_path | default(item.original_home_path)) | quote }}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_modify_original_db
      changed_when: _dual_switchback_modify_original_db.rc == 0
      failed_when: _dual_switchback_modify_original_db.rc != 0
      loop: "{{ _dual_switchback_standalone_targets }}"
      loop_control:
        label: "{{ item.restart_db_name }} -> {{ item.actual_original_home_path | default(item.original_home_path) }}"
      when: oracle_patch_dual_home_switchback_execute | bool

    - name: Switch Restart listener back to actual original home
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" modify listener \
          -listener {{ item.listener_name | quote }} \
          -oraclehome {{ (item.actual_original_home_path | default(item.original_home_path)) | quote }}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_modify_original_listener
      changed_when: _dual_switchback_modify_original_listener.rc == 0
      failed_when: >-
        _dual_switchback_modify_original_listener.rc != 0 and
        (
          item.source == 'restart' or
          (
            'PRCN-2044' not in (_dual_switchback_modify_original_listener.stdout | default('')) and
            'PRCR-1001' not in (_dual_switchback_modify_original_listener.stdout | default(''))
          )
        )
      loop: "{{ _dual_switchback_standalone_targets }}"
      loop_control:
        label: "{{ item.listener_name }} -> {{ item.actual_original_home_path | default(item.original_home_path) }}"
      when: oracle_patch_dual_home_switchback_execute | bool

    - name: Start DBs after dual-home switchback
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" start database -db {{ item.restart_db_name | quote }}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_start_original
      changed_when: _dual_switchback_start_original.rc == 0
      failed_when: >-
        _dual_switchback_start_original.rc != 0 and
        'already running' not in (_dual_switchback_start_original.stdout | default('') | lower) and
        'PRCR-1079' not in (_dual_switchback_start_original.stdout | default(''))
      loop: "{{ _dual_switchback_standalone_targets }}"
      loop_control:
        label: "{{ item.restart_db_name }}"
      when: oracle_patch_dual_home_switchback_execute | bool

    - name: Validate Restart uses original home again
      ansible.builtin.shell: |
        set -o pipefail
        "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" config database -db {{ item.restart_db_name | quote }} |
          awk -F': ' '$1 == "Oracle home" {print $2}'
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _dual_switchback_original_home
      changed_when: false
      failed_when: >-
        _dual_switchback_original_home.rc != 0 or
        (_dual_switchback_original_home.stdout | trim) != (item.actual_original_home_path | default(item.original_home_path))
      loop: "{{ _dual_switchback_standalone_targets }}"
      loop_control:
        label: "{{ item.restart_db_name }} -> {{ item.original_home_path }}"
      when: oracle_patch_dual_home_switchback_execute | bool
