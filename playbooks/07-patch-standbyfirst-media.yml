---
# playbooks/07-patch-standbyfirst-media.yml - report staged standby-first media.
#
# Read-only preflight: scans staged patch zips with patch_standbyfirst_info.
# Policy reminder:
#   - Fully SF-eligible zips → candidates for 07-patch-standbyfirst.yml
#   - OJVM+RU combos are not SF as a unit → dual-home/downtime for the full
#     combo; listed DB RU components are informational / opt-in RU-only SF only

- name: Report Data Guard standby-first patch media
  hosts: primary
  become: true
  vars:
    oracle_patch_standbyfirst_media_pattern: "*.zip"
    oracle_patch_standbyfirst_media_require_eligible: false
  tasks:
    - name: Scan staged patch zips for standby-first eligibility
      patch_standbyfirst_info:
        directory: "{{ oracle_stage_dir }}"
        pattern: "{{ oracle_patch_standbyfirst_media_pattern }}"
      register: _patch_sf_media

    - name: Report standby-first media scan
      ansible.builtin.debug:
        msg: >-
          Standby-first media scan examined {{
          _patch_sf_media.zip_files_examined }} patch zip(s) under {{
          oracle_stage_dir }}: eligible={{ _patch_sf_media.eligible_count }},
          eligible_db_components={{
          _patch_sf_media.eligible_db_component_count }},
          ineligible={{ _patch_sf_media.ineligible_count }}, errors={{
          _patch_sf_media.error_count }}. Eligible zip(s): {{
          (_patch_sf_media.eligible_patches | map(attribute='basename') | list | join(', '))
          if (_patch_sf_media.eligible_count | int > 0) else 'none' }}.

    - name: Report ineligible standby-first media
      ansible.builtin.debug:
        msg: >-
          {{ item.basename }}: {{ item.reason }}
      loop: "{{ _patch_sf_media.ineligible_patches }}"
      when: _patch_sf_media.ineligible_count | int > 0

    - name: Report eligible standby-first command handoff
      ansible.builtin.debug:
        msg: >-
          Eligible standby-first zip {{ item.basename }} detected. Use
          -e oracle_patch_zip={{ oracle_stage_dir }}/{{ item.basename }} on the
          readiness and confirmed apply commands for
          playbooks/07-patch-standbyfirst.yml.
      loop: "{{ _patch_sf_media.eligible_patches }}"
      when: _patch_sf_media.eligible_count | int > 0

    - name: Report eligible standby-first DB RU component handoff
      ansible.builtin.debug:
        msg: >-
          Eligible standby-first DB RU component {{ item.patch_number }} in
          {{ item.basename }} at {{ item.component_path }}. Prefer applying the
          full combo together (dual-home/downtime) when this zip is an OJVM+RU
          combo. Component-only SF is opt-in:
          -e oracle_patch_zip={{ oracle_stage_dir }}/{{ item.basename }}
          -e oracle_patch_apply_component_path={{ item.component_path }}
          -e oracle_patch_standbyfirst_allow_component_only=true
          on playbooks/07-patch-standbyfirst.yml.
      loop: "{{ _patch_sf_media.eligible_db_components }}"
      when: _patch_sf_media.eligible_db_component_count | int > 0

    - name: Report unreadable standby-first media
      ansible.builtin.debug:
        msg: >-
          {{ item.basename }}: {{ item.reason }}
      loop: "{{ _patch_sf_media.errors }}"
      when: _patch_sf_media.error_count | int > 0

    - name: Fail when no eligible standby-first media is staged
      ansible.builtin.fail:
        msg: >-
          No staged patch zip or DB RU component is Data Guard Standby-First
          Installable under {{ oracle_stage_dir }}. Stage an eligible standalone
          DB RU zip, stage a combo with an eligible DB RU component, or leave
          oracle_patch_standbyfirst_media_require_eligible=false for reporting
          only.
      when:
        - oracle_patch_standbyfirst_media_require_eligible | bool
        - _patch_sf_media.eligible_count | int == 0
        - _patch_sf_media.eligible_db_component_count | int == 0
