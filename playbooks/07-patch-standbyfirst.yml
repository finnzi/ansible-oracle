---
# playbooks/07-patch-standbyfirst.yml - Data Guard standby-first DB patching.
# Flow: prove the patch is standby-first eligible, stage optional target homes,
# patch the current standby, switchover through broker, then patch the old
# primary as the new standby.

- name: Validate standby-first patch eligibility
  hosts: primary
  become: true
  vars:
    oracle_patch_target: db
    oracle_patch_db_zip: "{{ oracle_stage_dir }}/{{ oracle_patch_files.db_ru_zip | default('p39062931_190000_Linux-x86-64.zip') }}"
    oracle_patch_zip: "{{ oracle_patch_db_zip }}"
    oracle_patch_apply_component_path: ""
    oracle_patch_standbyfirst_require_eligible: true
    oracle_patch_standbyfirst_execute: false
    oracle_patch_standbyfirst_restore_primary: false
    oracle_patch_standbyfirst_confirm: ""
  tasks:
    - name: Read standby-first eligibility from the patch README
      patch_standbyfirst_info:
        zip: "{{ oracle_patch_zip }}"
      register: _patch_standbyfirst

    - name: Fail when selected standby-first component path is invalid
      ansible.builtin.fail:
        msg: >-
          oracle_patch_apply_component_path={{ oracle_patch_apply_component_path }}
          is invalid. Use a relative component path reported by
          playbooks/07-patch-standbyfirst-media.yml.
      when:
        - oracle_patch_apply_component_path | default('') | length > 0
        - oracle_patch_apply_component_path.startswith('/') or
          oracle_patch_apply_component_path is search('(^|/)\\.\\.(/|$)')

    - name: Resolve selected standby-first patch component
      ansible.builtin.set_fact:
        _patch_standbyfirst_selected_component: >-
          {{
            (
              _patch_standbyfirst.eligible_db_components | default([])
              | selectattr('component_path', 'equalto', oracle_patch_apply_component_path)
              | list
              | first
            ) | default({})
          }}
      when: oracle_patch_apply_component_path | default('') | length > 0

    - name: Fail when selected patch component is not standby-first eligible
      ansible.builtin.fail:
        msg: >-
          oracle_patch_apply_component_path={{ oracle_patch_apply_component_path }}
          was not found as an eligible Data Guard Standby-First DB RU component
          in {{ oracle_patch_zip | basename }}.
      when:
        - oracle_patch_apply_component_path | default('') | length > 0
        - _patch_standbyfirst_selected_component | default({}) | length == 0

    - name: Fail when patch is not standby-first eligible
      ansible.builtin.fail:
        msg: >-
          {{ oracle_patch_zip | basename }} is not Data Guard standby-first
          installable. Use the standard patch path or the patch's documented
          special procedure instead of playbooks/07-patch-standbyfirst.yml.
      when:
        - oracle_patch_standbyfirst_require_eligible | default(true) | bool
        - oracle_patch_apply_component_path | default('') | length == 0
        - not _patch_standbyfirst.eligible | default(false) | bool

    - name: Fail when standby-first execution is not explicitly confirmed
      ansible.builtin.fail:
        msg: >-
          Standby-first patch execution installs/patches Data Guard homes,
          performs a broker switchover, and runs datapatch. Re-run with
          oracle_patch_standbyfirst_execute=true and
          oracle_patch_standbyfirst_confirm=PATCH_STANDBY_FIRST to execute.
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - oracle_patch_standbyfirst_confirm | default('') != 'PATCH_STANDBY_FIRST'

- name: Discover current Data Guard roles for standby-first patching
  hosts: oracle_db_hosts
  become: true
  vars:
    oracle_patch_standbyfirst_instance: ""
  tasks:
    - name: Resolve local Data Guard patch instance
      ansible.builtin.set_fact:
        _patch_sf_instance: >-
          {%- set instances = (oracle_instances | default([])) | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), false) -%}
          {%- set matches = [] -%}
          {%- for inst in instances -%}
            {%- if inst.dataguard | default(false) | bool and
                  (oracle_patch_standbyfirst_instance | length == 0 or
                   oracle_patch_standbyfirst_instance in [inst.name, inst.db_unique_name | default(inst.name)]) -%}
              {%- set _ = matches.append(inst) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ (matches | first) | default({}) }}

    - name: Fail when no Data Guard patch instance matches this host
      ansible.builtin.fail:
        msg: >-
          No Data Guard instance matched oracle_patch_standbyfirst_instance={{
          oracle_patch_standbyfirst_instance }} on {{ inventory_hostname }}.
      when: _patch_sf_instance | length == 0

    - name: Record local Data Guard unique name and home
      ansible.builtin.set_fact:
        _patch_sf_local_unique_name: "{{ _patch_sf_instance.db_unique_name | default(_patch_sf_instance.name) }}"
        _patch_sf_home_path: >-
          {{ _patch_sf_instance.oracle_base }}/{{ ((_patch_sf_instance.db_homes | selectattr('current', 'equalto', true) | list | first) | default(_patch_sf_instance.db_homes[0])).suffix }}
        _patch_sf_patch_home_path: >-
          {%- set current_home = (_patch_sf_instance.db_homes | selectattr('current', 'equalto', true) | list | first) | default(_patch_sf_instance.db_homes[0]) -%}
          {%- if oracle_patch_dual_home_path | default('') | length > 0 -%}
          {{ oracle_patch_dual_home_path }}{%- elif oracle_patch_dual_home_suffix | default('') | length > 0 -%}
          {{ _patch_sf_instance.oracle_base }}/{{ oracle_patch_dual_home_suffix }}{%- else -%}
          {{ _patch_sf_instance.oracle_base }}/{{ current_home.suffix }}{%- endif -%}

    - name: Read Data Guard broker roles and protection mode  # noqa: run-once[task]
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_home_path }}
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_local_unique_name }}_dgb" <<'DGMGRL'
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        )"
        printf '%s\n' "$output"
        primary="$(printf '%s\n' "$output" | awk '/Primary database/ {print $1; exit}')"
        standby="$(printf '%s\n' "$output" | awk '/Physical standby database/ {print $1; exit}')"
        mode="$(printf '%s\n' "$output" | awk -F': *' '/Protection Mode:/ {print $2; exit}')"
        printf 'PATCH_SF_PRIMARY=%s\nPATCH_SF_STANDBY=%s\nPATCH_SF_PROTECTION_MODE=%s\n' "$primary" "$standby" "$mode"
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_broker
      changed_when: false
      failed_when: >-
        _patch_sf_broker.rc != 0 or
        'Configuration -' not in (_patch_sf_broker.stdout | default(''))
      no_log: true
      run_once: true

    - name: Record current broker roles for standby-first patching  # noqa: run-once[task]
      ansible.builtin.set_fact:
        _patch_sf_current_primary: "{{ _patch_sf_broker.stdout | regex_search('PATCH_SF_PRIMARY=([^\\n]+)', '\\1') | first | default('') }}"
        _patch_sf_current_standby: "{{ _patch_sf_broker.stdout | regex_search('PATCH_SF_STANDBY=([^\\n]+)', '\\1') | first | default('') }}"
        _patch_sf_protection_mode: "{{ _patch_sf_broker.stdout | regex_search('PATCH_SF_PROTECTION_MODE=([^\\n]+)', '\\1') | first | default('') }}"
      run_once: true

    - name: Publish standby-first broker facts to static primary hosts  # noqa: run-once[task]
      ansible.builtin.set_fact:
        _patch_sf_current_primary: "{{ _patch_sf_current_primary }}"
        _patch_sf_current_standby: "{{ _patch_sf_current_standby }}"
        _patch_sf_protection_mode: "{{ _patch_sf_protection_mode }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups.primary | default([]) }}"
      run_once: true

    - name: Fail when broker is not in Maximum Availability  # noqa: run-once[task]
      ansible.builtin.fail:
        msg: >-
          Data Guard standby-first patching requires Maximum Availability, got
          {{ _patch_sf_protection_mode }}.
      when: _patch_sf_protection_mode != 'MaxAvailability'
      run_once: true

    - name: Fail when broker roles could not be resolved  # noqa: run-once[task]
      ansible.builtin.fail:
        msg: >-
          Could not resolve current primary/standby from broker output for
          standby-first patching.
      when:
        - _patch_sf_current_primary | length == 0 or _patch_sf_current_standby | length == 0
      run_once: true

    - name: Report standby-first execution plan  # noqa: run-once[task]
      ansible.builtin.debug:
        msg:
          patch_zip: "{{ oracle_patch_zip | default(oracle_stage_dir ~ '/' ~ (oracle_patch_files.db_ru_zip | default('p39062931_190000_Linux-x86-64.zip'))) }}"
          component_path: "{{ oracle_patch_apply_component_path | default('') | default('whole zip', true) }}"
          current_primary: "{{ _patch_sf_current_primary }}"
          current_standby: "{{ _patch_sf_current_standby }}"
          protection: "{{ _patch_sf_protection_mode }}"
          execute: "{{ oracle_patch_standbyfirst_execute | default(false) | bool }}"
          restore_original_primary: "{{ oracle_patch_standbyfirst_restore_primary | default(false) | bool }}"
          target_homes: >-
            {%- set out = [] -%}
            {%- for host in groups.oracle_db_hosts | default([]) -%}
              {%- set _ = out.append({
                'host': host,
                'db_unique_name': hostvars[host]._patch_sf_local_unique_name | default(''),
                'current_home': hostvars[host]._patch_sf_home_path | default('') | trim,
                'patch_home': hostvars[host]._patch_sf_patch_home_path | default('') | trim
              }) -%}
            {%- endfor -%}
            {{ out }}
      run_once: true

    - name: Add host to current standby patch group  # noqa: run-once[task]
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: patch_current_standby
      loop: "{{ groups.oracle_db_hosts | default([]) }}"
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - hostvars[item]._patch_sf_local_unique_name | default('') == _patch_sf_current_standby
      run_once: true

    - name: Add host to current primary patch group  # noqa: run-once[task]
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: patch_current_primary
      loop: "{{ groups.oracle_db_hosts | default([]) }}"
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - hostvars[item]._patch_sf_local_unique_name | default('') == _patch_sf_current_primary
      run_once: true

- name: Install current Data Guard standby DB target homes
  hosts: patch_current_standby
  become: true
  roles:
    - role: oracle_db_install
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_db_install_home_selection: selected
        oracle_db_install_home_suffixes: >-
          {{
            [oracle_patch_dual_home_suffix]
            if (
              oracle_patch_dual_home_suffix | default('') | length > 0 and
              oracle_patch_dual_home_path | default('') | length == 0
            )
            else []
          }}
        oracle_db_install_home_paths: >-
          {{
            [oracle_patch_dual_home_path]
            if (oracle_patch_dual_home_path | default('') | length > 0)
            else []
          }}

- name: Patch current Data Guard standby DB homes
  hosts: patch_current_standby
  become: true
  roles:
    - role: oracle_patch
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_patch_target: db
        oracle_patch_mode: >-
          {{
            'oop_dual'
            if (
              oracle_patch_dual_home_suffix | default('') | length > 0 or
              oracle_patch_dual_home_path | default('') | length > 0
            )
            else 'inplace'
          }}
        oracle_patch_apply_enabled: true
        oracle_patch_run_datapatch: false
        oracle_patch_dg_standbyfirst: false
        oracle_patch_allow_dataguard_dual_home_switch: true

- name: Validate current Data Guard standby before standby-first switchover
  hosts: primary
  become: true
  tasks:
    - name: Validate current standby is read-only with apply before switchover
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_home_path }}
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_standby }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_current_standby_after_patch
      changed_when: false
      failed_when: >-
        _patch_sf_current_standby_after_patch.rc != 0 or
        'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_current_standby_after_patch.stdout | default(''))
      no_log: true

    - name: Report standby-first readiness-only mode  # noqa: run-once[task]
      ansible.builtin.debug:
        msg: >-
          Standby-first readiness passed for primary={{ _patch_sf_current_primary }},
          standby={{ _patch_sf_current_standby }}, protection={{
          _patch_sf_protection_mode }}. No DB homes were installed or patched,
          no broker switchover was run, and datapatch was not executed because
          oracle_patch_standbyfirst_execute=false.
      when: not (oracle_patch_standbyfirst_execute | default(false) | bool)
      run_once: true

- name: Switchover Data Guard primary for standby-first patch
  hosts: primary
  become: true
  roles:
    - role: oracle_dataguard
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_dataguard_run_switchover: true
        oracle_dataguard_switchover_target: "{{ _patch_sf_current_standby }}"
        oracle_dataguard_configure_broker: false
        oracle_dataguard_prepare_primary: false
        oracle_dataguard_prepare_standby: false
        oracle_dataguard_duplicate_standby: false

- name: Run datapatch on promoted Data Guard primary
  hosts: patch_current_standby
  become: true
  tasks:
    - name: Run datapatch after standby-first switchover
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_patch_home_path | trim | quote }}
        export ORACLE_SID={{ _patch_sf_instance.name | quote }}
        "$ORACLE_HOME/OPatch/datapatch" -verbose
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_promoted_datapatch
      changed_when: _patch_sf_promoted_datapatch.rc == 0
      failed_when: >-
        _patch_sf_promoted_datapatch.rc != 0 or
        (
          'Patch installation complete' not in (_patch_sf_promoted_datapatch.stdout | default('')) and
          'SQL Patching tool complete' not in (_patch_sf_promoted_datapatch.stdout | default(''))
        )
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Install new Data Guard standby DB target homes
  hosts: patch_current_primary
  become: true
  roles:
    - role: oracle_db_install
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_db_install_home_selection: selected
        oracle_db_install_home_suffixes: >-
          {{
            [oracle_patch_dual_home_suffix]
            if (
              oracle_patch_dual_home_suffix | default('') | length > 0 and
              oracle_patch_dual_home_path | default('') | length == 0
            )
            else []
          }}
        oracle_db_install_home_paths: >-
          {{
            [oracle_patch_dual_home_path]
            if (oracle_patch_dual_home_path | default('') | length > 0)
            else []
          }}

- name: Patch new Data Guard standby DB homes
  hosts: patch_current_primary
  become: true
  roles:
    - role: oracle_patch
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_patch_target: db
        oracle_patch_mode: >-
          {{
            'oop_dual'
            if (
              oracle_patch_dual_home_suffix | default('') | length > 0 or
              oracle_patch_dual_home_path | default('') | length > 0
            )
            else 'inplace'
          }}
        oracle_patch_apply_enabled: true
        oracle_patch_run_datapatch: false
        oracle_patch_dg_standbyfirst: false
        oracle_patch_allow_dataguard_dual_home_switch: true

- name: Validate Data Guard broker after standby-first patching
  hosts: primary
  become: true
  tasks:
    - name: Validate Maximum Availability after standby-first patching
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_home_path }}
        "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_standby }}_dgb" <<'DGMGRL'
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_standby }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_primary }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_broker_after
      changed_when: false
      failed_when: >-
        _patch_sf_broker_after.rc != 0 or
        'Protection Mode: MaxAvailability' not in (_patch_sf_broker_after.stdout | default('')) or
        'Configuration Status:' not in (_patch_sf_broker_after.stdout | default('')) or
        'SUCCESS' not in (_patch_sf_broker_after.stdout | default('')) or
        'PRIMARY|READ WRITE|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_broker_after.stdout | default('')) or
        'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_broker_after.stdout | default(''))
      no_log: true
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Restore original Data Guard primary after standby-first patching
  hosts: primary
  become: true
  roles:
    - role: oracle_dataguard
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - oracle_patch_standbyfirst_restore_primary | default(false) | bool
      vars:
        oracle_dataguard_run_switchover: true
        oracle_dataguard_switchover_target: "{{ _patch_sf_current_primary }}"
        oracle_dataguard_configure_broker: false
        oracle_dataguard_prepare_primary: false
        oracle_dataguard_prepare_standby: false
        oracle_dataguard_duplicate_standby: false

- name: Validate original primary after standby-first restore
  hosts: primary
  become: true
  tasks:
    - name: Validate original primary and standby after standby-first restore
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_home_path }}
        "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_primary }}_dgb" <<'DGMGRL'
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_primary }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_standby }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_restore_after
      changed_when: false
      failed_when: >-
        _patch_sf_restore_after.rc != 0 or
        'Protection Mode: MaxAvailability' not in (_patch_sf_restore_after.stdout | default('')) or
        'Configuration Status:' not in (_patch_sf_restore_after.stdout | default('')) or
        'SUCCESS' not in (_patch_sf_restore_after.stdout | default('')) or
        'PRIMARY|READ WRITE|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_restore_after.stdout | default('')) or
        'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_restore_after.stdout | default(''))
      no_log: true
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - oracle_patch_standbyfirst_restore_primary | default(false) | bool
