---
# playbooks/07-patch-standbyfirst.yml - Data Guard standby-first DB patching.
#
# Policy:
#   - Whole zip must be Data Guard Standby-First Installable (every component
#     README). Classic OJVM+DB RU combos are NOT SF as a unit — apply them
#     together via dual-home / downtime (07-upgrade-dual-db-*.yml), not SF.
#   - Peeling an SF DB RU out of an otherwise ineligible combo is opt-in only
#     (oracle_patch_standbyfirst_allow_component_only=true). Default is refuse,
#     so operators do not SF the RU and leave OJVM for a later window.
#
# Flow when allowed: prove eligibility, stage optional target homes, patch the
# current standby, switchover through broker, then patch the old primary.

- name: Validate standby-first patch eligibility
  hosts: primary
  become: true
  vars:
    oracle_patch_target: db
    oracle_patch_db_zip: "{{ oracle_stage_dir }}/{{ oracle_patch_files.db_ru_zip | default('p39062931_190000_Linux-x86-64.zip') }}"
    oracle_patch_zip: "{{ oracle_patch_db_zip }}"
    oracle_patch_apply_component_path: ""
    # When true, allow SF apply of a single eligible DB RU component inside a
    # mixed/ineligible combo zip. Default false: combos are applied together.
    oracle_patch_standbyfirst_allow_component_only: false
    oracle_patch_standbyfirst_require_eligible: true
    oracle_patch_standbyfirst_execute: false
    oracle_patch_standbyfirst_restore_primary: false
    oracle_patch_standbyfirst_confirm: ""
  tasks:
    - name: Read standby-first eligibility from the patch README
      patch_standbyfirst_info:
        zip: "{{ oracle_patch_zip }}"
      register: _patch_standbyfirst

    - name: Fail when selected standby-first component path is invalid
      ansible.builtin.fail:
        msg: >-
          oracle_patch_apply_component_path={{ oracle_patch_apply_component_path }}
          is invalid. Use a relative component path reported by
          playbooks/07-patch-standbyfirst-media.yml.
      when:
        - oracle_patch_apply_component_path | default('') | length > 0
        - oracle_patch_apply_component_path.startswith('/') or
          oracle_patch_apply_component_path is search('(^|/)\\.\\.(/|$)')

    - name: Resolve selected standby-first patch component
      ansible.builtin.set_fact:
        _patch_standbyfirst_selected_component: >-
          {{
            (
              _patch_standbyfirst.eligible_db_components | default([])
              | selectattr('component_path', 'equalto', oracle_patch_apply_component_path)
              | list
              | first
            ) | default({})
          }}
      when: oracle_patch_apply_component_path | default('') | length > 0

    - name: Fail when selected patch component is not standby-first eligible
      ansible.builtin.fail:
        msg: >-
          oracle_patch_apply_component_path={{ oracle_patch_apply_component_path }}
          was not found as an eligible Data Guard Standby-First DB RU component
          in {{ oracle_patch_zip | basename }}.
      when:
        - oracle_patch_apply_component_path | default('') | length > 0
        - _patch_standbyfirst_selected_component | default({}) | length == 0

    # Combo (e.g. OJVM+DB RU): whole zip is not SF. Default refuse even when an
    # eligible DB RU component path is supplied — apply the combo together via
    # dual-home/downtime unless the operator opts into RU-only SF.
    - name: Fail when peeling SF component from mixed combo without opt-in
      ansible.builtin.fail:
        msg: >-
          {{ oracle_patch_zip | basename }} is not standby-first installable as a
          whole ({{ _patch_standbyfirst.reason | default('mixed or non-SF components') }}).
          Combo packages (OJVM + RU) should be applied together with
          playbooks/07-upgrade-dual-db-prepare.yml + cutover/downtime, not
          standby-first for the RU alone then OJVM later. To intentionally SF
          only component {{ oracle_patch_apply_component_path }}, re-run with
          -e oracle_patch_standbyfirst_allow_component_only=true.
      when:
        - oracle_patch_standbyfirst_require_eligible | default(true) | bool
        - oracle_patch_apply_component_path | default('') | length > 0
        - not (_patch_standbyfirst.eligible | default(false) | bool)
        - not (oracle_patch_standbyfirst_allow_component_only | default(false) | bool)

    - name: Fail when patch is not standby-first eligible
      ansible.builtin.fail:
        msg: >-
          {{ oracle_patch_zip | basename }} is not Data Guard Standby-First
          Installable as a whole
          ({{ _patch_standbyfirst.reason | default('see patch README') }}).
          Do not use playbooks/07-patch-standbyfirst.yml for full OJVM+RU combo
          zips — apply the combo together via dual-home prepare/cutover
          (standalone) or playbooks/07-upgrade-dual-db-downtime.yml (Data Guard).
          Standby-first is for zips where every component README is SF eligible.
          {% if (_patch_standbyfirst.eligible_db_components | default([]) | length) > 0 -%}
          This zip does contain SF-eligible DB RU component(s)
          {{ _patch_standbyfirst.eligible_db_components | map(attribute='component_path') | list | join(', ') }}
          — only use component-only SF with
          oracle_patch_standbyfirst_allow_component_only=true if you intentionally
          want the RU without the rest of the combo.
          {%- endif %}
      when:
        - oracle_patch_standbyfirst_require_eligible | default(true) | bool
        - oracle_patch_apply_component_path | default('') | length == 0
        - not _patch_standbyfirst.eligible | default(false) | bool

    - name: Fail when standby-first execution is not explicitly confirmed
      ansible.builtin.fail:
        msg: >-
          Standby-first patch execution installs/patches Data Guard homes,
          performs a broker switchover, and runs datapatch. Re-run with
          oracle_patch_standbyfirst_execute=true and
          oracle_patch_standbyfirst_confirm=PATCH_STANDBY_FIRST to execute.
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - oracle_patch_standbyfirst_confirm | default('') != 'PATCH_STANDBY_FIRST'

- name: Discover current Data Guard roles for standby-first patching
  hosts: oracle_db_hosts
  become: true
  vars:
    oracle_patch_standbyfirst_instance: ""
    oracle_patch_standbyfirst_expected_primary: ""
    oracle_patch_standbyfirst_expected_standby: ""
  tasks:
    - name: Resolve local Data Guard patch instance
      ansible.builtin.set_fact:
        _patch_sf_instance: >-
          {%- set instances = (oracle_instances | default([])) | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), false) -%}
          {%- set matches = [] -%}
          {%- for inst in instances -%}
            {%- if inst.dataguard | default(false) | bool and
                  (oracle_patch_standbyfirst_instance | length == 0 or
                   oracle_patch_standbyfirst_instance in [inst.name, inst.db_unique_name | default(inst.name)]) -%}
              {%- set _ = matches.append(inst) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ (matches | first) | default({}) }}

    - name: Fail when no Data Guard patch instance matches this host
      ansible.builtin.fail:
        msg: >-
          No Data Guard instance matched oracle_patch_standbyfirst_instance={{
          oracle_patch_standbyfirst_instance }} on {{ inventory_hostname }}.
      when: _patch_sf_instance | length == 0

    - name: Record local Data Guard unique name and home
      ansible.builtin.set_fact:
        _patch_sf_local_unique_name: "{{ _patch_sf_instance.db_unique_name | default(_patch_sf_instance.name) }}"
        _patch_sf_local_dgconnect_identifier: >-
          (DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST={{ _patch_sf_instance.listener_vip }})(PORT={{ _patch_sf_instance.listener_port | default(1521) }}))(CONNECT_DATA=(SERVER=DEDICATED)(SERVICE_NAME={{ _patch_sf_instance.db_unique_name | default(_patch_sf_instance.name) }}_DGMGRL)))
        _patch_sf_home_inventory_path: >-
          {{ _patch_sf_instance.oracle_base }}/{{ ((_patch_sf_instance.db_homes | selectattr('current', 'equalto', true) | list | first) | default(_patch_sf_instance.db_homes[0])).suffix }}
        _patch_sf_patch_home_path: >-
          {%- set current_home = (_patch_sf_instance.db_homes | selectattr('current', 'equalto', true) | list | first) | default(_patch_sf_instance.db_homes[0]) -%}
          {%- if oracle_patch_dual_home_path | default('') | length > 0 -%}
          {{ oracle_patch_dual_home_path }}{%- elif oracle_patch_dual_home_suffix | default('') | length > 0 -%}
          {{ _patch_sf_instance.oracle_base }}/{{ oracle_patch_dual_home_suffix }}{%- else -%}
          {{ _patch_sf_instance.oracle_base }}/{{ current_home.suffix }}{%- endif -%}

    - name: Resolve runtime ORACLE_HOME from Restart for standby-first
      ansible.builtin.include_role:
        name: oracle_common
        tasks_from: resolve-runtime-home.yml
      vars:
        oracle_runtime_home_restart_db: "{{ _patch_sf_local_unique_name }}"
        oracle_runtime_home_fallback: "{{ _patch_sf_home_inventory_path }}"

    - name: Use Restart-registered ORACLE_HOME for standby-first
      ansible.builtin.set_fact:
        _patch_sf_home_path: "{{ _runtime_home_path }}"

    - name: Read Data Guard broker roles and protection mode  # noqa: run-once[task]
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_home_path }}
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_local_unique_name }}_dgb" <<'DGMGRL'
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        )"
        printf '%s\n' "$output"
        primary="$(printf '%s\n' "$output" | awk '/Primary database/ {print $1; exit}')"
        standby="$(printf '%s\n' "$output" | awk '/Physical standby database/ {print $1; exit}')"
        mode="$(printf '%s\n' "$output" | awk -F': *' '/Protection Mode:/ {print $2; exit}')"
        printf 'PATCH_SF_PRIMARY=%s\nPATCH_SF_STANDBY=%s\nPATCH_SF_PROTECTION_MODE=%s\n' "$primary" "$standby" "$mode"
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_broker
      changed_when: false
      failed_when: >-
        _patch_sf_broker.rc != 0 or
        'Configuration -' not in (_patch_sf_broker.stdout | default(''))
      no_log: true
      run_once: true

    - name: Record current broker roles for standby-first patching  # noqa: run-once[task]
      ansible.builtin.set_fact:
        _patch_sf_current_primary: "{{ _patch_sf_broker.stdout | regex_search('PATCH_SF_PRIMARY=([^\\n]+)', '\\1') | first | default('') }}"
        _patch_sf_current_standby: "{{ _patch_sf_broker.stdout | regex_search('PATCH_SF_STANDBY=([^\\n]+)', '\\1') | first | default('') }}"
        _patch_sf_protection_mode: "{{ _patch_sf_broker.stdout | regex_search('PATCH_SF_PROTECTION_MODE=([^\\n]+)', '\\1') | first | default('') }}"
      run_once: true

    - name: Publish standby-first broker facts to Data Guard hosts  # noqa: run-once[task]
      ansible.builtin.set_fact:
        _patch_sf_current_primary: "{{ _patch_sf_current_primary }}"
        _patch_sf_current_standby: "{{ _patch_sf_current_standby }}"
        _patch_sf_protection_mode: "{{ _patch_sf_protection_mode }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups.oracle_db_hosts | default([]) }}"
      run_once: true

    - name: Fail when broker is not in Maximum Availability  # noqa: run-once[task]
      ansible.builtin.fail:
        msg: >-
          Data Guard standby-first patching requires Maximum Availability, got
          {{ _patch_sf_protection_mode }}.
      when: _patch_sf_protection_mode != 'MaxAvailability'
      run_once: true

    - name: Fail when broker roles could not be resolved  # noqa: run-once[task]
      ansible.builtin.fail:
        msg: >-
          Could not resolve current primary/standby from broker output for
          standby-first patching.
      when:
        - _patch_sf_current_primary | length == 0 or _patch_sf_current_standby | length == 0
      run_once: true

    - name: Record standby-first broker connect descriptors  # noqa: run-once[task]
      ansible.builtin.set_fact:
        _patch_sf_current_primary_dgconnect_identifier: >-
          {%- set out = [] -%}
          {%- for host in groups.oracle_db_hosts | default([]) -%}
            {%- if hostvars[host]._patch_sf_local_unique_name | default('') == _patch_sf_current_primary -%}
              {%- set _ = out.append(hostvars[host]._patch_sf_local_dgconnect_identifier | default('')) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out | first | default('') }}
        _patch_sf_current_standby_dgconnect_identifier: >-
          {%- set out = [] -%}
          {%- for host in groups.oracle_db_hosts | default([]) -%}
            {%- if hostvars[host]._patch_sf_local_unique_name | default('') == _patch_sf_current_standby -%}
              {%- set _ = out.append(hostvars[host]._patch_sf_local_dgconnect_identifier | default('')) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out | first | default('') }}
      run_once: true

    - name: Normalize broker connect descriptors for standby-first patching  # noqa: run-once[task]
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_home_path }}
        "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_primary }}_dgb" <<'DGMGRL'
        EDIT DATABASE '{{ _patch_sf_current_primary }}' SET PROPERTY DGConnectIdentifier='{{ _patch_sf_current_primary_dgconnect_identifier }}';
        EDIT DATABASE '{{ _patch_sf_current_standby }}' SET PROPERTY DGConnectIdentifier='{{ _patch_sf_current_standby_dgconnect_identifier }}';
        EXIT;
        DGMGRL
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_dgconnect_identifiers
      changed_when: false
      failed_when: >-
        _patch_sf_dgconnect_identifiers.rc != 0 or
        'Error:' in (_patch_sf_dgconnect_identifiers.stdout | default(''))
      no_log: true
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      run_once: true

    - name: Fail when current primary does not match expected standby-first primary  # noqa: run-once[task]
      ansible.builtin.fail:
        msg: >-
          Standby-first patching expected current primary
          {{ oracle_patch_standbyfirst_expected_primary }}, got
          {{ _patch_sf_current_primary }}.
      when:
        - oracle_patch_standbyfirst_expected_primary | default('') | length > 0
        - _patch_sf_current_primary != oracle_patch_standbyfirst_expected_primary
      run_once: true

    - name: Fail when current standby does not match expected standby-first standby  # noqa: run-once[task]
      ansible.builtin.fail:
        msg: >-
          Standby-first patching expected current standby
          {{ oracle_patch_standbyfirst_expected_standby }}, got
          {{ _patch_sf_current_standby }}.
      when:
        - oracle_patch_standbyfirst_expected_standby | default('') | length > 0
        - _patch_sf_current_standby != oracle_patch_standbyfirst_expected_standby
      run_once: true

    - name: Report standby-first execution plan  # noqa: run-once[task]
      ansible.builtin.debug:
        msg:
          patch_zip: "{{ oracle_patch_zip | default(oracle_stage_dir ~ '/' ~ (oracle_patch_files.db_ru_zip | default('p39062931_190000_Linux-x86-64.zip'))) }}"
          component_path: "{{ oracle_patch_apply_component_path | default('') | default('whole zip', true) }}"
          current_primary: "{{ _patch_sf_current_primary }}"
          current_standby: "{{ _patch_sf_current_standby }}"
          protection: "{{ _patch_sf_protection_mode }}"
          execute: "{{ oracle_patch_standbyfirst_execute | default(false) | bool }}"
          restore_original_primary: "{{ oracle_patch_standbyfirst_restore_primary | default(false) | bool }}"
          target_homes: >-
            {%- set out = [] -%}
            {%- for host in groups.oracle_db_hosts | default([]) -%}
              {%- set _ = out.append({
                'host': host,
                'db_unique_name': hostvars[host]._patch_sf_local_unique_name | default(''),
                'current_home': hostvars[host]._patch_sf_home_path | default('') | trim,
                'patch_home': hostvars[host]._patch_sf_patch_home_path | default('') | trim
              }) -%}
            {%- endfor -%}
            {{ out }}
      run_once: true

    - name: Add host to current standby patch group  # noqa: run-once[task]
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: patch_current_standby
      loop: "{{ groups.oracle_db_hosts | default([]) }}"
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - hostvars[item]._patch_sf_local_unique_name | default('') == _patch_sf_current_standby
      run_once: true

    - name: Add host to current primary patch group  # noqa: run-once[task]
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: patch_current_primary
      loop: "{{ groups.oracle_db_hosts | default([]) }}"
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - hostvars[item]._patch_sf_local_unique_name | default('') == _patch_sf_current_primary
      run_once: true

- name: Install current Data Guard standby DB target homes
  hosts: patch_current_standby
  become: true
  roles:
    - role: oracle_db_install
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_db_install_instances: "{{ [_patch_sf_instance] }}"
        oracle_db_install_home_selection: selected
        oracle_db_install_home_suffixes: >-
          {{
            [oracle_patch_dual_home_suffix]
            if (
              oracle_patch_dual_home_suffix | default('') | length > 0 and
              oracle_patch_dual_home_path | default('') | length == 0
            )
            else []
          }}
        oracle_db_install_home_paths: >-
          {{
            [oracle_patch_dual_home_path]
            if (oracle_patch_dual_home_path | default('') | length > 0)
            else []
          }}

- name: Prepare current Data Guard standby target home network config
  hosts: patch_current_standby
  become: true
  tasks:
    - name: Sync current standby target home network config
      ansible.builtin.shell: |
        set -o pipefail
        src_home={{ _patch_sf_home_path | trim | quote }}
        dst_home={{ _patch_sf_patch_home_path | trim | quote }}
        src_admin="$src_home/network/admin"
        dst_admin="$dst_home/network/admin"
        listener_name=LISTENER_{{ _patch_sf_instance.name | upper }}
        changed=0

        mkdir -p "$dst_admin"
        for file in listener.ora sqlnet.ora tnsnames.ora; do
          if [ -f "$src_admin/$file" ]; then
            sed "s#${src_home}#${dst_home}#g" "$src_admin/$file" > "$dst_admin/$file.tmp"
            if [ ! -f "$dst_admin/$file" ] || ! cmp -s "$dst_admin/$file.tmp" "$dst_admin/$file"; then
              mv "$dst_admin/$file.tmp" "$dst_admin/$file"
              changed=1
            else
              rm -f "$dst_admin/$file.tmp"
            fi
          fi
        done
        chown -R {{ oracle_user | quote }}:{{ oracle_group | quote }} "$dst_admin"
        chmod 0775 "$dst_admin"
        find "$dst_admin" -maxdepth 1 -type f -exec chmod 0644 {} +

        current_listener_home="$(
          {{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}/bin/srvctl config listener -listener "$listener_name" 2>/dev/null |
          awk -F': ' '$1 == "Home" {print $2; exit}'
        )"
        {{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}/bin/srvctl setenv database \
          -db {{ _patch_sf_local_unique_name | quote }} -env "TNS_ADMIN=$dst_admin" >/dev/null
        if [ "$current_listener_home" = "$dst_home" ]; then
          "$dst_home/bin/lsnrctl" stop "$listener_name" >/dev/null 2>&1 || true
          "$dst_home/bin/lsnrctl" start "$listener_name" >/dev/null
          changed=1
        fi

        if [ "$changed" -eq 1 ]; then
          echo CHANGED
        fi
      args: { executable: /bin/bash }
      register: _patch_sf_current_standby_network
      changed_when: "'CHANGED' in (_patch_sf_current_standby_network.stdout | default(''))"
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Patch current Data Guard standby DB homes
  hosts: patch_current_standby
  become: true
  roles:
    - role: oracle_patch
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_patch_instances: "{{ [_patch_sf_instance] }}"
        oracle_patch_target: db
        oracle_patch_mode: >-
          {{
            'oop_dual'
            if (
              oracle_patch_dual_home_suffix | default('') | length > 0 or
              oracle_patch_dual_home_path | default('') | length > 0
            )
            else 'inplace'
          }}
        oracle_patch_apply_enabled: true
        oracle_patch_run_datapatch: false
        oracle_patch_dg_standbyfirst: false
        oracle_patch_discover_oratab: false
        oracle_patch_allow_dataguard_dual_home_switch: true

- name: Validate current Data Guard standby DB target home patch inventory
  hosts: patch_current_standby
  become: true
  tasks:
    - name: Validate current standby target home contains expected patch IDs
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_patch_home_path | trim | quote }}
        output="$("$ORACLE_HOME/OPatch/opatch" lspatches)"
        printf '%s\n' "$output"
        {% for patch_id in _patch_expected_ids | default([]) %}
        printf '%s\n' "$output" | grep -E '^{{ patch_id }};' >/dev/null
        {% endfor %}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_current_standby_lspatches
      changed_when: false
      failed_when: >-
        _patch_sf_current_standby_lspatches.rc != 0 or
        'OPatch succeeded' not in (_patch_sf_current_standby_lspatches.stdout | default('')) or
        (_patch_expected_ids | default([]) | length) == 0
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Reconcile current Data Guard standby after target-home switch
  hosts: patch_current_standby
  become: true
  tasks:
    - name: Restart current standby listener from target home
      ansible.builtin.shell: |
        set -o pipefail
        listener_name=LISTENER_{{ _patch_sf_instance.name | upper }}
        gi_home={{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}
        "$gi_home/bin/srvctl" stop listener -listener "$listener_name" >/dev/null 2>&1 || true
        "$gi_home/bin/srvctl" start listener -listener "$listener_name"
      args: { executable: /bin/bash }
      changed_when: true
      when: oracle_patch_standbyfirst_execute | default(false) | bool

    - name: Register current standby with restarted target-home listener
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_patch_home_path | trim | quote }}
        export ORACLE_SID={{ _patch_sf_instance.name | quote }}
        printf '%s\n' "ALTER SYSTEM REGISTER;" "EXIT;" |
          "$ORACLE_HOME/bin/sqlplus" -L -S "/ as sysdba"
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      changed_when: false
      when: oracle_patch_standbyfirst_execute | default(false) | bool

    - name: Ensure current standby broker member is enabled before switchover
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_patch_home_path | trim | quote }}
        export ORACLE_SID={{ _patch_sf_instance.name | quote }}
        gi_home={{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}

        enable_member() {
          printf '%s\n' \
            "ENABLE DATABASE {{ _patch_sf_current_standby }};" \
            "EXIT;" |
            "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_primary }}_dgb"
        }

        output="$(enable_member 2>&1)" || rc=$?
        if printf '%s\n' "$output" | grep -F 'ORA-16631' >/dev/null; then
          "$gi_home/bin/srvctl" stop database -db {{ _patch_sf_local_unique_name | quote }} -stopoption IMMEDIATE >/dev/null 2>&1 || true
          output="$(enable_member 2>&1)" || rc=$?
          "$gi_home/bin/srvctl" start database -db {{ _patch_sf_local_unique_name | quote }} -startoption "read only"
          printf '%s\n' \
            "ALTER DATABASE RECOVER MANAGED STANDBY DATABASE CANCEL;" \
            "ALTER DATABASE OPEN READ ONLY;" \
            "ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT FROM SESSION;" \
            "EXIT;" |
            "$ORACLE_HOME/bin/sqlplus" -L -S "/ as sysdba"
        fi
        printf '%s\n' "$output"
        exit "${rc:-0}"
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_enable_current_standby
      changed_when: false
      failed_when: >-
        _patch_sf_enable_current_standby.rc != 0 or
        'Error:' in (_patch_sf_enable_current_standby.stdout | default(''))
      no_log: true
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Validate current Data Guard standby before standby-first switchover
  hosts: primary
  become: true
  tasks:
    - name: Validate current standby is read-only with apply before switchover
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_home_path }}
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_standby }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_current_standby_after_patch
      changed_when: false
      failed_when: >-
        _patch_sf_current_standby_after_patch.rc != 0 or
        'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_current_standby_after_patch.stdout | default(''))
      no_log: true

    - name: Report standby-first readiness-only mode  # noqa: run-once[task]
      ansible.builtin.debug:
        msg: >-
          Standby-first readiness passed for primary={{ _patch_sf_current_primary }},
          standby={{ _patch_sf_current_standby }}, protection={{
          _patch_sf_protection_mode }}. No DB homes were installed or patched,
          no broker switchover was run, and datapatch was not executed because
          oracle_patch_standbyfirst_execute=false.
      when: not (oracle_patch_standbyfirst_execute | default(false) | bool)
      run_once: true

- name: Switchover Data Guard primary for standby-first patch
  hosts: primary
  become: true
  roles:
    - role: oracle_dataguard
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_dataguard_run_switchover: true
        oracle_dataguard_switchover_target: "{{ _patch_sf_current_standby }}"
        oracle_dataguard_configure_broker: false
        oracle_dataguard_prepare_primary: false
        oracle_dataguard_prepare_standby: false
        oracle_dataguard_duplicate_standby: false

- name: Run datapatch on promoted Data Guard primary
  hosts: patch_current_standby
  become: true
  tasks:
    - name: Run datapatch after standby-first switchover
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_patch_home_path | trim | quote }}
        export ORACLE_SID={{ _patch_sf_instance.name | quote }}
        "$ORACLE_HOME/OPatch/datapatch" -verbose
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_promoted_datapatch
      changed_when: _patch_sf_promoted_datapatch.rc == 0
      failed_when: >-
        _patch_sf_promoted_datapatch.rc != 0 or
        (
          'Patch installation complete' not in (_patch_sf_promoted_datapatch.stdout | default('')) and
          'SQL Patching tool complete' not in (_patch_sf_promoted_datapatch.stdout | default(''))
        )
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Validate promoted Data Guard primary SQL patch registry
  hosts: patch_current_standby
  become: true
  tasks:
    - name: Validate promoted primary SQL patch registry contains expected patch IDs
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_patch_home_path | trim | quote }}
        export ORACLE_SID={{ _patch_sf_instance.name | quote }}
        output="$("$ORACLE_HOME/bin/sqlplus" -L -S "/ as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT 'SQL_PATCH_SUCCESS=' || patch_id
        FROM dba_registry_sqlpatch
        WHERE action = 'APPLY'
          AND status = 'SUCCESS';
        EXIT;
        SQL
        )"
        printf '%s\n' "$output"
        {% for patch_id in _patch_expected_ids | default([]) %}
        printf '%s\n' "$output" | grep -E '^[[:space:]]*SQL_PATCH_SUCCESS={{ patch_id }}[[:space:]]*$' >/dev/null
        {% endfor %}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_promoted_sqlpatch
      changed_when: false
      failed_when: >-
        _patch_sf_promoted_sqlpatch.rc != 0 or
        (_patch_expected_ids | default([]) | length) == 0
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Install new Data Guard standby DB target homes
  hosts: patch_current_primary
  become: true
  roles:
    - role: oracle_db_install
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_db_install_instances: "{{ [_patch_sf_instance] }}"
        oracle_db_install_home_selection: selected
        oracle_db_install_home_suffixes: >-
          {{
            [oracle_patch_dual_home_suffix]
            if (
              oracle_patch_dual_home_suffix | default('') | length > 0 and
              oracle_patch_dual_home_path | default('') | length == 0
            )
            else []
          }}
        oracle_db_install_home_paths: >-
          {{
            [oracle_patch_dual_home_path]
            if (oracle_patch_dual_home_path | default('') | length > 0)
            else []
          }}

- name: Prepare new Data Guard standby target home network config
  hosts: patch_current_primary
  become: true
  tasks:
    - name: Sync new standby target home network config
      ansible.builtin.shell: |
        set -o pipefail
        src_home={{ _patch_sf_home_path | trim | quote }}
        dst_home={{ _patch_sf_patch_home_path | trim | quote }}
        src_admin="$src_home/network/admin"
        dst_admin="$dst_home/network/admin"
        listener_name=LISTENER_{{ _patch_sf_instance.name | upper }}
        changed=0

        mkdir -p "$dst_admin"
        for file in listener.ora sqlnet.ora tnsnames.ora; do
          if [ -f "$src_admin/$file" ]; then
            sed "s#${src_home}#${dst_home}#g" "$src_admin/$file" > "$dst_admin/$file.tmp"
            if [ ! -f "$dst_admin/$file" ] || ! cmp -s "$dst_admin/$file.tmp" "$dst_admin/$file"; then
              mv "$dst_admin/$file.tmp" "$dst_admin/$file"
              changed=1
            else
              rm -f "$dst_admin/$file.tmp"
            fi
          fi
        done
        chown -R {{ oracle_user | quote }}:{{ oracle_group | quote }} "$dst_admin"
        chmod 0775 "$dst_admin"
        find "$dst_admin" -maxdepth 1 -type f -exec chmod 0644 {} +

        current_listener_home="$(
          {{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}/bin/srvctl config listener -listener "$listener_name" 2>/dev/null |
          awk -F': ' '$1 == "Home" {print $2; exit}'
        )"
        {{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}/bin/srvctl setenv database \
          -db {{ _patch_sf_local_unique_name | quote }} -env "TNS_ADMIN=$dst_admin" >/dev/null
        if [ "$current_listener_home" = "$dst_home" ]; then
          "$dst_home/bin/lsnrctl" stop "$listener_name" >/dev/null 2>&1 || true
          "$dst_home/bin/lsnrctl" start "$listener_name" >/dev/null
          changed=1
        fi

        if [ "$changed" -eq 1 ]; then
          echo CHANGED
        fi
      args: { executable: /bin/bash }
      register: _patch_sf_new_standby_network
      changed_when: "'CHANGED' in (_patch_sf_new_standby_network.stdout | default(''))"
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Patch new Data Guard standby DB homes
  hosts: patch_current_primary
  become: true
  roles:
    - role: oracle_patch
      when: oracle_patch_standbyfirst_execute | default(false) | bool
      vars:
        oracle_patch_instances: "{{ [_patch_sf_instance] }}"
        oracle_patch_target: db
        oracle_patch_mode: >-
          {{
            'oop_dual'
            if (
              oracle_patch_dual_home_suffix | default('') | length > 0 or
              oracle_patch_dual_home_path | default('') | length > 0
            )
            else 'inplace'
          }}
        oracle_patch_apply_enabled: true
        oracle_patch_run_datapatch: false
        oracle_patch_dg_standbyfirst: false
        oracle_patch_discover_oratab: false
        oracle_patch_allow_dataguard_dual_home_switch: true

- name: Validate new Data Guard standby DB target home patch inventory
  hosts: patch_current_primary
  become: true
  tasks:
    - name: Validate new standby target home contains expected patch IDs
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_patch_home_path | trim | quote }}
        output="$("$ORACLE_HOME/OPatch/opatch" lspatches)"
        printf '%s\n' "$output"
        {% for patch_id in _patch_expected_ids | default([]) %}
        printf '%s\n' "$output" | grep -E '^{{ patch_id }};' >/dev/null
        {% endfor %}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_new_standby_lspatches
      changed_when: false
      failed_when: >-
        _patch_sf_new_standby_lspatches.rc != 0 or
        'OPatch succeeded' not in (_patch_sf_new_standby_lspatches.stdout | default('')) or
        (_patch_expected_ids | default([]) | length) == 0
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Reconcile new Data Guard standby after target-home switch
  hosts: patch_current_primary
  become: true
  tasks:
    - name: Restart new standby listener from target home
      ansible.builtin.shell: |
        set -o pipefail
        listener_name=LISTENER_{{ _patch_sf_instance.name | upper }}
        gi_home={{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}
        "$gi_home/bin/srvctl" stop listener -listener "$listener_name" >/dev/null 2>&1 || true
        "$gi_home/bin/srvctl" start listener -listener "$listener_name"
      args: { executable: /bin/bash }
      changed_when: true
      when: oracle_patch_standbyfirst_execute | default(false) | bool

    - name: Register new standby with restarted target-home listener
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_patch_home_path | trim | quote }}
        export ORACLE_SID={{ _patch_sf_instance.name | quote }}
        printf '%s\n' "ALTER SYSTEM REGISTER;" "EXIT;" |
          "$ORACLE_HOME/bin/sqlplus" -L -S "/ as sysdba"
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      changed_when: false
      when: oracle_patch_standbyfirst_execute | default(false) | bool

    - name: Ensure new standby broker member is enabled after patching
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_patch_home_path | trim | quote }}
        export ORACLE_SID={{ _patch_sf_instance.name | quote }}
        gi_home={{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}

        enable_member() {
          printf '%s\n' \
            "ENABLE DATABASE {{ _patch_sf_current_primary }};" \
            "EXIT;" |
            "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_standby }}_dgb"
        }

        output="$(enable_member 2>&1)" || rc=$?
        if printf '%s\n' "$output" | grep -F 'ORA-16631' >/dev/null; then
          "$gi_home/bin/srvctl" stop database -db {{ _patch_sf_local_unique_name | quote }} -stopoption IMMEDIATE >/dev/null 2>&1 || true
          output="$(enable_member 2>&1)" || rc=$?
          "$gi_home/bin/srvctl" start database -db {{ _patch_sf_local_unique_name | quote }} -startoption "read only"
          printf '%s\n' \
            "ALTER DATABASE RECOVER MANAGED STANDBY DATABASE CANCEL;" \
            "ALTER DATABASE OPEN READ ONLY;" \
            "ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT FROM SESSION;" \
            "EXIT;" |
            "$ORACLE_HOME/bin/sqlplus" -L -S "/ as sysdba"
        fi
        printf '%s\n' "$output"
        exit "${rc:-0}"
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_enable_new_standby
      changed_when: false
      failed_when: >-
        _patch_sf_enable_new_standby.rc != 0 or
        'Error:' in (_patch_sf_enable_new_standby.stdout | default(''))
      no_log: true
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Validate Data Guard broker after standby-first patching
  hosts: primary
  become: true
  tasks:
    - name: Validate Maximum Availability after standby-first patching
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_home_path }}
        "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_standby }}_dgb" <<'DGMGRL'
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_standby }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_primary }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_broker_after
      changed_when: false
      failed_when: >-
        _patch_sf_broker_after.rc != 0 or
        'Protection Mode: MaxAvailability' not in (_patch_sf_broker_after.stdout | default('')) or
        'Configuration Status:' not in (_patch_sf_broker_after.stdout | default('')) or
        'SUCCESS' not in (_patch_sf_broker_after.stdout | default('')) or
        'PRIMARY|READ WRITE|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_broker_after.stdout | default('')) or
        'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_broker_after.stdout | default(''))
      no_log: true
      when: oracle_patch_standbyfirst_execute | default(false) | bool

- name: Restore original Data Guard primary after standby-first patching
  hosts: primary
  become: true
  roles:
    - role: oracle_dataguard
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - oracle_patch_standbyfirst_restore_primary | default(false) | bool
      vars:
        oracle_dataguard_run_switchover: true
        oracle_dataguard_switchover_target: "{{ _patch_sf_current_primary }}"
        oracle_dataguard_configure_broker: false
        oracle_dataguard_prepare_primary: false
        oracle_dataguard_prepare_standby: false
        oracle_dataguard_duplicate_standby: false

- name: Validate original primary after standby-first restore
  hosts: primary
  become: true
  tasks:
    - name: Validate original primary and standby after standby-first restore
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _patch_sf_home_path }}
        "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_primary }}_dgb" <<'DGMGRL'
        SHOW CONFIGURATION;
        EXIT;
        DGMGRL
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_primary }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
        "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _patch_sf_current_standby }}_dgb as sysdba" <<'SQL'
        SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
        SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
        EXIT;
        SQL
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      register: _patch_sf_restore_after
      changed_when: false
      failed_when: >-
        _patch_sf_restore_after.rc != 0 or
        'Protection Mode: MaxAvailability' not in (_patch_sf_restore_after.stdout | default('')) or
        'Configuration Status:' not in (_patch_sf_restore_after.stdout | default('')) or
        'SUCCESS' not in (_patch_sf_restore_after.stdout | default('')) or
        'PRIMARY|READ WRITE|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_restore_after.stdout | default('')) or
        'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' not in (_patch_sf_restore_after.stdout | default(''))
      no_log: true
      when:
        - oracle_patch_standbyfirst_execute | default(false) | bool
        - oracle_patch_standbyfirst_restore_primary | default(false) | bool
