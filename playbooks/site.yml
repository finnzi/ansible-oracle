---
# playbooks/site.yml — the umbrella playbook.
#
# End-to-end order:
#   prep OS -> Grid/Restart -> DB home -> instance/listener -> Restart/service
#   -> Data Guard in Maximum Availability -> FSFO observer -> patch inventory
#   and conservative no-op dual-home validation -> tests.
#
# The site playbook is the Data Guard lab path, so the instance and service
# imports run their oracle_network dependency in Data Guard mode from the
# beginning. Running the standalone listener pass first would churn listener
# files before the Data Guard play corrected them.
#
# Patch imports here use safe defaults: DB/Grid homes are inspected by default
# and only patched when oracle_patch_apply_enabled=true. The dual-home playbook
# defaults to the current home unless an existing target home is configured.
# Standby-first patching intentionally remains an explicit opt-in playbook
# because it performs broker role changes and can apply patches.
#
# Note: import_playbook does not accept a `name:` on the import itself, so
# each imported playbook carries a clearly-named top-level play.

- name: Vertical slice — prepare the OS for Oracle
  ansible.builtin.import_playbook: 00-prep-os.yml

- name: Install Oracle Grid Infrastructure (Restart)
  ansible.builtin.import_playbook: 01-install-grid.yml

- name: Install Oracle Database software
  ansible.builtin.import_playbook: 02-install-dbhome.yml

- name: Create database instances and listeners
  ansible.builtin.import_playbook: 03-create-instance.yml
  vars:
    oracle_network_dataguard_enabled: true
    oracle_lab_host_map_mode: dataguard
    oracle_db_manage_apply_instance_overrides_require_dataguard: false

- name: Register with Oracle Restart and create client services
  ansible.builtin.import_playbook: 04-register-restart.yml
  vars:
    oracle_network_dataguard_enabled: true
    oracle_lab_host_map_mode: dataguard
    oracle_restart_apply_instance_overrides_require_dataguard: false
    oracle_db_manage_apply_instance_overrides_require_dataguard: false
    oracle_service_apply_instance_overrides_require_dataguard: false

- name: Configure Data Guard in Maximum Availability mode
  ansible.builtin.import_playbook: 05-dataguard.yml

- name: Reconcile Restart services after standby creation
  ansible.builtin.import_playbook: 04-register-restart.yml
  vars:
    oracle_network_dataguard_enabled: true
    oracle_lab_host_map_mode: dataguard
    oracle_restart_apply_instance_overrides_require_dataguard: false
    oracle_db_manage_apply_instance_overrides_require_dataguard: false
    oracle_service_apply_instance_overrides_require_dataguard: false

- name: Configure FSFO observer
  ansible.builtin.import_playbook: 06-observer.yml

- name: Configure role-based client availability
  ansible.builtin.import_playbook: 08-client-availability.yml

- name: Converge Oracle DB home patch inventory
  ansible.builtin.import_playbook: 07-patch.yml

- name: Converge Oracle Grid home patch inventory
  ansible.builtin.import_playbook: 07-patch-grid.yml

- name: Validate Oracle DB dual-home patch switch target
  ansible.builtin.import_playbook: 07-patch-dual-db.yml

- name: Run the ansible-oracle test suite
  ansible.builtin.import_playbook: 99-test.yml
