---
# playbooks/site.yml — the umbrella playbook.
#
# Vertical-slice order:
#   00 prep OS  -> 02 install DB home -> 03 create instance + listener ->
#   04 register with Restart + create service -> 99 run tests.
#
# Scaffolded playbooks (01 grid, 05 dataguard, 06 observer, 07 patch) are
# imported but currently no-ops or fact-gathering only. To exercise them
# individually, run the playbook directly (e.g. ansible-playbook playbooks/07-patch.yml).
#
# Note: import_playbook does not accept a `name:` on the import itself, so
# each imported playbook carries a clearly-named top-level play.

- name: Vertical slice — prepare the OS for Oracle
  ansible.builtin.import_playbook: 00-prep-os.yml

- name: Scaffolded — install Oracle Grid Infrastructure (Restart)
  ansible.builtin.import_playbook: 01-install-grid.yml

- name: Install Oracle Database software
  ansible.builtin.import_playbook: 02-install-dbhome.yml

- name: Create database instances and listeners
  ansible.builtin.import_playbook: 03-create-instance.yml

- name: Register with Oracle Restart and create client services
  ansible.builtin.import_playbook: 04-register-restart.yml

- name: Scaffolded — configure Data Guard
  ansible.builtin.import_playbook: 05-dataguard.yml

- name: Scaffolded — configure FSFO observer
  ansible.builtin.import_playbook: 06-observer.yml

- name: Analyse patch for standby-first eligibility (apply scaffolded)
  ansible.builtin.import_playbook: 07-patch.yml

- name: Run the ansible-oracle test suite
  ansible.builtin.import_playbook: 99-test.yml
