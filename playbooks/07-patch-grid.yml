---
# playbooks/07-patch-grid.yml - Oracle Grid home patching.
# Converges the current Oracle Restart/Grid home against the staged GI RU.
# Apply is serialized standby-then-primary so GI patching cannot stop both
# Data Guard sites in the same Ansible batch.

- name: Converge Oracle Grid home patch inventory (standby first)
  hosts: standby
  serial: 1
  become: true
  roles:
    - role: oracle_patch
      vars:
        oracle_patch_target: grid

- name: Converge Oracle Grid home patch inventory (primary after standby)
  hosts: primary
  serial: 1
  become: true
  roles:
    - role: oracle_patch
      vars:
        oracle_patch_target: grid
