---
# playbooks/07-patch.yml — Oracle home patching.
# Detection (standby-first eligibility) runs against the staged RU zip. DB-home
# patch inventory is converged by default; opatchauto/datapatch only run when
# oracle_patch_apply_enabled=true and the expected patch ID is missing.
#
# Apply is serialized standby-then-primary so a generic run cannot stop both
# Data Guard sites in the same Ansible batch. The role also refuses apply when
# a single play still includes both sites (hosts: oracle_db_hosts).
# A fail-closed availability/apply gate sits between the plays so a failed or
# unhealthy standby cannot proceed into primary maintenance.

- name: Converge Oracle DB home patch inventory (standby first)
  hosts: standby
  serial: 1
  any_errors_fatal: true
  become: true
  roles:
    - role: oracle_patch

- name: Refuse primary DB patch unless standby is available after apply
  hosts: standby
  serial: 1
  any_errors_fatal: true
  become: true
  tasks:
    - name: Assert standby remains available before primary maintenance
      ansible.builtin.include_role:
        name: oracle_patch
        tasks_from: assert-site-ready.yml

- name: Converge Oracle DB home patch inventory (primary after standby)
  hosts: primary
  serial: 1
  any_errors_fatal: true
  become: true
  roles:
    - role: oracle_patch
