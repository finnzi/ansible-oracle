---
# tasks/install-home.yml — install one Oracle home (out-of-place).
# `tgt` is in scope: name, oracle_base, home_suffix, home_path, stage_dir, zip.
#
# Note: the installer zip lives under the read-only stage_dir (bind mount in
# the lab). We put writable per-home staging (response file, logs) under the
# oracle home's parent, which is always writable.

- name: Idempotency marker — is this home already installed?
  ansible.builtin.stat:
    path: "{{ tgt.home_path }}/.install_complete"
  register: _marker

- name: Check whether a previous run unpacked the installer
  ansible.builtin.stat:
    path: "{{ tgt.home_path }}/runInstaller"
  register: _runinstaller
  when: not _marker.stat.exists

- name: Check whether the oracle binary is linked
  ansible.builtin.stat:
    path: "{{ tgt.home_path }}/bin/oracle"
  register: _oracle_binary
  when: not _marker.stat.exists

- name: Determine whether this home already has a linked oracle binary
  ansible.builtin.set_fact:
    _oracle_home_linked: >-
      {{ (_oracle_binary.stat.exists | default(false)) and
         ((_oracle_binary.stat.size | default(0) | int) > 0) }}
  when: not _marker.stat.exists

- name: Remove incomplete Oracle home left by a failed installer run
  ansible.builtin.file:
    path: "{{ tgt.home_path }}"
    state: absent
  when:
    - not _marker.stat.exists
    - oracle_db_install_recreate_incomplete_home | default(true) | bool
    - _runinstaller.stat.exists | default(false)
    - not _oracle_home_linked | default(false)

- name: Home directory should exist (created by oracle_storage)
  ansible.builtin.file:
    path: "{{ tgt.home_path }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0775"

- name: Writable per-home staging area (not under the read-only stage mount)
  ansible.builtin.set_fact:
    _home_stage: "{{ tgt.oracle_base }}/.stage_{{ tgt.home_suffix }}"

- name: Create per-home staging area
  ansible.builtin.file:
    path: "{{ _home_stage }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0775"

- name: Unzip the installer directly into ORACLE_HOME (no-op if marker present)
  ansible.builtin.unarchive:
    src: "{{ tgt.stage_dir }}/{{ tgt.zip }}"
    dest: "{{ tgt.home_path }}"
    remote_src: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    creates: "{{ tgt.home_path }}/runInstaller"
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)

- name: Remove bundled OPatch before upgrade
  ansible.builtin.file:
    path: "{{ tgt.home_path }}/OPatch"
    state: absent
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)

- name: Upgrade bundled OPatch (extract p6880880 over ORACLE_HOME)
  ansible.builtin.unarchive:
    src: "{{ tgt.stage_dir }}/{{ (oracle_patch_files.opatch_zip | default('p6880880_190000_Linux-x86-64.zip')) }}"
    dest: "{{ tgt.home_path }}"
    remote_src: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)

- name: Write silent installer response file (db_install.rsp)
  ansible.builtin.template:
    src: db_install.rsp.j2
    dest: "{{ _home_stage }}/db_install.rsp"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  when: not _marker.stat.exists

- name: Write the oraInst.loc pointer for this host
  ansible.builtin.copy:
    dest: /etc/oraInst.loc
    content: |
      inventory_loc={{ oracle_inventory_loc }}
      inst_group={{ oracle_inst_group }}
    mode: "0644"
    owner: root
    group: root
  when: not _marker.stat.exists

# ── OS-family-specific install path ───────────────────────────────────
# OL7: 19.3 is certified; plain install works.
# OL8/OL9/OL10: 19.3 (2019) is NOT certified — it NPEs in supportedOSCheck
# and its linker fails against modern glibc/binutils. On those families we
# pass CV_ASSUME_DISTID=OL7 to clear the prereq engine and -applyRU the
# staged 19.31 RU so the home links against the patched toolchain. If the
# applyRU path is unavailable (offline lab), the install will fail at the
# link step; that gap is reported, not silently swallowed.

- name: Detect OS family for install-path selection
  ansible.builtin.set_fact:
    _install_apply_ru: >-
      {{ (ansible_distribution_major_version | default('7')) not in ['7'] }}

- name: Resolve Database RU media for installer applyRU
  ansible.builtin.set_fact:
    _db_ru_zip_input: >-
      {{
        oracle_db_install_apply_ru_zip
        | default(
            oracle_patch_db_zip
            | default(
                oracle_stage_dir ~ '/' ~
                (oracle_patch_files.db_ru_zip | default('p39062931_190000_Linux-x86-64.zip'))
              ),
            true
          )
      }}
    _db_ru_component_path: >-
      {{
        oracle_db_install_apply_ru_component_path
        | default(
            oracle_patch_apply_component_path
            | default(oracle_db_install_apply_ru_component_id | default(''), true),
            true
          )
      }}
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool

- name: Normalize Database RU media path for installer applyRU
  ansible.builtin.set_fact:
    _db_ru_zip_path: >-
      {{
        _db_ru_zip_input
        if _db_ru_zip_input.startswith('/')
        else oracle_stage_dir ~ '/' ~ _db_ru_zip_input
      }}
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool

- name: Verify Database RU media for installer applyRU
  ansible.builtin.stat:
    path: "{{ _db_ru_zip_path }}"
  register: _db_ru_zip_stat
  failed_when: not _db_ru_zip_stat.stat.exists
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool

- name: Set DB RU staging paths
  ansible.builtin.set_fact:
    _db_ru_extract_dir: "{{ _home_stage }}/db_ru"
    _db_ru_extract_marker: >-
      {{ _home_stage }}/db_ru/.{{ _db_ru_zip_path | basename }}.extracted
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool

- name: Create DB RU extraction directory
  ansible.builtin.file:
    path: "{{ _db_ru_extract_dir }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0775"
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool

- name: Check whether the DB RU bundle is already extracted
  ansible.builtin.stat:
    path: "{{ _db_ru_extract_marker }}"
  register: _db_ru_marker
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool

- name: Extract DB RU bundle for runInstaller -applyRU
  ansible.builtin.unarchive:
    src: "{{ _db_ru_zip_path }}"
    dest: "{{ _db_ru_extract_dir }}"
    remote_src: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool
    - not _db_ru_marker.stat.exists

- name: Mark DB RU bundle extraction complete
  ansible.builtin.file:
    path: "{{ _db_ru_extract_marker }}"
    state: touch
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool
    - not _db_ru_marker.stat.exists

- name: Resolve extracted Database RU directory for runInstaller -applyRU
  ansible.builtin.shell: |
    set -o pipefail
    root={{ _db_ru_extract_dir | quote }}
    configured={{ _db_ru_component_path | quote }}

    if [ -n "$configured" ]; then
      candidate="$root/$configured"
      if [ -d "$candidate" ]; then
        printf '%s\n' "$candidate"
        exit 0
      fi
      found="$(find "$root" -mindepth 2 -maxdepth 2 -type d -name "${configured##*/}" -print -quit)"
      if [ -n "$found" ]; then
        printf '%s\n' "$found"
        exit 0
      fi
      echo "Configured Database RU component not found under $root: $configured" >&2
      exit 1
    fi

    while IFS= read -r candidate; do
      readme="${candidate}/README.html"
      if [ -f "$readme" ] &&
         head -80 "$readme" | grep -Eiq 'Patch [0-9]+ - Database Release Update'; then
        printf '%s\n' "$candidate"
        exit 0
      fi
    done < <(find "$root" -mindepth 2 -maxdepth 2 -type d -print | sort)

    echo "No Database RU component directory found under $root" >&2
    exit 1
  args:
    executable: /bin/bash
  register: _db_ru_apply_dir
  changed_when: false
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool

- name: Run runInstaller — OL7 certified path (plain install)
  ansible.builtin.shell: |
    set -o pipefail
    cd {{ tgt.home_path }}
    ./runInstaller -silent -force -waitforcompletion -noconfig \
      -ignorePrereqFailure \
      -responseFile {{ _home_stage }}/db_install.rsp
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ oracle_user }}"
  register: _installer
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - not _install_apply_ru | bool
  changed_when: _installer.rc == 0 or 'Successfully Setup Software' in (_installer.stdout | default(''))
  failed_when: >-
    _installer.rc != 0 and 'Successfully Setup Software' not in (_installer.stdout | default(''))

- name: Run runInstaller — OL8+ path (applyRU to bridge the certification gap)
  ansible.builtin.shell: |
    set -o pipefail
    cd {{ tgt.home_path }}
    ./runInstaller -silent -force -waitforcompletion -noconfig \
      -ignorePrereqFailure -ignoreInternalDriverError \
      -applyRU {{ _db_ru_apply_dir.stdout | trim | quote }} \
      -responseFile {{ _home_stage }}/db_install.rsp
  args:
    executable: /bin/bash
  environment:
    CV_ASSUME_DISTID: OL7
  become: true
  become_user: "{{ oracle_user }}"
  register: _installer_ru
  when:
    - not _marker.stat.exists
    - not _oracle_home_linked | default(false)
    - _install_apply_ru | bool
  changed_when: _installer_ru.rc == 0 or 'Successfully Setup Software' in (_installer_ru.stdout | default(''))
  failed_when: >-
    _installer_ru.rc != 0 and 'Successfully Setup Software' not in (_installer_ru.stdout | default(''))
  # The OL8+ applyRU path is known to be flaky in offline labs (the installer's
  # InstallerPatchJob can exit without applying when it cannot reach Oracle
  # Support metadata). Surface a clear message in that case rather than retry.
  ignore_errors: "{{ oracle_install_allow_ol8_gap | default(true) | bool }}"

- name: Verify selected Database RU was applied during install
  ansible.builtin.shell: |
    set -o pipefail
    oracle_home={{ tgt.home_path | quote }}
    expected={{ (_db_ru_component_path | basename) | quote }}
    if [ -z "$expected" ]; then
      expected="$(basename {{ _db_ru_apply_dir.stdout | trim | quote }})"
    fi
    test -n "$expected"
    test -s "$oracle_home/bin/oracle"
    patches="$("$oracle_home/OPatch/opatch" lspatches 2>&1)"
    printf '%s\n' "$patches"
    printf '%s\n' "$patches" | grep -Eq "(^|[^0-9])${expected}([^0-9]|$)"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ oracle_user }}"
  register: _db_ru_install_verified
  changed_when: false
  failed_when: false
  when:
    - not _marker.stat.exists
    - _install_apply_ru | bool
    - _installer_ru is defined
    - not (_installer_ru.skipped | default(false))

- name: Determine whether runInstaller completed successfully
  ansible.builtin.set_fact:
    _installer_completed: >-
      {{
        (_oracle_home_linked | default(false)) or
        (((_installer | default({})).rc | default(1) | int) == 0) or
        ('Successfully Setup Software' in ((_installer | default({})).stdout | default(''))) or
        (
          (((_installer_ru | default({})).rc | default(1) | int) == 0 or
           'Successfully Setup Software' in ((_installer_ru | default({})).stdout | default(''))) and
          (((_db_ru_install_verified | default({})).rc | default(1) | int) == 0)
        )
      }}
  when: not _marker.stat.exists

- name: Report OL8+ install gap when applyRU did not succeed
  ansible.builtin.fail:
    msg: >-
      Oracle 19.3 base install could not complete on {{ ansible_distribution }}
      {{ ansible_distribution_version }} (the 19.3 linker is not certified on
      this OS and the -applyRU bridge did not apply the selected RU
      {{ _db_ru_zip_path }} component
      {{ _db_ru_component_path | default('auto-discovered', true) }} in this
      offline lab). The home at {{ tgt.home_path }} is staged but its binaries
      are not linked. To complete the install, either (a) run the lab on OL7,
      (b) stage a pre-patched 19.x gold image, or (c) provide network access so
      the installer can resolve applyRU metadata. See lab/README.md.
  when:
    - not _marker.stat.exists
    - _install_apply_ru | bool
    - not _installer_completed | default(false)

- name: Run root scripts (orainstRoot.sh + root.sh)
  ansible.builtin.shell: |
    set -o pipefail
    if [ -x {{ oracle_inventory_loc }}/orainstRoot.sh ]; then
      {{ oracle_inventory_loc }}/orainstRoot.sh
    fi
    {{ tgt.home_path }}/root.sh -silent
  args:
    executable: /bin/bash
  when:
    - not _marker.stat.exists
    - _installer_completed | default(false)
  changed_when: true

- name: Drop the idempotency marker
  ansible.builtin.file:
    path: "{{ tgt.home_path }}/.install_complete"
    state: touch
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  when:
    - not _marker.stat.exists
    - _installer_completed | default(false)
