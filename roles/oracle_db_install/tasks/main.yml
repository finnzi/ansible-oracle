---
# tasks/main.yml for oracle_db_install
#
# Install the Oracle 19c Database software (no DBCA here — that's
# oracle_db_manage). One pass per selected home suffix per instance.
# Out-of-place friendly: each home lives in its own directory so a future
# patch can install a fresh home alongside the running one.

# The base installer ships as a zip that, when unzipped directly into the
# ORACLE_HOME, contains runInstaller. So we unzip into the home directory
# and run it from there with a silent response file.

- name: Fail when DB home install selection is invalid
  ansible.builtin.fail:
    msg: >-
      oracle_db_install_home_selection={{ oracle_db_install_home_selection }}
      is invalid. Supported values are current and selected.
  when: oracle_db_install_home_selection not in ['current', 'selected']

- name: Resolve per-instance/per-home install targets
  ansible.builtin.set_fact:
    _install_targets: >-
      {%- set out=[] -%}
      {%- set selected_suffixes = oracle_db_install_home_suffixes | default([]) -%}
      {%- set selected_paths = oracle_db_install_home_paths | default([]) -%}
      {%- for inst in (oracle_db_install_instances | default(oracle_instances | default([]))) -%}
        {%- for home in inst.db_homes -%}
          {%- set home_path = inst.oracle_base ~ '/' ~ home.suffix -%}
          {%- set selected = (
                (oracle_db_install_home_selection == 'current' and
                 home.current | default(false) | bool) or
                (oracle_db_install_home_selection == 'selected' and
                 (
                   home.suffix in selected_suffixes or
                   home_path in selected_paths
                 ))
              ) -%}
          {%- if selected -%}
            {%- set _ = out.append({
                'name':  inst.name,
                'oracle_base': inst.oracle_base,
                'home_suffix': home.suffix,
                'home_path': home_path,
                'stage_dir': oracle_stage_dir,
                'zip': oracle_install_files.db_zip}) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: Ensure oraInventory location exists
  ansible.builtin.file:
    path: "{{ oracle_inventory_loc }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0775"

- name: Stage the installer zip is reachable (download/ bind-mount)
  ansible.builtin.stat:
    path: "{{ oracle_stage_dir }}/{{ oracle_install_files.db_zip }}"
  register: _db_zip_stat
  failed_when: not _db_zip_stat.stat.exists
  when: _install_targets | length > 0

- name: Per-home install loop
  ansible.builtin.include_tasks: install-home.yml
  loop: "{{ _install_targets }}"
  loop_control:
    loop_var: tgt
    label: "{{ tgt.name }}:{{ tgt.home_suffix }}"
