---
- name: Read initial Oracle Notification Services state
  ansible.builtin.command:
    argv: ["{{ oracle_gi_home }}/bin/srvctl", status, ons]
  become: true
  become_user: "{{ oracle_user }}"
  register: _fan_ons_initial_status
  changed_when: false
  failed_when: false

- name: Enable Oracle Notification Services in Restart
  ansible.builtin.command:
    argv: ["{{ oracle_gi_home }}/bin/srvctl", enable, ons]
  become: true
  become_user: "{{ oracle_user }}"
  when: "'disabled' in (_fan_ons_initial_status.stdout | default('') | lower)"

- name: Read Oracle Notification Services state
  ansible.builtin.command:
    argv: ["{{ oracle_gi_home }}/bin/srvctl", status, ons]
  become: true
  become_user: "{{ oracle_user }}"
  register: _fan_ons_status
  changed_when: false
  failed_when: false

- name: Start Oracle Notification Services
  ansible.builtin.command:
    argv: ["{{ oracle_gi_home }}/bin/srvctl", start, ons]
  become: true
  become_user: "{{ oracle_user }}"
  when: "'running' not in (_fan_ons_status.stdout | default('') | lower)"

- name: Probe firewalld for remote ONS
  ansible.builtin.command: firewall-cmd --state
  register: _fan_firewalld
  changed_when: false
  failed_when: false
  when: oracle_fan_open_firewall | bool

- name: Open remote ONS port in firewalld
  ansible.builtin.shell: |
    set -o pipefail
    changed=0
    firewall-cmd --query-port={{ oracle_fan_remote_port }}/tcp >/dev/null || {
      firewall-cmd --add-port={{ oracle_fan_remote_port }}/tcp
      changed=1
    }
    firewall-cmd --permanent --query-port={{ oracle_fan_remote_port }}/tcp >/dev/null || {
      firewall-cmd --permanent --add-port={{ oracle_fan_remote_port }}/tcp
      changed=1
    }
    [ "$changed" -eq 0 ] || echo ONS_FIREWALL_CHANGED
  args: { executable: /bin/bash }
  register: _fan_firewall
  changed_when: "'ONS_FIREWALL_CHANGED' in (_fan_firewall.stdout | default(''))"
  when:
    - oracle_fan_open_firewall | bool
    - (_fan_firewalld.stdout | default('') | trim) == 'running'

- name: Validate Oracle Notification Services remote listener
  ansible.builtin.shell: |
    set -o pipefail
    {{ oracle_gi_home }}/bin/srvctl status ons | grep -F 'ONS is running'
    ss -lnt | grep -E '[:.]{{ oracle_fan_remote_port }}[[:space:]]'
  args: { executable: /bin/bash }
  changed_when: false
