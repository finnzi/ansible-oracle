---
# defaults/main.yml for oracle_gi_install
#
# Install Oracle Grid Infrastructure for a standalone server (Oracle Restart).
# Database files stay on normal filesystems. The lab uses a small dedicated ASM
# disk only for Oracle Restart/Grid metadata.

oracle_user: oracle
oracle_group: oinstall
oracle_asm_group: asmadmin
oracle_gi_base: /grid
oracle_gi_oracle_base: /grid/app/oracle
oracle_gi_homes:
  - { suffix: 19c/gi_home1, current: true }
  - { suffix: 19c/gi_home2, current: false }

oracle_install_files:
  gi_zip: "V982068-01-Oracle.19c.Grid.Infrastructure.zip"
oracle_stage_dir: /u01/stage
oracle_patch_files:
  opatch_zip: "p6880880_190000_Linux-x86-64.zip"
  gi_ru_zip: "p39062956_190000_Linux-x86-64.zip"

oracle_inventory_loc: /opt/oracle/oraInventory
oracle_inst_group: oinstall

oracle_gi_asm_diskgroup_name: RESTART
oracle_gi_asm_diskgroup_redundancy: EXTERNAL
oracle_gi_asm_diskgroup_ausize: 4
oracle_gi_asm_disk_discovery_string: /dev/vdb
oracle_gi_asm_disks: /dev/vdb
oracle_gi_asm_sys_password: "{{ oracle_lab_sys_password | default('SysPassword1_') }}"
oracle_gi_asm_monitor_password: "{{ oracle_lab_sys_password | default('SysPassword1_') }}"
oracle_gi_install_cluster_name: restart
oracle_gi_install_min_free_mb: 20480
oracle_gi_install_apply_ru_component_id: "39036936"
oracle_gi_install_recreate_incomplete_home: true

# Keep the install explicit while this path is being hardened in the lab.
oracle_gi_install_enabled: false

# Existing installations are report-only unless repair is explicitly enabled.
oracle_gi_repair_existing_enabled: false
