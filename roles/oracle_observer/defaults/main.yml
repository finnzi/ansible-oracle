---
# defaults/main.yml for oracle_observer
#
# SCOPE: installs the observer-side Oracle Client home, broker network
# configuration, and optional Fast-Start Failover observer lifecycle.
#
# INTERFACE (consumed by playbooks/06-observer.yml):
#   observer_enabled:         bool
#   observer_oracle_base:     /observer/app/oracle
#   observer_client_home:     /observer/app/oracle/client_home1
#   observer_dg_connect_identifier: super_dgb
#   observer_sysdg_user:      dgmonitor
#   observer_sysdg_password:  (vaulted)

oracle_user: oracle
oracle_group: oinstall
oracle_inventory_loc: /home/oracle/oraInventory
oracle_inventory_enforce_single: true
oracle_inst_group: oinstall

observer_enabled: false
observer_oracle_base: /observer/app/oracle
observer_client_home: /observer/app/oracle/client_home1
observer_dg_connect_identifier: super_dgb
observer_dg_standby_connect_identifier: super_sby_dgb
observer_dg_primary_unique_name: super
observer_dg_standby_unique_name: super_sby
observer_client_primary_alias: super_primary
observer_client_standby_alias: super_standby
observer_client_tac_alias: super_tac
observer_client_primary_service: super_pri
observer_client_standby_service: super_stb
observer_client_tac_service: super_tac
observer_client_failover_retries: 30
observer_client_failover_delay: 1
observer_sysdg_user: dgmonitor
observer_sysdg_password: "{{ oracle_lab_dg_password | default('DgPassword1_') }}"
observer_install_type: Administrator
observer_config_dir: "{{ observer_client_home }}/network/admin"
observer_stage_dir: "{{ observer_oracle_base }}/.stage_client_home1"
observer_name: ansible_observer
observer_state_dir: "{{ observer_oracle_base }}/fsfo"
observer_log_dir: "{{ observer_oracle_base }}/diag/fsfo"
observer_service_name: oracle-fsfo-observer
observer_fast_start_failover_threshold: 30

# During a coordinated cold boot, Oracle Restart can bring the primary up
# before the physical standby is reachable.  Do not let the observer's FSFO
# threshold start counting until broker reports both members in valid roles.
# The marker lives below systemd's per-boot RuntimeDirectory, so later
# observer restarts in the same boot remain responsive to genuine failures.
observer_cold_boot_guard_enabled: true
observer_cold_boot_guard_retries: 60
observer_cold_boot_guard_delay: 10
observer_cold_boot_guard_command_timeout: 30
# Keep the script's own monotonic deadline below systemd TimeoutStartSec so it
# exits with a useful diagnostic instead of relying on systemd to kill it.
observer_cold_boot_guard_total_timeout: 840
observer_cold_boot_guard_timeout: 900

# Install the Oracle Client home and write observer-side network config.
oracle_observer_install_client: false
oracle_observer_recreate_incomplete_home: true
# Oracle 19.3's client linker still asks for libpthread_nonshared.a on modern
# Oracle Linux, while OL9 provides the needed nonshared objects through
# libc_nonshared.a. Keep this explicit and overridable because it mutates
# /usr/lib64 on the observer node.
observer_create_ol9_linker_compat_symlink: true

# Canonical enable flag. observer_enabled is a legacy alias used only when
# this variable is not set in inventory; an explicit false here wins.
oracle_observer_enabled: "{{ observer_enabled }}"
