---
# tasks/main.yml for oracle_restart_manage
#
# Register each instance with Oracle Restart (Grid standalone) so the DB and
# listener auto-start on crash/reboot. Degrades gracefully if Restart isn't
# installed yet (the slice case) — sets a fact the test suite asserts on.

# ── Is Oracle Restart actually installed on this host? ─────────────────
- name: Locate srvctl
  ansible.builtin.stat:
    path: "{{ oracle_gi_home }}/bin/srvctl"
  register: _srvctl_bin

- name: Probe Restart stack (ohasd)
  ansible.builtin.shell: |
    set -o pipefail
    if command -v crsctl >/dev/null 2>&1; then
      crsctl check has 2>&1 || true
    elif [ -x {{ oracle_gi_home }}/bin/crsctl ]; then
      {{ oracle_gi_home }}/bin/crsctl check has 2>&1 || true
    else
      echo "no-crsctl"
    fi
  args: { executable: /bin/bash }
  register: _has_check
  changed_when: false
  failed_when: false

- name: Set oracle_restart_available fact
  ansible.builtin.set_fact:
    oracle_restart_available: >-
      {{ _srvctl_bin.stat.exists and 'CRS-4638' in (_has_check.stdout | default('')) }}

- name: Restart not installed and required — fail loudly
  ansible.builtin.fail:
    msg: >-
      Oracle Restart is required on {{ inventory_hostname }} but srvctl was
      not found at {{ oracle_gi_home }}/bin/srvctl, or ohasd did not report a
      healthy state. Install Grid Infrastructure standalone (oracle_gi_install)
      before registering instances.
  when:
    - not oracle_restart_available
    - oracle_restart_required | bool

- name: Read Oracle High Availability Services autostart policy
  ansible.builtin.command: >-
    {{ oracle_gi_home }}/bin/crsctl config has
  register: _restart_has_autostart
  changed_when: false
  when: oracle_restart_available

# Oracle documents `crsctl enable has` as the supported way to enable Oracle
# Restart autostart. Do not modify AUTO_START on an `ora.*` resource directly;
# SRVCTL is the supported interface for Oracle Restart-managed components.
#
# The Grid installer configures ASM/CSS through its supported configuration
# assistants. This role only enables HAS and manages Oracle entities with
# SRVCTL; forcing ora.cssd directly would bypass those supported interfaces.
- name: Enable Oracle High Availability Services autostart
  ansible.builtin.command: >-
    {{ oracle_gi_home }}/bin/crsctl enable has
  register: _restart_has_enable
  changed_when: true
  when:
    - oracle_restart_available
    - "'CRS-4622' not in (_restart_has_autostart.stdout | default(''))"

# ── Register each instance + its listener with Restart ─────────────────
- name: Register instance, listener, and start them under Restart
  ansible.builtin.include_tasks: register-instance.yml
  loop: >-
    {{
      (oracle_instances | default([]))
      | oracle_apply_instance_overrides(
          oracle_instance_overrides | default({}),
          oracle_restart_apply_instance_overrides_require_dataguard | default(true)
        )
    }}
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  when:
    - oracle_restart_available
    # Standalone multi-instance DBs (duper/fluff) live on the primary host only.
    # Match oracle_db_manage / oracle_service_manage: do not register them on
    # standby inventory hosts (there is no instance there to start).
    - inst.dataguard | default(false) | bool or 'standby' not in group_names
    # Data Guard standbys are registered by oracle_dataguard after duplicate,
    # not here with the primary-side inventory shape.
    - not (
        inst.dataguard | default(false) | bool and
        (
          'standby' in group_names or
          inst.dg_role | default('') == 'standby'
        )
      )

# Oracle Restart may exhaust its initial start retries while the Data Guard
# peer is still booting.  Install a bounded, broker-aware pass for the next
# boot.  It uses each registered database home's srvctl and only reads HAS
# state through CRSCTL; it never edits ora.* resources with CRSCTL.
- name: Write Oracle Restart reconciliation environment
  ansible.builtin.template:
    src: oracle-restart-reconcile.env.j2
    dest: "{{ oracle_restart_reconcile_environment_file }}"
    owner: root
    group: root
    mode: "0600"
  register: _restart_reconcile_environment
  no_log: true
  when:
    - oracle_restart_available
    - oracle_restart_reconcile_enabled | bool

- name: Install Oracle Restart post-boot reconciliation script
  ansible.builtin.template:
    src: oracle-restart-reconcile.sh.j2
    dest: "{{ oracle_restart_reconcile_script_path }}"
    owner: root
    group: "{{ oracle_group }}"
    mode: "0750"
  register: _restart_reconcile_script
  when:
    - oracle_restart_available
    - oracle_restart_reconcile_enabled | bool

- name: Install Oracle Restart post-boot reconciliation unit
  ansible.builtin.template:
    src: oracle-restart-reconcile.service.j2
    dest: "/etc/systemd/system/{{ oracle_restart_reconcile_service_name }}"
    owner: root
    group: root
    mode: "0644"
  register: _restart_reconcile_unit
  when:
    - oracle_restart_available
    - oracle_restart_reconcile_enabled | bool

- name: Reload systemd after Oracle Restart reconciliation install
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - oracle_restart_available
    - oracle_restart_reconcile_enabled | bool
    - >-
      (_restart_reconcile_environment.changed | default(false)) or
      (_restart_reconcile_script.changed | default(false)) or
      (_restart_reconcile_unit.changed | default(false))

- name: Enable Oracle Restart post-boot reconciliation
  ansible.builtin.systemd_service:
    name: "{{ oracle_restart_reconcile_service_name }}"
    enabled: true
  when:
    - oracle_restart_available
    - oracle_restart_reconcile_enabled | bool

- name: Disable Oracle Restart post-boot reconciliation when not enabled
  ansible.builtin.systemd_service:
    name: "{{ oracle_restart_reconcile_service_name }}"
    enabled: false
    state: stopped
    daemon_reload: true
  register: _restart_reconcile_disable
  failed_when: >-
    (_restart_reconcile_disable.failed | default(false)) and
    'Could not find the requested service' not in
      (_restart_reconcile_disable.msg | default('')) and
    'not found' not in (_restart_reconcile_disable.msg | default('') | lower)
  when: not (oracle_restart_reconcile_enabled | bool)
