---
# defaults/main.yml for oracle_restart_manage
#
# Register each instance (and its listener) with Oracle Restart so the DB
# comes back automatically after a crash or host reboot. Uses srvctl against
# the Grid Infrastructure standalone (Oracle Restart) home.
#
# If Restart is NOT installed (the GI install role is stubbed in the vertical
# slice), this role detects that and reports the gap as an ansible fact rather
# than failing the whole play — so the slice still proves install+create+
# listener. The test suite then asserts the registration status explicitly.

oracle_user: oracle
oracle_group: oinstall
oracle_instances: []

# The Oracle Restart (GI standalone) home. Defaults to the project layout.
oracle_gi_home: /grid/19c/gi_home1

# Whether to hard-fail when Restart is missing. False in the slice; true later.
oracle_restart_required: false

# Keep primary/standby inventory overrides dormant for standalone runs by
# default. The Data Guard site path sets this false so generic Restart
# registration can skip standby instances and leave them to oracle_dataguard.
oracle_restart_apply_instance_overrides_require_dataguard: true

# After a cold boot Oracle Restart can start the former primary before the
# standby is reachable.  A bounded, broker-aware retry pass repairs that race
# without editing ora.* resources through CRSCTL.  The unit is enabled but is
# not started during Ansible convergence; it runs from multi-user.target on
# the next boot.
oracle_restart_reconcile_enabled: true
oracle_restart_reconcile_attempts: 18
oracle_restart_reconcile_delay_seconds: 20
oracle_restart_reconcile_command_timeout_seconds: 30
# Read-only CRS/SQL/SRVCTL probes should fail quickly during a cold boot;
# mutating SRVCTL operations receive a little longer for Oracle Restart to
# settle while remaining bounded by the systemd unit.
oracle_restart_reconcile_read_timeout_seconds: 30
oracle_restart_reconcile_mutation_timeout_seconds: 120
oracle_restart_reconcile_script_path: /usr/local/sbin/oracle-restart-reconcile
oracle_restart_reconcile_service_name: oracle-restart-reconcile.service
oracle_restart_reconcile_environment_file: /etc/sysconfig/oracle-restart-reconcile
oracle_restart_reconcile_dgmgrl_user: "{{ observer_sysdg_user | default('dgmonitor') }}"
oracle_restart_reconcile_dgmgrl_password: "{{ observer_sysdg_password | default(oracle_lab_dg_password | default('DgPassword1_')) }}"
