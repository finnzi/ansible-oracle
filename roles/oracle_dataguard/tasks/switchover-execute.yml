---
# Included by switchover.yml inside a block. Precheck, switchover,
# standby open/apply, and happy-path FSFO re-enable. Restore lives in
# switchover-restore.yml so it still runs when this include fails.
- name: Wait for broker SUCCESS and caught-up apply before switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    export PATH="/usr/bin:/bin:${ORACLE_HOME}/bin:${PATH:-}"
    SYS_CONNECT="sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}"
    TARGET="{{ _dg_switchover_target }}"
    # Network role may have just restarted listeners; wait until both member
    # DGB endpoints answer. Also require the target standby apply lag to be
    # near-zero — MaxAvailability SWITCHOVER can hang indefinitely when the
    # standby is still catching up after dual-home / patching.
    probe_cfg() {
      local conn="$1"
      local output
      output="$(printf 'SHOW CONFIGURATION;\nEXIT;\n' \
        | "$ORACLE_HOME/bin/dgmgrl" -silent "${SYS_CONNECT}@${conn}" 2>/dev/null || true)"
      printf '%s\n' "$output"
      printf '%s\n' "$output" | grep -q 'Configuration -' || return 1
      if printf '%s\n' "$output" | grep -qE 'Configuration Status:[[:space:]]*ERROR'; then
        return 1
      fi
      return 0
    }
    probe_lag() {
      local conn="$1"
      local output
      output="$(printf "SHOW DATABASE VERBOSE '%s';\nEXIT;\n" "${TARGET}" \
        | "$ORACLE_HOME/bin/dgmgrl" -silent "${SYS_CONNECT}@${conn}" 2>/dev/null || true)"
      printf '%s\n' "$output"
      # Accept 0 seconds, or "not available" only if Real Time Query is ON and
      # Database Status is SUCCESS (already current).
      if printf '%s\n' "$output" | grep -qE 'Apply Lag:[[:space:]]*0 seconds'; then
        return 0
      fi
      if printf '%s\n' "$output" | grep -qE 'Apply Lag:[[:space:]]+[1-5] seconds?([^0-9]|$)'; then
        # Small lag (<=5s) is fine for lab switchover. Require a word boundary
        # so "15 seconds" / "51 seconds" are not treated as caught-up.
        return 0
      fi
      if printf '%s\n' "$output" | grep -q 'Database Status:[[:space:]]*SUCCESS' \
        && printf '%s\n' "$output" | grep -qE 'Transport Lag:[[:space:]]*0 seconds'; then
        return 0
      fi
      return 1
    }
    cfg_ok=0
    for c in \
      '{{ _dg_switchover_connect_identifier }}' \
      '{{ _dg_primary_unique_name }}_dgb' \
      '{{ _dg_standby_unique_name }}_dgb'
    do
      if probe_cfg "$c"; then
        cfg_ok=1
        if probe_lag "$c"; then
          exit 0
        fi
      fi
    done
    [ "$cfg_ok" -eq 1 ] || exit 1
    exit 1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_precheck
  changed_when: false
  retries: 36
  delay: 10
  until: _dg_switchover_precheck.rc == 0
  failed_when: _dg_switchover_precheck.rc != 0
  no_log: true
  when: _dg_switchover_target_is_physical_standby | bool

- name: Switchover Data Guard broker primary
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    export PATH="/usr/bin:/bin:${ORACLE_HOME}/bin:${PATH:-}"
    SYS_CONNECT="sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}"
    TARGET="{{ _dg_switchover_target }}"
    # Prefer printf|dgmgrl over timeout+heredoc: the latter hung for the full
    # wall-clock budget in e2e (600s) while the same SWITCHOVER via printf
    # completed in ~40s on the same lab.
    dgmgrl_show() {
      local connect="$1"
      printf 'SHOW CONFIGURATION;\nEXIT;\n' \
        | "$ORACLE_HOME/bin/dgmgrl" -silent "${connect}" 2>/dev/null || true
    }
    # Prefer the pre-switch primary DGB endpoint; fall back to target DGB if
    # a prior attempt already flipped roles (retry-safe).
    try_conn() {
      local conn="$1"
      local output
      output="$(dgmgrl_show "${SYS_CONNECT}@${conn}")"
      if printf '%s\n' "$output" | grep -q 'Configuration -'; then
        printf '%s\n' "$output"
        return 0
      fi
      return 1
    }
    is_primary() {
      local name="$1"
      local cfg_text="$2"
      printf '%s\n' "$cfg_text" | grep -qE "^[[:space:]]*${name}[[:space:]]+- (\\(\\*\\) )?Primary database"
    }
    cfg="$(try_conn '{{ _dg_switchover_connect_identifier }}' \
      || try_conn "${TARGET}_dgb" \
      || try_conn '{{ _dg_primary_unique_name }}_dgb' \
      || try_conn '{{ _dg_standby_unique_name }}_dgb' \
      || true)"
    # Idempotent: if a prior attempt already made TARGET primary, accept it.
    if is_primary "${TARGET}" "${cfg}"; then
      echo "ALREADY_SWITCHED_PRIMARY=${TARGET}"
      echo SWITCHOVER_COMPLETE
      exit 0
    fi
    # Resolve which member is currently primary so DGMGRL can connect there.
    if is_primary '{{ _dg_primary_unique_name }}' "${cfg}"; then
      conn="{{ _dg_primary_unique_name }}_dgb"
    elif is_primary '{{ _dg_standby_unique_name }}' "${cfg}"; then
      conn="{{ _dg_standby_unique_name }}_dgb"
    else
      conn="{{ _dg_switchover_connect_identifier }}"
    fi
    # Always use password@TNS (not local OS auth) so DGMGRL can re-auth to the
    # remote member during SWITCHOVER without ORA-01017.
    #
    # Bound dgmgrl so a stuck CRS restart cannot hold the play for 25+ minutes.
    # Healthy MaxAvailability switchovers finish in <2 min; after dual-home the
    # first switchover can sit on "Connected to an idle instance" well past the
    # actual role flip. 360s covers the slow CRS path while still failing closed
    # before the pytest budget. On timeout accept ROLE_CONFIRMED if TARGET is
    # already primary.
    output="$(
      /usr/bin/timeout 360 \
        "$ORACLE_HOME/bin/dgmgrl" -silent "${SYS_CONNECT}@${conn}" \
        < <(printf "SWITCHOVER TO '%s';\nEXIT;\n" "${TARGET}") 2>/dev/null \
      || true
    )"
    # Persist a password-scrubbed copy for post-mortem (no_log hides the result).
    printf '%s\n' "$output" | sed -E 's#sys/[^@[:space:]]+@#sys/***@#g' \
      > /tmp/dg-switchover-last.out 2>/dev/null || true
    printf '%s\n' "$output"
    # Require an explicit success token. Matching bare "ORA-" rejects healthy
    # switchovers that still print lag/member Warning: ORA-... lines.
    if printf '%s\n' "$output" | grep -qiE 'switchover (succeeded|complete)|NEW PRIMARY|Switchover succeeded|new primary is'; then
      echo SWITCHOVER_COMPLETE
      exit 0
    fi
    # Re-check roles if wording was non-standard or dgmgrl was deadline-killed
    # after the role flip completed.
    post="$(try_conn "${TARGET}_dgb" || try_conn "$conn" || true)"
    if is_primary "${TARGET}" "${post}"; then
      echo "ROLE_CONFIRMED_PRIMARY=${TARGET}"
      echo SWITCHOVER_COMPLETE
      exit 0
    fi
    if printf '%s\n' "$output" | grep -qE 'Error:|Failed\.|Unable to switchover|ORA-01017|logon denied'; then
      echo "SWITCHOVER_FAILED conn=${conn} target=${TARGET}" >&2
      exit 1
    fi
    # No success and no hard failure text — treat as failure.
    echo "SWITCHOVER_NO_SUCCESS_TOKEN conn=${conn} target=${TARGET}" >&2
    exit 1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover
  changed_when: >-
    'SWITCHOVER_COMPLETE' in (_dg_switchover.stdout | default('')) and
    'ALREADY_SWITCHED_PRIMARY' not in (_dg_switchover.stdout | default(''))
  failed_when: _dg_switchover.rc != 0
  retries: 3
  delay: 20
  until: _dg_switchover.rc == 0
  no_log: true
  when: _dg_switchover_target_is_physical_standby | bool

- name: Wait for broker to settle after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    if output="$("$ORACLE_HOME/bin/dgmgrl" -silent / <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
    )" && printf '%s\n' "$output" | grep -q 'Configuration -'; then
      printf '%s\n' "$output"
      exit 0
    fi
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_target }}_dgb" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_broker_after
  changed_when: false
  retries: 18
  delay: 10
  until: >-
    _dg_switchover_broker_after.rc == 0 and
    'Configuration -' in (_dg_switchover_broker_after.stdout | default(''))
  failed_when: >-
    _dg_switchover_broker_after.rc != 0 or
    'Configuration -' not in (_dg_switchover_broker_after.stdout | default(''))
  no_log: true

- name: Read new standby open mode after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_new_standby }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_new_standby_open_mode
  changed_when: false
  failed_when: >-
    _dg_switchover_new_standby_open_mode.rc != 0 or
    'PHYSICAL STANDBY|' not in (_dg_switchover_new_standby_open_mode.stdout | default('')) or
    'ORA-' in (_dg_switchover_new_standby_open_mode.stdout | default('')) or
    'SP2-' in (_dg_switchover_new_standby_open_mode.stdout | default(''))
  no_log: true

- name: Stop new standby apply through broker before opening read-only
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    # Best-effort only. The SQL open/MRP path below cancels apply itself.
    # Never fail the switchover play on APPLY-OFF — post-role-change broker
    # state is flaky (ORA- warnings, transient DGMGRL errors) and this step
    # is not required for a correct final RO+APPLY open mode.
    output="$(timeout 45 "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_target }}_dgb" <<'DGMGRL' 2>/dev/null || true
    EDIT DATABASE '{{ _dg_switchover_new_standby }}' SET STATE='APPLY-OFF';
    EXIT;
    DGMGRL
    )"
    printf '%s\n' "$output"
    exit 0
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_apply_off
  changed_when: true
  failed_when: false
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_switchover_new_standby_open_mode.stdout | default(''))"

- name: Open new standby read-only with apply after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_new_standby }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF SERVEROUTPUT ON
    DECLARE
      v_open_mode v$database.open_mode%TYPE;
    BEGIN
      SELECT open_mode INTO v_open_mode FROM v$database;
      IF v_open_mode != 'READ ONLY WITH APPLY' THEN
        BEGIN
          EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE CANCEL';
        EXCEPTION
          WHEN OTHERS THEN NULL;
        END;
        IF v_open_mode = 'MOUNTED' THEN
          EXECUTE IMMEDIATE 'ALTER DATABASE OPEN';
        END IF;
        EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT FROM SESSION';
        DBMS_OUTPUT.PUT_LINE('CHANGED');
      ELSE
        DBMS_OUTPUT.PUT_LINE('OK');
      END IF;
    END;
    /
    SELECT database_role || '|' || open_mode FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_new_standby_read_only_apply
  changed_when: "'CHANGED' in (_dg_switchover_new_standby_read_only_apply.stdout | default(''))"
  failed_when: >-
    _dg_switchover_new_standby_read_only_apply.rc != 0 or
    'SP2-' in (_dg_switchover_new_standby_read_only_apply.stdout | default('')) or
    'PLS-' in (_dg_switchover_new_standby_read_only_apply.stdout | default(''))
  retries: 12
  delay: 10
  until: >-
    _dg_switchover_new_standby_read_only_apply.rc == 0 and
    'READ ONLY WITH APPLY' in (_dg_switchover_new_standby_read_only_apply.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_switchover_new_standby_open_mode.stdout | default(''))"

- name: Enable new standby apply through broker after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    export PATH="/usr/bin:/bin:${ORACLE_HOME}/bin:${PATH:-}"
    # Best-effort. SQL path already starts MRP for READ ONLY WITH APPLY; final
    # validate task is the source of truth. Do not fail switchover on broker
    # APPLY-ON errors after a role change.
    output="$(printf "EDIT DATABASE '%s' SET STATE='APPLY-ON';\nEXIT;\n" \
      '{{ _dg_switchover_new_standby }}' \
      | "$ORACLE_HOME/bin/dgmgrl" -silent \
          "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_target }}_dgb" \
          2>/dev/null || true)"
    printf '%s\n' "$output"
    exit 0
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_apply_on
  changed_when: false
  failed_when: false
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_switchover_new_standby_open_mode.stdout | default(''))"

- name: Ensure Fast-Start Failover is enabled after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    SYS_CONNECT="sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}"
    # Prefer the post-switchover primary (target). Fall back across members so
    # ALREADY_PRIMARY / half-settled configs still re-enable FSFO.
    try_show_fsfo() {
      local conn="$1"
      local output
      output="$(timeout 45 "$ORACLE_HOME/bin/dgmgrl" -silent "${SYS_CONNECT}@${conn}" <<'DGMGRL' 2>/dev/null || true
    SHOW FAST_START FAILOVER;
    EXIT;
    DGMGRL
    )"
      if printf '%s\n' "$output" | grep -qE 'Fast-Start Failover:[[:space:]]*(Enabled|Disabled)'; then
        printf '%s\n' "$output"
        return 0
      fi
      return 1
    }
    fsfo="$(try_show_fsfo '{{ _dg_switchover_target }}_dgb' \
      || try_show_fsfo '{{ _dg_primary_unique_name }}_dgb' \
      || try_show_fsfo '{{ _dg_standby_unique_name }}_dgb' \
      || true)"
    printf '%s\n' "$fsfo"
    if printf '%s\n' "$fsfo" | grep -qE 'Fast-Start Failover:[[:space:]]*Enabled'; then
      echo FSFO_ALREADY_ENABLED
      exit 0
    fi
    # ENABLE must target a live primary DGB endpoint.
    for conn in \
      '{{ _dg_switchover_target }}_dgb' \
      '{{ _dg_primary_unique_name }}_dgb' \
      '{{ _dg_standby_unique_name }}_dgb'
    do
      enable_out="$(timeout 60 "$ORACLE_HOME/bin/dgmgrl" -silent "${SYS_CONNECT}@${conn}" <<'DGMGRL' 2>/dev/null || true
    ENABLE FAST_START FAILOVER;
    EXIT;
    DGMGRL
    )"
      printf 'ENABLE@%s:\n%s\n' "$conn" "$enable_out"
      # Hard auth/connect failures: try next endpoint.
      if printf '%s\n' "$enable_out" | grep -qE 'ORA-01017|logon denied|ORA-12154|ORA-12541|ORA-12514'; then
        continue
      fi
      # Verify enable actually stuck (SHOW, not just ENABLE return text).
      verify="$(try_show_fsfo "$conn" || true)"
      printf '%s\n' "$verify"
      if printf '%s\n' "$verify" | grep -qE 'Fast-Start Failover:[[:space:]]*Enabled'; then
        echo FSFO_ENABLED
        exit 0
      fi
    done
    echo FSFO_ENABLE_FAILED >&2
    exit 1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_fsfo_enable
  changed_when: "'FSFO_ENABLED' in (_dg_switchover_fsfo_enable.stdout | default(''))"
  failed_when: >-
    _dg_switchover_fsfo_enable.rc != 0 or
    'FSFO_ENABLE_FAILED' in (_dg_switchover_fsfo_enable.stdout | default('')) or
    'FSFO_ENABLE_FAILED' in (_dg_switchover_fsfo_enable.stderr | default(''))
  retries: 6
  delay: 10
  until: >-
    _dg_switchover_fsfo_enable.rc == 0 and
    (
      'FSFO_ENABLED' in (_dg_switchover_fsfo_enable.stdout | default('')) or
      'FSFO_ALREADY_ENABLED' in (_dg_switchover_fsfo_enable.stdout | default(''))
    )
  no_log: true
  # Re-enable only if this play disabled FSFO for the switchover window.
  when: _dg_switchover_fsfo_was_enabled | default(false) | bool
