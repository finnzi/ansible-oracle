---
# tasks/duplicate-standby.yml - create the physical standby with RMAN.
# `inst` is one element of oracle_instances, after host overrides.

- name: Resolve current ORACLE_HOME for Data Guard standby duplicate
  ansible.builtin.set_fact:
    _dg_home_path: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}
    _dg_standby_unique_name: "{{ inst.db_unique_name | default(dg_standby.db_unique_name | default(inst.name ~ '_sby')) }}"
    _dg_primary_unique_name: "{{ inst.dg_primary_db_unique_name | default(dg_primary.db_unique_name | default(inst.name)) }}"
    _dg_standby_pfile: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}/dbs/init{{ inst.name }}.ora
    _dg_standby_spfile: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}/dbs/spfile{{ inst.name }}.ora
    _dg_standby_pwfile: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}/dbs/orapw{{ inst.name }}
    _dg_gi_home_path: "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}"

- name: Check for conflicting standalone Restart registration on standby
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "{{ _dg_home_path }}/bin/srvctl" config database -db {{ inst.name }} 2>&1 || echo NOT_REGISTERED
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_conflict_db
  changed_when: false
  failed_when: false
  when: inst.name != _dg_standby_unique_name

- name: Remove conflicting standalone Restart registration on standby
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "{{ _dg_home_path }}/bin/srvctl" remove database -db {{ inst.name }} -force
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_conflict_remove
  changed_when: _dg_standby_conflict_remove.rc == 0
  failed_when: _dg_standby_conflict_remove.rc != 0
  when:
    - inst.name != _dg_standby_unique_name
    - "'NOT_REGISTERED' not in (_dg_standby_conflict_db.stdout | default(''))"

- name: Check registered standby database status before duplicate
  ansible.builtin.shell: |
    set -o pipefail
    db_home={{ _dg_home_path | quote }}
    output="$(ORACLE_HOME="$db_home" "$db_home/bin/srvctl" status database \
      -db {{ _dg_standby_unique_name | quote }} 2>&1)"
    rc=$?
    printf '%s\n' "$output"
    if [ "$rc" -eq 0 ]; then
      exit 0
    fi
    if printf '%s\n' "$output" | grep -Eq 'PRCD-1120|PRCR-1001'; then
      echo NOT_REGISTERED
      exit 0
    fi
    exit "$rc"
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_registered_status_before
  changed_when: false
  failed_when: _dg_standby_registered_status_before.rc != 0

- name: Start registered physical standby before role probe
  ansible.builtin.shell: |
    set -o pipefail
    gi_home="{{ _dg_gi_home_path }}"
    db_home="{{ _dg_home_path }}"
    export ORACLE_HOME="$db_home"
    changed=0

    listener_status="$("$gi_home/bin/srvctl" status listener -listener LISTENER_{{ inst.name | upper }} 2>&1 || true)"
    printf '%s\n' "$listener_status"
    if ! printf '%s\n' "$listener_status" | grep -Eiq 'is running|running on'; then
      "$gi_home/bin/srvctl" start listener -listener LISTENER_{{ inst.name | upper }}
      changed=1
    fi

    db_status="$("$db_home/bin/srvctl" status database -db {{ _dg_standby_unique_name }} 2>&1 || true)"
    printf '%s\n' "$db_status"
    if pgrep -x "ora_pmon_{{ inst.name }}" >/dev/null 2>&1; then
      printf '%s\n' DATABASE_ALREADY_RUNNING_OUTSIDE_RESTART
    elif ! printf '%s\n' "$db_status" | grep -Eiq 'is running|running on'; then
      start_option=MOUNT
      if "$db_home/bin/srvctl" config database -db {{ _dg_standby_unique_name }} 2>/dev/null |
         grep -Eiq '^Database role:[[:space:]]*PRIMARY'; then
        start_option=OPEN
      fi
      "$db_home/bin/srvctl" start database -db {{ _dg_standby_unique_name }} -startoption "$start_option"
      changed=1
    fi

    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_registered_start
  changed_when: "'CHANGED' in (_dg_standby_registered_start.stdout | default(''))"
  failed_when: >-
    _dg_standby_registered_start.rc != 0 or
    'PRCR-1001' in (_dg_standby_registered_start.stdout | default('')) or
    'PRCD-1120' in (_dg_standby_registered_start.stdout | default(''))
  when: "'NOT_REGISTERED' not in (_dg_standby_registered_status_before.stdout | default(''))"

- name: Read standby database role before duplicate
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    fresh_auxiliary_prepared={{ 'true' if _dg_standby_unique_name in (_dg_fresh_auxiliary_names | default([])) else 'false' }}
    output="$("$ORACLE_HOME/bin/sqlplus" -L -S / as sysdba <<'SQL'
    WHENEVER SQLERROR EXIT FAILURE
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT 'DG_STATE=' || database_role || '|' || open_mode || '|' || db_unique_name FROM v$database;
    EXIT;
    SQL
    )"
    sql_rc=$?
    printf '%s\n' "$output"

    if printf '%s\n' "$output" |
       grep -Eq '^[[:space:]]*DG_STATE=(PRIMARY|PHYSICAL STANDBY)\|[^|]+\|[[:alnum:]_$#]+[[:space:]]*$'; then
      exit 0
    fi

    ora_codes="$(printf '%s\n' "$output" | grep -Eo 'ORA-[0-9]+' | sort -u || true)"
    unexpected="$(printf '%s\n' "$ora_codes" | grep -Ev '^ORA-01507$' || true)"
    if [ "$fresh_auxiliary_prepared" = true ] &&
       [ -z "$unexpected" ] &&
       printf '%s\n' "$ora_codes" | grep -Fxq 'ORA-01507'; then
      # The freshly prepared RMAN auxiliary is deliberately NOMOUNT, so
      # v$database does not exist yet. This is the sole safe duplicate state.
      echo DG_STATE=ABSENT
      exit 0
    fi

    echo "Standby role probe was neither a live member nor a NOMOUNT auxiliary explicitly prepared by this play (sqlplus rc=${sql_rc})" >&2
    exit 1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_role_before
  changed_when: false
  failed_when: _dg_standby_role_before.rc != 0

- name: Record whether duplicate target is already a live Data Guard member
  ansible.builtin.set_fact:
    _dg_standby_is_live_member: >-
      {{
        (
          'PHYSICAL STANDBY' in (_dg_standby_role_before.stdout | default(''))
        ) or (
          'PRIMARY|' in (_dg_standby_role_before.stdout | default('')) and
          _dg_standby_unique_name in (_dg_standby_role_before.stdout | default(''))
        )
      }}

- name: Resolve normalized live standby state line
  ansible.builtin.set_fact:
    _dg_standby_live_state_lines: >-
      {{
        _dg_standby_role_before.stdout_lines
        | default([])
        | map('trim')
        | select('match', '^DG_STATE=')
        | list
      }}
  when: _dg_standby_is_live_member | bool

- name: Fail closed when live standby state line is ambiguous
  ansible.builtin.assert:
    that:
      - _dg_standby_live_state_lines | length == 1
      - ((_dg_standby_live_state_lines | first | default('')).split('|') | length) == 3
      - (_dg_standby_live_state_lines | first | default('')).split('|')[2] == _dg_standby_unique_name
    fail_msg: >-
      Expected exactly one complete DG_STATE line for {{ _dg_standby_unique_name }};
      refusing to parse ambiguous SQL*Plus output.
  when: _dg_standby_is_live_member | bool

- name: Resolve live standby role and open mode after duplicate or promotion
  ansible.builtin.set_fact:
    _dg_standby_live_state_line: "{{ _dg_standby_live_state_lines | first }}"
    _dg_standby_live_role: >-
      {{
        (
          (_dg_standby_live_state_lines | first).split('|')[0].split('=', 1)[1]
          | default('')
        ) | trim | upper
      }}
    _dg_standby_live_open_mode: >-
      {{
        (
          (_dg_standby_live_state_lines | first).split('|')[1]
          | default('')
        ) | trim | upper
      }}
  when: _dg_standby_is_live_member | bool

- name: Fail closed when standby role or open mode is unknown
  ansible.builtin.assert:
    that:
      - _dg_standby_live_role in ['PRIMARY', 'PHYSICAL STANDBY']
      - >-
        (_dg_standby_live_role == 'PRIMARY' and _dg_standby_live_open_mode == 'READ WRITE') or
        (_dg_standby_live_role == 'PHYSICAL STANDBY' and _dg_standby_live_open_mode in ['MOUNTED', 'READ ONLY', 'READ ONLY WITH APPLY'])
    fail_msg: >-
      Standby candidate {{ _dg_standby_unique_name }} reported role={{ _dg_standby_live_role | default('unknown') }}
      and open_mode={{ _dg_standby_live_open_mode | default('unknown') }}. Refusing to
      force a promoted member back to PHYSICAL_STANDBY or infer an unsafe Restart start option.
  when: _dg_standby_is_live_member | bool

- name: Run RMAN active duplicate for physical standby
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/rman" <<'RMAN'
    CONNECT TARGET sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb
    CONNECT AUXILIARY sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_standby_unique_name }}_dgb
    DUPLICATE TARGET DATABASE
      FOR STANDBY
      FROM ACTIVE DATABASE
      DORECOVER
      NOFILENAMECHECK;
    EXIT;
    RMAN
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_duplicate_standby
  changed_when: true
  failed_when: >-
    _dg_duplicate_standby.rc != 0 or
    'RMAN-' in (_dg_duplicate_standby.stdout | default('')) or
    'ORA-' in (_dg_duplicate_standby.stdout | default(''))
  no_log: true
  when:
    - "'PHYSICAL STANDBY' not in (_dg_standby_role_before.stdout | default(''))"
    - not (_dg_standby_is_live_member | default(false) | bool)

- name: Validate standby role after duplicate or preserve promoted primary
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT 'DG_STATE=' || database_role || '|' || open_mode || '|' || db_unique_name FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_role_after
  changed_when: false
  failed_when: >-
    _dg_standby_role_after.rc != 0 or
    'ORA-' in (_dg_standby_role_after.stdout | default('')) or
    'SP2-' in (_dg_standby_role_after.stdout | default('')) or
    (
      'DG_STATE=PHYSICAL STANDBY|' not in (_dg_standby_role_after.stdout | default('')) and
      'DG_STATE=PRIMARY|READ WRITE|' not in (_dg_standby_role_after.stdout | default(''))
    )

- name: Resolve normalized final standby state line
  ansible.builtin.set_fact:
    _dg_standby_final_state_lines: >-
      {{
        _dg_standby_role_after.stdout_lines
        | default([])
        | map('trim')
        | select('match', '^DG_STATE=')
        | list
      }}

- name: Fail closed when final standby state line is ambiguous
  ansible.builtin.assert:
    that:
      - _dg_standby_final_state_lines | length == 1
      - ((_dg_standby_final_state_lines | first | default('')).split('|') | length) == 3
      - (_dg_standby_final_state_lines | first | default('')).split('|')[2] == _dg_standby_unique_name
    fail_msg: >-
      Expected exactly one complete DG_STATE line for {{ _dg_standby_unique_name }} after duplicate;
      refusing to infer a Restart contract from ambiguous SQL*Plus output.

- name: Resolve final standby role and open mode
  ansible.builtin.set_fact:
    _dg_standby_final_state_line: "{{ _dg_standby_final_state_lines | first }}"
    _dg_standby_live_role: >-
      {{
        (
          (_dg_standby_final_state_lines | first).split('|')[0].split('=', 1)[1]
          | default('')
        ) | trim | upper
      }}
    _dg_standby_live_open_mode: >-
      {{
        (
          (_dg_standby_final_state_lines | first).split('|')[1]
          | default('')
        ) | trim | upper
      }}

- name: Fail closed when final standby role or open mode is unknown
  ansible.builtin.assert:
    that:
      - _dg_standby_live_role in ['PRIMARY', 'PHYSICAL STANDBY']
      - >-
        (_dg_standby_live_role == 'PRIMARY' and _dg_standby_live_open_mode == 'READ WRITE') or
        (_dg_standby_live_role == 'PHYSICAL STANDBY' and _dg_standby_live_open_mode in ['MOUNTED', 'READ ONLY', 'READ ONLY WITH APPLY'])
    fail_msg: >-
      Standby candidate {{ _dg_standby_unique_name }} reported role={{ _dg_standby_live_role | default('unknown') }}
      and open_mode={{ _dg_standby_live_open_mode | default('unknown') }} after duplicate.
      Refusing to infer an unsafe Restart role or start option.

- name: Resolve final standby Restart role and start option
  ansible.builtin.set_fact:
    _dg_standby_restart_role: "{{ _dg_standby_live_role | replace(' ', '_') }}"
    _dg_standby_restart_startoption: >-
      {{
        'open'
        if _dg_standby_live_role == 'PRIMARY'
        else 'read only'
      }}

- name: Check standby spfile for Restart registration
  ansible.builtin.stat:
    path: "{{ _dg_standby_spfile }}"
  register: _dg_standby_spfile_stat

- name: Create standby spfile for Restart registration
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<SQL
    CREATE SPFILE='{{ _dg_standby_spfile }}' FROM PFILE='{{ _dg_standby_pfile }}';
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_create_spfile
  changed_when: true
  failed_when: >-
    _dg_standby_create_spfile.rc != 0 or
    'ORA-' in (_dg_standby_create_spfile.stdout | default('')) or
    'SP2-' in (_dg_standby_create_spfile.stdout | default(''))
  when: not _dg_standby_spfile_stat.stat.exists

- name: Read standby spfile in use
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT value FROM v$parameter WHERE name = 'spfile';
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_spfile_in_use
  changed_when: false
  failed_when: >-
    _dg_standby_spfile_in_use.rc != 0 or
    'ORA-' in (_dg_standby_spfile_in_use.stdout | default('')) or
    'SP2-' in (_dg_standby_spfile_in_use.stdout | default(''))

- name: Restart standby from spfile for broker management
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    DECLARE
      v_open_mode v$database.open_mode%TYPE;
    BEGIN
      SELECT open_mode INTO v_open_mode FROM v$database;
      IF v_open_mode = 'READ ONLY WITH APPLY' THEN
        BEGIN
          EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE CANCEL';
        EXCEPTION
          WHEN OTHERS THEN NULL;
        END;
      END IF;
    END;
    /
    SHUTDOWN IMMEDIATE;
    STARTUP MOUNT;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_restart_spfile
  changed_when: true
  failed_when: >-
    _dg_standby_restart_spfile.rc != 0 or
    (
      (_dg_standby_restart_spfile.stdout | default('')).replace('ORA-01109', '')
      is search('ORA-')
    ) or
    'SP2-' in (_dg_standby_restart_spfile.stdout | default(''))
  when:
    - oracle_dataguard_configure_broker | default(false) | bool
    - _dg_standby_spfile not in (_dg_standby_spfile_in_use.stdout | default(''))
    - "'NOT_REGISTERED' in (_dg_standby_registered_status_before.stdout | default(''))"

- name: Configure standby Data Guard initialization parameters
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<SQL
    ALTER SYSTEM SET standby_file_management='AUTO' SCOPE=BOTH;
    ALTER SYSTEM SET dg_broker_start=TRUE SCOPE=BOTH;
    ALTER SYSTEM SET log_archive_config='DG_CONFIG=({{ _dg_primary_unique_name }},{{ _dg_standby_unique_name }})' SCOPE=BOTH;
    ALTER SYSTEM SET fal_server='{{ _dg_primary_unique_name }}_dgb' SCOPE=BOTH;
    ALTER SYSTEM SET fal_client='{{ _dg_standby_unique_name }}_dgb' SCOPE=BOTH;
    ALTER SYSTEM SET local_listener='(ADDRESS=(PROTOCOL=TCP)(HOST={{ inst.listener_vip }})(PORT={{ inst.listener_port | default(1521) }}))' SCOPE=BOTH;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_params
  changed_when: false
  failed_when: >-
    _dg_standby_params.rc != 0 or
    'ORA-' in (_dg_standby_params.stdout | default('')) or
    'SP2-' in (_dg_standby_params.stdout | default(''))

- name: Check standby Restart database registration
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "{{ _dg_home_path }}/bin/srvctl" config database -db {{ _dg_standby_unique_name }} 2>&1 || echo NOT_REGISTERED
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_srvctl_db
  changed_when: false
  failed_when: false

- name: Read standby Restart database resource profile
  ansible.builtin.shell: |
    set -o pipefail
    "{{ _dg_gi_home_path }}/bin/crsctl" \
      status resource ora.{{ _dg_standby_unique_name }}.db -p 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_crs_db
  changed_when: false
  failed_when: false

- name: Resolve standby Restart database registration probes
  ansible.builtin.set_fact:
    _dg_standby_crs_db_exists: >-
      {{
        _dg_standby_crs_db.rc == 0 and
        ('NAME=ora.' ~ _dg_standby_unique_name ~ '.db') in
        (_dg_standby_crs_db.stdout | default(''))
      }}
    _dg_standby_srvctl_db_usable: >-
      {{
        _dg_standby_srvctl_db.rc == 0 and
        'NOT_REGISTERED' not in (_dg_standby_srvctl_db.stdout | default('')) and
        'PRCR-' not in (_dg_standby_srvctl_db.stdout | default('')) and
        'PRCD-' not in (_dg_standby_srvctl_db.stdout | default(''))
      }}
    _dg_standby_crs_db_contract_ok: >-
      {{
        _dg_standby_crs_db.rc == 0 and
        ('ROLE=' ~ _dg_standby_restart_role) in (_dg_standby_crs_db.stdout | default('')) and
        'MANAGEMENT_POLICY=AUTOMATIC' in (_dg_standby_crs_db.stdout | default('')) and
        ('usr_ora_open_mode=' ~ _dg_standby_restart_startoption | lower) in
          ((_dg_standby_crs_db.stdout | default('')) | lower) and
        'USR_ORA_STOP_MODE=immediate' in (_dg_standby_crs_db.stdout | default('')) and
        'ENABLED=1' in (_dg_standby_crs_db.stdout | default(''))
      }}

- name: Fail when standby Restart registration cannot be reconciled safely
  ansible.builtin.fail:
    msg: >-
      Standby Restart resource ora.{{ _dg_standby_unique_name }}.db exists,
      but srvctl cannot inspect it and its read-only CRS profile does not match
      the required live-role/AUTOMATIC/start-option contract. Refusing to
      mutate an ora.* resource with crsctl; restore supported srvctl/CSS access
      or remove and recreate the registration through srvctl.
  when:
    - _dg_standby_crs_db_exists | bool
    - not (_dg_standby_srvctl_db_usable | bool)
    - not (_dg_standby_crs_db_contract_ok | bool)

- name: Register physical standby database with Oracle Restart
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "{{ _dg_home_path }}/bin/srvctl" add database \
      -db {{ _dg_standby_unique_name }} \
      -oraclehome {{ _dg_home_path }} \
      -spfile {{ _dg_standby_spfile }} \
      -pwfile {{ _dg_standby_pwfile }} \
      -role "{{ _dg_standby_restart_role }}" \
      -policy AUTOMATIC \
      -dbname {{ inst.name }} \
      -instance {{ inst.name }} \
      -startoption "{{ _dg_standby_restart_startoption }}" \
      -stopoption IMMEDIATE
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_srvctl_add_db
  changed_when: _dg_standby_srvctl_add_db.rc == 0
  failed_when: _dg_standby_srvctl_add_db.rc != 0
  when: not (_dg_standby_crs_db_exists | bool)

# `srvctl add` only establishes the contract on first convergence. Broker
# switchovers and older lab runs can leave an existing Restart registration
# with the wrong role or start policy, so reconcile it through SRVCTL on every
# run. The broker role later promotes the start option to read-only apply.
- name: Reconcile standby database Restart configuration
  ansible.builtin.command:
    argv:
      - "{{ _dg_home_path }}/bin/srvctl"
      - modify
      - database
      - -db
      - "{{ _dg_standby_unique_name }}"
      - -role
      - "{{ _dg_standby_restart_role }}"
      - -policy
      - AUTOMATIC
      - -startoption
      - "{{ _dg_standby_restart_startoption }}"
      - -stopoption
      - IMMEDIATE
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ _dg_home_path }}"
  changed_when: true
  when: >-
    _dg_standby_srvctl_db_usable | bool and
    (
      ('database role: ' ~ _dg_standby_restart_role | lower) not in (_dg_standby_srvctl_db.stdout | default('') | lower) or
      'Management policy: AUTOMATIC' not in (_dg_standby_srvctl_db.stdout | default('')) or
      ('start options: ' ~ _dg_standby_restart_startoption | lower) not in (_dg_standby_srvctl_db.stdout | default('') | lower) or
      'stop options: immediate' not in (_dg_standby_srvctl_db.stdout | default('') | lower)
    )

- name: Check standby listener Restart registration
  ansible.builtin.shell: |
    set -o pipefail
    "{{ _dg_gi_home_path }}/bin/srvctl" config listener -listener LISTENER_{{ inst.name | upper }} 2>&1 || echo NOT_REGISTERED
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_srvctl_listener
  changed_when: false
  failed_when: false

- name: Register standby listener with Oracle Restart
  ansible.builtin.shell: |
    set -o pipefail
    "{{ _dg_gi_home_path }}/bin/srvctl" add listener \
      -listener LISTENER_{{ inst.name | upper }} \
      -oraclehome {{ _dg_home_path }} \
      -endpoints "TCP:{{ inst.listener_port | default(1521) }}"
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_srvctl_add_listener
  changed_when: _dg_standby_srvctl_add_listener.rc == 0
  failed_when: >-
    _dg_standby_srvctl_add_listener.rc != 0 and
    'already exists' not in (_dg_standby_srvctl_add_listener.stdout | default(''))
  when: "'NOT_REGISTERED' in (_dg_standby_srvctl_listener.stdout | default(''))"

# `srvctl add` only handles the first registration. A rebuilt or switched
# Oracle home can leave an existing listener pointed at the wrong home or port,
# which prevents Restart from bringing it back cleanly after a guest boot.
- name: Reconcile standby listener Restart configuration
  ansible.builtin.shell: |
    set -o pipefail
    gi_home="{{ _dg_gi_home_path }}"
    listener="LISTENER_{{ inst.name | upper }}"
    config="$("$gi_home/bin/srvctl" config listener -listener "$listener" 2>&1)"
    printf '%s\n' "$config"
    if printf '%s\n' "$config" | grep -Fqx "Home: {{ _dg_home_path }}" &&
       printf '%s\n' "$config" | grep -Eiq '^End points:[[:space:]]*TCP:{{ inst.listener_port | default(1521) }}([[:space:]]|$)'; then
      echo LISTENER_CONTRACT_OK
      exit 0
    fi

    "$gi_home/bin/srvctl" modify listener \
      -listener "$listener" \
      -oraclehome {{ _dg_home_path }} \
      -endpoints "TCP:{{ inst.listener_port | default(1521) }}"
    echo LISTENER_CONTRACT_RECONCILED
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_srvctl_reconcile_listener
  changed_when: >-
    'LISTENER_CONTRACT_RECONCILED' in
    (_dg_standby_srvctl_reconcile_listener.stdout | default(''))
  failed_when: _dg_standby_srvctl_reconcile_listener.rc != 0

- name: Enable standby database and listener in Oracle Restart
  ansible.builtin.shell: |
    set -o pipefail
    gi_home="{{ _dg_gi_home_path }}"
    db_home="{{ _dg_home_path }}"
    export ORACLE_HOME="$db_home"
    changed=0

    db_profile="$("$gi_home/bin/crsctl" status resource ora.{{ _dg_standby_unique_name }}.db -p 2>&1)" || true
    printf '%s\n' "$db_profile"
    if printf '%s\n' "$db_profile" | grep -Fqx 'ENABLED=1'; then
      echo DATABASE_ALREADY_ENABLED
    else
      enable_output="$("$db_home/bin/srvctl" enable database -db {{ _dg_standby_unique_name }} 2>&1)" || enable_rc=$?
      printf '%s\n' "$enable_output"
      if [ "${enable_rc:-0}" -ne 0 ] && ! printf '%s\n' "$enable_output" | grep -Eiq 'already enabled|PRCR-1002'; then
        exit "${enable_rc:-1}"
      fi
      if [ "${enable_rc:-0}" -eq 0 ]; then
        changed=1
      fi
    fi

    unset enable_rc
    enable_output="$("$gi_home/bin/srvctl" enable listener -listener LISTENER_{{ inst.name | upper }} 2>&1)" || enable_rc=$?
    printf '%s\n' "$enable_output"
    if [ "${enable_rc:-0}" -ne 0 ] && ! printf '%s\n' "$enable_output" | grep -Eiq 'already enabled|PRCR-1002'; then
      exit "${enable_rc:-1}"
    fi
    if [ "${enable_rc:-0}" -eq 0 ]; then
      changed=1
    fi

    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_srvctl_enable
  changed_when: "'CHANGED' in (_dg_standby_srvctl_enable.stdout | default(''))"

- name: Validate standby Restart registration
  ansible.builtin.shell: |
    set -o pipefail
    gi_home="{{ _dg_gi_home_path }}"
    db_home="{{ _dg_home_path }}"
    export ORACLE_HOME="$db_home"
    db_config="$($db_home/bin/srvctl config database -db {{ _dg_standby_unique_name }} 2>&1)"
    db_rc=$?
    printf '%s\n' "$db_config"
    if [ "$db_rc" -ne 0 ] ||
       ! printf '%s\n' "$db_config" | grep -Fqi "Database role: {{ _dg_standby_restart_role }}"; then
      db_profile="$($gi_home/bin/crsctl status resource ora.{{ _dg_standby_unique_name }}.db -p 2>&1)"
      profile_rc=$?
      printf '%s\n' "$db_profile"
      if [ "$profile_rc" -ne 0 ] ||
         ! printf '%s\n' "$db_profile" | grep -Fq 'ROLE={{ _dg_standby_restart_role }}' ||
         ! printf '%s\n' "$db_profile" | grep -Fq 'MANAGEMENT_POLICY=AUTOMATIC' ||
         ! printf '%s\n' "$db_profile" | grep -Fiq 'USR_ORA_OPEN_MODE={{ _dg_standby_restart_startoption }}' ||
         ! printf '%s\n' "$db_profile" | grep -Fq 'USR_ORA_STOP_MODE=immediate' ||
         ! printf '%s\n' "$db_profile" | grep -Fq 'ENABLED=1'; then
        echo "Standby Restart database registration is not verifiable through srvctl or a matching read-only CRS profile." >&2
        exit 1
      fi
    fi

    listener_config="$($gi_home/bin/srvctl config listener -listener LISTENER_{{ inst.name | upper }} 2>&1)"
    listener_rc=$?
    printf '%s\n' "$listener_config"
    [ "$listener_rc" -eq 0 ] || exit "$listener_rc"
    printf '%s\n' "$listener_config" | grep -Fq 'LISTENER_' || exit 1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_srvctl_validate
  changed_when: false
  failed_when: >-
    _dg_standby_srvctl_validate.rc != 0 or
    (_dg_standby_restart_role not in (_dg_standby_srvctl_validate.stdout | default(''))) or
    'LISTENER_' not in (_dg_standby_srvctl_validate.stdout | default(''))
