---
# tasks/main.yml for oracle_dataguard
#
# Data Guard orchestration for primary prep, physical standby duplicate,
# broker configuration, and opt-in manual switchover.

- name: Resolve Data Guard instances
  ansible.builtin.set_fact:
    _dg_instances: "{{ (oracle_instances | default([])) | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), false) }}"

- name: Mark Data Guard switchover target as matched
  ansible.builtin.set_fact:
    _dg_switchover_target_matched: true
  loop: "{{ _dg_instances }}"
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  run_once: true
  when:
    - oracle_dataguard_run_switchover | bool
    - oracle_dataguard_switchover_target | length > 0
    - "'primary' in group_names"
    - oracle_dataguard_switchover_target in [
        inst.db_unique_name | default(dg_primary.db_unique_name | default(inst.name)),
        inst.dg_standby_db_unique_name | default(dg_standby.db_unique_name | default(inst.name ~ '_sby'))
      ]

- name: Fail when switchover is requested without a target
  ansible.builtin.fail:
    msg: oracle_dataguard_switchover_target is required when oracle_dataguard_run_switchover=true.
  run_once: true
  when:
    - oracle_dataguard_run_switchover | bool
    - oracle_dataguard_switchover_target | length == 0
    - "'primary' in group_names"

- name: Fail when switchover target does not match a Data Guard instance
  ansible.builtin.fail:
    msg: >-
      oracle_dataguard_switchover_target={{ oracle_dataguard_switchover_target }}
      does not match any configured Data Guard primary or standby unique name.
  run_once: true
  when:
    - oracle_dataguard_run_switchover | bool
    - oracle_dataguard_switchover_target | length > 0
    - "'primary' in group_names"
    - not (_dg_switchover_target_matched | default(false) | bool)

- name: Prepare primary database for Data Guard
  ansible.builtin.include_tasks: prepare-primary.yml
  loop: "{{ _dg_instances }}"
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  when:
    - oracle_dataguard_prepare_primary | bool
    - "'primary' in group_names"

- name: Prepare standby auxiliary for Data Guard
  ansible.builtin.include_tasks: prepare-standby.yml
  loop: "{{ _dg_instances }}"
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  when:
    - oracle_dataguard_prepare_standby | bool
    - "'standby' in group_names"

- name: Duplicate physical standby for Data Guard
  ansible.builtin.include_tasks: duplicate-standby.yml
  loop: "{{ _dg_instances }}"
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  when:
    - oracle_dataguard_duplicate_standby | bool
    - "'standby' in group_names"

- name: Ensure Data Guard flashback prerequisite
  ansible.builtin.include_tasks: ensure-flashback.yml
  loop: "{{ _dg_instances }}"
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  when:
    - oracle_dataguard_configure_broker | bool
    - inst.dataguard | default(false) | bool
    - inst.flashback | default(false) | bool
    - "'primary' in group_names or 'standby' in group_names"

- name: Configure Data Guard broker
  ansible.builtin.include_tasks: configure-broker.yml
  loop: "{{ _dg_instances }}"
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  when:
    - oracle_dataguard_configure_broker | bool
    - "'primary' in group_names"

- name: Manually switchover Data Guard broker primary
  ansible.builtin.include_tasks: switchover.yml
  loop: "{{ _dg_instances }}"
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  run_once: true
  when:
    - oracle_dataguard_run_switchover | bool
    - oracle_dataguard_switchover_target | length > 0
    - "'primary' in group_names"
    - oracle_dataguard_switchover_target in [
        inst.db_unique_name | default(dg_primary.db_unique_name | default(inst.name)),
        inst.dg_standby_db_unique_name | default(dg_standby.db_unique_name | default(inst.name ~ '_sby'))
      ]

- name: Read live DB facts (so we can report role/open-mode)
  oracle_db_facts:
    service_name: "{{ (_dg_instances | first).service_name | default((_dg_instances | first).name) }}"
    host: "{{ (_dg_instances | first).listener_vip | default('superdb.domain.is') }}"
    port: "{{ (_dg_instances | first).listener_port | default(1521) }}"
    username: system
    password: "{{ oracle_lab_system_password | default('SysPassword1_') }}"
    role: sysdg
  register: _dg_facts
  failed_when: false
  when: _dg_instances | length > 0

- name: Report DG readiness
  ansible.builtin.debug:
    msg: >-
      Data Guard role partially implemented. Live DB role:
      {{ _dg_facts.facts.database_role | default('unknown') }}; open mode:
      {{ _dg_facts.facts.open_mode | default('unknown') }}. Set dg_enabled=true
      and oracle_dataguard_enabled=true after the primary/standby duplicate
      path is implemented.

- name: Set oracle_dataguard_configured fact
  ansible.builtin.set_fact:
    oracle_dataguard_configured: "{{ _dg_facts.facts.database_role | default('PRIMARY') in ['PHYSICAL STANDBY', 'LOGICAL STANDBY', 'SNAPSHOT STANDBY'] }}"
  when: _dg_facts is defined

- name: Not implemented — fail only if DG is explicitly requested
  ansible.builtin.fail:
    msg: >-
      oracle_dataguard_enabled=true is reserved for the full Data Guard
      lifecycle. Primary prep, physical standby duplicate, broker
      configuration, Maximum Availability, READ ONLY WITH APPLY, and manual
      switchover are implemented through their explicit gates. Keep
      oracle_dataguard_enabled=false until FSFO/automatic failover and observer
      lifecycle are implemented.
  when:
    - dg_enabled | bool
    - oracle_dataguard_enabled | bool
