---
# tasks/prepare-standby.yml - standby-side auxiliary setup for RMAN duplicate.
# `inst` is one element of oracle_instances, after host overrides.

- name: Resolve current ORACLE_HOME for Data Guard standby prep
  ansible.builtin.set_fact:
    _dg_home_path: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}
    _dg_standby_unique_name: "{{ inst.db_unique_name | default(dg_standby.db_unique_name | default(inst.name ~ '_sby')) }}"
    _dg_primary_unique_name: "{{ inst.dg_primary_db_unique_name | default(dg_primary.db_unique_name | default(inst.name)) }}"
    _dg_listener_host: >-
      {%- set explicit = inst.listener_ip | default('') | trim -%}
      {%- if explicit -%}{{ explicit }}{%- else -%}
      {%- for entry in (oracle_lab_listener_vips | default([])) -%}
      {%- if inst.listener_vip | default('') in (entry.names | default('') | string).split() -%}{{ entry.ip }}{%- endif -%}
      {%- endfor -%}
      {%- endif -%}
    _dg_listener_port: "{{ inst.listener_port | default(1521) }}"
    _dg_standby_pfile: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}/dbs/init{{ inst.name }}.ora
    _dg_standby_pwfile: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}/dbs/orapw{{ inst.name }}

- name: Require a literal standby listener IP for Data Guard
  ansible.builtin.assert:
    that:
      - (_dg_listener_host | default('') | length) > 0
      - _dg_listener_host is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
    fail_msg: >-
      {{ inst.name }} requires listener_ip (or an explicit lab VIP mapping)
      before Data Guard LOCAL_LISTENER configuration.

- name: Resolve runtime ORACLE_HOME from Restart for standby prep
  ansible.builtin.include_role:
    name: oracle_common
    tasks_from: resolve-runtime-home.yml
  vars:
    oracle_runtime_home_restart_db: "{{ _dg_standby_unique_name }}"
    oracle_runtime_home_fallback: "{{ _dg_home_path }}"

- name: Use Restart-registered ORACLE_HOME for standby prep
  ansible.builtin.set_fact:
    _dg_home_path: "{{ _runtime_home_path }}"

- name: Ensure standby audit directory exists
  ansible.builtin.file:
    path: "{{ inst.oracle_base }}/admin/{{ inst.name }}/adump"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0750"

- name: Write standby auxiliary initialization file
  ansible.builtin.copy:
    dest: "{{ _dg_standby_pfile }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"
    content: |
      *.db_name='{{ inst.name }}'
      *.db_unique_name='{{ _dg_standby_unique_name }}'
      *.control_files='{{ inst.dirs.data }}/control01.ctl','{{ inst.dirs.flashback }}/control02.ctl'
      *.db_create_file_dest='{{ inst.dirs.data }}'
      *.db_recovery_file_dest='{{ inst.dirs.flashback }}'
      *.db_recovery_file_dest_size='20G'
      *.audit_file_dest='{{ inst.oracle_base }}/admin/{{ inst.name }}/adump'
      *.diagnostic_dest='{{ inst.oracle_base }}'
      *.standby_file_management='AUTO'
      *.dg_broker_start=TRUE
      *.log_archive_config='DG_CONFIG=({{ _dg_primary_unique_name }},{{ _dg_standby_unique_name }})'
      *.fal_server='{{ _dg_primary_unique_name }}_dgb'
      *.fal_client='{{ _dg_standby_unique_name }}_dgb'
      *.local_listener='(ADDRESS=(PROTOCOL=TCP)(HOST={{ _dg_listener_host }})(PORT={{ _dg_listener_port }}))'
  register: _dg_standby_pfile_result

- name: Ensure standby password file exists for remote SYSDBA
  ansible.builtin.shell: |
    set -o pipefail
    if [ ! -f "{{ _dg_standby_pwfile }}" ]; then
      "{{ _dg_home_path }}/bin/orapwd" \
        file="{{ _dg_standby_pwfile }}" \
        password="{{ oracle_lab_sys_password | default('SysPassword1_') }}" \
        entries=10 \
        format=12
      echo CHANGED
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_pwfile_result
  changed_when: "'CHANGED' in (_dg_standby_pwfile_result.stdout | default(''))"
  no_log: true

- name: Register standby auxiliary in oratab
  ansible.builtin.lineinfile:
    path: /etc/oratab
    regexp: "^{{ inst.name }}:"
    line: "{{ inst.name }}:{{ _dg_home_path }}:N"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Check standby auxiliary PMON
  ansible.builtin.command: "pgrep -x ora_pmon_{{ inst.name }}"
  register: _dg_standby_pmon
  changed_when: false
  failed_when: false

- name: Read standby database role during auxiliary prep
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode || '|' || db_unique_name FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_role_during_prep
  changed_when: false
  failed_when: false
  when: _dg_standby_pmon.rc == 0

- name: Record whether this host already has a live Data Guard member
  ansible.builtin.set_fact:
    _dg_standby_is_live_member: >-
      {{
        (
          'PHYSICAL STANDBY' in (_dg_standby_role_during_prep.stdout | default(''))
        ) or (
          'PRIMARY|' in (_dg_standby_role_during_prep.stdout | default('')) and
          _dg_standby_unique_name in (_dg_standby_role_during_prep.stdout | default(''))
        )
      }}
  when: _dg_standby_pmon.rc == 0

- name: Default live-member flag when the auxiliary is down
  ansible.builtin.set_fact:
    _dg_standby_is_live_member: false
  when: _dg_standby_pmon.rc != 0

- name: Check registered physical standby before auxiliary startup
  ansible.builtin.shell: |
    set -o pipefail
    db_home={{ _dg_home_path | quote }}
    output="$(ORACLE_HOME="$db_home" "$db_home/bin/srvctl" status database \
      -db {{ _dg_standby_unique_name | quote }} 2>&1)"
    rc=$?
    printf '%s\n' "$output"
    if [ "$rc" -eq 0 ]; then
      exit 0
    fi
    if printf '%s\n' "$output" | grep -Eq 'PRCD-1120|PRCR-1001'; then
      echo NOT_REGISTERED
      exit 0
    fi
    exit "$rc"
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_registered_standby_status
  changed_when: false
  failed_when: _dg_registered_standby_status.rc != 0

- name: Start registered physical standby instead of auxiliary NOMOUNT
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    gi_home="{{ oracle_gi_home | default('/grid/19c/gi_home1') }}"
    changed=0

    if pgrep -x "ora_pmon_{{ inst.name }}" >/dev/null 2>&1 &&
       ! printf '%s\n' "{{ _dg_standby_role_during_prep.stdout | default('') }}" | grep -F 'PHYSICAL STANDBY' >/dev/null &&
       ! printf '%s\n' "{{ _dg_standby_role_during_prep.stdout | default('') }}" | grep -F '{{ _dg_standby_unique_name }}' >/dev/null; then
      # Leftover standalone on the standby host only. Never abort a live
      # Data Guard member (physical standby or promoted unique-name primary).
      printf 'SHUTDOWN ABORT;\nEXIT;\n' | "$ORACLE_HOME/bin/sqlplus" -S / as sysdba
      changed=1
    fi

    listener_status="$("$gi_home/bin/srvctl" status listener -listener LISTENER_{{ inst.name | upper }} 2>&1 || true)"
    printf '%s\n' "$listener_status"
    if ! printf '%s\n' "$listener_status" | grep -Eiq 'is running|running on'; then
      "$gi_home/bin/srvctl" start listener -listener LISTENER_{{ inst.name | upper }}
      changed=1
    fi

    db_status="$("$gi_home/bin/srvctl" status database -db {{ _dg_standby_unique_name }} 2>&1 || true)"
    printf '%s\n' "$db_status"
    if ! printf '%s\n' "$db_status" | grep -Eiq 'is running|running on'; then
      "$gi_home/bin/srvctl" start database -db {{ _dg_standby_unique_name }} -startoption MOUNT || start_rc=$?
      changed=1
      if [ "${start_rc:-0}" -ne 0 ]; then
        exit "$start_rc"
      fi
    fi

    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_registered_standby_start
  changed_when: "'CHANGED' in (_dg_registered_standby_start.stdout | default(''))"
  failed_when: >-
    (
      _dg_registered_standby_start.rc != 0 and
      'ORA-19838' not in (_dg_registered_standby_start.stdout | default(''))
    ) or
    'PRCR-1001' in (_dg_registered_standby_start.stdout | default('')) or
    'PRCD-1120' in (_dg_registered_standby_start.stdout | default(''))
  when:
    - not (_dg_standby_is_live_member | default(false) | bool)
    - "'NOT_REGISTERED' not in (_dg_registered_standby_status.stdout | default(''))"
    - _dg_standby_pmon.rc != 0 or 'PHYSICAL STANDBY' not in (_dg_standby_role_during_prep.stdout | default(''))

- name: Restart standby auxiliary when pfile changes
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<SQL
    SHUTDOWN ABORT;
    STARTUP NOMOUNT PFILE='{{ _dg_standby_pfile }}';
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_restart
  changed_when: true
  failed_when: >-
    _dg_standby_restart.rc != 0 or
    'ORA-' in (_dg_standby_restart.stdout | default('')) or
    'SP2-' in (_dg_standby_restart.stdout | default(''))
  when:
    - not (_dg_standby_is_live_member | default(false) | bool)
    - _dg_standby_pmon.rc == 0
    - _dg_standby_pfile_result.changed | default(false)
    - "'PHYSICAL STANDBY' not in (_dg_standby_role_during_prep.stdout | default(''))"
    - >-
      'NOT_REGISTERED' in (_dg_registered_standby_status.stdout | default('')) or
      'ORA-19838' in (_dg_registered_standby_start.stdout | default(''))

- name: Start standby auxiliary instance NOMOUNT
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<SQL
    STARTUP NOMOUNT PFILE='{{ _dg_standby_pfile }}';
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_start
  changed_when: true
  failed_when: >-
    _dg_standby_start.rc != 0 or
    'ORA-' in (_dg_standby_start.stdout | default('')) or
    'SP2-' in (_dg_standby_start.stdout | default(''))
  when:
    - not (_dg_standby_is_live_member | default(false) | bool)
    - _dg_standby_pmon.rc != 0
    - not (_dg_standby_restart.changed | default(false))
    - >-
      'NOT_REGISTERED' in (_dg_registered_standby_status.stdout | default('')) or
      'ORA-19838' in (_dg_registered_standby_start.stdout | default(''))

- name: Validate standby auxiliary static listener connection
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_standby_unique_name }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT status FROM v$instance;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_static_connect
  changed_when: false
  failed_when: >-
    _dg_standby_static_connect.rc != 0 or
    (
      'STARTED' not in (_dg_standby_static_connect.stdout | default('')) and
      'MOUNTED' not in (_dg_standby_static_connect.stdout | default('')) and
      'OPEN' not in (_dg_standby_static_connect.stdout | default(''))
    ) or
    'ORA-' in (_dg_standby_static_connect.stdout | default('')) or
    'SP2-' in (_dg_standby_static_connect.stdout | default(''))
  no_log: true

# This in-memory fact is deliberately recorded only when this play started a
# previously down, unregistered instance from the managed auxiliary pfile.
# ORA-01507 alone is not proof that a target is safe to overwrite: an existing
# database can also be unmounted.
- name: Record freshly prepared RMAN auxiliary
  ansible.builtin.set_fact:
    _dg_fresh_auxiliary_names: >-
      {{
        ((_dg_fresh_auxiliary_names | default([])) + [_dg_standby_unique_name])
        | unique
        | list
      }}
  when:
    - _dg_standby_start.changed | default(false)
    - _dg_standby_pmon.rc != 0
    - "'NOT_REGISTERED' in (_dg_registered_standby_status.stdout | default(''))"
    - "'STARTED' in (_dg_standby_static_connect.stdout | default(''))"
