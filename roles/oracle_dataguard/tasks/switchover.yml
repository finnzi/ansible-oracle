---
# tasks/switchover.yml - manual Data Guard broker switchover.
# `inst` is one element of oracle_instances, after host overrides.

- name: Resolve current ORACLE_HOME for Data Guard switchover
  ansible.builtin.set_fact:
    _dg_home_path: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}
    _dg_primary_unique_name: "{{ inst.db_unique_name | default(dg_primary.db_unique_name | default(inst.name)) }}"
    _dg_standby_unique_name: "{{ inst.dg_standby_db_unique_name | default(dg_standby.db_unique_name | default(inst.name ~ '_sby')) }}"
    _dg_switchover_target: "{{ oracle_dataguard_switchover_target }}"

- name: Resolve Data Guard switchover endpoints
  ansible.builtin.set_fact:
    _dg_switchover_new_standby: >-
      {{ _dg_standby_unique_name if _dg_switchover_target == _dg_primary_unique_name else _dg_primary_unique_name }}
    _dg_switchover_connect_identifier: >-
      {{ _dg_standby_unique_name if _dg_switchover_target == _dg_primary_unique_name else _dg_primary_unique_name }}_dgb

- name: Fail when switchover target is not a configured member
  ansible.builtin.fail:
    msg: >-
      oracle_dataguard_switchover_target must be {{ _dg_primary_unique_name }}
      or {{ _dg_standby_unique_name }}, got {{ _dg_switchover_target }}.
  when: _dg_switchover_target not in [_dg_primary_unique_name, _dg_standby_unique_name]

- name: Read Data Guard broker roles before switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_connect_identifier }}" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_before
  changed_when: false
  failed_when: >-
    _dg_switchover_before.rc != 0 or
    'Configuration -' not in (_dg_switchover_before.stdout | default(''))
  no_log: true

- name: Record Data Guard switchover target role
  ansible.builtin.set_fact:
    _dg_switchover_target_is_primary: >-
      {{ (_dg_switchover_before.stdout | default('') | regex_search('(?m)^\s*' ~ _dg_switchover_target ~ '\s+- Primary database')) is not none }}
    _dg_switchover_target_is_physical_standby: >-
      {{ (_dg_switchover_before.stdout | default('') | regex_search('(?m)^\s*' ~ _dg_switchover_target ~ '\s+- Physical standby database')) is not none }}

- name: Report Data Guard switchover target already primary
  ansible.builtin.debug:
    msg: ALREADY_PRIMARY
  when: _dg_switchover_target_is_primary | bool

- name: Fail when switchover target is not a physical standby
  ansible.builtin.fail:
    msg: "Target {{ _dg_switchover_target }} is not a switchover-ready physical standby."
  when:
    - not (_dg_switchover_target_is_primary | bool)
    - not (_dg_switchover_target_is_physical_standby | bool)

- name: Switchover Data Guard broker primary
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_connect_identifier }}" <<'DGMGRL'
    SWITCHOVER TO '{{ _dg_switchover_target }}';
    EXIT;
    DGMGRL
    )"
    printf '%s\n' "$output"
    case "$output" in
      *ORA-*|*Error:*) exit 1 ;;
    esac
    echo SWITCHOVER_COMPLETE
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover
  changed_when: "'SWITCHOVER_COMPLETE' in (_dg_switchover.stdout | default(''))"
  failed_when: _dg_switchover.rc != 0
  no_log: true
  when: _dg_switchover_target_is_physical_standby | bool

- name: Wait for broker to settle after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_target }}_dgb" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_broker_after
  changed_when: false
  retries: 18
  delay: 10
  until: >-
    _dg_switchover_broker_after.rc == 0 and
    'Configuration -' in (_dg_switchover_broker_after.stdout | default(''))
  failed_when: >-
    _dg_switchover_broker_after.rc != 0 or
    'Configuration -' not in (_dg_switchover_broker_after.stdout | default(''))
  no_log: true

- name: Read new standby open mode after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_new_standby }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_new_standby_open_mode
  changed_when: false
  failed_when: >-
    _dg_switchover_new_standby_open_mode.rc != 0 or
    'PHYSICAL STANDBY|' not in (_dg_switchover_new_standby_open_mode.stdout | default('')) or
    'ORA-' in (_dg_switchover_new_standby_open_mode.stdout | default('')) or
    'SP2-' in (_dg_switchover_new_standby_open_mode.stdout | default(''))
  no_log: true

- name: Stop new standby apply through broker before opening read-only
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_target }}_dgb" <<'DGMGRL'
    EDIT DATABASE '{{ _dg_switchover_new_standby }}' SET STATE='APPLY-OFF';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_apply_off
  changed_when: true
  failed_when: >-
    _dg_switchover_apply_off.rc != 0 or
    'Error:' in (_dg_switchover_apply_off.stdout | default('')) or
    'ORA-' in (_dg_switchover_apply_off.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_switchover_new_standby_open_mode.stdout | default(''))"

- name: Open new standby read-only with apply after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_new_standby }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    DECLARE
      v_open_mode v$database.open_mode%TYPE;
    BEGIN
      SELECT open_mode INTO v_open_mode FROM v$database;
      IF v_open_mode != 'READ ONLY WITH APPLY' THEN
        BEGIN
          EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE CANCEL';
        EXCEPTION
          WHEN OTHERS THEN NULL;
        END;
        IF v_open_mode = 'MOUNTED' THEN
          EXECUTE IMMEDIATE 'ALTER DATABASE OPEN';
        END IF;
        EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT FROM SESSION';
        DBMS_OUTPUT.PUT_LINE('CHANGED');
      ELSE
        DBMS_OUTPUT.PUT_LINE('OK');
      END IF;
    END;
    /
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_new_standby_read_only_apply
  changed_when: "'CHANGED' in (_dg_switchover_new_standby_read_only_apply.stdout | default(''))"
  failed_when: >-
    _dg_switchover_new_standby_read_only_apply.rc != 0 or
    'ORA-' in (_dg_switchover_new_standby_read_only_apply.stdout | default('')) or
    'SP2-' in (_dg_switchover_new_standby_read_only_apply.stdout | default('')) or
    'PLS-' in (_dg_switchover_new_standby_read_only_apply.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_switchover_new_standby_open_mode.stdout | default(''))"

- name: Enable new standby apply through broker after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_target }}_dgb" <<'DGMGRL'
    EDIT DATABASE '{{ _dg_switchover_new_standby }}' SET STATE='APPLY-ON';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_apply_on
  changed_when: false
  failed_when: >-
    _dg_switchover_apply_on.rc != 0 or
    'Error:' in (_dg_switchover_apply_on.stdout | default('')) or
    'ORA-' in (_dg_switchover_apply_on.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_switchover_new_standby_open_mode.stdout | default(''))"

- name: Validate Data Guard switchover target and new standby
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    target="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_target }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
    EXIT;
    SQL
    )"
    standby="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_new_standby }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
    EXIT;
    SQL
    )"
    output="$(printf '%s\n%s\n' "$target" "$standby")"
    printf '%s\n' "$output"
    case "$output" in
      *ORA-*|*Error:*) exit 1 ;;
    esac
    printf '%s\n' "$output" | grep -F 'PRIMARY|READ WRITE|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' >/dev/null || exit 1
    printf '%s\n' "$output" | grep -F 'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' >/dev/null || exit 1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_validate
  changed_when: false
  retries: 18
  delay: 10
  until: _dg_switchover_validate.rc == 0
  failed_when: _dg_switchover_validate.rc != 0
  no_log: true
