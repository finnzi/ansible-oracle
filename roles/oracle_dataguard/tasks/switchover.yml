---
# tasks/switchover.yml - Data Guard broker switchover.
# `inst` is one element of oracle_instances, after host overrides.

- name: Resolve current ORACLE_HOME for Data Guard switchover
  ansible.builtin.set_fact:
    _dg_home_inventory_path: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}
    _dg_primary_unique_name: "{{ inst.db_unique_name | default(dg_primary.db_unique_name | default(inst.name)) }}"
    _dg_standby_unique_name: "{{ inst.dg_standby_db_unique_name | default(dg_standby.db_unique_name | default(inst.name ~ '_sby')) }}"
    _dg_switchover_requested_target: "{{ oracle_dataguard_switchover_target }}"
    _dg_switchover_fsfo_was_enabled: false
    _dg_gi_home_path: "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}"

- name: Resolve runtime ORACLE_HOME from Restart for switchover
  ansible.builtin.include_role:
    name: oracle_common
    tasks_from: resolve-runtime-home.yml
  vars:
    oracle_runtime_home_restart_db: "{{ inst.db_unique_name | default(inst.name) }}"
    oracle_runtime_home_fallback: "{{ _dg_home_inventory_path }}"

- name: Use Restart-registered ORACLE_HOME for switchover tools
  ansible.builtin.set_fact:
    _dg_home_path: "{{ _runtime_home_path }}"

- name: Resolve Data Guard switchover probe endpoint
  ansible.builtin.set_fact:
    _dg_switchover_probe_identifier: "{{ _dg_primary_unique_name }}_dgb"

# Broker must be running on every member or SWITCHOVER fails with ORA-16608 /
# ORA-16525 on the lagging side (seen after dual-home when the standby DMON
# was left stopped).
- name: Ensure Data Guard broker is started on both members before switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    export PATH="/usr/bin:/bin:${ORACLE_HOME}/bin:${PATH:-}"
    start_broker() {
      local conn="$1"
      local output
      if [ "$conn" = "/" ]; then
        output="$("$ORACLE_HOME/bin/sqlplus" -L -S / as sysdba <<'SQL'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF SERVEROUTPUT ON
    WHENEVER SQLERROR EXIT 1
    DECLARE
      v_start v$parameter.value%TYPE;
    BEGIN
      SELECT value INTO v_start FROM v$parameter WHERE name = 'dg_broker_start';
      IF UPPER(v_start) != 'TRUE' THEN
        EXECUTE IMMEDIATE 'ALTER SYSTEM SET dg_broker_start=TRUE SCOPE=BOTH';
        DBMS_OUTPUT.PUT_LINE('STARTED');
      ELSE
        DBMS_OUTPUT.PUT_LINE('ALREADY');
      END IF;
    END;
    /
    EXIT;
    SQL
    )" || true
      else
        output="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@${conn} as sysdba" <<'SQL'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF SERVEROUTPUT ON
    WHENEVER SQLERROR EXIT 1
    DECLARE
      v_start v$parameter.value%TYPE;
    BEGIN
      SELECT value INTO v_start FROM v$parameter WHERE name = 'dg_broker_start';
      IF UPPER(v_start) != 'TRUE' THEN
        EXECUTE IMMEDIATE 'ALTER SYSTEM SET dg_broker_start=TRUE SCOPE=BOTH';
        DBMS_OUTPUT.PUT_LINE('STARTED');
      ELSE
        DBMS_OUTPUT.PUT_LINE('ALREADY');
      END IF;
    END;
    /
    EXIT;
    SQL
    )" || true
      fi
      printf '%s:%s\n' "$conn" "$output"
    }
    start_broker /
    start_broker "{{ _dg_primary_unique_name }}_dgb"
    start_broker "{{ _dg_standby_unique_name }}_dgb"
    # Give DMON a moment to register after a cold start.
    sleep 5
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_broker_start
  changed_when: "'STARTED' in (_dg_switchover_broker_start.stdout | default(''))"
  failed_when: >-
    'STARTED' not in (_dg_switchover_broker_start.stdout | default('')) and
    'ALREADY' not in (_dg_switchover_broker_start.stdout | default(''))

- name: Fail when switchover target is not a configured member
  ansible.builtin.fail:
    msg: >-
      oracle_dataguard_switchover_target must be
      {{ oracle_dataguard_auto_switchover_target }}, {{ _dg_primary_unique_name }},
      or {{ _dg_standby_unique_name }}, got {{ _dg_switchover_requested_target }}.
  when:
    - _dg_switchover_requested_target != oracle_dataguard_auto_switchover_target
    - _dg_switchover_requested_target not in [_dg_primary_unique_name, _dg_standby_unique_name]

- name: Read Data Guard broker roles before switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    # After a prior switchover this host may be the standby (local broker often
    # ORA-16525). Probe local OS auth, then each member DGMGRL service until
    # SHOW CONFIGURATION returns a broker configuration.
    try_show() {
      local conn="$1"
      local output
      if [ "$conn" = "/" ]; then
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent / <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
    )" || true
      else
        output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@${conn}" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
    )" || true
      fi
      if printf '%s\n' "$output" | grep -q 'Configuration -'; then
        printf '%s\n' "$output"
        return 0
      fi
      return 1
    }
    try_show / \
      || try_show "{{ _dg_primary_unique_name }}_dgb" \
      || try_show "{{ _dg_standby_unique_name }}_dgb"
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_before
  changed_when: false
  retries: 18
  delay: 10
  until: >-
    _dg_switchover_before.rc == 0 and
    'Configuration -' in (_dg_switchover_before.stdout | default(''))
  failed_when: >-
    _dg_switchover_before.rc != 0 or
    'Configuration -' not in (_dg_switchover_before.stdout | default(''))
  no_log: true

- name: Record Data Guard switchover member roles
  ansible.builtin.set_fact:
    _dg_primary_unique_is_primary: >-
      {{ (_dg_switchover_before.stdout | default('') | regex_search('(?m)^\s*' ~ _dg_primary_unique_name ~ '\s+- (\(\*\) )?Primary database')) is not none }}
    _dg_standby_unique_is_primary: >-
      {{ (_dg_switchover_before.stdout | default('') | regex_search('(?m)^\s*' ~ _dg_standby_unique_name ~ '\s+- (\(\*\) )?Primary database')) is not none }}
    _dg_primary_unique_is_physical_standby: >-
      {{ (_dg_switchover_before.stdout | default('') | regex_search('(?m)^\s*' ~ _dg_primary_unique_name ~ '\s+- (\(\*\) )?Physical standby database')) is not none }}
    _dg_standby_unique_is_physical_standby: >-
      {{ (_dg_switchover_before.stdout | default('') | regex_search('(?m)^\s*' ~ _dg_standby_unique_name ~ '\s+- (\(\*\) )?Physical standby database')) is not none }}

- name: Resolve requested switchover target
  ansible.builtin.set_fact:
    _dg_switchover_current_primary: >-
      {{ _dg_primary_unique_name if (_dg_primary_unique_is_primary | bool) else _dg_standby_unique_name if (_dg_standby_unique_is_primary | bool) else '' }}
    _dg_switchover_target: >-
      {{ _dg_standby_unique_name if _dg_switchover_requested_target == oracle_dataguard_auto_switchover_target else _dg_switchover_requested_target }}

- name: Record Data Guard switchover target role
  ansible.builtin.set_fact:
    _dg_switchover_target_is_primary: >-
      {{ (_dg_switchover_target == _dg_primary_unique_name and (_dg_primary_unique_is_primary | bool)) or (_dg_switchover_target == _dg_standby_unique_name and (_dg_standby_unique_is_primary | bool)) }}
    _dg_switchover_target_is_physical_standby: >-
      {{ (_dg_switchover_target == _dg_primary_unique_name and (_dg_primary_unique_is_physical_standby | bool)) or (_dg_switchover_target == _dg_standby_unique_name and (_dg_standby_unique_is_physical_standby | bool)) }}

- name: Fail when broker output does not show a current primary
  ansible.builtin.fail:
    msg: Broker output did not show a current primary for switchover.
  when: _dg_switchover_current_primary | length == 0

- name: Resolve Data Guard switchover endpoints
  ansible.builtin.set_fact:
    _dg_switchover_new_standby: >-
      {{ (_dg_standby_unique_name if _dg_switchover_target == _dg_primary_unique_name else _dg_primary_unique_name) if (_dg_switchover_target_is_primary | bool) else _dg_switchover_current_primary }}
    _dg_switchover_connect_identifier: "{{ _dg_switchover_current_primary }}_dgb"

- name: Report Data Guard switchover target already primary
  ansible.builtin.debug:
    msg: ALREADY_PRIMARY
  when: _dg_switchover_target_is_primary | bool

- name: Fail when switchover target is not a physical standby
  ansible.builtin.fail:
    msg: "Target {{ _dg_switchover_target }} is not a switchover-ready physical standby."
  when:
    - not (_dg_switchover_target_is_primary | bool)
    - not (_dg_switchover_target_is_physical_standby | bool)

- name: Disable Fast-Start Failover before broker switchover when enabled
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    output="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_connect_identifier }}" <<'DGMGRL'
    SHOW FAST_START FAILOVER;
    EXIT;
    DGMGRL
    )"
    printf '%s\n' "$output"
    if printf '%s\n' "$output" | grep -q 'Fast-Start Failover: Enabled'; then
      "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_connect_identifier }}" <<'DGMGRL'
    DISABLE FAST_START FAILOVER;
    EXIT;
    DGMGRL
      echo FSFO_DISABLED
    else
      echo FSFO_ALREADY_DISABLED
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_fsfo_disable
  changed_when: "'FSFO_DISABLED' in (_dg_switchover_fsfo_disable.stdout | default(''))"
  failed_when: >-
    _dg_switchover_fsfo_disable.rc != 0 or
    'Error:' in (_dg_switchover_fsfo_disable.stdout | default(''))
  no_log: true
  when: _dg_switchover_target_is_physical_standby | bool

- name: Record whether FSFO was enabled before switchover
  ansible.builtin.set_fact:
    _dg_switchover_fsfo_was_enabled: >-
      {{ 'FSFO_DISABLED' in (_dg_switchover_fsfo_disable.stdout | default('')) }}
  when:
    - _dg_switchover_fsfo_disable is defined
    - not (_dg_switchover_fsfo_disable.skipped | default(false))

- name: Perform switchover with guaranteed FSFO and apply restore
  when: _dg_switchover_target_is_physical_standby | bool
  block:
    - name: Run switchover precheck, role change, and standby open
      ansible.builtin.include_tasks: switchover-execute.yml
  always:
    - name: Restore FSFO and managed recovery after switchover attempt
      ansible.builtin.include_tasks: switchover-restore.yml


- name: Ensure standby_file_management=AUTO on both members after switchover
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    export PATH="/usr/bin:/bin:${ORACLE_HOME}/bin:${PATH:-}"
    # CRS restart after role change can bring a member up from an older SPFILE
    # that still has the default MANUAL. Re-assert AUTO on both members so
    # primary prerequisites and future file adds stay correct.
    for conn in \
      '{{ _dg_switchover_target }}_dgb' \
      '{{ _dg_switchover_new_standby }}_dgb'
    do
      out="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@${conn} as sysdba" <<'SQL'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF SERVEROUTPUT ON
    DECLARE
      v_val v$parameter.value%TYPE;
    BEGIN
      SELECT value INTO v_val FROM v$parameter WHERE name = 'standby_file_management';
      IF UPPER(v_val) != 'AUTO' THEN
        EXECUTE IMMEDIATE 'ALTER SYSTEM SET standby_file_management=AUTO SCOPE=BOTH';
        DBMS_OUTPUT.PUT_LINE('SET_AUTO');
      ELSE
        DBMS_OUTPUT.PUT_LINE('ALREADY_AUTO');
      END IF;
    END;
    /
    EXIT;
    SQL
    )" || true
      printf '%s:%s\n' "$conn" "$out"
    done
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_sfm_auto
  changed_when: "'SET_AUTO' in (_dg_switchover_sfm_auto.stdout | default(''))"
  failed_when: false

- name: Validate Data Guard switchover target and new standby
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    export PATH="/usr/bin:/bin:${ORACLE_HOME}/bin:${PATH:-}"
    # Match live test assertions: role + open_mode + protection_mode.
    # protection_level can lag as RESYNCHRONIZATION for several minutes after
    # a role change (especially if dgmgrl CRS restart was deadline-killed); the
    # pytest helpers only assert MAXIMUM AVAILABILITY in protection_mode.
    target="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_target }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
    EXIT;
    SQL
    )"
    standby="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_switchover_new_standby }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
    EXIT;
    SQL
    )"
    output="$(printf '%s\n%s\n' "$target" "$standby")"
    normalized_output="$(printf '%s\n' "$output" | tr '[:lower:]' '[:upper:]')"
    printf '%s\n' "$output" | sed -E 's#sys/[^@[:space:]]+@#sys/***@#g' \
      > /tmp/dg-validate-last.out 2>/dev/null || true
    printf '%s\n' "$output"
    # Fail closed on connection/SQL errors (but not on RESYNCHRONIZATION text).
    if printf '%s\n' "$normalized_output" | grep -qE 'ORA-[0-9]{5}|^ERROR:|SP2-'; then
      exit 1
    fi
    printf '%s\n' "$normalized_output" | grep -qF 'PRIMARY|READ WRITE|MAXIMUM AVAILABILITY' || exit 1
    printf '%s\n' "$normalized_output" | grep -qF 'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY' || exit 1
    # Reject demotion to performance mode.
    if printf '%s\n' "$normalized_output" | grep -qE 'MAXIMUM PERFORMANCE|UNPROTECTED'; then
      exit 1
    fi
    exit 0
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_validate
  changed_when: false
  retries: 36
  delay: 10
  until: _dg_switchover_validate.rc == 0
  failed_when: _dg_switchover_validate.rc != 0
  no_log: true

- name: Resolve post-switchover Restart registration contract
  ansible.builtin.set_fact:
    _dg_switchover_restart_registration:
      - host: "{{ groups['primary'] | first }}"
        db_unique_name: "{{ _dg_primary_unique_name }}"
        db_home: "{{ _dg_home_path }}"
        expected_role: >-
          {{ 'PRIMARY' if _dg_switchover_target == _dg_primary_unique_name else 'PHYSICAL_STANDBY' }}
        expected_startoption: >-
          {{ 'open' if _dg_switchover_target == _dg_primary_unique_name else 'read only' }}
      - host: "{{ groups['standby'] | first }}"
        db_unique_name: "{{ _dg_standby_unique_name }}"
        db_home: "{{ _dg_home_path }}"
        expected_role: >-
          {{ 'PRIMARY' if _dg_switchover_target == _dg_standby_unique_name else 'PHYSICAL_STANDBY' }}
        expected_startoption: >-
          {{ 'open' if _dg_switchover_target == _dg_standby_unique_name else 'read only' }}

- name: Probe local Restart database registration after switchover
  ansible.builtin.command:
    argv:
      - "{{ _dg_gi_home_path }}/bin/crsctl"
      - status
      - resource
      - "ora.{{ item.db_unique_name }}.db"
      - -p
  delegate_to: "{{ item.host }}"
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_restart_registration_probe
  changed_when: false
  failed_when: false
  loop: "{{ _dg_switchover_restart_registration }}"
  loop_control:
    label: "{{ item.host }}:{{ item.db_unique_name }}"

- name: Require local Restart registration before reconciliation
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - "('NAME=ora.' ~ item.item.db_unique_name ~ '.db') in item.stdout"
      - "'TYPE=ora.database.type' in item.stdout"
    fail_msg: >-
      Restart database {{ item.item.db_unique_name }} is not registered on
      {{ item.item.host }}; cannot reconcile its post-switchover role without
      changing runtime database state.
  loop: "{{ _dg_switchover_restart_registration_probe.results }}"
  loop_control:
    label: "{{ item.item.host }}:{{ item.item.db_unique_name }}"

- name: Reconcile local Restart database registration after switchover
  ansible.builtin.command:
    argv:
      - "{{ item.item.db_home }}/bin/srvctl"
      - modify
      - database
      - -db
      - "{{ item.item.db_unique_name }}"
      - -role
      - "{{ item.item.expected_role }}"
      - -policy
      - AUTOMATIC
      - -startoption
      - "{{ item.item.expected_startoption }}"
      - -stopoption
      - IMMEDIATE
  delegate_to: "{{ item.item.host }}"
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_restart_registration_modify
  changed_when: true
  when: >-
    ('role=' ~ item.item.expected_role | lower) not in (item.stdout | default('') | lower) or
    ('usr_ora_open_mode=' ~ item.item.expected_startoption | lower) not in (item.stdout | default('') | lower) or
    'usr_ora_stop_mode=immediate' not in (item.stdout | default('') | lower) or
    'management_policy=automatic' not in (item.stdout | default('') | lower) or
    'enabled=1' not in (item.stdout | default('') | lower)
  loop: "{{ _dg_switchover_restart_registration_probe.results }}"
  loop_control:
    label: >-
      {{ item.item.host }}:{{ item.item.db_unique_name }} ->
      {{ item.item.expected_role }}/{{ item.item.expected_startoption }}

- name: Verify local Restart database registration after switchover
  ansible.builtin.command:
    argv:
      - "{{ _dg_gi_home_path }}/bin/crsctl"
      - status
      - resource
      - "ora.{{ item.db_unique_name }}.db"
      - -p
  delegate_to: "{{ item.host }}"
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_switchover_restart_registration_after
  changed_when: false
  failed_when: >-
    _dg_switchover_restart_registration_after.rc != 0 or
    ('role=' ~ item.expected_role | lower) not in
      (_dg_switchover_restart_registration_after.stdout | default('') | lower) or
    ('usr_ora_open_mode=' ~ item.expected_startoption | lower) not in
      (_dg_switchover_restart_registration_after.stdout | default('') | lower) or
    'usr_ora_stop_mode=immediate' not in
      (_dg_switchover_restart_registration_after.stdout | default('') | lower) or
    'management_policy=automatic' not in
      (_dg_switchover_restart_registration_after.stdout | default('') | lower) or
    'enabled=1' not in
      (_dg_switchover_restart_registration_after.stdout | default('') | lower)
  loop: "{{ _dg_switchover_restart_registration }}"
  loop_control:
    label: "{{ item.host }}:{{ item.db_unique_name }}"
