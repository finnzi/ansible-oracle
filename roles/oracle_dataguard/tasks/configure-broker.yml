---
# tasks/configure-broker.yml - broker config, Maximum Availability, read-only apply.
# `inst` is one element of oracle_instances, after host overrides.

- name: Resolve current ORACLE_HOME for Data Guard broker
  ansible.builtin.set_fact:
    _dg_home_path: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}
    _dg_primary_unique_name: "{{ inst.db_unique_name | default(dg_primary.db_unique_name | default(inst.name)) }}"
    _dg_standby_unique_name: "{{ inst.dg_standby_db_unique_name | default(dg_standby.db_unique_name | default(inst.name ~ '_sby')) }}"
    _dg_primary_pwfile: "{{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}/dbs/orapw{{ inst.name }}"
    _dg_gi_home_path: "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}"

- name: Resolve runtime ORACLE_HOME from Restart for broker config
  ansible.builtin.include_role:
    name: oracle_common
    tasks_from: resolve-runtime-home.yml
  vars:
    oracle_runtime_home_restart_db: "{{ _dg_primary_unique_name }}"
    oracle_runtime_home_fallback: "{{ _dg_home_path }}"

- name: Use Restart-registered ORACLE_HOME for broker tools
  ansible.builtin.set_fact:
    _dg_home_path: "{{ _runtime_home_path }}"

- name: Read Data Guard broker configuration
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_show_before
  changed_when: false
  failed_when: >-
    _dg_broker_show_before.rc != 0 or
    (
      'ORA-16532' not in (_dg_broker_show_before.stdout | default('')) and
      'Configuration -' not in (_dg_broker_show_before.stdout | default(''))
    )
  no_log: true

- name: Create Data Guard broker configuration
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    CREATE CONFIGURATION '{{ dg_broker_config }}' AS
      PRIMARY DATABASE IS '{{ _dg_primary_unique_name }}'
      CONNECT IDENTIFIER IS {{ _dg_primary_unique_name }}_dgb;
    ADD DATABASE '{{ _dg_standby_unique_name }}'
      AS CONNECT IDENTIFIER IS {{ _dg_standby_unique_name }}_dgb
      MAINTAINED AS PHYSICAL;
    ENABLE CONFIGURATION;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_create
  changed_when: true
  failed_when: >-
    _dg_broker_create.rc != 0 or
    'Error:' in (_dg_broker_create.stdout | default('')) or
    'ORA-' in (_dg_broker_create.stdout | default(''))
  no_log: true
  when: "'ORA-16532' in (_dg_broker_show_before.stdout | default(''))"

- name: Add missing standby to existing Data Guard broker configuration
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    ADD DATABASE '{{ _dg_standby_unique_name }}'
      AS CONNECT IDENTIFIER IS {{ _dg_standby_unique_name }}_dgb
      MAINTAINED AS PHYSICAL;
    ENABLE CONFIGURATION;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_add_standby
  changed_when: true
  failed_when: >-
    _dg_broker_add_standby.rc != 0 or
    'Error:' in (_dg_broker_add_standby.stdout | default('')) or
    'ORA-' in (_dg_broker_add_standby.stdout | default(''))
  no_log: true
  when:
    - "'Configuration -' in (_dg_broker_show_before.stdout | default(''))"
    - _dg_standby_unique_name not in (_dg_broker_show_before.stdout | default(''))

- name: Wait for standby broker member to be available
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    SHOW DATABASE '{{ _dg_standby_unique_name }}';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_standby_ready
  changed_when: false
  retries: 12
  delay: 10
  until: >-
    _dg_broker_standby_ready.rc == 0 and
    'Database Status:' in (_dg_broker_standby_ready.stdout | default('')) and
    (
      'SUCCESS' in (_dg_broker_standby_ready.stdout | default('')) or
      'ORA-16819' in (_dg_broker_standby_ready.stdout | default('')) or
      'ORA-16820' in (_dg_broker_standby_ready.stdout | default(''))
    ) and
    (
      'ORA-' not in (_dg_broker_standby_ready.stdout | default('')) or
      (
        (
          'ORA-16819' in (_dg_broker_standby_ready.stdout | default('')) or
          'ORA-16820' in (_dg_broker_standby_ready.stdout | default(''))
        ) and
        ((_dg_broker_standby_ready.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is not search('ORA-'))
      )
    ) and
    (
      'Error:' not in (_dg_broker_standby_ready.stdout | default('')) or
      ((_dg_broker_standby_ready.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is not search('ORA-'))
    )
  failed_when: >-
    _dg_broker_standby_ready.rc != 0 or
    'Database Status:' not in (_dg_broker_standby_ready.stdout | default('')) or
    (
      'SUCCESS' not in (_dg_broker_standby_ready.stdout | default('')) and
      'ORA-16819' not in (_dg_broker_standby_ready.stdout | default('')) and
      'ORA-16820' not in (_dg_broker_standby_ready.stdout | default(''))
    ) or
    (
      'ORA-' in (_dg_broker_standby_ready.stdout | default('')) and
      (
        (
          'ORA-16819' not in (_dg_broker_standby_ready.stdout | default('')) and
          'ORA-16820' not in (_dg_broker_standby_ready.stdout | default(''))
        ) or
        ((_dg_broker_standby_ready.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is search('ORA-'))
      )
    ) or
    (
      'Error:' in (_dg_broker_standby_ready.stdout | default('')) and
      ((_dg_broker_standby_ready.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is search('ORA-'))
    )
  no_log: true

- name: Read Data Guard broker roles after member convergence
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_roles_current
  changed_when: false
  failed_when: >-
    _dg_broker_roles_current.rc != 0 or
    'Primary database' not in (_dg_broker_roles_current.stdout | default('')) or
    'Physical standby database' not in (_dg_broker_roles_current.stdout | default(''))
  no_log: true

- name: Read live Data Guard member roles and open modes
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    probe_member() {
      local unique="$1"
      local output
      output="$($ORACLE_HOME/bin/sqlplus -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@${unique}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode FROM v$database;
    EXIT;
    SQL
      )" || true
      printf '%s\n' "$output" | awk -v unique="$unique" '$0 ~ /^[[:space:]]*(PRIMARY|PHYSICAL STANDBY)\|(READ WRITE|READ ONLY WITH APPLY|READ ONLY|MOUNTED)[[:space:]]*$/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0); print "LIVE_DB_STATE=" unique "|" $0; exit}'
    }
    probe_member "{{ _dg_primary_unique_name }}"
    probe_member "{{ _dg_standby_unique_name }}"
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_live_db_state_probe
  changed_when: false
  failed_when: >-
    _dg_live_db_state_probe.rc != 0 or
    'LIVE_DB_STATE={{ _dg_primary_unique_name }}|' not in
      (_dg_live_db_state_probe.stdout | default('')) or
    'LIVE_DB_STATE={{ _dg_standby_unique_name }}|' not in
      (_dg_live_db_state_probe.stdout | default(''))
  no_log: true

- name: Resolve live Data Guard member state lines
  ansible.builtin.set_fact:
    _dg_primary_live_state_line: >-
      {{
        _dg_live_db_state_probe.stdout_lines
        | select('match', '^LIVE_DB_STATE=' ~ _dg_primary_unique_name ~ '[|]')
        | list | first | default('')
      }}
    _dg_standby_live_state_line: >-
      {{
        _dg_live_db_state_probe.stdout_lines
        | select('match', '^LIVE_DB_STATE=' ~ _dg_standby_unique_name ~ '[|]')
        | list | first | default('')
      }}

- name: Resolve live Data Guard roles and open modes
  ansible.builtin.set_fact:
    _dg_primary_live_role: "{{ (_dg_primary_live_state_line.split('|')[1] | default('')) | trim | upper }}"
    _dg_primary_live_open_mode: "{{ (_dg_primary_live_state_line.split('|')[2] | default('')) | trim | upper }}"
    _dg_standby_live_role: "{{ (_dg_standby_live_state_line.split('|')[1] | default('')) | trim | upper }}"
    _dg_standby_live_open_mode: "{{ (_dg_standby_live_state_line.split('|')[2] | default('')) | trim | upper }}"

- name: Fail closed when live Data Guard roles are ambiguous
  ansible.builtin.assert:
    that:
      - _dg_primary_live_role in ['PRIMARY', 'PHYSICAL STANDBY']
      - _dg_standby_live_role in ['PRIMARY', 'PHYSICAL STANDBY']
      - (_dg_primary_live_role == 'PRIMARY') != (_dg_standby_live_role == 'PRIMARY')
      - >-
        (_dg_primary_live_role == 'PRIMARY' and _dg_primary_live_open_mode == 'READ WRITE') or
        (_dg_primary_live_role == 'PHYSICAL STANDBY' and _dg_primary_live_open_mode in ['MOUNTED', 'READ ONLY', 'READ ONLY WITH APPLY'])
      - >-
        (_dg_standby_live_role == 'PRIMARY' and _dg_standby_live_open_mode == 'READ WRITE') or
        (_dg_standby_live_role == 'PHYSICAL STANDBY' and _dg_standby_live_open_mode in ['MOUNTED', 'READ ONLY', 'READ ONLY WITH APPLY'])
    fail_msg: >-
      Live Data Guard state is not a safe two-member configuration:
      {{ _dg_primary_unique_name }}={{ _dg_primary_live_role }}/{{ _dg_primary_live_open_mode }};
      {{ _dg_standby_unique_name }}={{ _dg_standby_live_role }}/{{ _dg_standby_live_open_mode }}.
      Refusing to force inventory roles or Restart start options.

- name: Resolve live Data Guard primary and standby endpoints
  ansible.builtin.set_fact:
    _dg_live_primary_unique: >-
      {{ _dg_primary_unique_name if _dg_primary_live_role == 'PRIMARY' else _dg_standby_unique_name }}
    _dg_live_standby_unique: >-
      {{ _dg_standby_unique_name if _dg_primary_live_role == 'PRIMARY' else _dg_primary_unique_name }}
    _dg_live_primary_host: >-
      {{ groups['primary'] | first if _dg_primary_live_role == 'PRIMARY' else groups['standby'] | first }}
    _dg_live_standby_host: >-
      {{ groups['standby'] | first if _dg_primary_live_role == 'PRIMARY' else groups['primary'] | first }}
    _dg_live_standby_role: >-
      {{ _dg_standby_live_role if _dg_primary_live_role == 'PRIMARY' else _dg_primary_live_role }}
    _dg_live_standby_startoption: >-
      {{
        'open'
        if (_dg_standby_live_role if _dg_primary_live_role == 'PRIMARY' else _dg_primary_live_role) == 'PRIMARY'
        else 'read only'
      }}

- name: Verify broker roles match live database state
  ansible.builtin.assert:
    that:
      - >-
        (_dg_broker_roles_current.stdout | default('') |
        regex_search('(?mi)^\\s*' ~ _dg_live_primary_unique ~
        '\\s+-\\s+(\\(\\*\\)\\s+)?Primary database')) is not none
      - >-
        (_dg_broker_roles_current.stdout | default('') |
        regex_search('(?mi)^\\s*' ~ _dg_live_standby_unique ~
        '\\s+-\\s+(\\(\\*\\)\\s+)?Physical standby database')) is not none
    fail_msg: >-
      Broker roles (Primary database / Physical standby database) do not match
      the live database role probe:
      {{ _dg_live_primary_unique }}={{ _dg_primary_live_role }}/{{ _dg_primary_live_open_mode }};
      {{ _dg_live_standby_unique }}={{ _dg_standby_live_role }}/{{ _dg_standby_live_open_mode }}.
      Refusing to force inventory roles or Restart start options.

- name: Ensure observer SYSDG account exists on the primary
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    export TNS_ADMIN="${ORACLE_HOME}/network/admin"
    SYS_CONNECT="sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}"
    sqlplus_as() {
      local target="$1"
      if [ "$target" = "/" ]; then
        "$ORACLE_HOME/bin/sqlplus" -L -S / as sysdba
      else
        "$ORACLE_HOME/bin/sqlplus" -L -S "${SYS_CONNECT}@${target} as sysdba"
      fi
    }
    conn="/"
    for candidate in \
      "{{ _dg_primary_unique_name }}_dgb" \
      "{{ _dg_standby_unique_name }}_dgb" \
      "/"
    do
      role="$(sqlplus_as "$candidate" <<'SQL' || true
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role FROM v$database;
    EXIT;
    SQL
    )"
      if printf '%s\n' "$role" | grep -qx 'PRIMARY'; then
        conn="$candidate"
        break
      fi
    done
    unique="$(sqlplus_as "$conn" <<'SQL' || true
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT sys_context('USERENV', 'DB_UNIQUE_NAME') FROM dual;
    EXIT;
    SQL
    )"
    unique="$(printf '%s\n' "$unique" | awk 'NF {print; exit}')"
    printf 'LIVE_PRIMARY_CONN=%s\n' "$conn"
    printf 'LIVE_PRIMARY_UNIQUE=%s\n' "$unique"
    sqlplus_as "$conn" <<'SQL'
    SET SERVEROUTPUT ON
    DECLARE
      v_count PLS_INTEGER;
      v_user  VARCHAR2(128) := UPPER('{{ oracle_dataguard_observer_user }}');
    BEGIN
      SELECT COUNT(*) INTO v_count FROM dba_users WHERE username = v_user;
      IF v_count = 0 THEN
        EXECUTE IMMEDIATE 'CREATE USER ' || v_user ||
          ' IDENTIFIED BY "{{ oracle_dataguard_observer_password }}" ACCOUNT UNLOCK';
        DBMS_OUTPUT.PUT_LINE('CREATED');
      ELSE
        EXECUTE IMMEDIATE 'ALTER USER ' || v_user ||
          ' IDENTIFIED BY "{{ oracle_dataguard_observer_password }}" ACCOUNT UNLOCK';
        DBMS_OUTPUT.PUT_LINE('UPDATED');
      END IF;
      EXECUTE IMMEDIATE 'GRANT CREATE SESSION TO ' || v_user;
      EXECUTE IMMEDIATE 'GRANT SYSDG TO ' || v_user;
    END;
    /
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_observer_user
  changed_when: "'CREATED' in (_dg_observer_user.stdout | default(''))"
  failed_when: >-
    _dg_observer_user.rc != 0 or
    'ORA-' in (_dg_observer_user.stdout | default('')) or
    'SP2-' in (_dg_observer_user.stdout | default('')) or
    'PLS-' in (_dg_observer_user.stdout | default(''))
  no_log: true

# A SYSDG grant updates the Oracle password file. Data Guard redo replicates
# the database user but not that file, so an observer can authenticate to the
# primary yet fail when it checks the standby unless both copies are aligned.
# After switchover the inventory-primary host may be the live standby; copy
# from the live primary unique name, never from a hardcoded inventory path.
- name: Fail closed when observer account setup cannot identify the live primary
  ansible.builtin.assert:
    that:
      - >-
        (_dg_observer_user.stdout_lines | default([])
        | select('match', '^LIVE_PRIMARY_UNIQUE=.+') | list | length) == 1
    fail_msg: >-
      Observer account setup did not identify exactly one live primary. Refusing
      to infer a Data Guard role from inventory group membership.

- name: Resolve live primary unique name after observer account update
  ansible.builtin.set_fact:
    _dg_live_primary_unique: >-
      {{
        (
          _dg_observer_user.stdout_lines | default([])
          | select('match', '^LIVE_PRIMARY_UNIQUE=.+')
          | list
          | first
          | default('LIVE_PRIMARY_UNIQUE=' ~ _dg_live_primary_unique)
        ).split('=', 1)[1]
      }}

- name: Resolve live password-file hosts from broker roles
  ansible.builtin.set_fact:
    _dg_pwfile_source_host: >-
      {{
        groups['primary'] | first
        if (_dg_live_primary_unique | trim) == (_dg_primary_unique_name | string)
        else groups['standby'] | first
      }}
    _dg_pwfile_dest_host: >-
      {{
        groups['standby'] | first
        if (_dg_live_primary_unique | trim) == (_dg_primary_unique_name | string)
        else groups['primary'] | first
      }}
    _dg_pwfile_dest_unique: >-
      {{
        _dg_standby_unique_name
        if (_dg_live_primary_unique | trim) == (_dg_primary_unique_name | string)
        else _dg_primary_unique_name
      }}

- name: Discover live primary password file path
  ansible.builtin.shell: |
    set -o pipefail
    db_home="{{ _dg_home_path }}"
    db={{ _dg_live_primary_unique | trim | quote }}
    path="$("${db_home}/bin/srvctl" config database -db "$db" 2>/dev/null |
      awk -F': ' '$1 == "Password file" {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}')"
    if [ -z "$path" ] || [ ! -f "$path" ]; then
      path={{ _dg_primary_pwfile | quote }}
    fi
    if [ ! -f "$path" ]; then
      echo "PWFILE_MISSING path=${path}" >&2
      exit 1
    fi
    printf '%s\n' "$path"
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ _dg_pwfile_source_host }}"
  register: _dg_live_primary_pwfile_path
  changed_when: false

- name: Discover live standby password file destination
  ansible.builtin.shell: |
    set -o pipefail
    db_home="{{ _dg_home_path }}"
    db={{ _dg_pwfile_dest_unique | quote }}
    path="$("${db_home}/bin/srvctl" config database -db "$db" 2>/dev/null |
      awk -F': ' '$1 == "Password file" {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}')"
    if [ -z "$path" ]; then
      path={{ _dg_primary_pwfile | quote }}
    fi
    printf '%s\n' "$path"
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ _dg_pwfile_dest_host }}"
  register: _dg_live_standby_pwfile_path
  changed_when: false

- name: Read live primary password file after observer account update
  ansible.builtin.slurp:
    src: "{{ _dg_live_primary_pwfile_path.stdout | trim }}"
  delegate_to: "{{ _dg_pwfile_source_host }}"
  register: _dg_primary_pwfile_contents
  no_log: true

- name: Synchronize primary password file to the standby
  ansible.builtin.copy:
    dest: "{{ _dg_live_standby_pwfile_path.stdout | trim }}"
    content: "{{ _dg_primary_pwfile_contents.content | b64decode }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0640"
  delegate_to: "{{ _dg_pwfile_dest_host }}"
  register: _dg_standby_pwfile_sync
  no_log: true

- name: Validate observer SYSDG account can inspect broker
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "{{ oracle_dataguard_observer_user }}/{{ oracle_dataguard_observer_password }}@{{ _dg_live_primary_unique }}_dgb" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_observer_user_broker
  changed_when: false
  retries: 12
  delay: 10
  until: >-
    _dg_observer_user_broker.rc == 0 and
    'Configuration -' in (_dg_observer_user_broker.stdout | default('')) and
    (
      'ORA-' not in (_dg_observer_user_broker.stdout | default('')) or
      (
        (
          'ORA-16819' in (_dg_observer_user_broker.stdout | default('')) or
          'ORA-16820' in (_dg_observer_user_broker.stdout | default(''))
        ) and
        ((_dg_observer_user_broker.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is not search('ORA-'))
      )
    ) and
    (
      'Error:' not in (_dg_observer_user_broker.stdout | default('')) or
      ((_dg_observer_user_broker.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is not search('ORA-'))
    )
  failed_when: >-
    _dg_observer_user_broker.rc != 0 or
    'Configuration -' not in (_dg_observer_user_broker.stdout | default('')) or
    (
      'ORA-' in (_dg_observer_user_broker.stdout | default('')) and
      (
        (
          'ORA-16819' not in (_dg_observer_user_broker.stdout | default('')) and
          'ORA-16820' not in (_dg_observer_user_broker.stdout | default(''))
        ) or
        ((_dg_observer_user_broker.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is search('ORA-'))
      )
    ) or
    (
      'Error:' in (_dg_observer_user_broker.stdout | default('')) and
      ((_dg_observer_user_broker.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is search('ORA-'))
    )
  no_log: true

- name: Configure broker synchronous transport
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_primary_unique }}_dgb" <<'DGMGRL'
    EDIT DATABASE '{{ _dg_primary_unique_name }}' SET PROPERTY LogXptMode='SYNC';
    EDIT DATABASE '{{ _dg_standby_unique_name }}' SET PROPERTY LogXptMode='SYNC';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_transport
  changed_when: false
  failed_when: >-
    _dg_broker_transport.rc != 0 or
    'Error:' in (_dg_broker_transport.stdout | default('')) or
    'ORA-' in (_dg_broker_transport.stdout | default(''))
  no_log: true

- name: Read FSFO state before protection mode reconcile
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_primary_unique }}_dgb" <<'DGMGRL'
    SHOW FAST_START FAILOVER;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_fsfo_state_for_protection
  changed_when: false
  failed_when: >-
    _dg_fsfo_state_for_protection.rc != 0 or
    'Fast-Start Failover:' not in (_dg_fsfo_state_for_protection.stdout | default('')) or
    (
      'Fast-Start Failover: Enabled' in (_dg_fsfo_state_for_protection.stdout | default('')) and
      'Protection Mode:    MaxAvailability' not in (_dg_fsfo_state_for_protection.stdout | default(''))
    ) or
    'Error:' in (_dg_fsfo_state_for_protection.stdout | default(''))
  no_log: true

- name: Configure broker protection mode before FSFO is enabled
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_primary_unique }}_dgb" <<'DGMGRL'
    EDIT CONFIGURATION SET PROTECTION MODE AS MAXAVAILABILITY;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_protection
  changed_when: false
  failed_when: >-
    _dg_broker_protection.rc != 0 or
    'Error:' in (_dg_broker_protection.stdout | default('')) or
    'ORA-' in (_dg_broker_protection.stdout | default(''))
  no_log: true
  when: "'Fast-Start Failover: Enabled' not in (_dg_fsfo_state_for_protection.stdout | default(''))"

- name: Read standby open mode before read-only apply correction
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_standby_unique }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_open_mode_before
  changed_when: false
  failed_when: >-
    _dg_standby_open_mode_before.rc != 0 or
    'PHYSICAL STANDBY|' not in (_dg_standby_open_mode_before.stdout | default('')) or
    'ORA-' in (_dg_standby_open_mode_before.stdout | default('')) or
    'SP2-' in (_dg_standby_open_mode_before.stdout | default(''))
  no_log: true

- name: Stop standby apply through broker before opening read-only
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_primary_unique }}_dgb" <<'DGMGRL'
    EDIT DATABASE '{{ _dg_live_standby_unique }}' SET STATE='APPLY-OFF';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_apply_off
  changed_when: true
  failed_when: >-
    _dg_broker_apply_off.rc != 0 or
    'Error:' in (_dg_broker_apply_off.stdout | default('')) or
    'ORA-' in (_dg_broker_apply_off.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_standby_open_mode_before.stdout | default(''))"

- name: Open physical standby read-only with apply
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_standby_unique }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    DECLARE
      v_open_mode v$database.open_mode%TYPE;
    BEGIN
      SELECT open_mode INTO v_open_mode FROM v$database;
      IF v_open_mode != 'READ ONLY WITH APPLY' THEN
        BEGIN
          EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE CANCEL';
        EXCEPTION
          WHEN OTHERS THEN NULL;
        END;
        IF v_open_mode = 'MOUNTED' THEN
          EXECUTE IMMEDIATE 'ALTER DATABASE OPEN';
        END IF;
        EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT FROM SESSION';
        DBMS_OUTPUT.PUT_LINE('CHANGED');
      ELSE
        DBMS_OUTPUT.PUT_LINE('OK');
      END IF;
    END;
    /
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_read_only_apply
  changed_when: "'CHANGED' in (_dg_standby_read_only_apply.stdout | default(''))"
  failed_when: >-
    _dg_standby_read_only_apply.rc != 0 or
    'ORA-' in (_dg_standby_read_only_apply.stdout | default('')) or
    'SP2-' in (_dg_standby_read_only_apply.stdout | default('')) or
    'PLS-' in (_dg_standby_read_only_apply.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_standby_open_mode_before.stdout | default(''))"

- name: Enable standby apply through broker
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_primary_unique }}_dgb" <<'DGMGRL'
    EDIT DATABASE '{{ _dg_live_standby_unique }}' SET STATE='APPLY-ON';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_apply_on
  changed_when: false
  failed_when: >-
    _dg_broker_apply_on.rc != 0 or
    'Error:' in (_dg_broker_apply_on.stdout | default('')) or
    'ORA-' in (_dg_broker_apply_on.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_standby_open_mode_before.stdout | default(''))"

- name: Read standby Restart start policy after broker convergence
  ansible.builtin.command:
    argv:
      - "{{ _dg_home_path }}/bin/srvctl"
      - config
      - database
      - -db
      - "{{ _dg_live_standby_unique }}"
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ _dg_live_standby_host }}"
  register: _dg_standby_restart_config
  changed_when: false
  failed_when: false

- name: Read standby Restart database resource profile after broker convergence
  ansible.builtin.shell: |
    set -o pipefail
    "{{ _dg_gi_home_path }}/bin/crsctl" \
      status resource ora.{{ _dg_live_standby_unique }}.db -p 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ _dg_live_standby_host }}"
  register: _dg_standby_restart_resource
  changed_when: false
  failed_when: false

- name: Resolve standby Restart policy probe results
  ansible.builtin.set_fact:
    _dg_standby_restart_srvctl_usable: >-
      {{
        _dg_standby_restart_config.rc == 0 and
        'PRCR-' not in (_dg_standby_restart_config.stdout | default('')) and
        'PRCD-' not in (_dg_standby_restart_config.stdout | default(''))
      }}
    _dg_standby_restart_resource_exists: >-
      {{
        _dg_standby_restart_resource.rc == 0 and
        ('NAME=ora.' ~ _dg_live_standby_unique ~ '.db') in
        (_dg_standby_restart_resource.stdout | default(''))
      }}
    _dg_standby_restart_resource_contract_ok: >-
      {{
        _dg_standby_restart_resource.rc == 0 and
        'ROLE=PHYSICAL_STANDBY' in (_dg_standby_restart_resource.stdout | default('')) and
        'MANAGEMENT_POLICY=AUTOMATIC' in (_dg_standby_restart_resource.stdout | default('')) and
        'USR_ORA_OPEN_MODE=read only' in (_dg_standby_restart_resource.stdout | default('')) and
        'USR_ORA_STOP_MODE=immediate' in (_dg_standby_restart_resource.stdout | default('')) and
        'ENABLED=1' in (_dg_standby_restart_resource.stdout | default(''))
      }}

- name: Fail when standby Restart policy cannot be reconciled safely
  ansible.builtin.fail:
    msg: >-
      Standby Restart resource ora.{{ _dg_live_standby_unique }}.db cannot be
      inspected through srvctl and its read-only CRS profile does not match
      the PHYSICAL_STANDBY/AUTOMATIC/read-only contract. Refusing to mutate an
      ora.* resource with crsctl; restore supported srvctl/CSS access.
  when:
    - _dg_standby_restart_resource_exists | bool
    - not (_dg_standby_restart_srvctl_usable | bool)
    - not (_dg_standby_restart_resource_contract_ok | bool)

- name: Configure standby Restart start policy for read-only apply
  ansible.builtin.command:
    argv:
      - "{{ _dg_home_path }}/bin/srvctl"
      - modify
      - database
      - -db
      - "{{ _dg_live_standby_unique }}"
      - -startoption
      - "{{ _dg_live_standby_startoption }}"
      - -stopoption
      - IMMEDIATE
      - -role
      - PHYSICAL_STANDBY
      - -policy
      - AUTOMATIC
  become: true
  become_user: "{{ oracle_user }}"
  delegate_to: "{{ _dg_live_standby_host }}"
  changed_when: true
  when: >-
    _dg_standby_restart_srvctl_usable | bool and
    (
      ('start options: ' ~ _dg_live_standby_startoption | lower) not in (_dg_standby_restart_config.stdout | default('') | lower) or
      'stop options: immediate' not in (_dg_standby_restart_config.stdout | default('') | lower) or
      'database role: physical_standby' not in (_dg_standby_restart_config.stdout | default('') | lower) or
      'management policy: automatic' not in (_dg_standby_restart_config.stdout | default('') | lower)
    )

- name: Validate Data Guard broker and standby open mode
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    broker="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_primary_unique }}_dgb" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
    )"
    standby="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_standby_unique }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
    EXIT;
    SQL
    )"
    primary="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_live_primary_unique }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
    EXIT;
    SQL
    )"
    output="$(printf '%s\n%s\n%s\n' "$broker" "$standby" "$primary")"
    printf '%s\n' "$output"
    case "$output" in
      *ORA-*)
        printf '%s\n' "$output" | sed 's/ORA-16819//g; s/ORA-16820//g' | grep -F 'ORA-' >/dev/null && exit 1
        ;;
    esac
    if ! printf '%s\n' "$output" | grep -F 'SUCCESS' >/dev/null; then
      printf '%s\n' "$output" | grep -E 'ORA-16819|ORA-16820' >/dev/null || exit 1
    fi
    printf '%s\n' "$output" | grep -F 'MAXIMUM AVAILABILITY' >/dev/null || exit 1
    printf '%s\n' "$output" | grep -F 'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' >/dev/null || exit 1
    printf '%s\n' "$output" | grep -F 'PRIMARY|READ WRITE|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' >/dev/null || exit 1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_validate
  changed_when: false
  retries: 12
  delay: 10
  until: _dg_broker_validate.rc == 0
  failed_when: _dg_broker_validate.rc != 0
  no_log: true
