---
# tasks/configure-broker.yml - broker config, Maximum Availability, read-only apply.
# `inst` is one element of oracle_instances, after host overrides.

- name: Resolve current ORACLE_HOME for Data Guard broker
  ansible.builtin.set_fact:
    _dg_home_path: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}
    _dg_primary_unique_name: "{{ inst.db_unique_name | default(dg_primary.db_unique_name | default(inst.name)) }}"
    _dg_standby_unique_name: "{{ inst.dg_standby_db_unique_name | default(dg_standby.db_unique_name | default(inst.name ~ '_sby')) }}"

- name: Read Data Guard broker configuration
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_show_before
  changed_when: false
  failed_when: >-
    _dg_broker_show_before.rc != 0 or
    (
      'ORA-16532' not in (_dg_broker_show_before.stdout | default('')) and
      'Configuration -' not in (_dg_broker_show_before.stdout | default(''))
    )
  no_log: true

- name: Create Data Guard broker configuration
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    CREATE CONFIGURATION '{{ dg_broker_config }}' AS
      PRIMARY DATABASE IS '{{ _dg_primary_unique_name }}'
      CONNECT IDENTIFIER IS {{ _dg_primary_unique_name }}_dgb;
    ADD DATABASE '{{ _dg_standby_unique_name }}'
      AS CONNECT IDENTIFIER IS {{ _dg_standby_unique_name }}_dgb
      MAINTAINED AS PHYSICAL;
    ENABLE CONFIGURATION;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_create
  changed_when: true
  failed_when: >-
    _dg_broker_create.rc != 0 or
    'Error:' in (_dg_broker_create.stdout | default('')) or
    'ORA-' in (_dg_broker_create.stdout | default(''))
  no_log: true
  when: "'ORA-16532' in (_dg_broker_show_before.stdout | default(''))"

- name: Wait for standby broker member to be available
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    SHOW DATABASE '{{ _dg_standby_unique_name }}';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_standby_ready
  changed_when: false
  retries: 12
  delay: 10
  until: >-
    _dg_broker_standby_ready.rc == 0 and
    'Database Status:' in (_dg_broker_standby_ready.stdout | default('')) and
    (
      'SUCCESS' in (_dg_broker_standby_ready.stdout | default('')) or
      'ORA-16819' in (_dg_broker_standby_ready.stdout | default('')) or
      'ORA-16820' in (_dg_broker_standby_ready.stdout | default(''))
    ) and
    (
      'ORA-' not in (_dg_broker_standby_ready.stdout | default('')) or
      (
        (
          'ORA-16819' in (_dg_broker_standby_ready.stdout | default('')) or
          'ORA-16820' in (_dg_broker_standby_ready.stdout | default(''))
        ) and
        ((_dg_broker_standby_ready.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is not search('ORA-'))
      )
    ) and
    (
      'Error:' not in (_dg_broker_standby_ready.stdout | default('')) or
      ((_dg_broker_standby_ready.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is not search('ORA-'))
    )
  failed_when: >-
    _dg_broker_standby_ready.rc != 0 or
    'Database Status:' not in (_dg_broker_standby_ready.stdout | default('')) or
    (
      'SUCCESS' not in (_dg_broker_standby_ready.stdout | default('')) and
      'ORA-16819' not in (_dg_broker_standby_ready.stdout | default('')) and
      'ORA-16820' not in (_dg_broker_standby_ready.stdout | default(''))
    ) or
    (
      'ORA-' in (_dg_broker_standby_ready.stdout | default('')) and
      (
        (
          'ORA-16819' not in (_dg_broker_standby_ready.stdout | default('')) and
          'ORA-16820' not in (_dg_broker_standby_ready.stdout | default(''))
        ) or
        ((_dg_broker_standby_ready.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is search('ORA-'))
      )
    ) or
    (
      'Error:' in (_dg_broker_standby_ready.stdout | default('')) and
      ((_dg_broker_standby_ready.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is search('ORA-'))
    )
  no_log: true

- name: Ensure observer SYSDG account exists on the primary
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET SERVEROUTPUT ON
    DECLARE
      v_count PLS_INTEGER;
      v_user  VARCHAR2(128) := UPPER('{{ oracle_dataguard_observer_user }}');
    BEGIN
      SELECT COUNT(*) INTO v_count FROM dba_users WHERE username = v_user;
      IF v_count = 0 THEN
        EXECUTE IMMEDIATE 'CREATE USER ' || v_user ||
          ' IDENTIFIED BY "{{ oracle_dataguard_observer_password }}" ACCOUNT UNLOCK';
        DBMS_OUTPUT.PUT_LINE('CREATED');
      ELSE
        EXECUTE IMMEDIATE 'ALTER USER ' || v_user ||
          ' IDENTIFIED BY "{{ oracle_dataguard_observer_password }}" ACCOUNT UNLOCK';
        DBMS_OUTPUT.PUT_LINE('UPDATED');
      END IF;
      EXECUTE IMMEDIATE 'GRANT CREATE SESSION TO ' || v_user;
      EXECUTE IMMEDIATE 'GRANT SYSDG TO ' || v_user;
    END;
    /
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_observer_user
  changed_when: "'CREATED' in (_dg_observer_user.stdout | default(''))"
  failed_when: >-
    _dg_observer_user.rc != 0 or
    'ORA-' in (_dg_observer_user.stdout | default('')) or
    'SP2-' in (_dg_observer_user.stdout | default('')) or
    'PLS-' in (_dg_observer_user.stdout | default(''))
  no_log: true

- name: Validate observer SYSDG account can inspect broker
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "{{ oracle_dataguard_observer_user }}/{{ oracle_dataguard_observer_password }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_observer_user_broker
  changed_when: false
  retries: 12
  delay: 10
  until: >-
    _dg_observer_user_broker.rc == 0 and
    'Configuration -' in (_dg_observer_user_broker.stdout | default('')) and
    (
      'ORA-' not in (_dg_observer_user_broker.stdout | default('')) or
      (
        (
          'ORA-16819' in (_dg_observer_user_broker.stdout | default('')) or
          'ORA-16820' in (_dg_observer_user_broker.stdout | default(''))
        ) and
        ((_dg_observer_user_broker.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is not search('ORA-'))
      )
    ) and
    (
      'Error:' not in (_dg_observer_user_broker.stdout | default('')) or
      ((_dg_observer_user_broker.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is not search('ORA-'))
    )
  failed_when: >-
    _dg_observer_user_broker.rc != 0 or
    'Configuration -' not in (_dg_observer_user_broker.stdout | default('')) or
    (
      'ORA-' in (_dg_observer_user_broker.stdout | default('')) and
      (
        (
          'ORA-16819' not in (_dg_observer_user_broker.stdout | default('')) and
          'ORA-16820' not in (_dg_observer_user_broker.stdout | default(''))
        ) or
        ((_dg_observer_user_broker.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is search('ORA-'))
      )
    ) or
    (
      'Error:' in (_dg_observer_user_broker.stdout | default('')) and
      ((_dg_observer_user_broker.stdout | default('')).replace('ORA-16819', '').replace('ORA-16820', '') is search('ORA-'))
    )
  no_log: true

- name: Configure broker synchronous transport
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    EDIT DATABASE '{{ _dg_primary_unique_name }}' SET PROPERTY LogXptMode='SYNC';
    EDIT DATABASE '{{ _dg_standby_unique_name }}' SET PROPERTY LogXptMode='SYNC';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_transport
  changed_when: false
  failed_when: >-
    _dg_broker_transport.rc != 0 or
    'Error:' in (_dg_broker_transport.stdout | default('')) or
    'ORA-' in (_dg_broker_transport.stdout | default(''))
  no_log: true

- name: Read FSFO state before protection mode reconcile
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    SHOW FAST_START FAILOVER;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_fsfo_state_for_protection
  changed_when: false
  failed_when: >-
    _dg_fsfo_state_for_protection.rc != 0 or
    'Fast-Start Failover:' not in (_dg_fsfo_state_for_protection.stdout | default('')) or
    (
      'Fast-Start Failover: Enabled' in (_dg_fsfo_state_for_protection.stdout | default('')) and
      'Protection Mode:    MaxAvailability' not in (_dg_fsfo_state_for_protection.stdout | default(''))
    ) or
    'Error:' in (_dg_fsfo_state_for_protection.stdout | default(''))
  no_log: true

- name: Configure broker protection mode before FSFO is enabled
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    EDIT CONFIGURATION SET PROTECTION MODE AS MAXAVAILABILITY;
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_protection
  changed_when: false
  failed_when: >-
    _dg_broker_protection.rc != 0 or
    'Error:' in (_dg_broker_protection.stdout | default('')) or
    'ORA-' in (_dg_broker_protection.stdout | default(''))
  no_log: true
  when: "'Fast-Start Failover: Enabled' not in (_dg_fsfo_state_for_protection.stdout | default(''))"

- name: Read standby open mode before read-only apply correction
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_standby_unique_name }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_open_mode_before
  changed_when: false
  failed_when: >-
    _dg_standby_open_mode_before.rc != 0 or
    'PHYSICAL STANDBY|' not in (_dg_standby_open_mode_before.stdout | default('')) or
    'ORA-' in (_dg_standby_open_mode_before.stdout | default('')) or
    'SP2-' in (_dg_standby_open_mode_before.stdout | default(''))
  no_log: true

- name: Stop standby apply through broker before opening read-only
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    EDIT DATABASE '{{ _dg_standby_unique_name }}' SET STATE='APPLY-OFF';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_apply_off
  changed_when: true
  failed_when: >-
    _dg_broker_apply_off.rc != 0 or
    'Error:' in (_dg_broker_apply_off.stdout | default('')) or
    'ORA-' in (_dg_broker_apply_off.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_standby_open_mode_before.stdout | default(''))"

- name: Open physical standby read-only with apply
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_standby_unique_name }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    DECLARE
      v_open_mode v$database.open_mode%TYPE;
    BEGIN
      SELECT open_mode INTO v_open_mode FROM v$database;
      IF v_open_mode != 'READ ONLY WITH APPLY' THEN
        BEGIN
          EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE CANCEL';
        EXCEPTION
          WHEN OTHERS THEN NULL;
        END;
        IF v_open_mode = 'MOUNTED' THEN
          EXECUTE IMMEDIATE 'ALTER DATABASE OPEN';
        END IF;
        EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT FROM SESSION';
        DBMS_OUTPUT.PUT_LINE('CHANGED');
      ELSE
        DBMS_OUTPUT.PUT_LINE('OK');
      END IF;
    END;
    /
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_standby_read_only_apply
  changed_when: "'CHANGED' in (_dg_standby_read_only_apply.stdout | default(''))"
  failed_when: >-
    _dg_standby_read_only_apply.rc != 0 or
    'ORA-' in (_dg_standby_read_only_apply.stdout | default('')) or
    'SP2-' in (_dg_standby_read_only_apply.stdout | default('')) or
    'PLS-' in (_dg_standby_read_only_apply.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_standby_open_mode_before.stdout | default(''))"

- name: Enable standby apply through broker
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    "$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    EDIT DATABASE '{{ _dg_standby_unique_name }}' SET STATE='APPLY-ON';
    EXIT;
    DGMGRL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_apply_on
  changed_when: false
  failed_when: >-
    _dg_broker_apply_on.rc != 0 or
    'Error:' in (_dg_broker_apply_on.stdout | default('')) or
    'ORA-' in (_dg_broker_apply_on.stdout | default(''))
  no_log: true
  when: "'READ ONLY WITH APPLY' not in (_dg_standby_open_mode_before.stdout | default(''))"

- name: Validate Data Guard broker and standby open mode
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _dg_home_path }}
    export ORACLE_SID={{ inst.name }}
    broker="$("$ORACLE_HOME/bin/dgmgrl" -silent "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_primary_unique_name }}_dgb" <<'DGMGRL'
    SHOW CONFIGURATION;
    EXIT;
    DGMGRL
    )"
    standby="$("$ORACLE_HOME/bin/sqlplus" -L -S "sys/{{ oracle_lab_sys_password | default('SysPassword1_') }}@{{ _dg_standby_unique_name }}_dgb as sysdba" <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
    EXIT;
    SQL
    )"
    primary="$("$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode || '|' || protection_mode || '|' || protection_level FROM v$database;
    EXIT;
    SQL
    )"
    output="$(printf '%s\n%s\n%s\n' "$broker" "$standby" "$primary")"
    printf '%s\n' "$output"
    case "$output" in
      *ORA-*)
        printf '%s\n' "$output" | sed 's/ORA-16819//g; s/ORA-16820//g' | grep -F 'ORA-' >/dev/null && exit 1
        ;;
    esac
    if ! printf '%s\n' "$output" | grep -F 'SUCCESS' >/dev/null; then
      printf '%s\n' "$output" | grep -E 'ORA-16819|ORA-16820' >/dev/null || exit 1
    fi
    printf '%s\n' "$output" | grep -F 'MAXIMUM AVAILABILITY' >/dev/null || exit 1
    printf '%s\n' "$output" | grep -F 'PHYSICAL STANDBY|READ ONLY WITH APPLY|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' >/dev/null || exit 1
    printf '%s\n' "$output" | grep -F 'PRIMARY|READ WRITE|MAXIMUM AVAILABILITY|MAXIMUM AVAILABILITY' >/dev/null || exit 1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dg_broker_validate
  changed_when: false
  retries: 12
  delay: 10
  until: _dg_broker_validate.rc == 0
  failed_when: _dg_broker_validate.rc != 0
  no_log: true
