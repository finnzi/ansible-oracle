---
# defaults/main.yml for oracle_dataguard
#
# SCOPE: the role has explicit gates for each implemented Data Guard action.
# The remaining contract is:
#   - Physical standby creation (RMAN DUPLICATE FROM ACTIVE DATABASE or
#     backup-based duplicate).
#   - Broker configuration (DGMGRL CREATE CONFIGURATION).
#   - Broker protection mode set to MAXIMUM AVAILABILITY.
#   - Standby kept in OPEN READ ONLY WITH APPLY (the explicit project
#     requirement — NOT mounted).
#   - Manual switchover (DGMGRL SWITCHOVER TO <standby>).
#   - Automatic failover wiring (delegated to oracle_observer for FSFO).
#
# INTERFACE (consumed by playbooks/05-dataguard.yml):
#   dg_enabled:       bool    — gate the whole role on the instance
#   dg_role:          primary|standby
#   dg_primary:       { host, port, service, db_unique_name }
#   dg_standby:       { host, port, service, db_unique_name }
#   dg_broker_config: <name>  — DGMGRL configuration name
#   protection mode: always MAXIMUM AVAILABILITY
#   dg_action:        configure|switchover|failover|reconcile

oracle_user: oracle
oracle_group: oinstall
oracle_instances: []

# Role-wide gate (off in the standalone slice).
dg_enabled: false

dg_action: reconcile
dg_broker_config: dg_super

# SQL*Net connect identifiers the broker uses. Must resolve via tnsnames.ora
# written by oracle_network on each node.
dg_primary:
  host: superdc1.domain.is
  port: 1521
  service: super_dgb
  db_unique_name: super
dg_standby:
  host: superdc2.domain.is
  port: 1521
  service: super_sby_dgb
  db_unique_name: super_sby

# Whether to actually run the (unimplemented) DG actions.
oracle_dataguard_enabled: false

# Incremental preparation that is safe before the standby exists. This enables
# primary-side prerequisites needed by RMAN duplicate and broker setup without
# creating or switching a standby.
oracle_dataguard_prepare_primary: false

# Prepare the standby host as an RMAN auxiliary: pfile, password file, oratab,
# and NOMOUNT instance reachable through the static _DGMGRL listener service.
oracle_dataguard_prepare_standby: false

# Create the physical standby from the primary with RMAN active duplicate. This
# is idempotent: it skips once the standby reports database_role=PHYSICAL STANDBY.
oracle_dataguard_duplicate_standby: false

# Configure Data Guard broker, enable the configuration, set Maximum
# Availability, and keep the standby open READ ONLY WITH APPLY.
oracle_dataguard_configure_broker: false

# Dedicated broker observer account used by oracle_observer for FSFO.
oracle_dataguard_observer_user: "{{ observer_sysdg_user | default('dgmonitor') }}"
oracle_dataguard_observer_password: "{{ oracle_lab_dg_password | default('DgPassword1_') }}"

# Run a broker switchover to oracle_dataguard_switchover_target. Set the target
# to oracle_dataguard_auto_switchover_target to choose the selected instance's
# configured standby unique name automatically. Set
# oracle_dataguard_switchover_instance when using auto in multi-instance
# inventories. This is deliberately opt-in so ordinary convergence does not
# change roles.
oracle_dataguard_run_switchover: false
oracle_dataguard_switchover_target: ""
oracle_dataguard_auto_switchover_target: auto
oracle_dataguard_switchover_instance: ""
