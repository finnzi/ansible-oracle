---
# tasks/main.yml for oracle_network
#
# Per-instance listener configuration. We bind each instance's listener to its
# dedicated VIP hostname (superdb.domain.is for standalone; superdc1/dc2 for
# DG) and configure a STATIC SID_LIST entry. The research confirmed that
# dynamic service registration can come back "blocked" in constrained labs, so
# we add the static entry for reliability.
#
# The listener is started with lsnrctl here for the very first boot; once
# Oracle Restart takes ownership (oracle_restart_manage), it owns reloads.

- name: Resolve current ORACLE_HOME and listener VIP per instance
  ansible.builtin.set_fact:
    _net_instances: >-
      {%- set out = [] -%}
      {%- set dg_mode = oracle_network_dataguard_enabled | default(false) | bool -%}
      {%- set require_dg = false if dg_mode else true -%}
      {%- for raw_inst in ((oracle_instances | default([])) | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), require_dg)) -%}
        {%- set inst = raw_inst -%}
        {%- set include_inst = (inst.dataguard | default(false) | bool) if dg_mode else ('standby' not in group_names or (inst.dataguard | default(false) | bool)) -%}
        {%- if include_inst -%}
          {%- set current_home = (inst.db_homes | selectattr('current','equalto',true) | list | first) | default(inst.db_homes[0]) -%}
          {%- set listener_name = (inst.listener_vip | default(inst.name ~ (('dc2' if 'standby' in group_names else 'dc1') if (inst.dataguard | default(false) | bool) else 'db') ~ '.' ~ (lab_domain | default('domain.is')))) -%}
          {%- set vip = namespace(ip='') -%}
          {%- for entry in (oracle_lab_listener_vips | default([])) -%}
            {%- if listener_name in (entry.names | default('') | string).split() -%}
              {%- set vip.ip = entry.ip -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set _ = out.append(inst | combine({
            '_home': current_home.suffix,
            '_net': listener_name,
            '_vip': vip.ip,
            '_port': (inst.listener_port | default(1521))})) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Remove stale lab host aliases from guest /etc/hosts
  ansible.builtin.shell: |
    set -o pipefail
    tmp="$(mktemp)"
    aliases="{{ oracle_lab_guest_hosts | map(attribute='names') | join(' ') }}"
    awk -v b="# BEGIN ANSIBLE-ORACLE lab guest hosts" \
        -v e="# END ANSIBLE-ORACLE lab guest hosts" \
        -v aliases="$aliases" '
      BEGIN {
        split(aliases, alias_list, /[[:space:]]+/)
        for (i in alias_list) {
          if (alias_list[i] != "") {
            stale[alias_list[i]] = 1
          }
        }
      }
      $0==b {ind=1; print; next}
      $0==e {ind=0; print; next}
      ind {print; next}
      {
        for (i = 2; i <= NF; i++) {
          if ($i in stale) {
            next
          }
        }
      }
      {print}
    ' /etc/hosts > "$tmp"
    if ! cmp -s "$tmp" /etc/hosts; then
      cat "$tmp" > /etc/hosts
      echo CHANGED
    fi
    rm -f "$tmp"
  args: { executable: /bin/bash }
  register: _guest_hosts_scrub
  changed_when: "'CHANGED' in (_guest_hosts_scrub.stdout | default(''))"
  when: oracle_lab_guest_hosts | length > 0

- name: Ensure guest /etc/hosts has the lab host aliases
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE-ORACLE lab guest hosts"
    block: |
      {% for entry in oracle_lab_guest_hosts %}
      {% if oracle_lab_host_map_mode in (entry.modes | default([oracle_lab_host_map_mode])) %}
      {{ entry.ip }} {{ entry.names }}
      {% endif %}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: oracle_lab_guest_hosts | length > 0
  register: _guest_hosts

- name: Assign dedicated listener VIPs to the guest interface
  ansible.builtin.shell: |
    set -o pipefail
    iface="{{ oracle_network_listener_interface | default('') }}"
    if [ -z "$iface" ]; then
      iface="$(ip -o route show default | awk '{print $5; exit}')"
    fi
    if ip -4 addr show dev "$iface" | grep -Eq '(^|[[:space:]]){{ inst._vip }}/'; then
      runtime_present=1
    else
      runtime_present=0
    fi

    persistent_changed=0
    persist="{{ '1' if (oracle_network_persist_listener_vips | bool) else '0' }}"
    if [ "$persist" -eq 1 ]; then
      if ! command -v nmcli >/dev/null 2>&1; then
        echo "nmcli is required to persist listener VIP {{ inst._vip }}" >&2
        exit 1
      fi
      conn="$(nmcli -g GENERAL.CONNECTION device show "$iface" | awk 'NF {print; exit}')"
      if [ -z "$conn" ] || [ "$conn" = "--" ]; then
        echo "No NetworkManager connection found for listener interface $iface" >&2
        exit 1
      fi
      if ! nmcli -g ipv4.addresses connection show "$conn" | tr ',' '\n' | awk '{$1=$1};1' | grep -Fxq "{{ inst._vip }}/{{ oracle_network_listener_vip_prefix }}"; then
        nmcli connection modify "$conn" +ipv4.addresses "{{ inst._vip }}/{{ oracle_network_listener_vip_prefix }}"
        persistent_changed=1
      fi
    fi

    if [ "$runtime_present" -eq 0 ]; then
      ip addr add "{{ inst._vip }}/{{ oracle_network_listener_vip_prefix }}" dev "$iface"
      echo CHANGED
    elif [ "$persistent_changed" -eq 1 ]; then
      echo CHANGED
    fi
  args: { executable: /bin/bash }
  loop: "{{ _net_instances | selectattr('_vip', 'defined') | selectattr('_vip') | list }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}:{{ inst._vip }}" }
  register: _listener_vip_assign
  changed_when: "'CHANGED' in (_listener_vip_assign.stdout | default(''))"

- name: Ensure ORACLE_HOME/network/admin exists per instance
  ansible.builtin.file:
    path: "{{ inst.oracle_base }}/{{ inst._home }}/network/admin"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0775"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }

- name: Write listener.ora (static SID_LIST, bound to instance VIP)
  ansible.builtin.template:
    src: listener.ora.j2
    dest: "{{ inst.oracle_base }}/{{ inst._home }}/network/admin/listener.ora"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }
  register: _listener_ora

- name: Write sqlnet.ora defaults
  ansible.builtin.copy:
    dest: "{{ inst.oracle_base }}/{{ inst._home }}/network/admin/sqlnet.ora"
    content: |
      # Managed by ansible-oracle / oracle_network
      NAMES.DIRECTORY_PATH= (TNSNAMES, EZCONNECT)
      SQLNET.INBOUND_CONNECT_TIMEOUT = 60
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }

- name: Write tnsnames.ora with the client-facing service entry
  ansible.builtin.template:
    src: tnsnames.ora.j2
    dest: "{{ inst.oracle_base }}/{{ inst._home }}/network/admin/tnsnames.ora"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }

- name: Probe firewalld state
  ansible.builtin.command: firewall-cmd --state
  register: _firewalld_state
  changed_when: false
  failed_when: false
  when: oracle_network_open_firewall | bool

- name: Open listener port in firewalld
  ansible.builtin.shell: |
    set -o pipefail
    changed=0
    if ! firewall-cmd --query-port={{ inst._port }}/tcp >/dev/null; then
      firewall-cmd --add-port={{ inst._port }}/tcp
      changed=1
    fi
    if ! firewall-cmd --permanent --query-port={{ inst._port }}/tcp >/dev/null; then
      firewall-cmd --permanent --add-port={{ inst._port }}/tcp
      changed=1
    fi
    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    fi
  args: { executable: /bin/bash }
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}:{{ inst._port }}" }
  register: _firewalld_listener_port
  changed_when: "'CHANGED' in (_firewalld_listener_port.stdout | default(''))"
  when:
    - oracle_network_open_firewall | bool
    - (_firewalld_state.rc | default(1)) == 0

# ── Bring the listener up idempotently ────────────────────────────────
# Check status; if down, start it; if up and .ora changed, reload.
- name: Check listener status (LISTENER_<INSTANCE>)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ inst.oracle_base }}/{{ inst._home }}
    "$ORACLE_HOME/bin/lsnrctl" status LISTENER_{{ inst.name | upper }} 2>&1 || true
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }
  register: _lsnr_status
  changed_when: false

- name: Start listener where it is down
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.inst.oracle_base }}/{{ item.inst._home }}
    "$ORACLE_HOME/bin/lsnrctl" start LISTENER_{{ item.inst.name | upper }} 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  loop: >-
    {%- set down = [] -%}
    {%- for r in (_lsnr_status.results | default([])) -%}
      {%- if r.inst is defined and ('TNS-' in (r.stdout | default('')) or 'no listener' in (r.stdout | default('') | lower) or (r.rc | default(0)) != 0) -%}
        {%- set _ = down.append({'inst': r.inst}) -%}
      {%- endif -%}
    {%- endfor -%}
    {{ down }}
  loop_control: { label: "{{ item.inst.name }}" }
  register: _lsnr_start
  changed_when: true
  failed_when: >-
    _lsnr_start.rc != 0 and
    'TNS-01106' not in (_lsnr_start.stdout | default('')) and
    'TNS-' in (_lsnr_start.stdout | default(''))

- name: Restart listener where bind inputs changed
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.inst.oracle_base }}/{{ item.inst._home }}
    "$ORACLE_HOME/bin/lsnrctl" stop LISTENER_{{ item.inst.name | upper }} 2>&1 || true
    "$ORACLE_HOME/bin/lsnrctl" start LISTENER_{{ item.inst.name | upper }} 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  loop: >-
    {%- set restart = [] -%}
    {%- for r in (_lsnr_status.results | default([])) -%}
      {%- set listener_changed = namespace(value=false) -%}
      {%- for t in (_listener_ora.results | default([])) -%}
        {%- if t.inst is defined and r.inst is defined and t.inst.name == r.inst.name and (t.changed | default(false)) -%}
          {%- set listener_changed.value = true -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if r.inst is defined and (r.rc | default(1)) == 0 and 'TNS-' not in (r.stdout | default('')) and 'no listener' not in (r.stdout | default('') | lower) and ((_guest_hosts.changed | default(false)) or (_listener_vip_assign.changed | default(false)) or listener_changed.value) -%}
        {%- set _ = restart.append({'inst': r.inst}) -%}
      {%- endif -%}
    {%- endfor -%}
    {{ restart }}
  loop_control: { label: "{{ item.inst.name }}" }
  register: _lsnr_restart
  changed_when: true
  failed_when: >-
    _lsnr_restart.rc != 0 or 'TNS-' in (_lsnr_restart.stdout | default(''))

- name: Reload listener where it is up and .ora changed
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.inst.oracle_base }}/{{ item.inst._home }}
    "$ORACLE_HOME/bin/lsnrctl" reload LISTENER_{{ item.inst.name | upper }} 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  loop: >-
    {%- set reload = [] -%}
    {%- for r in (_lsnr_status.results | default([])) -%}
      {%- if r.inst is defined and (r.rc | default(1)) == 0 and 'TNS-' not in (r.stdout | default('')) and 'no listener' not in (r.stdout | default('') | lower) -%}
        {%- set _ = reload.append({'inst': r.inst}) -%}
      {%- endif -%}
    {%- endfor -%}
    {{ reload }}
  loop_control: { label: "{{ item.inst.name }}" }
  register: _lsnr_reload
  changed_when: false
  failed_when: false
