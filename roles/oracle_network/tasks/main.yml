---
# tasks/main.yml for oracle_network
#
# Per-instance listener configuration. We bind each instance's listener to its
# dedicated VIP hostname (superdb.domain.is for standalone; superdc1/dc2 for
# DG) and configure a STATIC SID_LIST entry. The research confirmed that
# dynamic service registration can come back "blocked" in constrained labs, so
# we add the static entry for reliability.
#
# The listener is started with lsnrctl here for the very first boot; once
# Oracle Restart takes ownership (oracle_restart_manage), it owns reloads.

- name: Fail when network home selection is invalid
  ansible.builtin.fail:
    msg: >-
      oracle_network_home_selection={{ oracle_network_home_selection }} is
      invalid. Supported values are current and selected.
  when: oracle_network_home_selection | default('current') not in ['current', 'selected']

# Resolve which VIPs this host must keep even when the role is invoked with a
# filtered oracle_network_instances list (dual-home prepare for standalones).
# Cleanup must not strip Data Guard superdc* VIPs just because super was
# filtered out of this run — that breaks redo transport / FSFO probes.
- name: Resolve host-retained listener VIPs from full inventory
  ansible.builtin.set_fact:
    _net_retain_vips: >-
      {%- set out = [] -%}
      {%- set require_dg = false -%}
      {%- for raw_inst in ((oracle_instances | default([])) | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), require_dg)) -%}
        {%- set include_inst = ('standby' not in group_names or (raw_inst.dataguard | default(false) | bool)) -%}
        {%- if include_inst -%}
          {%- set listener_name = (raw_inst.listener_vip | default(raw_inst.name ~ (('dc2' if 'standby' in group_names else 'dc1') if (raw_inst.dataguard | default(false) | bool) else 'db') ~ '.' ~ (lab_domain | default('domain.is')))) -%}
          {%- for entry in (oracle_lab_listener_vips | default([])) -%}
            {%- if listener_name in (entry.names | default('') | string).split() and (entry.ip | default('') | length > 0) -%}
              {%- if entry.ip not in out -%}
                {%- set _ = out.append(entry.ip) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for entry in (oracle_lab_listener_vips | default([])) -%}
        {%- set names = (entry.names | default('') | string) -%}
        {%- if (entry.ip | default('') | length > 0) and (entry.ip not in out) -%}
          {%- if ('standby' in group_names and 'dc2' in names) or ('primary' in group_names and 'dc1' in names) -%}
            {%- set _ = out.append(entry.ip) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Resolve ORACLE_HOME and listener VIP per instance/home
  ansible.builtin.set_fact:
    _net_instances: >-
      {%- set out = [] -%}
      {%- set dg_mode = oracle_network_dataguard_enabled | default(false) | bool -%}
      {%- set require_dg = false if dg_mode else true -%}
      {%- set selection = oracle_network_home_selection | default('current') -%}
      {%- set selected_suffixes = oracle_network_home_suffixes | default([]) -%}
      {%- set raw_instances = (
            oracle_network_instances
            if (oracle_network_instances | default([]) | length > 0)
            else (oracle_instances | default([]))
          ) -%}
      {%- for raw_inst in (raw_instances | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), require_dg)) -%}
        {%- set inst = raw_inst -%}
        {# Primary hosts may mix standalone and Data Guard databases. Standby
           hosts only need listeners for the Data Guard instances they host. #}
        {%- set include_inst = ('standby' not in group_names or (inst.dataguard | default(false) | bool)) -%}
        {%- if include_inst -%}
          {%- set homes = [] -%}
          {%- if selection == 'selected' -%}
            {%- for home in inst.db_homes | default([]) -%}
              {%- if home.suffix in selected_suffixes -%}
                {%- set _ = homes.append(home) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- else -%}
            {%- set current_home = (inst.db_homes | selectattr('current','equalto',true) | list | first) | default(inst.db_homes[0]) -%}
            {%- set _ = homes.append(current_home) -%}
          {%- endif -%}
          {%- set listener_name = (inst.listener_vip | default(inst.name ~ (('dc2' if 'standby' in group_names else 'dc1') if (inst.dataguard | default(false) | bool) else 'db') ~ '.' ~ (lab_domain | default('domain.is')))) -%}
          {%- set vip = namespace(ip='') -%}
          {%- for entry in (oracle_lab_listener_vips | default([])) -%}
            {%- if listener_name in (entry.names | default('') | string).split() -%}
              {%- set vip.ip = entry.ip -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set current_home = (inst.db_homes | selectattr('current','equalto',true) | list | first) | default(inst.db_homes[0]) -%}
          {%- for home in homes -%}
            {%- set _ = out.append(inst | combine({
              '_home': home.suffix,
              '_home_path': inst.oracle_base ~ '/' ~ home.suffix,
              '_home_is_current': (home.suffix == current_home.suffix),
              '_net': listener_name,
              '_vip': vip.ip,
              '_port': (inst.listener_port | default(1521))})) -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Resolve runtime listener Oracle home from Restart
  ansible.builtin.shell: |
    set -o pipefail
    gi={{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}
    listener="LISTENER_{{ inst.name | upper }}"
    fallback={{ inst._home_path | default(inst.oracle_base ~ '/' ~ inst._home) | quote }}
    home=""
    if [ -x "${gi}/bin/srvctl" ]; then
      home="$("${gi}/bin/srvctl" config listener -listener "${listener}" 2>/dev/null |
        awk -F': ' '$1 == "Home" || $1 == "Oracle home" {
          gsub(/^[ \t]+|[ \t]+$/, "", $2)
          print $2
          exit
        }')"
    fi
    if [ -n "${home}" ] && [ -x "${home}/bin/lsnrctl" ]; then
      printf '%s\n' "${home}"
    else
      printf '%s\n' "${fallback}"
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _net_runtime_homes
  changed_when: false
  failed_when: (_net_runtime_homes.stdout | default('') | trim | length) == 0
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }
  when: oracle_network_home_selection | default('current') == 'current'

- name: Apply Restart listener homes to the network instance list
  ansible.builtin.set_fact:
    _net_instances: >-
      {%- set out = [] -%}
      {%- for r in _net_runtime_homes.results | default([]) -%}
        {%- if r.skipped | default(false) -%}
          {%- set _ = out.append(r.inst) -%}
        {%- else -%}
          {%- set home_path = r.stdout | default('') | trim -%}
          {%- set suffix = home_path.rsplit('/', 1)[1] if (home_path | length > 0) else r.inst._home -%}
          {%- set _ = out.append(r.inst | combine({
            '_home': suffix,
            '_home_path': home_path,
            '_home_is_current': true
          })) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out if out | length > 0 else _net_instances }}
  when:
    - oracle_network_home_selection | default('current') == 'current'
    - (_net_runtime_homes.results | default([]) | length) > 0

- name: Remove unmanaged lab listener VIPs from the guest interface
  ansible.builtin.shell: |
    set -o pipefail
    iface="{{ oracle_network_listener_interface | default('') }}"
    if [ -z "$iface" ]; then
      iface="$(ip -o route show default | awk '{print $5; exit}')"
    fi

    # Retain VIPs for every inventory instance on this host (not only the
    # filtered oracle_network_instances subset for this run). Union with the
    # current work list so assign targets are never cleaned mid-play.
    desired=" {{ (
      (_net_retain_vips | default([]))
      + (_net_instances | default([]) | selectattr('_vip', 'defined') | map(attribute='_vip') | reject('equalto', '') | list)
    ) | unique | join(' ') }} "
    managed="{{ oracle_lab_listener_vips | default([]) | map(attribute='ip') | unique | join(' ') }}"
    prefix="{{ oracle_network_listener_vip_prefix }}"
    persist="{{ '1' if (oracle_network_persist_listener_vips | bool) else '0' }}"
    changed=0

    conn=""
    if [ "$persist" -eq 1 ] && [ -n "$managed" ]; then
      if ! command -v nmcli >/dev/null 2>&1; then
        echo "nmcli is required to remove stale listener VIPs" >&2
        exit 1
      fi
      conn="$(nmcli -g GENERAL.CONNECTION device show "$iface" | awk 'NF {print; exit}')"
      if [ -z "$conn" ] || [ "$conn" = "--" ]; then
        echo "No NetworkManager connection found for listener interface $iface" >&2
        exit 1
      fi
    fi

    for ip in $managed; do
      case "$desired" in
        *" $ip "*) continue ;;
      esac

      if ip -4 addr show dev "$iface" | grep -Eq '(^|[[:space:]])'"$ip"'/'; then
        ip addr del "$ip/$prefix" dev "$iface"
        changed=1
      fi

      if [ "$persist" -eq 1 ]; then
        if nmcli -g ipv4.addresses connection show "$conn" |
             tr ',' '\n' | awk '{$1=$1};1' | grep -Fxq "$ip/$prefix"; then
          nmcli connection modify "$conn" -ipv4.addresses "$ip/$prefix"
          changed=1
        fi
      fi
    done

    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    fi
  args: { executable: /bin/bash }
  register: _listener_vip_cleanup
  changed_when: "'CHANGED' in (_listener_vip_cleanup.stdout | default(''))"
  when:
    - oracle_lab_listener_vips | length > 0
    # Filtered runs (oracle_network_instances set) must never strip VIPs for
    # instances not in this work list. Extra-var oracle_instances may also omit
    # them (e2e standalone dual-home vars), so skip cleanup entirely then.
    - (oracle_network_instances | default([])) | length == 0

- name: Assign dedicated listener VIPs to the guest interface
  ansible.builtin.shell: |
    set -o pipefail
    iface="{{ oracle_network_listener_interface | default('') }}"
    if [ -z "$iface" ]; then
      iface="$(ip -o route show default | awk '{print $5; exit}')"
    fi
    if ip -4 addr show dev "$iface" | grep -Eq '(^|[[:space:]]){{ inst._vip }}/'; then
      runtime_present=1
    else
      runtime_present=0
    fi

    persistent_changed=0
    persist="{{ '1' if (oracle_network_persist_listener_vips | bool) else '0' }}"
    if [ "$persist" -eq 1 ]; then
      if ! command -v nmcli >/dev/null 2>&1; then
        echo "nmcli is required to persist listener VIP {{ inst._vip }}" >&2
        exit 1
      fi
      conn="$(nmcli -g GENERAL.CONNECTION device show "$iface" | awk 'NF {print; exit}')"
      if [ -z "$conn" ] || [ "$conn" = "--" ]; then
        echo "No NetworkManager connection found for listener interface $iface" >&2
        exit 1
      fi
      if ! nmcli -g ipv4.addresses connection show "$conn" | tr ',' '\n' | awk '{$1=$1};1' | grep -Fxq "{{ inst._vip }}/{{ oracle_network_listener_vip_prefix }}"; then
        nmcli connection modify "$conn" +ipv4.addresses "{{ inst._vip }}/{{ oracle_network_listener_vip_prefix }}"
        persistent_changed=1
      fi
    fi

    if [ "$runtime_present" -eq 0 ]; then
      ip addr add "{{ inst._vip }}/{{ oracle_network_listener_vip_prefix }}" dev "$iface"
      echo CHANGED
    elif [ "$persistent_changed" -eq 1 ]; then
      echo CHANGED
    fi
  args: { executable: /bin/bash }
  loop: "{{ _net_instances | selectattr('_vip', 'defined') | selectattr('_vip') | list }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}:{{ inst._vip }}" }
  register: _listener_vip_assign
  changed_when: "'CHANGED' in (_listener_vip_assign.stdout | default(''))"

- name: Ensure ORACLE_HOME/network/admin exists per instance
  ansible.builtin.file:
    path: "{{ inst._home_path | default(inst.oracle_base ~ '/' ~ inst._home) }}/network/admin"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0775"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }

- name: Write listener.ora (static SID_LIST, bound to instance VIP)
  ansible.builtin.template:
    src: listener.ora.j2
    dest: "{{ inst._home_path | default(inst.oracle_base ~ '/' ~ inst._home) }}/network/admin/listener.ora"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }
  register: _listener_ora

- name: Write sqlnet.ora defaults
  ansible.builtin.copy:
    dest: "{{ inst._home_path | default(inst.oracle_base ~ '/' ~ inst._home) }}/network/admin/sqlnet.ora"
    content: |
      # Managed by ansible-oracle / oracle_network
      NAMES.DIRECTORY_PATH= (TNSNAMES, EZCONNECT)
      SQLNET.INBOUND_CONNECT_TIMEOUT = 60
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }

- name: Write tnsnames.ora with the client-facing service entry
  ansible.builtin.template:
    src: tnsnames.ora.j2
    dest: "{{ inst._home_path | default(inst.oracle_base ~ '/' ~ inst._home) }}/network/admin/tnsnames.ora"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }

- name: Probe firewalld state
  ansible.builtin.command: firewall-cmd --state
  register: _firewalld_state
  changed_when: false
  failed_when: false
  when: oracle_network_open_firewall | bool

- name: Open listener port in firewalld
  ansible.builtin.shell: |
    set -o pipefail
    changed=0
    if ! firewall-cmd --query-port={{ inst._port }}/tcp >/dev/null; then
      firewall-cmd --add-port={{ inst._port }}/tcp
      changed=1
    fi
    if ! firewall-cmd --permanent --query-port={{ inst._port }}/tcp >/dev/null; then
      firewall-cmd --permanent --add-port={{ inst._port }}/tcp
      changed=1
    fi
    if [ "$changed" -eq 1 ]; then
      echo CHANGED
    fi
  args: { executable: /bin/bash }
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}:{{ inst._port }}" }
  register: _firewalld_listener_port
  changed_when: "'CHANGED' in (_firewalld_listener_port.stdout | default(''))"
  when:
    - oracle_network_open_firewall | bool
    - (_firewalld_state.rc | default(1)) == 0

# ── Bring the listener up idempotently ────────────────────────────────
# Check status; if down, start it; if up and .ora changed, reload.
# Never control a listener from a non-current (unused dual-home) path, and
# never bounce every listener because an aggregate host-map/VIP flag changed.
- name: Check listener status (LISTENER_<INSTANCE>)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ inst._home_path | default(inst.oracle_base ~ '/' ~ inst._home) }}
    "$ORACLE_HOME/bin/lsnrctl" status LISTENER_{{ inst.name | upper }} 2>&1 || true
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  loop: "{{ _net_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }
  register: _lsnr_status
  changed_when: false
  when:
    - oracle_network_manage_listener | default(true) | bool
    - inst._home_is_current | default(true) | bool

- name: Start listener where it is down
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.inst._home_path | default(item.inst.oracle_base ~ '/' ~ item.inst._home) }}
    "$ORACLE_HOME/bin/lsnrctl" start LISTENER_{{ item.inst.name | upper }} 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  loop: >-
    {%- set down = [] -%}
    {%- for r in (_lsnr_status.results | default([])) -%}
      {%- if r.skipped | default(false) -%}
      {%- elif r.inst is defined and (r.inst._home_is_current | default(true) | bool) and ('TNS-' in (r.stdout | default('')) or 'no listener' in (r.stdout | default('') | lower) or (r.rc | default(0)) != 0) -%}
        {%- set _ = down.append({'inst': r.inst}) -%}
      {%- endif -%}
    {%- endfor -%}
    {{ down }}
  loop_control: { label: "{{ item.inst.name }}" }
  register: _lsnr_start
  changed_when: true
  failed_when: >-
    _lsnr_start.rc != 0 and
    'TNS-01106' not in (_lsnr_start.stdout | default(''))
  when:
    - oracle_network_manage_listener | default(true) | bool

- name: Restart listener where bind inputs changed
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.inst._home_path | default(item.inst.oracle_base ~ '/' ~ item.inst._home) }}
    "$ORACLE_HOME/bin/lsnrctl" stop LISTENER_{{ item.inst.name | upper }} 2>&1 || true
    "$ORACLE_HOME/bin/lsnrctl" start LISTENER_{{ item.inst.name | upper }} 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  loop: >-
    {%- set restart = [] -%}
    {%- for r in (_lsnr_status.results | default([])) -%}
      {%- if r.skipped | default(false) or not (r.inst is defined) or not (r.inst._home_is_current | default(true) | bool) -%}
      {%- else -%}
        {%- set listener_changed = namespace(value=false) -%}
        {%- set vip_changed = namespace(value=false) -%}
        {%- for t in (_listener_ora.results | default([])) -%}
          {%- if t.inst is defined and t.inst.name == r.inst.name and t.inst._home | default('') == r.inst._home | default('') and (t.changed | default(false)) -%}
            {%- set listener_changed.value = true -%}
          {%- endif -%}
        {%- endfor -%}
        {%- for v in (_listener_vip_assign.results | default([])) -%}
          {%- if v.inst is defined and v.inst.name == r.inst.name and (v.changed | default(false)) -%}
            {%- set vip_changed.value = true -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if (r.rc | default(1)) == 0 and 'TNS-' not in (r.stdout | default('')) and 'no listener' not in (r.stdout | default('') | lower) and (listener_changed.value or vip_changed.value) -%}
          {%- set _ = restart.append({'inst': r.inst}) -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {{ restart }}
  loop_control: { label: "{{ item.inst.name }}" }
  register: _lsnr_restart
  changed_when: true
  failed_when: >-
    _lsnr_restart.rc != 0 or 'TNS-' in (_lsnr_restart.stdout | default(''))
  when:
    - oracle_network_manage_listener | default(true) | bool

- name: Reload listener where it is up and .ora changed
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.inst._home_path | default(item.inst.oracle_base ~ '/' ~ item.inst._home) }}
    "$ORACLE_HOME/bin/lsnrctl" reload LISTENER_{{ item.inst.name | upper }} 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  loop: >-
    {%- set reload = [] -%}
    {%- for r in (_lsnr_status.results | default([])) -%}
      {%- if r.skipped | default(false) -%}
      {%- elif r.inst is defined and (r.inst._home_is_current | default(true) | bool) and (r.rc | default(1)) == 0 and 'TNS-' not in (r.stdout | default('')) and 'no listener' not in (r.stdout | default('') | lower) -%}
        {%- set _ = reload.append({'inst': r.inst}) -%}
      {%- endif -%}
    {%- endfor -%}
    {{ reload }}
  loop_control: { label: "{{ item.inst.name }}" }
  register: _lsnr_reload
  changed_when: false
  failed_when: false
  when:
    - oracle_network_manage_listener | default(true) | bool
