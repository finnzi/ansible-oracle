---
# defaults/main.yml for oracle_network
#
# Bind the listener to a dedicated IP/hostname per instance. The hostname is
# already in /etc/hosts (lab/scripts/update-hosts.sh) and on the host too, so
# clients resolve the VIP without a dedicated DNS.

oracle_user: oracle
oracle_group: oinstall
oracle_instances: []
# Optional role-scoped instance list. Prefer this over oracle_instances when
# non-empty so callers can pass a filtered list via include_role vars even when
# inventory/extra-vars still define the full oracle_instances.
oracle_network_instances: []

oracle_lab_guest_hosts: []
oracle_lab_host_map_mode: standalone
oracle_lab_listener_vips: []
oracle_network_dataguard_enabled: false
# Explicit interface used for listener VIP assignment.  Do not infer this
# from the default route: database, backup, and management networks are often
# separate (and production hosts may use bonds/VLANs).
oracle_network_interface: ""
# Backwards-compatible alias.  New inventories should use
# oracle_network_interface.
oracle_network_listener_interface: ""
oracle_network_persist_listener_vips: true
oracle_network_listener_vip_prefix: 24
oracle_network_open_firewall: false

# Which DB homes receive network/admin files:
#   current  - homes marked current:true (default runtime path)
#   selected - only suffixes listed in oracle_network_home_suffixes
# Dual-home upgrade prepare writes the target (unused) home so cutover never
# depends on a manual TNS_ADMIN / tnsnames copy.
oracle_network_home_selection: current
oracle_network_home_suffixes: []

# When false, write listener/tnsnames/sqlnet into the selected homes but do
# not start, stop, or reload any live listener. Dual-home prepare uses this
# so a newly rendered unused-home listener.ora cannot bounce the runtime
# listener from the target home.
oracle_network_manage_listener: true

# Default listener shape; overridden per-instance in inventory.
listener_name_template: "LISTENER_{% raw %}{{ inst.name | upper }}{% endraw %}"
listener_port: 1521
listener_admin_port: 1521   # same as data port in the lab; separate in real envs
