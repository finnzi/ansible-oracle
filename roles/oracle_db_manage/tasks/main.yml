---
# tasks/main.yml for oracle_db_manage
#
# Two-phase: (1) DBCA create if absent, idempotent via /etc/oratab entry;
# (2) reconcile runtime parameters with oracle_session/sqlplus.

- name: Per-instance DBCA + reconcile loop
  ansible.builtin.include_tasks: manage-instance.yml
  loop: "{{ (oracle_instances | default([])) | oracle_apply_instance_overrides(oracle_instance_overrides | default({})) }}"
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  when: "'standby' not in group_names"
