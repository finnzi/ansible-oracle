---
# tasks/manage-instance.yml — create one instance via DBCA + reconcile params.
# `inst` is in scope (one element of oracle_instances).

- name: Resolve current ORACLE_HOME for this instance
  ansible.builtin.set_fact:
    _home_inventory_path: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}
    _dbca_stage: "{{ inst.oracle_base }}/.stage_{{ inst.name }}"
    _dbca_response_file: "{{ inst.oracle_base }}/.stage_{{ inst.name }}/dbca.rsp"
    _listener_host: "{{ inst.listener_ip | default('') | trim }}"
    _listener_port: "{{ inst.listener_port | default(1521) }}"
    # These facts are host-scoped, so reset them before every include_tasks
    # iteration instead of inheriting the previous instance's SQL state.
    _db_reachable: false
    _dbfacts_fields: []
    _db_reconcile_writable: false

- name: Require a literal listener IP for LOCAL_LISTENER
  ansible.builtin.assert:
    that:
      - (_listener_host | default('') | length) > 0
      - _listener_host is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
    fail_msg: >-
      {{ inst.name }} needs listener_ip. LOCAL_LISTENER must point at the
      database's dedicated literal VIP, not a hostname/default route.

- name: Resolve runtime ORACLE_HOME from Restart for instance manage
  ansible.builtin.include_role:
    name: oracle_common
    tasks_from: resolve-runtime-home.yml
  vars:
    oracle_runtime_home_restart_db: "{{ inst.db_unique_name | default(inst.name) }}"
    oracle_runtime_home_fallback: "{{ _home_inventory_path }}"

- name: Use Restart-registered ORACLE_HOME for instance manage
  ansible.builtin.set_fact:
    _home_path: "{{ _runtime_home_path }}"

- name: Check if instance already exists (oratab + DB open)
  ansible.builtin.shell: |
    set -o pipefail
    grep -qE '^\s*{{ inst.name }}:' /etc/oratab && echo present || echo absent
  args: { executable: /bin/bash }
  register: _oratab
  changed_when: false

- name: Set _instance_exists fact
  ansible.builtin.set_fact:
    _instance_exists: "{{ _oratab.stdout | trim == 'present' }}"

# ── DBCA create ───────────────────────────────────────────────────────
- name: Create writable DBCA staging area
  ansible.builtin.file:
    path: "{{ _dbca_stage }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0775"
  when: not _instance_exists

- name: Stage DBCA response file
  ansible.builtin.template:
    src: dbca.rsp.j2
    dest: "{{ _dbca_response_file }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0600"
  when: not _instance_exists

- name: Run DBCA -createDatabase (slow — many minutes)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    "$ORACLE_HOME/bin/dbca" -silent -createDatabase \
      -responseFile {{ _dbca_response_file }}
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dbca
  when: not _instance_exists
  changed_when: "'100% complete' in (_dbca.stdout | default(''))"
  failed_when: >-
    _dbca.rc != 0 or (
      '100% complete' not in (_dbca.stdout | default('')) and
      'already exists' not in (_dbca.stdout | default(''))
    )

- name: Read live DB facts locally with sqlplus
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET PAGES 0 FEEDBACK OFF VERIFY OFF HEADING OFF
    SELECT open_mode || '|' || log_mode || '|' || flashback_on || '|' ||
           database_role || '|' || force_logging
      FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dbfacts_sql
  when: _instance_exists or (_dbca is success)
  changed_when: false
  failed_when: false
  retries: 5
  delay: 5
  until:
    - _dbfacts_sql.rc == 0
    - "'|' in (_dbfacts_sql.stdout | default(''))"

- name: Parse live DB facts
  ansible.builtin.set_fact:
    _dbfacts_fields: "{{ (_dbfacts_sql.stdout | trim).split('|') }}"
    _db_reachable: true
  when:
    - _dbfacts_sql is defined
    - _dbfacts_sql.rc == 0
    - "'|' in (_dbfacts_sql.stdout | default(''))"

- name: Record whether this host currently owns the writable primary
  ansible.builtin.set_fact:
    _db_reconcile_writable: >-
      {{ _dbfacts_fields[3] == 'PRIMARY' and _dbfacts_fields[0] == 'READ WRITE' }}
  when: _db_reachable | default(false)

- name: Fail when the database is not ready for reconciliation
  ansible.builtin.fail:
    msg: >-
      {{ inst.name }} is not ready for inventory reconciliation: expected a
      READ WRITE primary or a broker-managed physical standby, got
      {{ (_dbfacts_fields[3] | default('unknown')) }}|
      {{ (_dbfacts_fields[0] | default('unreachable')) }}. Restore the database
      through Oracle Restart before applying inventory changes.
  when: >-
    not (_db_reachable | default(false)) or
    (_dbfacts_fields[3] not in ['PRIMARY', 'PHYSICAL STANDBY']) or
    (_dbfacts_fields[3] == 'PRIMARY' and _dbfacts_fields[0] != 'READ WRITE') or
    (_dbfacts_fields[3] == 'PHYSICAL STANDBY' and
     _dbfacts_fields[0] != 'READ ONLY WITH APPLY')

# ── Reconcile runtime parameters (idempotent) ─────────────────────────
- name: Apply memory / archivelog / flashback / force-logging settings
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    ALTER SYSTEM SET sga_target={{ (inst.memory | default(oracle_default_memory)).sga_target | default(oracle_default_memory.sga_target) }} SCOPE=BOTH SID='*';
    ALTER SYSTEM SET pga_aggregate_target={{ (inst.memory | default(oracle_default_memory)).pga_aggregate_target | default(oracle_default_memory.pga_aggregate_target) }} SCOPE=BOTH SID='*';
    -- Archive log destination: dedicated /a01 path
    ALTER SYSTEM SET log_archive_dest_1='LOCATION={{ inst.dirs.archive }}' SCOPE=BOTH SID='*';
    -- Recovery area (flashback) on the dedicated /f01 path
    ALTER SYSTEM SET db_recovery_file_dest='{{ inst.dirs.flashback }}' SCOPE=BOTH SID='*';
    ALTER SYSTEM SET db_recovery_file_dest_size=10G SCOPE=BOTH SID='*';
    -- Register dynamic services with the per-instance VIP listener.
    ALTER SYSTEM SET local_listener='(ADDRESS=(PROTOCOL=TCP)(HOST={{ _listener_host }})(PORT={{ _listener_port }}))' SCOPE=BOTH SID='*';
    ALTER SYSTEM REGISTER;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _params_sql
  changed_when: false
  failed_when: >-
    _params_sql.rc != 0 or
    'ORA-' in (_params_sql.stdout | default('')) or
    'SP2-' in (_params_sql.stdout | default(''))
  when: _db_reconcile_writable | default(false)

- name: Validate custom database parameters
  ansible.builtin.assert:
    that:
      - param.name is defined
      - param.name is match('^[A-Za-z][A-Za-z0-9_$#]*$')
      - param.value is defined
      - (param.scope | default('BOTH') | upper) in ['MEMORY', 'SPFILE', 'BOTH']
      - (param.sid | default('*') | string) is match('^[A-Za-z0-9_$#*]+$')
    fail_msg: >-
      {{ inst.name }} has an invalid custom database parameter. Each entry
      requires a safe Oracle parameter name, a value, optional scope
      MEMORY/SPFILE/BOTH, and optional SID.
  loop: "{{ inst.parameters | default([]) }}"
  loop_control:
    loop_var: param
    label: "{{ param.name | default('unnamed') }}"
  when: _db_reconcile_writable | default(false)

- name: Apply custom database parameters
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    {% for param in inst.parameters | default([]) %}
    ALTER SYSTEM SET {{ param.name }}={% if param.quote | default(false) %}q'[{{ param.value | string }}]'{% else %}{{ param.value }}{% endif %} SCOPE={{ param.scope | default('BOTH') | upper }} SID='{{ param.sid | default('*') }}';
    {% endfor %}
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _custom_params_sql
  changed_when: false
  failed_when: >-
    _custom_params_sql.rc != 0 or
    'ORA-' in (_custom_params_sql.stdout | default('')) or
    'SP2-' in (_custom_params_sql.stdout | default(''))
  when:
    - _db_reconcile_writable | default(false)
    - (inst.parameters | default([]) | length) > 0

# These require restarts of the right kind; gate on the *current* value so we
# only change them when needed.
- name: Toggle ARCHIVELOG mode (if differs from desired)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    cur="$("$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'C' | awk 'NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT log_mode FROM v$database;
    C
    )"
    want="{{ 'ARCHIVELOG' if (inst.archivelog | default(true)) else 'NOARCHIVELOG' }}"
    if [ "${cur// /}" != "${want}" ]; then
      printf '%s\n' \
        'SHUTDOWN IMMEDIATE;' \
        'STARTUP MOUNT;' \
        {% if inst.archivelog | default(true) -%}
        'ALTER DATABASE ARCHIVELOG;' \
        {% else -%}
        'ALTER DATABASE NOARCHIVELOG;' \
        {% endif -%}
        'ALTER DATABASE OPEN;' \
        'EXIT;' | "$ORACLE_HOME/bin/sqlplus" -S / as sysdba
      echo CHANGED
    else
      echo OK
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _archivelog
  changed_when: "'CHANGED' in (_archivelog.stdout | default(''))"
  failed_when: >-
    _archivelog.rc != 0 or
    'ORA-' in (_archivelog.stdout | default('')) or
    'SP2-' in (_archivelog.stdout | default(''))
  when: _db_reconcile_writable | default(false)

- name: Fail when Data Guard inventory disables flashback
  ansible.builtin.fail:
    msg: >-
      {{ inst.name }} uses Data Guard/FSFO and must keep flashback enabled for
      automatic reinstate. Set flashback=true, or manage this database as a
      non-FSFO standalone instance before disabling flashback.
  when:
    - _db_reconcile_writable | default(false)
    - inst.dataguard | default(false) | bool
    - not (inst.flashback | default(false) | bool)

- name: Toggle FLASHBACK ON/OFF (if differs from desired)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    cur="$("$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'C' | awk 'NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT flashback_on FROM v$database;
    C
    )"
    want="{{ 'YES' if (inst.flashback | default(false)) else 'NO' }}"
    if [ "${cur// /}" != "${want}" ]; then
      printf '%s\n' \
        {% if inst.flashback | default(false) -%}
        'ALTER DATABASE FLASHBACK ON;' \
        {% else -%}
        'ALTER DATABASE FLASHBACK OFF;' \
        {% endif -%}
        'EXIT;' |
        "$ORACLE_HOME/bin/sqlplus" -S / as sysdba
      echo CHANGED
    else
      echo OK
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _flashback
  changed_when: "'CHANGED' in (_flashback.stdout | default(''))"
  failed_when: >-
    _flashback.rc != 0 or
    'ORA-' in (_flashback.stdout | default('')) or
    'SP2-' in (_flashback.stdout | default(''))
  when: _db_reconcile_writable | default(false)

- name: Toggle FORCE LOGGING (if differs from desired)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    cur="$("$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'C' | awk 'NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT force_logging FROM v$database;
    C
    )"
    want="{{ 'YES' if (inst.force_logging | default(true)) else 'NO' }}"
    if [ "${cur// /}" != "${want}" ]; then
      printf '%s\n' \
        {% if inst.force_logging | default(true) -%}
        'ALTER DATABASE FORCE LOGGING;' \
        {% else -%}
        'ALTER DATABASE NO FORCE LOGGING;' \
        {% endif -%}
        'EXIT;' |
        "$ORACLE_HOME/bin/sqlplus" -S / as sysdba
      echo CHANGED
    else
      echo OK
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _forcelog
  changed_when: "'CHANGED' in (_forcelog.stdout | default(''))"
  failed_when: >-
    _forcelog.rc != 0 or
    'ORA-' in (_forcelog.stdout | default('')) or
    'SP2-' in (_forcelog.stdout | default(''))
  when: _db_reconcile_writable | default(false)

- name: Ensure online redo groups have members in the dedicated redo directory
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF SERVEROUTPUT ON
    DECLARE
      v_member VARCHAR2(4000);
      v_count NUMBER;
    BEGIN
      FOR grp IN (SELECT group# FROM v$log ORDER BY group#) LOOP
        v_member := '{{ inst.dirs.redo }}/online_redo_g' || grp.group# || '.log';
        SELECT COUNT(*)
          INTO v_count
          FROM v$logfile
         WHERE group# = grp.group#
           AND member = v_member;

        IF v_count = 0 THEN
          EXECUTE IMMEDIATE
            'ALTER DATABASE ADD LOGFILE MEMBER ''' || v_member ||
            ''' TO GROUP ' || grp.group#;
          DBMS_OUTPUT.PUT_LINE('ADDED ' || v_member);
        ELSE
          DBMS_OUTPUT.PUT_LINE('EXISTS ' || v_member);
        END IF;
      END LOOP;
    END;
    /
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _redo_members
  changed_when: "'ADDED ' in (_redo_members.stdout | default(''))"
  failed_when: >-
    _redo_members.rc != 0 or
    'ORA-' in (_redo_members.stdout | default('')) or
    'SP2-' in (_redo_members.stdout | default('')) or
    'PLS-' in (_redo_members.stdout | default(''))
  when: _db_reconcile_writable | default(false)

- name: Remove online redo members outside the dedicated redo directory
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF SERVEROUTPUT ON
    ALTER SYSTEM SWITCH LOGFILE;
    ALTER SYSTEM CHECKPOINT;
    ALTER SYSTEM SWITCH LOGFILE;
    ALTER SYSTEM CHECKPOINT;
    ALTER SYSTEM SWITCH LOGFILE;
    ALTER SYSTEM CHECKPOINT;
    DECLARE
      v_dedicated_members NUMBER;
      v_group_members NUMBER;
      v_log_status VARCHAR2(16);
    BEGIN
      FOR redo_member IN (
        SELECT group#, member
          FROM v$logfile
         WHERE type = 'ONLINE'
           AND member NOT LIKE '{{ inst.dirs.redo }}/%'
         ORDER BY group#, member
      ) LOOP
        SELECT COUNT(*)
          INTO v_dedicated_members
          FROM v$logfile
         WHERE type = 'ONLINE'
           AND group# = redo_member.group#
           AND member LIKE '{{ inst.dirs.redo }}/%'
           AND NVL(status, 'VALID') != 'INVALID';

        SELECT COUNT(*)
          INTO v_group_members
          FROM v$logfile
         WHERE type = 'ONLINE'
           AND group# = redo_member.group#;

        IF v_dedicated_members = 0 OR v_group_members <= 1 THEN
          RAISE_APPLICATION_ERROR(
            -20001,
            'Refusing to remove non-dedicated redo member before group ' ||
            redo_member.group# || ' has a dedicated replacement');
        END IF;

        FOR attempt IN 1..5 LOOP
          SELECT status
            INTO v_log_status
            FROM v$log
           WHERE group# = redo_member.group#;
          EXIT WHEN v_log_status != 'CURRENT';
          EXECUTE IMMEDIATE 'ALTER SYSTEM SWITCH LOGFILE';
          EXECUTE IMMEDIATE 'ALTER SYSTEM CHECKPOINT';
        END LOOP;

        SELECT status
          INTO v_log_status
          FROM v$log
         WHERE group# = redo_member.group#;
        IF v_log_status = 'CURRENT' THEN
          RAISE_APPLICATION_ERROR(
            -20002,
            'Refusing to remove current redo member from group ' ||
            redo_member.group#);
        END IF;

        EXECUTE IMMEDIATE
          'ALTER DATABASE DROP LOGFILE MEMBER ''' ||
          REPLACE(redo_member.member, '''', '''''') || '''';
        DBMS_OUTPUT.PUT_LINE('DROPPED ' || redo_member.member);
      END LOOP;
    END;
    /
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _redo_member_cleanup
  changed_when: "'DROPPED ' in (_redo_member_cleanup.stdout | default(''))"
  failed_when: >-
    _redo_member_cleanup.rc != 0 or
    'ORA-' in (_redo_member_cleanup.stdout | default('')) or
    'SP2-' in (_redo_member_cleanup.stdout | default('')) or
    'PLS-' in (_redo_member_cleanup.stdout | default(''))
  when: (_db_reconcile_writable | default(false)) and (oracle_db_manage_drop_nondedicated_redo | default(false) | bool)
