---
# tasks/manage-instance.yml — create one instance via DBCA + reconcile params.
# `inst` is in scope (one element of oracle_instances).

- name: Resolve current ORACLE_HOME for this instance
  ansible.builtin.set_fact:
    _home_path: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}
    _dbca_stage: "{{ inst.oracle_base }}/.stage_{{ inst.name }}"
    _dbca_response_file: "{{ inst.oracle_base }}/.stage_{{ inst.name }}/dbca.rsp"

- name: Check if instance already exists (oratab + DB open)
  ansible.builtin.shell: |
    set -o pipefail
    grep -qE '^\s*{{ inst.name }}:' /etc/oratab && echo present || echo absent
  args: { executable: /bin/bash }
  register: _oratab
  changed_when: false

- name: Set _instance_exists fact
  ansible.builtin.set_fact:
    _instance_exists: "{{ _oratab.stdout | trim == 'present' }}"

# ── DBCA create ───────────────────────────────────────────────────────
- name: Create writable DBCA staging area
  ansible.builtin.file:
    path: "{{ _dbca_stage }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0775"
  when: not _instance_exists

- name: Stage DBCA response file
  ansible.builtin.template:
    src: dbca.rsp.j2
    dest: "{{ _dbca_response_file }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  when: not _instance_exists

- name: Run DBCA -createDatabase (slow — many minutes)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    "$ORACLE_HOME/bin/dbca" -silent -createDatabase \
      -responseFile {{ _dbca_response_file }}
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dbca
  when: not _instance_exists
  changed_when: "'100% complete' in (_dbca.stdout | default(''))"
  failed_when: >-
    _dbca.rc != 0 or (
      '100% complete' not in (_dbca.stdout | default('')) and
      'already exists' not in (_dbca.stdout | default(''))
    )

- name: Read live DB facts locally with sqlplus
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET PAGES 0 FEEDBACK OFF VERIFY OFF HEADING OFF
    SELECT open_mode || '|' || log_mode || '|' || flashback_on || '|' ||
           database_role || '|' || force_logging
      FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _dbfacts_sql
  when: _instance_exists or (_dbca is success)
  changed_when: false
  failed_when: false
  retries: 5
  delay: 5
  until:
    - _dbfacts_sql.rc == 0
    - "'|' in (_dbfacts_sql.stdout | default(''))"

- name: Parse live DB facts
  ansible.builtin.set_fact:
    _dbfacts_fields: "{{ (_dbfacts_sql.stdout | trim).split('|') }}"
    _db_reachable: true
  when:
    - _dbfacts_sql is defined
    - _dbfacts_sql.rc == 0
    - "'|' in (_dbfacts_sql.stdout | default(''))"

# ── Reconcile runtime parameters (idempotent) ─────────────────────────
- name: Apply memory / archivelog / flashback / force-logging settings
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    ALTER SYSTEM SET sga_target={{ (inst.memory | default(oracle_default_memory)).sga_target | default(oracle_default_memory.sga_target) }} SCOPE=BOTH SID='*';
    ALTER SYSTEM SET pga_aggregate_target={{ (inst.memory | default(oracle_default_memory)).pga_aggregate_target | default(oracle_default_memory.pga_aggregate_target) }} SCOPE=BOTH SID='*';
    -- Archive log destination: dedicated /a01 path
    ALTER SYSTEM SET log_archive_dest_1='LOCATION={{ inst.dirs.archive }}' SCOPE=BOTH SID='*';
    -- Recovery area (flashback) on the dedicated /f01 path
    ALTER SYSTEM SET db_recovery_file_dest='{{ inst.dirs.flashback }}' SCOPE=BOTH SID='*';
    ALTER SYSTEM SET db_recovery_file_dest_size=10G SCOPE=BOTH SID='*';
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _params_sql
  changed_when: false
  failed_when: >-
    _params_sql.rc != 0 or
    'ORA-' in (_params_sql.stdout | default('')) or
    'SP2-' in (_params_sql.stdout | default(''))
  when: _db_reachable | default(false)

# These require restarts of the right kind; gate on the *current* value so we
# only change them when needed.
- name: Toggle ARCHIVELOG mode (if differs from desired)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    cur="$("$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'C' | awk 'NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT log_mode FROM v$database;
    C
    )"
    want="{{ 'ARCHIVELOG' if (inst.archivelog | default(true)) else 'NOARCHIVELOG' }}"
    if [ "${cur// /}" != "${want}" ]; then
      printf '%s\n' \
        'SHUTDOWN IMMEDIATE;' \
        'STARTUP MOUNT;' \
        {% if inst.archivelog | default(true) -%}
        'ALTER DATABASE ARCHIVELOG;' \
        {% else -%}
        'ALTER DATABASE NOARCHIVELOG;' \
        {% endif -%}
        'ALTER DATABASE OPEN;' \
        'EXIT;' | "$ORACLE_HOME/bin/sqlplus" -S / as sysdba
      echo CHANGED
    else
      echo OK
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _archivelog
  changed_when: "'CHANGED' in (_archivelog.stdout | default(''))"
  failed_when: >-
    _archivelog.rc != 0 or
    'ORA-' in (_archivelog.stdout | default('')) or
    'SP2-' in (_archivelog.stdout | default(''))
  when: _db_reachable | default(false)

- name: Toggle FLASHBACK ON/OFF (if differs from desired)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    cur="$("$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'C' | awk 'NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT flashback_on FROM v$database;
    C
    )"
    want="{{ 'YES' if (inst.flashback | default(false)) else 'NO' }}"
    if [ "${cur// /}" != "${want}" ]; then
      printf '%s\n' 'ALTER DATABASE FLASHBACK ON;' 'EXIT;' |
        "$ORACLE_HOME/bin/sqlplus" -S / as sysdba
      echo CHANGED
    else
      echo OK
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _flashback
  changed_when: "'CHANGED' in (_flashback.stdout | default(''))"
  failed_when: >-
    _flashback.rc != 0 or
    'ORA-' in (_flashback.stdout | default('')) or
    'SP2-' in (_flashback.stdout | default(''))
  when: _db_reachable | default(false) and (inst.flashback | default(false))

- name: Toggle FORCE LOGGING (if differs from desired)
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _home_path }}
    export ORACLE_SID={{ inst.name }}
    cur="$("$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'C' | awk 'NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT force_logging FROM v$database;
    C
    )"
    want="{{ 'YES' if (inst.force_logging | default(true)) else 'NO' }}"
    if [ "${cur// /}" != "${want}" ]; then
      printf '%s\n' 'ALTER DATABASE FORCE LOGGING;' 'EXIT;' |
        "$ORACLE_HOME/bin/sqlplus" -S / as sysdba
      echo CHANGED
    else
      echo OK
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _forcelog
  changed_when: "'CHANGED' in (_forcelog.stdout | default(''))"
  failed_when: >-
    _forcelog.rc != 0 or
    'ORA-' in (_forcelog.stdout | default('')) or
    'SP2-' in (_forcelog.stdout | default(''))
  when: _db_reachable | default(false)
