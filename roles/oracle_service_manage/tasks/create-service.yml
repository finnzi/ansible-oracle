---
# Build the service set for one inventory instance. `services` is the preferred
# interface; `service_name` remains supported for existing inventories.

- name: Set instance service reconciliation facts
  ansible.builtin.set_fact:
    _svc_home_inventory_path: >-
      {{ inst.oracle_base }}/{{ ((inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0])).suffix }}
    _svc_restart_db: "{{ inst.db_unique_name | default(inst.name) }}"
    _svc_definitions: >-
      {{
        inst.services
        | default([
            {
              'name': inst.service_name | default(inst.name ~ '_svc'),
              'role': 'PRIMARY',
              'failover_type': 'SELECT',
              'failover_method': 'BASIC',
              'failover_retries': 30,
              'failover_delay': 1
            }
          ], true)
      }}

- name: Resolve runtime ORACLE_HOME from Restart for service reconcile
  ansible.builtin.include_role:
    name: oracle_common
    tasks_from: resolve-runtime-home.yml
  vars:
    oracle_runtime_home_restart_db: "{{ _svc_restart_db }}"
    oracle_runtime_home_fallback: "{{ _svc_home_inventory_path }}"

- name: Use Restart-registered ORACLE_HOME for service reconcile
  ansible.builtin.set_fact:
    _svc_home_path: "{{ _runtime_home_path }}"

- name: Read local database role before service reconciliation
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _svc_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET PAGES 0 FEEDBACK OFF VERIFY OFF HEADING OFF
    SELECT database_role || '|' || open_mode FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _svc_database_state
  changed_when: false
  failed_when: >-
    (
      _svc_database_state.rc != 0 or
      'ORA-' in (_svc_database_state.stdout | default('')) or
      'SP2-' in (_svc_database_state.stdout | default(''))
    ) and not (
      (
        inst.dg_role | default('') == 'standby'
        or (
          'standby' in group_names
          and inst.dataguard | default(false) | bool
        )
      )
      and 'ORA-01034' in (_svc_database_state.stdout | default(''))
    )

- name: Record whether the local database is available for service reconciliation
  ansible.builtin.set_fact:
    _svc_database_available: >-
      {{
        _svc_database_state.rc == 0 and
        'ORA-' not in (_svc_database_state.stdout | default('')) and
        'SP2-' not in (_svc_database_state.stdout | default(''))
      }}

- name: Report deferred standby service reconciliation
  ansible.builtin.debug:
    msg: >-
      {{ _svc_restart_db }} is not available yet; deferring its Restart services
      until the post-Data Guard reconciliation pass.
  when: not (_svc_database_available | bool)

- name: Reconcile per-instance services
  ansible.builtin.include_tasks: reconcile-service.yml
  loop: "{{ _svc_definitions }}"
  loop_control:
    loop_var: svc
    label: "{{ svc.name }} ({{ svc.role | default('PRIMARY') }})"
  when: _svc_database_available | bool
