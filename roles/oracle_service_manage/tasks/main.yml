---
# tasks/main.yml for oracle_service_manage
#
# Create a dedicated client-facing service per instance (e.g. super_svc) so
# application clients always connect to the current primary without needing
# to know the host. We use dbms_service (always available) so this works on
# standalone hosts even before Restart owns the DB; if Restart is available
# we ALSO register the service via srvctl so Restart restarts it.

- name: Data Guard current-primary service requires Restart ownership
  ansible.builtin.fail:
    msg: >-
      {{ inst.name }} is configured for Data Guard, but Oracle Restart is not
      available. Refusing to create {{ inst.service_name | default(inst.name ~ '_svc') }}
      with DBMS_SERVICE because it would not follow the current primary after
      switchover. Install/register Restart first, then create the role PRIMARY
      service with srvctl/broker ownership.
  loop: >-
    {{
      (oracle_instances | default([]))
      | oracle_apply_instance_overrides(
          oracle_instance_overrides | default({}),
          oracle_service_apply_instance_overrides_require_dataguard | default(true)
        )
    }}
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  when:
    - inst.dataguard | default(false) | bool
    - not (oracle_restart_available | default(false) | bool)

- name: Per-instance service loop
  ansible.builtin.include_tasks: create-service.yml
  loop: >-
    {{
      (oracle_instances | default([]))
      | oracle_apply_instance_overrides(
          oracle_instance_overrides | default({}),
          oracle_service_apply_instance_overrides_require_dataguard | default(true)
        )
    }}
  loop_control:
    loop_var: inst
    label: "{{ inst.name }}"
  when:
    - inst.dataguard | default(false) | bool or 'standby' not in group_names
    - not (inst.dataguard | default(false) | bool) or (oracle_restart_available | default(false) | bool)
