---
# Reconcile one role-based service. Oracle Restart owns Data Guard services so
# broker role transitions can start the matching service automatically.

- name: Validate service definition
  ansible.builtin.assert:
    that:
      - svc.name | default('') | length > 0
      - (svc.role | default('PRIMARY')) in ['PRIMARY', 'PHYSICAL_STANDBY', 'LOGICAL_STANDBY', 'SNAPSHOT_STANDBY']
      - (svc.failover_type | default('NONE')) in ['NONE', 'SESSION', 'SELECT', 'TRANSACTION', 'AUTO']
      - (svc.failover_method | default('NONE')) in ['NONE', 'BASIC']
      - (svc.failover_restore | default('NONE')) in ['NONE', 'LEVEL1']
    fail_msg: "Invalid Oracle service definition for {{ inst.name }}: {{ svc }}"

- name: Set service facts
  ansible.builtin.set_fact:
    _svc_name: "{{ svc.name }}"
    _svc_role: "{{ svc.role | default('PRIMARY') }}"
    _svc_failover_type: "{{ svc.failover_type | default('NONE') }}"
    _svc_failover_method: "{{ svc.failover_method | default('NONE') }}"
    _svc_manage_current_role: >-
      {{
        ((_svc_database_state.stdout | default('') | trim) == 'PRIMARY|READ WRITE' and
         (svc.role | default('PRIMARY')) == 'PRIMARY') or
        ((_svc_database_state.stdout | default('') | trim).startswith('PHYSICAL STANDBY|READ ONLY') and
         (svc.role | default('PRIMARY')) == 'PHYSICAL_STANDBY')
      }}

- name: Create and start standalone client service via DBMS_SERVICE
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _svc_home_path }}
    export ORACLE_SID={{ inst.name }}
    "$ORACLE_HOME/bin/sqlplus" -S / as sysdba <<'SQL'
    SET SERVEROUTPUT ON
    DECLARE
      v_count NUMBER;
    BEGIN
      SELECT COUNT(*) INTO v_count FROM dba_services WHERE name = '{{ _svc_name }}';
      IF v_count = 0 THEN
        DBMS_SERVICE.CREATE_SERVICE(service_name => '{{ _svc_name }}', network_name => '{{ _svc_name }}');
        DBMS_OUTPUT.PUT_LINE('CREATED');
      ELSE
        DBMS_OUTPUT.PUT_LINE('EXISTS');
      END IF;
      BEGIN
        DBMS_SERVICE.START_SERVICE(service_name => '{{ _svc_name }}');
        DBMS_OUTPUT.PUT_LINE('STARTED');
      EXCEPTION
        WHEN OTHERS THEN
          IF SQLCODE = -44305 THEN DBMS_OUTPUT.PUT_LINE('ALREADY_RUNNING'); ELSE RAISE; END IF;
      END;
    END;
    /
    ALTER SYSTEM REGISTER;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _svc_sql
  changed_when: "'CREATED' in (_svc_sql.stdout | default('')) or 'STARTED' in (_svc_sql.stdout | default(''))"
  failed_when: >-
    _svc_sql.rc != 0 or
    'ORA-' in (_svc_sql.stdout | default('')) or
    'SP2-' in (_svc_sql.stdout | default('')) or
    'PLS-' in (_svc_sql.stdout | default(''))
  when:
    - not (oracle_restart_available | bool)
    - _svc_manage_current_role | bool

- name: Inspect Restart service configuration
  ansible.builtin.command:
    argv:
      - "{{ _svc_home_path }}/bin/srvctl"
      - config
      - service
      - -db
      - "{{ _svc_restart_db }}"
      - -service
      - "{{ _svc_name }}"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ _svc_home_path }}"
  register: _srvctl_config_svc
  changed_when: false
  failed_when: false
  when: oracle_restart_available | bool

- name: Read Restart service resource profile
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home }}/bin/crsctl" status resource \
      ora.{{ _svc_restart_db }}.{{ _svc_name }}.svc -p 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _crsctl_service_profile
  changed_when: false
  failed_when: false
  when: oracle_restart_available | bool

- name: Read Restart service resource status
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home }}/bin/crsctl" status resource \
      ora.{{ _svc_restart_db }}.{{ _svc_name }}.svc -t 2>&1
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _crsctl_service_status
  changed_when: false
  failed_when: false
  when: oracle_restart_available | bool

- name: Resolve Restart service command output
  ansible.builtin.set_fact:
    _svc_srvctl_config_output: >-
      {{ (_srvctl_config_svc.stdout | default('')) ~
         (_srvctl_config_svc.stderr | default('')) }}
  when: oracle_restart_available | bool

- name: Resolve Restart service registration probes
  ansible.builtin.set_fact:
    _svc_crs_service_exists: >-
      {{
        _crsctl_service_profile.rc == 0 and
        ('NAME=ora.' ~ _svc_restart_db ~ '.' ~ _svc_name ~ '.svc') in
        (_crsctl_service_profile.stdout | default(''))
      }}
    _svc_srvctl_config_usable: >-
      {{
        (
          _srvctl_config_svc.rc == 0 and
          'PRCR-' not in (_svc_srvctl_config_output | default('')) and
          'PRCD-' not in (_svc_srvctl_config_output | default(''))
        ) or
        (
          'PRCR-1001' in (_svc_srvctl_config_output | default('')) and
          not (_crsctl_service_profile.rc == 0 and
            ('NAME=ora.' ~ _svc_restart_db ~ '.' ~ _svc_name ~ '.svc') in
            (_crsctl_service_profile.stdout | default('')))
        )
      }}
    _svc_restart_service_exists: >-
      {{
        (_crsctl_service_profile.rc == 0 and
          ('NAME=ora.' ~ _svc_restart_db ~ '.' ~ _svc_name ~ '.svc') in
          (_crsctl_service_profile.stdout | default(''))) or
        (_srvctl_config_svc.rc == 0)
      }}
    _svc_crs_service_contract_ok: >-
      {{
        _crsctl_service_profile.rc == 0 and
        ('NAME=ora.' ~ _svc_restart_db ~ '.' ~ _svc_name ~ '.svc') in
          (_crsctl_service_profile.stdout | default('')) and
        ('ROLE=' ~ _svc_role) in (_crsctl_service_profile.stdout | default('')) and
        'MANAGEMENT_POLICY=AUTOMATIC' in (_crsctl_service_profile.stdout | default('')) and
        'ENABLED=1' in (_crsctl_service_profile.stdout | default('')) and
        (
          ('FAILOVER_TYPE=' ~ _svc_failover_type) in (_crsctl_service_profile.stdout | default('')) or
          (
            _svc_failover_type == 'NONE' and
            (_crsctl_service_profile.stdout | default('') |
              regex_search('(?m)^FAILOVER_TYPE=\\s*$')) is not none
          )
        ) and
        (
          ('FAILOVER_METHOD=' ~ _svc_failover_method) in (_crsctl_service_profile.stdout | default('')) or
          (
            _svc_failover_method == 'NONE' and
            (_crsctl_service_profile.stdout | default('') |
              regex_search('(?m)^FAILOVER_METHOD=\\s*$')) is not none
          )
        ) and
        (
          ('FAILOVER_RETRIES=' ~ (svc.failover_retries | default(30) | string)) in
            (_crsctl_service_profile.stdout | default('')) or
          (
            _svc_failover_type == 'NONE' and
            (_crsctl_service_profile.stdout | default('') |
              regex_search('(?m)^FAILOVER_RETRIES=\\s*$')) is not none
          )
        ) and
        (
          ('TAF_FAILOVER_DELAY=' ~ (svc.failover_delay | default(1) | string)) in
            (_crsctl_service_profile.stdout | default('')) or
          (
            _svc_failover_type == 'NONE' and
            (_crsctl_service_profile.stdout | default('') |
              regex_search('(?m)^TAF_FAILOVER_DELAY=\\s*$')) is not none
          )
        ) and
        (
          ('AQ_HA_NOTIFICATION=' ~
            ('1' if (svc.notification | default(true) | bool) else '0')) in
            (_crsctl_service_profile.stdout | default(''))
        ) and
        (
          svc.commit_outcome is not defined or
          ('COMMIT_OUTCOME=' ~ ('1' if (svc.commit_outcome | bool) else '0')) in
            (_crsctl_service_profile.stdout | default(''))
        ) and
        (
          svc.retention is not defined or
          ('RETENTION=' ~ (svc.retention | string)) in
            (_crsctl_service_profile.stdout | default(''))
        ) and
        (
          svc.replay_init_time is not defined or
          ('REPLAY_INITIATION_TIME=' ~ (svc.replay_init_time | string)) in
            (_crsctl_service_profile.stdout | default(''))
        ) and
        (
          svc.failover_restore is not defined or
          ('FAILOVER_RESTORE=' ~ svc.failover_restore) in
            (_crsctl_service_profile.stdout | default(''))
        )
      }}
    _svc_crs_service_online: >-
      {{
        'ONLINE  ONLINE' in (_crsctl_service_status.stdout | default('')) or
        'ONLINE ONLINE' in (_crsctl_service_status.stdout | default(''))
      }}
  when: oracle_restart_available | bool

- name: Fail when an existing Restart service cannot be reconciled safely
  ansible.builtin.fail:
    msg: >-
      Restart service ora.{{ _svc_restart_db }}.{{ _svc_name }}.svc exists,
      but srvctl cannot inspect it and its read-only CRS profile does not match
      the requested {{ _svc_role }}/AUTOMATIC/{{ _svc_failover_type }} service
      contract. Refusing to mutate an ora.* resource with crsctl; restore
      supported srvctl/CSS access.
  when:
    - oracle_restart_available | bool
    - _svc_crs_service_exists | bool
    - not (_svc_srvctl_config_usable | bool)
    - not (_svc_crs_service_contract_ok | bool)

- name: Fail when a Restart service is absent and srvctl is unavailable
  ansible.builtin.fail:
    msg: >-
      Restart service ora.{{ _svc_restart_db }}.{{ _svc_name }}.svc is absent,
      and srvctl cannot inspect or add it. Refusing to create or mutate an
      ora.* resource with crsctl; restore supported srvctl/CSS access.
  when:
    - oracle_restart_available | bool
    - not (_svc_restart_service_exists | bool)
    - not (_svc_srvctl_config_usable | bool)

- name: Add role-based service to Oracle Restart
  ansible.builtin.command:
    argv: >-
      {{
        [
          _svc_home_path ~ '/bin/srvctl', 'add', 'service',
          '-db', _svc_restart_db,
          '-service', _svc_name,
          '-role', _svc_role,
          '-policy', 'AUTOMATIC',
          '-failovertype', _svc_failover_type,
          '-failovermethod', _svc_failover_method,
          '-failoverretry', svc.failover_retries | default(30) | string,
          '-failoverdelay', svc.failover_delay | default(1) | string,
          '-notification', svc.notification | default(true) | ternary('TRUE', 'FALSE')
        ]
        + (['-commit_outcome', svc.commit_outcome | ternary('TRUE', 'FALSE')]
           if svc.commit_outcome is defined else [])
        + (['-retention', svc.retention | string]
           if svc.retention is defined else [])
        + (['-replay_init_time', svc.replay_init_time | string]
           if svc.replay_init_time is defined else [])
        + (['-failover_restore', svc.failover_restore]
           if svc.failover_restore is defined else [])
      }}
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ _svc_home_path }}"
  register: _srvctl_add_svc
  changed_when: true
  when:
    - oracle_restart_available | bool
    - _svc_srvctl_config_usable | bool
    - not (_svc_restart_service_exists | bool)

- name: Reconcile existing Restart service contract
  ansible.builtin.command:
    argv: >-
      {{
        [
          _svc_home_path ~ '/bin/srvctl', 'modify', 'service',
          '-db', _svc_restart_db,
          '-service', _svc_name,
          '-role', _svc_role,
          '-policy', 'AUTOMATIC',
          '-failovertype', _svc_failover_type,
          '-failovermethod', _svc_failover_method,
          '-failoverretry', svc.failover_retries | default(30) | string,
          '-failoverdelay', svc.failover_delay | default(1) | string,
          '-notification', svc.notification | default(true) | ternary('TRUE', 'FALSE')
        ]
        + (['-commit_outcome', svc.commit_outcome | ternary('TRUE', 'FALSE')]
           if svc.commit_outcome is defined else [])
        + (['-retention', svc.retention | string]
           if svc.retention is defined else [])
        + (['-replay_init_time', svc.replay_init_time | string]
           if svc.replay_init_time is defined else [])
        + (['-failover_restore', svc.failover_restore]
           if svc.failover_restore is defined else [])
      }}
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ _svc_home_path }}"
  register: _srvctl_modify_svc
  # srvctl modify is the reconcile write; report changed only when the
  # inspected contract did not already match so idempotent runs stay quiet.
  changed_when: >-
    ('Service role: ' ~ _svc_role) not in (_srvctl_config_svc.stdout | default(''))
    or 'Management policy: AUTOMATIC' not in (_srvctl_config_svc.stdout | default(''))
    or ('Failover type: ' ~ _svc_failover_type) not in (_srvctl_config_svc.stdout | default(''))
    or ('Failover method: ' ~ _svc_failover_method) not in (_srvctl_config_svc.stdout | default(''))
  when:
    - oracle_restart_available | bool
    - _svc_srvctl_config_usable | bool
    - _srvctl_config_svc.rc == 0

- name: Re-inspect Restart service configuration after add or reconcile
  ansible.builtin.command:
    argv:
      - "{{ _svc_home_path }}/bin/srvctl"
      - config
      - service
      - -db
      - "{{ _svc_restart_db }}"
      - -service
      - "{{ _svc_name }}"
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ _svc_home_path }}"
  register: _srvctl_config_after
  changed_when: false
  when:
    - oracle_restart_available | bool
    - _svc_srvctl_config_usable | bool
    - >-
      (
        _srvctl_add_svc is defined
        and not (_srvctl_add_svc.skipped | default(false))
      )
      or
      (
        _srvctl_modify_svc is defined
        and not (_srvctl_modify_svc.skipped | default(false))
      )

- name: Use refreshed Restart service configuration
  ansible.builtin.set_fact:
    _srvctl_config_svc: "{{ _srvctl_config_after }}"
  when:
    - _srvctl_config_after is defined
    - not (_srvctl_config_after.skipped | default(false))

- name: Validate existing Restart service contract
  ansible.builtin.assert:
    that:
      - "('Service role: ' ~ _svc_role) in _srvctl_config_svc.stdout"
      - "('Failover type: ' ~ _svc_failover_type) in _srvctl_config_svc.stdout"
      - "('Failover method: ' ~ _svc_failover_method) in _srvctl_config_svc.stdout"
      - "'Management policy: AUTOMATIC' in _srvctl_config_svc.stdout"
      - >-
        ('AQ HA notifications: ' ~ (svc.notification | default(true) | ternary('true', 'false'))) in _srvctl_config_svc.stdout
        or
        ('Notification: ' ~ (svc.notification | default(true) | ternary('TRUE', 'FALSE'))) in _srvctl_config_svc.stdout
        or
        ('Notification: ' ~ (svc.notification | default(true) | ternary('true', 'false'))) in _srvctl_config_svc.stdout
      - >-
        ('TAF failover retries: ' ~ (svc.failover_retries | default(30) | string)) in _srvctl_config_svc.stdout
        or
        ('Failover retries: ' ~ (svc.failover_retries | default(30) | string)) in _srvctl_config_svc.stdout
      - >-
        ('TAF failover delay: ' ~ (svc.failover_delay | default(1) | string)) in _srvctl_config_svc.stdout
        or
        ('Failover delay: ' ~ (svc.failover_delay | default(1) | string)) in _srvctl_config_svc.stdout
      - >-
        svc.commit_outcome is not defined or
        ('Commit Outcome: ' ~ (svc.commit_outcome | ternary('true', 'false'))) in _srvctl_config_svc.stdout
      - >-
        svc.retention is not defined or
        ('Retention: ' ~ (svc.retention | string)) in _srvctl_config_svc.stdout
      - >-
        svc.replay_init_time is not defined or
        ('Replay Initiation Time: ' ~ (svc.replay_init_time | string)) in _srvctl_config_svc.stdout
      - >-
        svc.failover_restore is not defined or
        ('Failover restore: ' ~ svc.failover_restore) in _srvctl_config_svc.stdout
    fail_msg: >-
      Existing service {{ _svc_name }} on {{ _svc_restart_db }} does not match
      the requested Restart service contract after srvctl modify service.
  when:
    - oracle_restart_available | bool
    - (_srvctl_config_svc.rc | default(1)) == 0

- name: Validate matching Restart service contract through CRS profile
  ansible.builtin.assert:
    that:
      - _svc_crs_service_contract_ok | bool
    fail_msg: >-
      Restart service ora.{{ _svc_restart_db }}.{{ _svc_name }}.svc could not
      be validated through srvctl or a matching read-only CRS profile. Refusing
      to mutate an ora.* resource with crsctl; restore supported srvctl/CSS
      access.
  when:
    - oracle_restart_available | bool
    - not (_svc_srvctl_config_usable | bool)

- name: Accept matching Restart service state without SRVCTL mutation
  ansible.builtin.debug:
    msg: >-
      Restart service ora.{{ _svc_restart_db }}.{{ _svc_name }}.svc already
      matches its CRS contract; CSS is unavailable, so enable/start is a
      read-only no-op.
  when:
    - oracle_restart_available | bool
    - not (_svc_srvctl_config_usable | bool)
    - _svc_crs_service_contract_ok | bool
    - >-
      not (_svc_manage_current_role | bool) or
      (_svc_crs_service_online | bool)

- name: Fail when a matching current-role service is not online
  ansible.builtin.fail:
    msg: >-
      Restart service ora.{{ _svc_restart_db }}.{{ _svc_name }}.svc matches
      its CRS profile, but is not online for the current database role and
      srvctl is unavailable. Refusing to start or mutate an ora.* resource via
      crsctl; restore supported srvctl/CSS access.
  when:
    - oracle_restart_available | bool
    - not (_svc_srvctl_config_usable | bool)
    - _svc_crs_service_contract_ok | bool
    - _svc_manage_current_role | bool
    - not (_svc_crs_service_online | bool)

- name: Check standby-role service priming marker
  ansible.builtin.stat:
    path: "{{ oracle_service_prime_marker_dir }}/{{ _svc_restart_db }}-{{ _svc_name }}"
  register: _svc_prime_marker
  when:
    - oracle_restart_available | bool
    - _svc_srvctl_config_usable | bool
    - oracle_service_prime_standby_role_services | bool
    - _svc_role == 'PHYSICAL_STANDBY'
    - (_svc_database_state.stdout | default('') | trim) == 'PRIMARY|READ WRITE'

- name: Prime standby-role service for broker role transitions
  when:
    - oracle_restart_available | bool
    - _svc_srvctl_config_usable | bool
    - oracle_service_prime_standby_role_services | bool
    - _svc_role == 'PHYSICAL_STANDBY'
    - (_svc_database_state.stdout | default('') | trim) == 'PRIMARY|READ WRITE'
    - not (_svc_prime_marker.stat.exists | default(false))
  block:
    - name: Ensure service priming marker directory exists
      ansible.builtin.file:
        path: "{{ oracle_service_prime_marker_dir }}"
        state: directory
        owner: "{{ oracle_user }}"
        group: "{{ oracle_group }}"
        mode: "0755"

    - name: Start and stop standby-role service once on the primary
      ansible.builtin.shell: |
        set -o pipefail
        export ORACLE_HOME={{ _svc_home_path }}
        "$ORACLE_HOME/bin/srvctl" start service -db {{ _svc_restart_db }} -service {{ _svc_name }}
        "$ORACLE_HOME/bin/srvctl" stop service -db {{ _svc_restart_db }} -service {{ _svc_name }}
      args: { executable: /bin/bash }
      become: true
      become_user: "{{ oracle_user }}"
      changed_when: true

    - name: Record standby-role service priming
      ansible.builtin.file:
        path: "{{ oracle_service_prime_marker_dir }}/{{ _svc_restart_db }}-{{ _svc_name }}"
        state: touch
        owner: "{{ oracle_user }}"
        group: "{{ oracle_group }}"
        mode: "0644"
        modification_time: preserve
        access_time: preserve

- name: Enable and start matching role-based service
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ _svc_home_path }}
    enable_output="$("$ORACLE_HOME/bin/srvctl" enable service -db {{ _svc_restart_db }} -service {{ _svc_name }} 2>&1)"
    enable_rc=$?
    printf '%s\n' "$enable_output"
    if [ "$enable_rc" -ne 0 ] &&
       ! printf '%s\n' "$enable_output" | grep -Eiq 'already enabled|PRCR-1002'; then
      exit "$enable_rc"
    fi
    if [ "$enable_rc" -eq 0 ]; then echo SERVICE_ENABLED; fi

    if [ "{{ '1' if (_svc_manage_current_role | bool) else '0' }}" -eq 0 ]; then
      echo SERVICE_REGISTERED_FOR_{{ _svc_role }}_ROLE
      exit 0
    fi

    status_output="$("$ORACLE_HOME/bin/srvctl" status service -db {{ _svc_restart_db }} -service {{ _svc_name }} 2>&1)" || true
    printf '%s\n' "$status_output"
    if printf '%s\n' "$status_output" | grep -Eq 'is running|is already running'; then
      echo SERVICE_ALREADY_RUNNING
      exit 0
    fi
    "$ORACLE_HOME/bin/srvctl" start service -db {{ _svc_restart_db }} -service {{ _svc_name }}
    echo SERVICE_STARTED
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _srvctl_start_svc
  changed_when: >-
    'SERVICE_ENABLED' in (_srvctl_start_svc.stdout | default('')) or
    'SERVICE_STARTED' in (_srvctl_start_svc.stdout | default(''))
  failed_when: _srvctl_start_svc.rc != 0
  when:
    - oracle_restart_available | bool
    - _svc_srvctl_config_usable | bool
