---
# defaults/main.yml for oracle_service_manage
#
# Create role-based client services. An instance can declare `services`, each
# with name, role, and TAF attributes. Existing inventories that only declare
# `service_name` receive the historical PRIMARY/SELECT service contract.

oracle_user: oracle
oracle_group: oinstall
oracle_instances: []
oracle_gi_home: /grid/19c/gi_home1
oracle_restart_available: false
oracle_service_apply_instance_overrides_require_dataguard: true
oracle_service_prime_standby_role_services: true
oracle_service_prime_marker_dir: /var/lib/ansible-oracle/services
