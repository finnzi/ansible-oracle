---
# defaults/main.yml for oracle_common
#
# These mirror the project-wide vars in inventory/group_vars/all.yml; the
# defaults make the role usable standalone (e.g. in molecule tests).

oracle_user: oracle
oracle_group: oinstall
oracle_primary_group_role: dba
oracle_asm_group: asmadmin
oracle_roles: [dba, oper, asmadmin, backupdba, dgdba, kmdba]

# Single central Oracle inventory. All installers on a host must share this path.
oracle_inventory_loc: /home/oracle/oraInventory
oracle_inventory_enforce_single: true

# The preinstall RPM usually sets these but a lab image may not have it. The
# role is idempotent regardless.
oracle_uid: 54321
oracle_gid: 54321

oracle_common_packages:
  - cloud-utils-growpart
  - elfutils-libelf-devel
  - gcc
  - glibc-devel
  - ksh
  - libaio-devel
  - libnsl
  - libstdc++-devel
  - libxcrypt-compat
  - make
  - policycoreutils-python-utils
  - sysstat
  - unzip

# Expand the root LVM/XFS volume into free virtual-disk space (KVM lab OL
# cloud image layout). Off by default so non-lab hosts keep VG headroom;
# the lab inventory opts in via inventory/group_vars/all.yml. Idempotent;
# no-op when already grown or layout differs.
oracle_common_grow_root: false
oracle_common_grow_root_disk: /dev/vda
oracle_common_grow_root_partnum: "4"
oracle_common_grow_root_partition: /dev/vda4
oracle_common_grow_root_vg: vg_main
oracle_common_grow_root_lv: lv_root

# Optional lab hostname mappings. When supplied, install them during the OS
# substrate pass so Oracle NetCA can resolve the guest FQDN before Grid is
# installed. Production inventories leave this empty and use DNS.
oracle_lab_guest_hosts: []
oracle_lab_host_map_mode: standalone

# sysctl / limits — conservative lab defaults. Tune via inventory in real envs.
oracle_sysctl:
  fs.file-max: 6815744
  kernel.sem: "1024 32000 100 128"
  kernel.shmmni: 4096
  kernel.shmall: 1073741824
  kernel.shmmax: 4398046511104
  kernel.panic_on_oops: 1
  net.core.rmem_default: 262144
  net.core.rmem_max: 4194304
  net.core.wmem_default: 262144
  net.core.wmem_max: 1048576
  net.ipv4.ip_local_port_range: "9000 65500"
  vm.hugetlb_shm_group: "{{ oracle_gid }}"
oracle_limits_soft:
  nofile: 1024
  nproc:  2047
  stack:  10240
oracle_limits_hard:
  nofile: 65536
  nproc:  16384
  stack:  32768
