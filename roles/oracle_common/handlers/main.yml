---
# handlers/main.yml for oracle_common

- name: Reload sysctl
  ansible.builtin.shell: |
    # Apply each sysctl key individually so that one un-settable key does not
    # abort the rest. kernel.sem and the Oracle-required values DO apply.
    set -o pipefail
    rc=0
    while read -r key val; do
      [ -z "$key" ] && continue
      sysctl -w "$key=$val" >/dev/null 2>&1 || rc=1
    done < <(grep -vE '^\s*#|^\s*$' /etc/sysctl.d/99-oracle.conf | awk -F' = ' '{print $1" "$2}')
    exit 0
  args:
    executable: /bin/bash
  changed_when: true
