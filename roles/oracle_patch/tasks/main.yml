---
# tasks/main.yml for oracle_patch
#
# The standby-first DETECTION is real and runs now (the user explicitly asked
# for auto-detection from release notes). DB and Grid homes are converged by
# comparing opatch lspatches with the patch IDs derived from the staged bundle.

- name: Verify the patch zip is staged
  ansible.builtin.stat:
    path: "{{ oracle_patch_zip }}"
  register: _patch_zip
  failed_when: not _patch_zip.stat.exists

- name: Fail when patch target is invalid
  ansible.builtin.fail:
    msg: >-
      oracle_patch_target={{ oracle_patch_target }} is invalid. Supported
      targets are db and grid.
  when: oracle_patch_target not in ['db', 'grid']

- name: Fail when patch mode is invalid
  ansible.builtin.fail:
    msg: >-
      oracle_patch_mode={{ oracle_patch_mode }} is invalid. Supported modes are
      inplace and oop_dual.
  when: oracle_patch_mode not in ['inplace', 'oop_dual']

- name: Fail when dual-home mode is requested for Grid homes
  ansible.builtin.fail:
    msg: >-
      oracle_patch_mode=oop_dual is currently implemented for DB homes only.
      Use oracle_patch_target=db, or use inplace mode for Grid homes.
  when:
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target != 'db'

# ── Standby-first eligibility from the patch README (fully implemented) ─
- name: Read standby-first eligibility from the patch README
  patch_standbyfirst_info:
    zip: "{{ oracle_patch_zip }}"
  register: _sf

- name: Fail when selected patch component path is invalid
  ansible.builtin.fail:
    msg: >-
      oracle_patch_apply_component_path={{ oracle_patch_apply_component_path }}
      is invalid. Use a relative component path reported by
      playbooks/07-patch-standbyfirst-media.yml.
  when:
    - oracle_patch_apply_component_path | default('') | length > 0
    - oracle_patch_apply_component_path.startswith('/') or
      oracle_patch_apply_component_path is search('(^|/)\\.\\.(/|$)')

- name: Resolve selected patch component
  ansible.builtin.set_fact:
    _patch_selected_component: >-
      {{
        (
          _sf.eligible_db_components | default([])
          | selectattr('component_path', 'equalto', oracle_patch_apply_component_path)
          | list
          | first
        ) | default({})
      }}
  when: oracle_patch_apply_component_path | default('') | length > 0

- name: Fail when selected patch component is not eligible
  ansible.builtin.fail:
    msg: >-
      oracle_patch_apply_component_path={{ oracle_patch_apply_component_path }}
      was not found as an eligible Data Guard Standby-First DB RU component in
      {{ oracle_patch_zip | basename }}.
  when:
    - oracle_patch_apply_component_path | default('') | length > 0
    - _patch_selected_component | default({}) | length == 0

- name: Resolve whether to use standby-first patching
  ansible.builtin.set_fact:
    oracle_patch_use_standbyfirst: >-
      {%- if oracle_patch_dg_standbyfirst | default('auto') == 'auto' -%}
      {{
        ((_patch_selected_component | default({})).standby_first | default(false))
        if (oracle_patch_apply_component_path | default('') | length > 0)
        else (_sf.eligible | default(false))
      }}
      {%- else -%}
      {{ oracle_patch_dg_standbyfirst | bool }}
      {%- endif -%}
  when: oracle_patch_dg_standbyfirst | default('auto') in ('auto', true)

- name: Resolve expected DB patch IDs
  ansible.builtin.set_fact:
    _patch_expected_ids: >-
      {%- if oracle_patch_expected_patch_ids | length > 0 -%}
      {{ oracle_patch_expected_patch_ids }}
      {%- elif oracle_patch_apply_component_path | default('') | length > 0 -%}
      {{ [_patch_selected_component.patch_number] if (_patch_selected_component | default({}) | length > 0) else [] }}
      {%- else -%}
      {%- set ids = [] -%}
      {%- for component in _sf.components | default([]) -%}
        {%- set description = component.description | default('') -%}
        {%- if component.name != 'combo' and 'Database Release Update' in description -%}
          {%- set _ = ids.append(component.patch_number) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ids }}
      {%- endif -%}
  when: oracle_patch_target == 'db'

- name: Resolve expected Grid patch IDs
  ansible.builtin.set_fact:
    _patch_expected_ids: >-
      {%- set ids = [] -%}
      {%- for patch in _sf.patch_inventory | default([]) -%}
        {%- set description = patch.description | default('') -%}
        {%- if not (description is search('(?i)(OJVM|JavaVM)')) -%}
          {%- set _ = ids.append(patch.patch_number) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ oracle_patch_expected_grid_patch_ids if (oracle_patch_expected_grid_patch_ids | length > 0) else ids }}
  when: oracle_patch_target == 'grid'

- name: Fail when no expected patch IDs could be derived
  ansible.builtin.fail:
    msg: >-
      Could not derive expected {{ oracle_patch_target }} patch IDs from
      {{ oracle_patch_zip | basename }}. Set oracle_patch_expected_patch_ids or
      oracle_patch_expected_grid_patch_ids explicitly.
  when: _patch_expected_ids | length == 0

- name: Report standby-first verdict
  ansible.builtin.debug:
    msg: >-
      Patch {{ oracle_patch_zip | basename }}: standby-first eligible =
      {{ _sf.eligible | default('n/a') }}. Reason:
      {{ _sf.reason | default('n/a') }}. Apply mode: {{ oracle_patch_mode }}.
      Target: {{ oracle_patch_target }}. Component path:
      {{ oracle_patch_apply_component_path | default('') | default('none', true) }}.
      Expected patch IDs:
      {{ _patch_expected_ids | join(',') }}.
      Policy: whole-zip SF only when every component is SF; OJVM+RU combos use
      dual-home/downtime together, not SF RU then OJVM later.

- name: Verify OPatch upgrade zip is staged
  ansible.builtin.stat:
    path: "{{ oracle_patch_opatch_zip }}"
  register: _opatch_zip
  failed_when: not _opatch_zip.stat.exists

# ── Resolve DB-home patch targets ──────────────────────────────────────
# Prefer oracle_patch_instances when the caller supplied a filtered list
# (avoids extra-var oracle_instances clobbering include_role params).
- name: Resolve inventory DB patch targets
  ansible.builtin.set_fact:
    _patch_inventory_targets: >-
      {%- set out=[] -%}
      {%- set raw_instances = (
            oracle_patch_instances
            if (oracle_patch_instances | default([]) | length > 0)
            else (oracle_instances | default([]))
          ) -%}
      {%- set instances = raw_instances | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), false) -%}
      {%- for inst in instances -%}
        {%- set current_home = (inst.db_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.db_homes[0]) -%}
        {%- set target_suffix = oracle_patch_dual_home_suffix if (oracle_patch_dual_home_suffix | length > 0) else current_home.suffix -%}
        {%- set target_home_path = oracle_patch_dual_home_path if (oracle_patch_dual_home_path | length > 0) else inst.oracle_base ~ '/' ~ target_suffix -%}
        {%- set resolved_home_path = target_home_path if oracle_patch_mode == 'oop_dual' else inst.oracle_base ~ '/' ~ current_home.suffix -%}
        {%- set resolved_suffix = target_home_path.rsplit('/', 1)[1] if (oracle_patch_mode == 'oop_dual' and oracle_patch_dual_home_path | length > 0) else (target_suffix if oracle_patch_mode == 'oop_dual' else current_home.suffix) -%}
        {%- set data_dir = (inst.dirs.data | default('')) -%}
        {%- set db_unique = inst.db_unique_name | default(inst.name) -%}
        {%- set param_dir = (
          (data_dir ~ '/' ~ db_unique)
          if (data_dir | length > 0)
          else (inst.oracle_base ~ '/parameter_files/' ~ db_unique)
        ) -%}
        {%- set modeled = [] -%}
        {%- for home in inst.db_homes | default([]) -%}
          {%- set _ = modeled.append(inst.oracle_base ~ '/' ~ home.suffix) -%}
        {%- endfor -%}
        {%- set _ = out.append({
          'name': inst.name,
          'restart_db_name': db_unique,
          'service_name': inst.service_name | default(inst.name ~ '_svc'),
          'dataguard': inst.dataguard | default(false) | bool,
          'oracle_base': inst.oracle_base,
          'home_suffix': resolved_suffix,
          'home_path': resolved_home_path,
          'current_home_path': inst.oracle_base ~ '/' ~ current_home.suffix,
          'modeled_home_paths': modeled,
          'explicit_dual_target': (
            (oracle_patch_dual_home_suffix | default('') | length > 0) or
            (oracle_patch_dual_home_path | default('') | length > 0)
          ),
          'data_dir': data_dir,
          'parameter_file_dir': param_dir,
          'source': 'inventory'
        }) -%}
      {%- endfor -%}
      {{ out }}
  when: oracle_patch_target == 'db'

- name: Read /etc/oratab DB homes for brownfield patching
  ansible.builtin.shell: |
    set -o pipefail
    awk -F: 'NF >= 2 && $1 !~ /^[#[:space:]]*$/ && $1 !~ /^\+/ && $2 ~ /^\// {print $1 "|" $2}' /etc/oratab 2>/dev/null || true
  args: { executable: /bin/bash }
  register: _patch_oratab
  changed_when: false
  when:
    - oracle_patch_target == 'db'
    - oracle_patch_discover_oratab | bool

- name: Resolve /etc/oratab DB patch targets
  ansible.builtin.set_fact:
    _patch_oratab_targets: >-
      {%- set out=[] -%}
      {%- for line in _patch_oratab.stdout_lines | default([]) -%}
        {%- set parts = line.split('|') -%}
        {%- if parts | length >= 2 and parts[1] | length > 0 -%}
          {%- set home_path = parts[1] -%}
          {%- set parent = home_path.rsplit('/', 1)[0] -%}
          {%- set suffix = home_path.rsplit('/', 1)[1] -%}
          {%- set _ = out.append({
            'name': parts[0],
            'restart_db_name': parts[0],
            'oracle_base': parent,
            'home_suffix': suffix,
            'home_path': home_path,
            'source': 'oratab'
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: oracle_patch_target == 'db'

- name: Resolve extra brownfield DB patch targets
  ansible.builtin.set_fact:
    _patch_extra_targets: >-
      {%- set out=[] -%}
      {%- for item in oracle_patch_extra_homes | default([]) -%}
        {%- set home_path = item if item is string else item.home_path | default('') -%}
        {%- if home_path | length > 0 -%}
          {%- set parent = home_path.rsplit('/', 1)[0] -%}
          {%- set suffix = home_path.rsplit('/', 1)[1] -%}
          {%- set _ = out.append({
            'name': (suffix if item is string else item.name | default(suffix)),
            'restart_db_name': (suffix if item is string else item.restart_db_name | default(item.name | default(suffix))),
            'oracle_base': (parent if item is string else item.oracle_base | default(parent)),
            'home_suffix': (suffix if item is string else item.home_suffix | default(suffix)),
            'home_path': home_path,
            'source': 'extra'
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: oracle_patch_target == 'db'

- name: Resolve inventory Grid patch targets
  ansible.builtin.set_fact:
    _patch_inventory_grid_targets: >-
      {%- set out=[] -%}
      {%- set raw_instances = (
            oracle_patch_instances
            if (oracle_patch_instances | default([]) | length > 0)
            else (oracle_instances | default([]))
          ) -%}
      {%- set instances = raw_instances | oracle_apply_instance_overrides(oracle_instance_overrides | default({}), false) -%}
      {%- for inst in instances -%}
        {%- if inst.gi_homes is defined and inst.gi_base is defined -%}
          {%- set current_home = (inst.gi_homes | selectattr('current', 'equalto', true) | list | first) | default(inst.gi_homes[0]) -%}
          {%- set _ = out.append({
            'name': inst.name ~ '_grid',
            'oracle_base': inst.gi_base,
            'home_suffix': current_home.suffix,
            'home_path': inst.gi_base ~ '/' ~ current_home.suffix,
            'source': 'inventory'
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: oracle_patch_target == 'grid'

- name: Read /etc/oracle/olr.loc Grid home for brownfield patching
  ansible.builtin.shell: |
    set -o pipefail
    awk -F= '$1 == "crs_home" && $2 ~ /^\// {print $2}' /etc/oracle/olr.loc 2>/dev/null || true
  args: { executable: /bin/bash }
  register: _patch_olr
  changed_when: false
  when:
    - oracle_patch_target == 'grid'
    - oracle_patch_discover_olr | bool

- name: Resolve /etc/oracle/olr.loc Grid patch targets
  ansible.builtin.set_fact:
    _patch_olr_targets: >-
      {%- set out=[] -%}
      {%- for home_path in _patch_olr.stdout_lines | default([]) -%}
        {%- if home_path | length > 0 -%}
          {%- set parent = home_path.rsplit('/', 1)[0] -%}
          {%- set suffix = home_path.rsplit('/', 1)[1] -%}
          {%- set _ = out.append({
            'name': 'grid',
            'oracle_base': parent,
            'home_suffix': suffix,
            'home_path': home_path,
            'source': 'olr'
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: oracle_patch_target == 'grid'

- name: Resolve extra brownfield Grid patch targets
  ansible.builtin.set_fact:
    _patch_extra_grid_targets: >-
      {%- set out=[] -%}
      {%- for item in oracle_patch_extra_grid_homes | default([]) -%}
        {%- set home_path = item if item is string else item.home_path | default('') -%}
        {%- if home_path | length > 0 -%}
          {%- set parent = home_path.rsplit('/', 1)[0] -%}
          {%- set suffix = home_path.rsplit('/', 1)[1] -%}
          {%- set _ = out.append({
            'name': (suffix if item is string else item.name | default(suffix)),
            'oracle_base': (parent if item is string else item.oracle_base | default(parent)),
            'home_suffix': (suffix if item is string else item.home_suffix | default(suffix)),
            'home_path': home_path,
            'source': 'extra'
          }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: oracle_patch_target == 'grid'

- name: Resolve Oracle patch targets
  ansible.builtin.set_fact:
    _patch_targets: >-
      {%- set out = [] -%}
      {%- set seen = [] -%}
      {%- set candidate_targets = [] -%}
      {%- if oracle_patch_target == 'grid' -%}
        {%- set candidate_targets = (_patch_inventory_grid_targets | default([])) + (_patch_olr_targets | default([])) + (_patch_extra_grid_targets | default([])) -%}
      {%- else -%}
        {%- set candidate_targets = (_patch_inventory_targets | default([])) + (_patch_oratab_targets | default([])) + (_patch_extra_targets | default([])) -%}
      {%- endif -%}
      {%- for target in candidate_targets -%}
        {%- if target.home_path not in seen -%}
          {%- set _ = seen.append(target.home_path) -%}
          {%- set _ = out.append(target) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Fail when no patch targets were resolved
  ansible.builtin.fail:
    msg: >-
      No {{ oracle_patch_target }} homes were resolved from inventory,
      brownfield discovery, or extra-home variables.
  when: _patch_targets | length == 0

- name: Report resolved Oracle patch targets
  ansible.builtin.debug:
    msg:
      name: "{{ item.name }}"
      source: "{{ item.source }}"
      home_path: "{{ item.home_path }}"
      home_suffix: "{{ item.home_suffix }}"
      restart_db_name: "{{ item.restart_db_name | default('') }}"
  loop: "{{ _patch_targets }}"
  loop_control:
    label: "{{ item.name }}:{{ item.home_suffix }}"

- name: Fail when dual-home target is not inventory-backed
  ansible.builtin.fail:
    msg: >-
      oracle_patch_mode=oop_dual requires inventory-backed DB targets so the
      role can safely resolve Restart database names and target homes.
      Configure oracle_instances / oracle_patch_instances or use inplace mode
      for brownfield-only homes.

  when:
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - (_patch_targets | rejectattr('source', 'equalto', 'inventory') | list | length) > 0

- name: Check Oracle home patch inventory
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.home_path | quote }}
    {{ item.home_path }}/OPatch/opatch lspatches
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_lspatches
  changed_when: false
  failed_when: >-
    _patch_lspatches.rc != 0 or
    'OPatch succeeded' not in (_patch_lspatches.stdout | default(''))
  loop: "{{ _patch_targets }}"
  loop_control:
    label: "{{ item.name }}:{{ item.home_suffix }}"

- name: Record DB homes missing expected patch IDs
  ansible.builtin.set_fact:
    _patch_missing_targets: >-
      {%- set missing = [] -%}
      {%- for result in _patch_lspatches.results | default([]) -%}
        {%- set installed_patch_ids = [] -%}
        {%- set installed_db_ru_ids = [] -%}
        {%- for line in result.stdout_lines | default([]) -%}
          {%- set candidate = line.split(';', 1)[0] | trim -%}
          {%- if candidate is match('^[0-9]+$') -%}
            {%- set _ = installed_patch_ids.append(candidate) -%}
            {%- if 'Database Release Update' in line -%}
              {%- set _ = installed_db_ru_ids.append(candidate) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set missing_ids = [] -%}
        {%- for patch_id in _patch_expected_ids -%}
          {%- if patch_id not in installed_patch_ids -%}
            {# Dual-home / brownfield: OPatch drops an older RU ID once a later
               Database RU is applied. Treat the expected RU as satisfied only
               when an installed Database RU has a higher numeric patch id
               (newer RU). An older installed RU must NOT satisfy a newer
               expected upgrade target. #}
            {%- set newer_db_rus = installed_db_ru_ids
              | map('int')
              | select('>', (patch_id | int))
              | list -%}
            {%- if newer_db_rus | length == 0 -%}
              {%- set _ = missing_ids.append(patch_id) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if missing_ids | length > 0 -%}
          {%- set target = result.item | combine({'missing_patch_ids': missing_ids}) -%}
          {%- set _ = missing.append(target) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ missing }}

- name: Report DB patch inventory status
  ansible.builtin.debug:
    msg: >-
      {{ oracle_patch_target }} patch inventory:
      {{ (_patch_targets | length) - (_patch_missing_targets | length) }}
      of {{ _patch_targets | length }} home(s) already contain expected patch
      ID(s) {{ _patch_expected_ids | join(',') }}.

- name: Fail when patches are missing but apply is disabled
  ansible.builtin.fail:
    msg: >-
      {{ _patch_missing_targets | length }} DB home(s) are missing expected
      patch ID(s) {{ _patch_expected_ids | join(',') }}, but
      oracle_patch_apply_enabled=false. Set oracle_patch_apply_enabled=true to
      run OPatch/opatchauto/datapatch.
  when:
    - _patch_missing_targets | length > 0
    - not oracle_patch_apply_enabled | bool

- name: Fail when standby-first orchestration is requested in per-host role
  ansible.builtin.fail:
    msg: >-
      {{ oracle_patch_zip | basename }} is standby-first eligible and
      oracle_patch_dg_standbyfirst resolves to true, but standby-first patch
      orchestration must run through playbooks/07-patch-standbyfirst.yml.
      Required flow: patch standby, switchover, then patch the new standby.
  when:
    - _patch_missing_targets | length > 0
    - oracle_patch_apply_enabled | bool
    - oracle_patch_target == 'db'
    - oracle_patch_use_standbyfirst | default(false) | bool

- name: Read Restart database home for dual-home DB targets
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" config database -db {{ item.restart_db_name | quote }} 2>/dev/null |
      awk -F': ' '$1 == "Oracle home" {print $2}'
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_restart_homes
  changed_when: false
  failed_when: false
  loop: "{{ _patch_targets }}"
  loop_control:
    label: "{{ item.restart_db_name | default(item.name) }}:{{ item.home_suffix }}"
  when:
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'

- name: Record dual-home DB switch targets
  ansible.builtin.set_fact:
    _patch_dual_switch_targets: >-
      {%- set out = [] -%}
      {%- for result in _patch_restart_homes.results | default([]) -%}
        {%- set current_home = result.stdout | default('') | trim -%}
        {%- set modeled = result.item.modeled_home_paths | default([]) -%}
        {%- set explicit = result.item.explicit_dual_target | default(false) | bool -%}
        {%- if result.rc == 0 and current_home | length > 0 and current_home != result.item.home_path -%}
          {%- if explicit or current_home not in modeled -%}
            {%- set _ = out.append(result.item | combine({'restart_home_path': current_home})) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when:
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'

- name: Fail when dual-home switch is needed but apply is disabled
  ansible.builtin.fail:
    msg: >-
      {{ _patch_dual_switch_targets | default([]) | length }} DB home switch(es)
      are needed, but oracle_patch_apply_enabled=false. Set
      oracle_patch_apply_enabled=true to modify Restart metadata and restart DBs.
  when:
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - oracle_patch_switch_enabled | default(true) | bool
    - (_patch_dual_switch_targets | default([]) | length) > 0
    - not oracle_patch_apply_enabled | bool

- name: Report dual-home switch deferred (prepare-only)
  ansible.builtin.debug:
    msg: >-
      oracle_patch_switch_enabled=false: {{
        _patch_dual_switch_targets | default([]) | length
      }} Restart home switch(es) are deferred. Target home(s) were still
      inventory-checked/patched; run the planned cutover playbook to switch.
  when:
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - not (oracle_patch_switch_enabled | default(true) | bool)
    - (_patch_dual_switch_targets | default([]) | length) > 0

- name: Fail when dual-home switch would need Data Guard orchestration
  ansible.builtin.fail:
    msg: >-
      oracle_patch_mode=oop_dual would switch a Data Guard database home.
      Data Guard-aware standby-first patch orchestration is not implemented in
      this role slice yet, so switch standalone DB homes only.
  when:
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - oracle_patch_switch_enabled | default(true) | bool
    - (_patch_dual_switch_targets | default([]) | selectattr('dataguard', 'equalto', true) | list | length) > 0
    - not oracle_patch_allow_dataguard_dual_home_switch | default(false) | bool

# ── Home apply path (only when inventory says work is needed) ──────────
- name: Upgrade OPatch in homes that need patching
  ansible.builtin.unarchive:
    src: "{{ oracle_patch_opatch_zip }}"
    dest: "{{ item.home_path }}"
    remote_src: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
  become: true
  become_user: "{{ oracle_user }}"
  loop: "{{ _patch_missing_targets }}"
  loop_control:
    label: "{{ item.name }}:{{ item.home_suffix }}"
  when:
    - oracle_patch_apply_enabled | bool
    - _patch_missing_targets | length > 0

- name: Ensure patch bundle extraction directory exists
  ansible.builtin.file:
    path: "{{ oracle_patch_bundle_extract_dir }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0775"
  when:
    - oracle_patch_apply_enabled | bool
    - _patch_missing_targets | length > 0

- name: Check whether patch bundle is already extracted
  ansible.builtin.stat:
    path: "{{ oracle_patch_bundle_extract_dir }}/.{{ oracle_patch_zip | basename }}.extracted"
  register: _patch_extract_marker
  when:
    - oracle_patch_apply_enabled | bool
    - _patch_missing_targets | length > 0

- name: Extract patch bundle for opatchauto
  ansible.builtin.unarchive:
    src: "{{ oracle_patch_zip }}"
    dest: "{{ oracle_patch_bundle_extract_dir }}"
    remote_src: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
  become: true
  become_user: "{{ oracle_user }}"
  when:
    - oracle_patch_apply_enabled | bool
    - _patch_missing_targets | length > 0
    - not _patch_extract_marker.stat.exists

- name: Mark patch bundle extraction complete
  ansible.builtin.file:
    path: "{{ oracle_patch_bundle_extract_dir }}/.{{ oracle_patch_zip | basename }}.extracted"
    state: touch
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: "0644"
  when:
    - oracle_patch_apply_enabled | bool
    - _patch_missing_targets | length > 0
    - not _patch_extract_marker.stat.exists

- name: Resolve extracted patch directory
  ansible.builtin.shell: |
    set -o pipefail
    root={{ oracle_patch_bundle_extract_dir | quote }}
    bundle={{ oracle_patch_zip | basename | regex_replace('^p([0-9]+)_.*$', '\\1') | quote }}
    target={{ oracle_patch_target | quote }}
    configured={{ (oracle_patch_grid_apply_component_id | default('')) | quote }}
    component={{ (oracle_patch_apply_component_path | default('')) | quote }}

    if [ -n "$component" ]; then
      if [ -d "$root/$component" ]; then
        printf '%s\n' "$root/$component"
        exit 0
      fi
      printf 'Configured patch component not found: %s\n' "$root/$component" >&2
      exit 1
    fi

    if [ "$target" = "grid" ] && [ -n "$configured" ]; then
      found="$(find "$root" -mindepth 2 -maxdepth 2 -type d -name "$configured" -print -quit)"
      if [ -n "$found" ]; then
        printf '%s\n' "$found"
        exit 0
      fi
    fi

    if [ "$target" = "grid" ]; then
      while IFS= read -r candidate; do
        readme="${candidate}/README.html"
        if [ -f "$readme" ] &&
           head -80 "$readme" | grep -Eiq 'GI Release Update|Grid Infrastructure.*Release Update'; then
          printf '%s\n' "$candidate"
          exit 0
        fi
      done < <(find "$root" -mindepth 2 -maxdepth 2 -type d -print | sort)
    elif [ -d "$root/$bundle" ]; then
      printf '%s\n' "$root/$bundle"
      exit 0
    fi
    find "$root" -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' -print | sort | tail -1
  args: { executable: /bin/bash }
  register: _patch_apply_dir
  changed_when: false
  failed_when: _patch_apply_dir.rc != 0 or (_patch_apply_dir.stdout | trim | length) == 0
  when:
    - oracle_patch_apply_enabled | bool
    - _patch_missing_targets | length > 0

- name: Apply Oracle home patch with opatchauto
  ansible.builtin.shell: |
    set -o pipefail
    # opatchauto refuses to run with CWD in / or /root
    cd {{ item.home_path | quote }}
    {{ item.home_path }}/OPatch/opatchauto apply {{ _patch_apply_dir.stdout | trim | quote }} -oh {{ item.home_path | quote }}
  args: { executable: /bin/bash }
  register: _patch_opatchauto
  changed_when: >-
    _patch_opatchauto.rc == 0 and
    'OPatchAuto successful' in (_patch_opatchauto.stdout | default(''))
  failed_when: >-
    _patch_opatchauto.rc != 0 or
    'OPatchAuto successful' not in (_patch_opatchauto.stdout | default(''))
  loop: "{{ _patch_missing_targets }}"
  loop_control:
    label: "{{ item.name }}:{{ item.home_suffix }}"
  when:
    - oracle_patch_apply_enabled | bool
    - _patch_missing_targets | length > 0

- name: Stop DBs before dual-home Restart switch
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" stop database -db {{ item.restart_db_name | quote }} -stopoption IMMEDIATE
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_stop
  changed_when: _patch_dual_stop.rc == 0
  failed_when: >-
    _patch_dual_stop.rc != 0 and
    'PRCD-1120' not in (_patch_dual_stop.stdout | default('')) and
    'PRCR-1005' not in (_patch_dual_stop.stdout | default('')) and
    'not running' not in (_patch_dual_stop.stdout | default('') | lower)
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "{{ item.restart_db_name }} -> {{ item.home_path }}"
  when:
    - oracle_patch_apply_enabled | bool
    - oracle_patch_switch_enabled | default(true) | bool
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - (_patch_dual_switch_targets | default([]) | length) > 0

- name: Switch Restart database to dual-home target
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" modify database \
      -db {{ item.restart_db_name | quote }} \
      -oraclehome {{ item.home_path | quote }}
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_modify_db
  changed_when: _patch_dual_modify_db.rc == 0
  failed_when: _patch_dual_modify_db.rc != 0
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "{{ item.restart_db_name }} -> {{ item.home_path }}"
  when:
    - oracle_patch_apply_enabled | bool
    - oracle_patch_switch_enabled | default(true) | bool
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - (_patch_dual_switch_targets | default([]) | length) > 0

# spfile/orapw must NOT live only under $OH/dbs for dual-home work; clean
# rebuilds delete that tree. Prefer durable data-dir path, mirror under new
# home dbs/, rewrite Restart metadata. Script lives in files/ to avoid YAML
# embedding large shell blocks.
- name: Relocate spfile and password file to durable path for dual-home switch
  ansible.builtin.script: >
    relocate_spfile_for_dual_home.sh
    {{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}
    {{ item.restart_db_name | quote }}
    {{ item.home_path | quote }}
    {{ (item.restart_home_path | default(item.current_home_path | default(''))) | quote }}
    {{ item.name | quote }}
    {{ item.oracle_base | quote }}
    {{ (item.data_dir | default('')) | quote }}
    {{ (item.parameter_file_dir | default('')) | quote }}
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_migrate_spfile
  changed_when: "'CHANGED' in (_patch_dual_migrate_spfile.stdout | default(''))"
  failed_when: >-
    _patch_dual_migrate_spfile.rc != 0 or
    'SPFILE_MISSING' in (_patch_dual_migrate_spfile.stdout | default('')) or
    'SPFILE_MISSING' in (_patch_dual_migrate_spfile.stderr | default(''))
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "{{ item.restart_db_name }} -> durable param dir + {{ item.home_path }}/dbs"
  when:
    - oracle_patch_apply_enabled | bool
    - oracle_patch_switch_enabled | default(true) | bool
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - (_patch_dual_switch_targets | default([]) | length) > 0

- name: Switch Restart listener to dual-home target
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" modify listener \
      -listener LISTENER_{{ item.name | upper }} \
      -oraclehome {{ item.home_path | quote }}
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_modify_listener
  changed_when: _patch_dual_modify_listener.rc == 0
  failed_when: >-
    _patch_dual_modify_listener.rc != 0 and
    'PRCN-2044' not in (_patch_dual_modify_listener.stdout | default('')) and
    'PRCR-1001' not in (_patch_dual_modify_listener.stdout | default(''))
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "LISTENER_{{ item.name | upper }} -> {{ item.home_path }}"
  when:
    - oracle_patch_apply_enabled | bool
    - oracle_patch_switch_enabled | default(true) | bool
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - (_patch_dual_switch_targets | default([]) | length) > 0

- name: Start DBs after dual-home Restart switch
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" start database -db {{ item.restart_db_name | quote }}
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_start
  changed_when: _patch_dual_start.rc == 0
  failed_when: >-
    _patch_dual_start.rc != 0 and
    'already running' not in (_patch_dual_start.stdout | default('') | lower) and
    'PRCR-1079' not in (_patch_dual_start.stdout | default(''))
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "{{ item.restart_db_name }}"
  when:
    - oracle_patch_apply_enabled | bool
    - oracle_patch_switch_enabled | default(true) | bool
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - (_patch_dual_switch_targets | default([]) | length) > 0

- name: Reopen Data Guard standby read-only with apply after dual-home switch
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.home_path | quote }}
    export ORACLE_SID={{ item.name | quote }}
    "$ORACLE_HOME/bin/sqlplus" -L -S / as sysdba <<'SQL'
    SET SERVEROUTPUT ON PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    DECLARE
      v_database_role v$database.database_role%TYPE;
      v_open_mode v$database.open_mode%TYPE;
    BEGIN
      SELECT database_role, open_mode INTO v_database_role, v_open_mode
      FROM v$database;
      IF v_database_role != 'PHYSICAL STANDBY' THEN
        DBMS_OUTPUT.PUT_LINE('OK');
      ELSIF v_open_mode != 'READ ONLY WITH APPLY' THEN
        BEGIN
          EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE CANCEL';
        EXCEPTION
          WHEN OTHERS THEN NULL;
        END;
        IF v_open_mode = 'MOUNTED' THEN
          EXECUTE IMMEDIATE 'ALTER DATABASE OPEN';
        END IF;
        EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT FROM SESSION';
        DBMS_OUTPUT.PUT_LINE('CHANGED');
      ELSE
        DBMS_OUTPUT.PUT_LINE('OK');
      END IF;
    END;
    /
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dg_standby_open_apply
  changed_when: "'CHANGED' in (_patch_dg_standby_open_apply.stdout | default(''))"
  failed_when: >-
    _patch_dg_standby_open_apply.rc != 0 or
    'ORA-' in (_patch_dg_standby_open_apply.stdout | default('')) or
    'SP2-' in (_patch_dg_standby_open_apply.stdout | default('')) or
    'PLS-' in (_patch_dg_standby_open_apply.stdout | default(''))
  loop: "{{ _patch_dual_switch_targets | default([]) | selectattr('dataguard', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.restart_db_name }}"
  when:
    - oracle_patch_apply_enabled | bool
    - oracle_patch_switch_enabled | default(true) | bool
    - oracle_patch_allow_dataguard_dual_home_switch | default(false) | bool
    - oracle_patch_mode == 'oop_dual'
    - oracle_patch_target == 'db'
    - (_patch_dual_switch_targets | default([]) | length) > 0

- name: Read database role before datapatch
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.home_path | quote }}
    export ORACLE_SID={{ item.name | quote }}
    "$ORACLE_HOME/bin/sqlplus" -L -S / as sysdba <<'SQL'
    SET PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT database_role || '|' || open_mode FROM v$database;
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_datapatch_roles
  changed_when: false
  failed_when: false
  loop: >-
    {{
      ((_patch_missing_targets + (_patch_dual_switch_targets | default([]))) | unique(attribute='home_path'))
      if oracle_patch_mode == 'oop_dual'
      else _patch_missing_targets
    }}
  loop_control:
    label: "{{ item.name }}:{{ item.home_suffix }}"
  when:
    - oracle_patch_apply_enabled | bool
    - oracle_patch_run_datapatch | bool
    - oracle_patch_target == 'db'
    - not (
        oracle_patch_mode == 'oop_dual' and
        not (oracle_patch_switch_enabled | default(true) | bool)
      )
    - (_patch_missing_targets | length > 0) or ((_patch_dual_switch_targets | default([]) | length) > 0)

- name: Run datapatch for patched DB homes
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.item.home_path | quote }}
    export ORACLE_SID={{ item.item.name | quote }}
    {{ item.item.home_path }}/OPatch/datapatch -verbose
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_datapatch
  changed_when: _patch_datapatch.rc == 0
  failed_when: >-
    _patch_datapatch.rc != 0 or
    (
      'Patch installation complete' not in (_patch_datapatch.stdout | default('')) and
      'SQL Patching tool complete' not in (_patch_datapatch.stdout | default(''))
    )
  loop: "{{ _patch_datapatch_roles.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}:{{ item.item.home_suffix }}"
  when:
    - oracle_patch_apply_enabled | bool
    - oracle_patch_run_datapatch | bool
    - oracle_patch_target == 'db'
    # Prepare-only dual-home leaves the DB on the old home; datapatch waits for cutover.
    - not (
        oracle_patch_mode == 'oop_dual' and
        not (oracle_patch_switch_enabled | default(true) | bool)
      )
    - (_patch_missing_targets | length > 0) or ((_patch_dual_switch_targets | default([]) | length) > 0)
    - not (item.skipped | default(false))
    - "'PRIMARY|READ WRITE' in (item.stdout | default(''))"
