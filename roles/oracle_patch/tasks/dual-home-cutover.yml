---
# Dual-home Restart cutover. Included inside a block so a later rescue can
# restore the previous home, parameter-file metadata, listener, and service.

- name: Stop DBs before dual-home Restart switch
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" stop database -db {{ item.restart_db_name | quote }} -stopoption IMMEDIATE
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_stop
  changed_when: _patch_dual_stop.rc == 0
  failed_when: >-
    _patch_dual_stop.rc != 0 and
    'PRCD-1120' not in (_patch_dual_stop.stdout | default('')) and
    'PRCR-1005' not in (_patch_dual_stop.stdout | default('')) and
    'not running' not in (_patch_dual_stop.stdout | default('') | lower)
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "{{ item.restart_db_name }} -> {{ item.home_path }}"

- name: Switch Restart database to dual-home target
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" modify database \
      -db {{ item.restart_db_name | quote }} \
      -oraclehome {{ item.home_path | quote }}
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_modify_db
  changed_when: _patch_dual_modify_db.rc == 0
  failed_when: _patch_dual_modify_db.rc != 0
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "{{ item.restart_db_name }} -> {{ item.home_path }}"

# spfile/orapw must NOT live only under $OH/dbs for dual-home work; clean
# rebuilds delete that tree. Prefer durable data-dir path, mirror under new
# home dbs/, rewrite Restart metadata. Script lives in files/ to avoid YAML
# embedding large shell blocks.
- name: Relocate spfile and password file to durable path for dual-home switch
  ansible.builtin.script: >
    relocate_spfile_for_dual_home.sh
    {{ oracle_gi_home | default('/grid/19c/gi_home1') | quote }}
    {{ item.restart_db_name | quote }}
    {{ item.home_path | quote }}
    {{ (item.restart_home_path | default(item.current_home_path | default(''))) | quote }}
    {{ item.name | quote }}
    {{ item.oracle_base | quote }}
    {{ (item.data_dir | default('')) | quote }}
    {{ (item.parameter_file_dir | default('')) | quote }}
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_migrate_spfile
  changed_when: "'CHANGED' in (_patch_dual_migrate_spfile.stdout | default(''))"
  failed_when: >-
    _patch_dual_migrate_spfile.rc != 0 or
    'SPFILE_MISSING' in (_patch_dual_migrate_spfile.stdout | default('')) or
    'SPFILE_MISSING' in (_patch_dual_migrate_spfile.stderr | default('')) or
    'PWFILE_MISSING' in (_patch_dual_migrate_spfile.stdout | default('')) or
    'PWFILE_MISSING' in (_patch_dual_migrate_spfile.stderr | default(''))
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "{{ item.restart_db_name }} -> durable param dir + {{ item.home_path }}/dbs"

- name: Switch Restart listener to dual-home target
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" modify listener \
      -listener LISTENER_{{ item.name | upper }} \
      -oraclehome {{ item.home_path | quote }}
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_modify_listener
  changed_when: _patch_dual_modify_listener.rc == 0
  failed_when: >-
    _patch_dual_modify_listener.rc != 0 and
    'PRCN-2044' not in (_patch_dual_modify_listener.stdout | default('')) and
    'PRCR-1001' not in (_patch_dual_modify_listener.stdout | default(''))
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "LISTENER_{{ item.name | upper }} -> {{ item.home_path }}"

- name: Start DBs after dual-home Restart switch
  ansible.builtin.shell: |
    set -o pipefail
    "{{ oracle_gi_home | default('/grid/19c/gi_home1') }}/bin/srvctl" start database -db {{ item.restart_db_name | quote }}
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_start
  changed_when: _patch_dual_start.rc == 0
  failed_when: >-
    _patch_dual_start.rc != 0 and
    'already running' not in (_patch_dual_start.stdout | default('') | lower)
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "{{ item.restart_db_name }}"

- name: Probe database is open after dual-home Restart switch
  ansible.builtin.shell: |
    set -o pipefail
    gi="{{ oracle_gi_home | default('/grid/19c/gi_home1') }}"
    status="$("${gi}/bin/srvctl" status database -db {{ item.restart_db_name | quote }})"
    printf '%s\n' "$status"
    printf '%s\n' "$status" | grep -Eiq 'is running' || exit 1
    export ORACLE_HOME={{ item.home_path | quote }}
    export ORACLE_SID={{ item.name | quote }}
    open="$("$ORACLE_HOME/bin/sqlplus" -L -S / as sysdba <<'SQL'
    SET PAGES 0 FEEDBACK OFF HEADING OFF VERIFY OFF
    SELECT status || '|' || database_role || '|' || open_mode FROM v$instance, v$database;
    EXIT;
    SQL
    )"
    printf '%s\n' "$open"
    printf '%s\n' "$open" | grep -qE 'ORA-|SP2-' && exit 1
    # Physical standby may come up MOUNTED and is reopened READ ONLY WITH APPLY
    # by the next task. A primary (or any other role) must be OPEN; a mounted
    # production primary is not a successful cutover.
    if printf '%s\n' "$open" | grep -q '|PHYSICAL STANDBY|'; then
      printf '%s\n' "$open" | grep -qE '^(OPEN|MOUNTED)\|PHYSICAL STANDBY\|' || exit 1
    else
      printf '%s\n' "$open" | grep -qE '^OPEN\|' || exit 1
      if printf '%s\n' "$open" | grep -q '|PRIMARY|'; then
        printf '%s\n' "$open" | grep -q '|READ WRITE' || exit 1
      fi
    fi
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dual_open
  changed_when: false
  retries: 12
  delay: 10
  until: _patch_dual_open.rc == 0
  failed_when: _patch_dual_open.rc != 0
  loop: "{{ _patch_dual_switch_targets | default([]) }}"
  loop_control:
    label: "{{ item.restart_db_name }}"

- name: Reopen Data Guard standby read-only with apply after dual-home switch
  ansible.builtin.shell: |
    set -o pipefail
    export ORACLE_HOME={{ item.home_path | quote }}
    export ORACLE_SID={{ item.name | quote }}
    "$ORACLE_HOME/bin/sqlplus" -L -S / as sysdba <<'SQL'
    SET SERVEROUTPUT ON PAGES 0 LINESIZE 32767 FEEDBACK OFF HEADING OFF VERIFY OFF
    DECLARE
      v_database_role v$database.database_role%TYPE;
      v_open_mode v$database.open_mode%TYPE;
    BEGIN
      SELECT database_role, open_mode INTO v_database_role, v_open_mode
      FROM v$database;
      IF v_database_role != 'PHYSICAL STANDBY' THEN
        DBMS_OUTPUT.PUT_LINE('OK');
      ELSIF v_open_mode != 'READ ONLY WITH APPLY' THEN
        BEGIN
          EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE CANCEL';
        EXCEPTION
          WHEN OTHERS THEN NULL;
        END;
        IF v_open_mode = 'MOUNTED' THEN
          EXECUTE IMMEDIATE 'ALTER DATABASE OPEN';
        END IF;
        EXECUTE IMMEDIATE 'ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT FROM SESSION';
        DBMS_OUTPUT.PUT_LINE('CHANGED');
      ELSE
        DBMS_OUTPUT.PUT_LINE('OK');
      END IF;
    END;
    /
    EXIT;
    SQL
  args: { executable: /bin/bash }
  become: true
  become_user: "{{ oracle_user }}"
  register: _patch_dg_standby_open_apply
  changed_when: "'CHANGED' in (_patch_dg_standby_open_apply.stdout | default(''))"
  failed_when: >-
    _patch_dg_standby_open_apply.rc != 0 or
    'ORA-' in (_patch_dg_standby_open_apply.stdout | default('')) or
    'SP2-' in (_patch_dg_standby_open_apply.stdout | default('')) or
    'PLS-' in (_patch_dg_standby_open_apply.stdout | default(''))
  loop: "{{ _patch_dual_switch_targets | default([]) | selectattr('dataguard', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.restart_db_name }}"
  when:
    - oracle_patch_allow_dataguard_dual_home_switch | default(false) | bool
    - (_patch_dual_switch_targets | default([]) | length) > 0
