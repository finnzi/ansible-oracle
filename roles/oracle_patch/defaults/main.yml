---
# defaults/main.yml for oracle_patch
#
# SCOPE: DB-home and Grid-home patch inventory and idempotent in-place apply,
# DB dual-home Restart switching to a configured target home, and a dedicated
# Data Guard standby-first orchestration playbook.
#
# WHAT REMAINS:
#   - Live new dual-home target install and switch proof in the KVM lab.
#
#   Standby-first branch (Data Guard only, playbooks/07-patch-standbyfirst.yml):
#     1. Call patch_standbyfirst_info to read eligibility from the README.
#     2. If eligible: stage/patch standby target -> DGMGRL SWITCHOVER ->
#        stage/patch new standby target.
#     3. If not eligible (OJVM in the RU): fail before touching DB homes so the
#        operator can follow the patch's documented special procedure.
#
# INTERFACE (consumed by playbooks/07-patch.yml):
#   oracle_patch_mode: inplace | oop_dual
#   oracle_patch_target: db | grid
#   oracle_patch_zip:    path to the RU zip under stage_dir
#   oracle_patch_opatch_zip: path to the p6880880 zip
#   oracle_patch_dg_standbyfirst: auto | true | false  (auto = ask the module)
#   oracle_patch_expected_patch_ids: [] means derive DB RU IDs from README
#   oracle_patch_expected_grid_patch_ids: [] means derive Grid IDs from OPatch inventory XML
#   oracle_patch_discover_oratab: include DB homes discovered from /etc/oratab
#   oracle_patch_extra_homes: additional brownfield DB homes to patch
#   oracle_patch_discover_olr: include Grid home discovered from /etc/oracle/olr.loc
#   oracle_patch_extra_grid_homes: additional brownfield Grid homes to patch
#   oracle_patch_dual_home_suffix/path: target DB home for oop_dual switching.
#     Inventory suffix and inventory-declared explicit path targets are
#     installed by playbooks/07-patch-dual-db.yml before patch/switch.
#   oracle_patch_standbyfirst_require_eligible: precheck gate in standby-first playbook

oracle_user: oracle
oracle_group: oinstall
oracle_stage_dir: /u01/stage
oracle_instances: []

oracle_patch_mode: inplace
oracle_patch_target: db
oracle_patch_db_zip: "{{ oracle_stage_dir }}/{{ oracle_patch_files.db_ru_zip | default('p39062931_190000_Linux-x86-64.zip') }}"
oracle_patch_grid_zip: "{{ oracle_stage_dir }}/{{ oracle_patch_files.gi_ru_zip | default('p39062956_190000_Linux-x86-64.zip') }}"
oracle_patch_zip: "{{ oracle_patch_grid_zip if oracle_patch_target == 'grid' else oracle_patch_db_zip }}"
oracle_patch_opatch_zip: "{{ oracle_stage_dir }}/p6880880_190000_Linux-x86-64.zip"
oracle_patch_dg_standbyfirst: auto

# Actually run opatchauto/datapatch when a target home is missing the expected
# patch id(s). Detection and inventory validation run regardless.
oracle_patch_apply_enabled: false
oracle_patch_run_datapatch: true
oracle_patch_expected_patch_ids: []
oracle_patch_expected_grid_patch_ids: []
oracle_patch_grid_apply_component_id: "{{ oracle_gi_install_apply_ru_component_id | default('') }}"
oracle_patch_bundle_extract_dir: /var/tmp/ansible-oracle-patches

# Brownfield support: include database homes that were installed outside this
# inventory but are registered in /etc/oratab. Entries whose SID starts with '+'
# are ignored because they are ASM/Grid homes, not DB homes.
oracle_patch_discover_oratab: true

# Additional brownfield DB homes. Each item may be either a home path string or
# a dict with at least home_path, plus optional name/oracle_base/home_suffix.
oracle_patch_extra_homes: []

# Dual-home DB patching. When oracle_patch_mode=oop_dual, the target home is
# oracle_patch_dual_home_path if set, otherwise
# oracle_base/oracle_patch_dual_home_suffix if set, otherwise the inventory
# current home. The dual-home playbook automatically installs suffix targets
# and explicit-path targets declared in inventory before patch/switch.
# Brownfield explicit path targets must already exist because they are outside
# the inventory home model.
oracle_patch_dual_home_suffix: ""
oracle_patch_dual_home_path: ""

# Set only from the dedicated standby-first playbook, where Data Guard role
# changes are explicitly orchestrated around DB-home switches.
oracle_patch_allow_dataguard_dual_home_switch: false

# The dedicated standby-first playbook refuses non-eligible patch bundles by
# default. Keep this true unless following a vendor-documented special path.
oracle_patch_standbyfirst_require_eligible: true

# Brownfield Grid support: Oracle Restart records the active CRS home here.
oracle_patch_discover_olr: true

# Additional brownfield Grid homes. Each item may be either a home path string
# or a dict with at least home_path, plus optional name/oracle_base/home_suffix.
oracle_patch_extra_grid_homes: []
