---
# defaults/main.yml for oracle_patch
#
# SCOPE: stubbed in the vertical slice. The standby-first DETECTION (the part
# the user explicitly called out) is fully implemented in
# library/patch_standbyfirst_info.py and is unit-tested. The APPLY logic here
# is scaffolded with a fixed interface.
#
# WHAT TO IMPLEMENT (next engagement):
#   Single-home mode (oracle_patch_mode: inplace):
#     1. Upgrade OPatch from p6880880 (unzip into <ORACLE_HOME>).
#     2. For Grid patch: `opatchauto apply <gi_ru_zip> -oh <GI_HOME>`.
#        For DB patch:   `opatchauto apply <db_ru_zip> -oh <ORACLE_HOME>`.
#     3. Run datapatch (the SQL side of the RU) on each open DB.
#
#   Dual-home mode (oracle_patch_mode: oop_dual) — preferred for zero-downtime:
#     1. Install a NEW Oracle home (oracle_db_install) at <base>/<db_homeN+1>.
#     2. Patch the new home in place (above).
#     3. `srvctl modify database -db <name> -oraclehome <new_home>`.
#     4. Restart the DB under Restart (`srvctl stop/start database`).
#     5. Run datapatch.
#     6. Leave the old home in place for rollback.
#
#   Standby-first branch (Data Guard only):
#     1. Call patch_standbyfirst_info to read eligibility from the README.
#     2. If eligible: patch standby -> DGMGRL SWITCHOVER -> patch new standby.
#     3. If not eligible (OJVM in the RU): emit the MOS special-procedure
#        notice and fall back to the standard patch path.
#
# INTERFACE (consumed by playbooks/07-patch.yml):
#   oracle_patch_mode: inplace | oop_dual
#   oracle_patch_target: db | grid
#   oracle_patch_zip:    path to the RU zip under stage_dir
#   oracle_patch_opatch_zip: path to the p6880880 zip
#   oracle_patch_dg_standbyfirst: auto | true | false  (auto = ask the module)

oracle_user: oracle
oracle_group: oinstall
oracle_stage_dir: /u01/stage
oracle_instances: []

oracle_patch_mode: inplace
oracle_patch_target: db
oracle_patch_zip: "{{ oracle_stage_dir }}/p39062931_190000_Linux-x86-64.zip"
oracle_patch_opatch_zip: "{{ oracle_stage_dir }}/p6880880_190000_Linux-x86-64.zip"
oracle_patch_dg_standbyfirst: auto

# Actually run the (unimplemented) apply. Detection runs regardless.
oracle_patch_apply_enabled: false
