---
# Focused live-smoke vars for proving the full multi-instance primary host.
# Use with --limit superdb1. It keeps the existing Data Guard `super` primary
# in Maximum Availability and adds standalone `duper` and `fluff` databases on
# the same VM.

oracle_network_dataguard_enabled: true
oracle_lab_host_map_mode: dataguard
oracle_db_manage_apply_instance_overrides_require_dataguard: false
oracle_restart_apply_instance_overrides_require_dataguard: false
oracle_service_apply_instance_overrides_require_dataguard: false

oracle_instances:
  - name: super
    oracle_base: /super/app/oracle
    db_homes:
      - suffix: dbhome_1
        current: true
      - suffix: dbhome_2
        current: false
    gi_base: /grid
    gi_homes:
      - suffix: 19c/gi_home1
        current: true
      - suffix: 19c/gi_home2
        current: false
    dirs:
      data: /super/d01
      archive: /super/a01
      flashback: /super/f01

      redo: /super/r01
    dataguard: true
    archivelog: true
    flashback: true
    force_logging: true
    memory:
      sga_target: 2G
      pga_aggregate_target: 1G
    listener_vip: superdb.domain.is
    listener_port: 1521
    service_name: super_svc
    # Role-based DG services (same shape as inventory/group_vars/all.yml) so
    # multi-instance e2e / smoke still exercises super_pri / super_stb / super_tac.
    services:
      - name: super_svc
        role: PRIMARY
        failover_type: SELECT
        failover_method: BASIC
        failover_retries: 30
        failover_delay: 1
      - name: super_pri
        role: PRIMARY
        failover_type: SELECT
        failover_method: BASIC
        failover_retries: 30
        failover_delay: 1
      - name: super_stb
        role: PHYSICAL_STANDBY
        failover_type: NONE
        failover_method: NONE
        failover_retries: 0
        failover_delay: 0
      - name: super_tac
        role: PRIMARY
        failover_type: AUTO
        failover_method: BASIC
        failover_retries: 60
        failover_delay: 1
        notification: true
        commit_outcome: true
        retention: 86400
        replay_init_time: 300
        failover_restore: LEVEL1

  - name: duper
    oracle_base: /duper/app/oracle
    db_homes:
      - suffix: dbhome_1
        current: true
      - suffix: dbhome_2
        current: false
    gi_base: /grid
    gi_homes:
      - suffix: 19c/gi_home1
        current: true
      - suffix: 19c/gi_home2
        current: false
    dirs:
      data: /duper/d01
      archive: /duper/a01
      flashback: /duper/f01
      redo: /duper/r01
    dataguard: false
    archivelog: true
    flashback: false
    force_logging: true
    memory:
      sga_target: 1G
      pga_aggregate_target: 512M
    parameters:
      - name: open_cursors
        value: 450
        scope: BOTH
    listener_vip: duperdb.domain.is
    listener_port: 1522
    service_name: duper_svc

  - name: fluff
    oracle_base: /fluff/app/oracle
    db_homes:
      - suffix: dbhome_1
        current: true
      - suffix: dbhome_2
        current: false
    gi_base: /grid
    gi_homes:
      - suffix: 19c/gi_home1
        current: true
      - suffix: 19c/gi_home2
        current: false
    dirs:
      data: /fluff/d01
      archive: /fluff/a01
      flashback: /fluff/f01
      redo: /fluff/r01
    dataguard: false
    archivelog: false
    flashback: false
    force_logging: false
    memory:
      sga_target: 1G
      pga_aggregate_target: 512M
    parameters:
      - name: open_cursors
        value: 350
        scope: BOTH
    listener_vip: fluffdb.domain.is
    listener_port: 1523
    service_name: fluff_svc

# Do NOT set oracle_instance_overrides here. Extra-var overrides replace
# inventory/group_vars for every host and would pin the standby to primary
# role/unique name. primary.yml / standby.yml supply per-group DG shape.
# Ensure super is a Data Guard instance in the list above (dataguard: true).

oracle_lab_guest_hosts:
  - ip: 192.168.87.11
    names: superdb1.domain.is superdb1
    modes: [standalone, dataguard]
  - ip: 192.168.87.12
    names: superdb2.domain.is superdb2
    modes: [standalone, dataguard]
  - ip: 192.168.87.13
    names: observer.domain.is observer
    modes: [standalone, dataguard]
  - ip: 192.168.87.21
    names: superdb.domain.is superdb
    modes: [standalone]
  - ip: 192.168.87.22
    names: duperdb.domain.is duperdb
    modes: [standalone, dataguard]
  - ip: 192.168.87.23
    names: fluffdb.domain.is fluffdb
    modes: [standalone, dataguard]
  - ip: 192.168.87.31
    names: superdc1.domain.is superdc1
    modes: [dataguard]
  - ip: 192.168.87.32
    names: superdc2.domain.is superdc2
    modes: [dataguard]

oracle_lab_listener_vips:
  - ip: 192.168.87.21
    names: superdb.domain.is superdb
  - ip: 192.168.87.22
    names: duperdb.domain.is duperdb
  - ip: 192.168.87.23
    names: fluffdb.domain.is fluffdb
  - ip: 192.168.87.31
    names: superdc1.domain.is superdc1
  - ip: 192.168.87.32
    names: superdc2.domain.is superdc2
