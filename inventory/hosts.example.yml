---
# inventory/hosts.example.yml
#
# Template for the live inventory/hosts.yml, which is generated by
# lab/scripts/lab-up.sh and is gitignored. Copy/adapt for non-lab use.
#
# lab/scripts/lab-up.sh copies this to inventory/hosts.yml after creating the
# KVM/libvirt lab network. The fixed IPs come from libvirt DHCP reservations.

all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: "{{ '~/.ssh/lab_oracle' | expanduser }}"
    ansible_ssh_common_args: "-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    # Set this to the client/VIP interface on every DB host (eth0 is the lab).
    oracle_network_interface: eth0

  children:
    # The standalone-or-primary DB host(s).
    primary:
      hosts:
        superdb1:
          ansible_host: 192.168.87.11

    # Reserved for Data Guard standby (DG slice).
    standby:
      hosts:
        superdb2:
          ansible_host: 192.168.87.12

    # Reserved for the FSFO observer (observer slice).
    observer:
      hosts:
        observer1:
          ansible_host: 192.168.87.13

    # Convenience aggregate: every DB-bearing host.
    oracle_db_hosts:
      children:
        primary:
        standby:
