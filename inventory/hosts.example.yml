---
# inventory/hosts.example.yml
#
# Template for the live inventory/hosts.yml, which is generated by
# lab/scripts/lab-up.sh and is gitignored. Copy/adapt for non-lab use.
#
# The vertical slice populates only [primary] with superdb1 (standalone mode).
# The [standby] and [observer] groups are wired here so DG/FSFO slots in.

all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  children:
    # The standalone-or-primary DB host(s).
    primary:
      hosts:
        superdb1:
          ansible_host: 172.28.0.11

    # Reserved for Data Guard standby (DG slice).
    standby:
      hosts:
        superdb2:
          ansible_host: 172.28.0.12

    # Reserved for the FSFO observer (observer slice).
    observer:
      hosts:
        observer:
          ansible_host: 172.28.0.13

    # Convenience aggregate: every DB-bearing host.
    oracle_db_hosts:
      children:
        primary:
        standby:
