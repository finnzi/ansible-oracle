---
# inventory/group_vars/standby.yml
#
# Hosts in the [standby] group run the physical standby side of a Data Guard
# pair. The base inventory keeps this override here so the Data Guard host
# contract stays explicit.

oracle_instance_overrides:
  super:
    dataguard: true
    flashback: true
    listener_vip: "superdc2.domain.is"
    listener_ip: "192.168.87.32"
    dg_primary_host: "superdc1.domain.is"
    dg_standby_host: "superdc2.domain.is"
    dg_role: standby
    db_unique_name: super_sby
    # Requirement: standby must be OPEN READ ONLY WITH APPLY (not MOUNTED).
    desired_open_mode: "READ ONLY WITH APPLY"
