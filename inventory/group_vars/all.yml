---
# inventory/group_vars/all.yml
#
# Global defaults for every host in the ansible-oracle lab. Per-instance and
# per-host overrides live in primary.yml / standby.yml / observer.yml and in
# host_vars/. These defaults express the layout the project mandates:
#
#   /<instance>/app/oracle/<dbhome_N>   ORACLE_HOMEs (out-of-place friendly)
#   /<instance>/d01                     data files
#   /<instance>/a01                     archive logs
#   /<instance>/f01                     flashback recovery area
#   /<instance>/r01                     redo log members
#   /grid/19c/gi_homeN                  Oracle Restart (Grid) homes
#
# Database files remain filesystem-based. Oracle Restart uses ASM only for the
# small RESTART disk group that keeps the local GI stack bootable and healthy.

# ── Software versions / source artefacts ──────────────────────────────
# These filenames match what is staged under download/ by lab-up.sh
# (symlinked from ~/sources/oracle). Override per-environment if your sources
# differ.
oracle_version: "19.3.0.0"
oracle_release_update: "19.31.0.0.260421"  # baseline / current-home target
oracle_upgrade_release_update: "19.32.0.0.260721"  # dual-home upgrade target

# Single central Oracle inventory for every home on the host (DB, Grid, client).
# Greenfield-only: rebuild the lab rather than migrating an existing inventory.
oracle_inventory_loc: /home/oracle/oraInventory
oracle_inventory_enforce_single: true

# Lab-only: expand guest / into free virtual-disk space (see oracle_common).
# Role default is false so non-lab hosts keep VG headroom unless they opt in.
oracle_common_grow_root: true

# Lab guest data/archive/FRA/redo paths live on the root filesystem. Production
# inventories must leave the role default (true) so missing mounts fail closed.
oracle_storage_require_dedicated_mounts: false

# The KVM lab opts into repairing/recovering an already-installed Restart stack
# even when the slow Grid installer itself is disabled.
oracle_gi_repair_existing_enabled: true

oracle_install_files:
  db_zip: "V982063-01-Oracle.19c.Database.Enterprise.Edition.zip"
  gi_zip: "V982068-01-Oracle.19c.Grid.Infrastructure.zip"
  client_zip: "V982064-01-Oracle.19c.Database.Client.zip"

oracle_patch_files:
  opatch_zip: "p6880880_190000_Linux-x86-64.zip"
  db_ru_zip: "p39062931_190000_Linux-x86-64.zip"          # OJVM 19.31 + DB RU 19.31
  gi_ru_zip: "p39062956_190000_Linux-x86-64.zip"          # OJVM 19.31 + GI RU 19.31
  db_ru_upgrade_zip: "p39618649_190000_Linux-x86-64.zip"  # OJVM 19.32 + DB RU 19.32
  gi_ru_upgrade_zip: "p39618711_190000_Linux-x86-64.zip"  # OJVM 19.32 + GI RU 19.32 (staged)

# Eligible standby-first DB RU component path inside the 19.32 combo zip.
oracle_upgrade_db_ru_component_path: "39618649/39472050"
oracle_upgrade_db_ru_patch_id: "39472050"

# Where the KVM lab VMs see the staged installers. lab-up.sh mounts
# ~/sources/oracle read-only at this path through libvirt.
oracle_stage_dir: "/u01/stage"

# ── OS user / groups ──────────────────────────────────────────────────
oracle_user: oracle
oracle_group: oinstall
oracle_roles:
  - dba
  - oper
  - asmadmin
  - backupdba
  - dgdba       # SYSDG — Data Guard broker
  - kmdba

# ── The database instances managed by this repo ───────────────────────
# A list so the same playbooks can manage several DBs per host (super, duper,
# fluff ...). Each instance gets its own /<name> tree and its own listener.
#
# dataguard: false  -> standalone, listener VIP <name>db.domain.is
# dataguard: true   -> primary+standby pair, VIPs <name>dc1/dc2.domain.is
#
# archive / flashback / force_logging are independently toggleable.
oracle_instances:
  - name: super
    oracle_base: /super/app/oracle
    db_homes:
      - suffix: dbhome_1
        current: true
      - suffix: dbhome_2
        current: false
    gi_base: /grid
    gi_homes:
      - suffix: 19c/gi_home1
        current: true
      - suffix: 19c/gi_home2
        current: false
    dirs:
      data: /super/d01
      archive: /super/a01
      flashback: /super/f01
      redo: /super/r01
    dataguard: false
    archivelog: true
    flashback: false
    force_logging: true
    memory:
      sga_target: 2G
      pga_aggregate_target: 1G
    # standalone listener hostname; for DG this is overridden by primary/standby
    listener_vip: superdb.domain.is
    listener_port: 1521
    # Backward-compatible primary service used by the original test slice.
    service_name: super_svc
    # Role-based Data Guard services. super_pri follows the writable primary;
    # super_stb follows the Active Data Guard read-only physical standby.
    services:
      - name: super_svc
        role: PRIMARY
        failover_type: SELECT
        failover_method: BASIC
        failover_retries: 30
        failover_delay: 1
      - name: super_pri
        role: PRIMARY
        failover_type: SELECT
        failover_method: BASIC
        failover_retries: 30
        failover_delay: 1
      - name: super_stb
        role: PHYSICAL_STANDBY
        failover_type: NONE
        failover_method: NONE
        failover_retries: 0
        failover_delay: 0
      - name: super_tac
        role: PRIMARY
        failover_type: AUTO
        failover_method: BASIC
        failover_retries: 60
        failover_delay: 1
        notification: true
        commit_outcome: true
        retention: 86400
        replay_init_time: 300
        failover_restore: LEVEL1

# Default listener / DB credentials for the lab (NOT for production). The test
# suite and the custom modules use these. Real passwords should be vaulted.
oracle_lab_sys_password: "SysPassword1_"
oracle_lab_system_password: "SysPassword1_"
oracle_lab_dg_password: "DgPassword1_"

# ── Domain / DNS conventions for the lab ──────────────────────────────
lab_domain: domain.is
oracle_network_open_firewall: true
oracle_lab_host_map_mode: standalone

oracle_lab_guest_hosts:
  - ip: 192.168.87.11
    names: superdb1.domain.is superdb1
    modes: [standalone, dataguard]
  - ip: 192.168.87.12
    names: superdb2.domain.is superdb2
    modes: [standalone, dataguard]
  - ip: 192.168.87.13
    names: observer.domain.is observer
    modes: [standalone, dataguard]
  - ip: 192.168.87.21
    names: superdb.domain.is superdb
    modes: [standalone]
  - ip: 192.168.87.31
    names: superdc1.domain.is superdc1
    modes: [dataguard]
  - ip: 192.168.87.32
    names: superdc2.domain.is superdc2
    modes: [dataguard]

oracle_lab_listener_vips:
  - ip: 192.168.87.21
    names: superdb.domain.is superdb
  - ip: 192.168.87.31
    names: superdc1.domain.is superdc1
  - ip: 192.168.87.32
    names: superdc2.domain.is superdc2
