---
# Ansible Galaxy collections.
#
# This repository is intentionally self-contained: it depends on no external
# collections for the vertical slice. The custom modules under library/ and the
# roles under roles/ provide everything required.
#
# When the Data Guard / FSFO / patching roles are filled in, this is where any
# additional collections (e.g. community.general for systemd units) would be
# pinned. For now it is empty on purpose so `ansible-galaxy collection install
# -r requirements.yml` is a no-op.
collections: []
