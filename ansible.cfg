; ansible.cfg — control-node configuration for the ansible-oracle lab.
;
; Lab is brought up by lab/scripts/lab-up.sh which writes inventory/hosts.yml.
; The settings below favour a frictionless local lab over production hardening
; (host key checking off, no retries). Harden before pointing this at real hosts.

[defaults]
; Where hosts live. hosts.yml is generated by the lab tooling and gitignored;
; group_vars/ and host_vars/ are committed.
inventory     = inventory/hosts.yml

; Local custom modules + the standby-first patch detector live here.
library       = library

; Roles that ship with this repo (no external Galaxy roles in the slice).
roles_path    = roles

; Cache facts for the duration of a run; disabled between runs to keep
; idempotency checks honest.
fact_caching  = memory

; Lab affordances — turn back on for real environments.
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
forks = 10

; Python interpreter on the OL9 targets. The lab containers ship /usr/bin/python3.
interpreter_python = /usr/bin/python3

; Raise the action/plugin search paths so role-local plugins resolve cleanly.
callbacks_enabled = profile_tasks

[privilege_escalation]
; The playbooks use `become: true` per-task. No global password here — the lab
; containers permit passwordless sudo for the oracle user.
become_user = root

[ssh_connection]
; Lab containers run OpenSSH; pipelining speeds multi-node plays.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
